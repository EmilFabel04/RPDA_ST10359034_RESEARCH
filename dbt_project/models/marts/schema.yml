version: 2

models:
  - name: dim_customers
    description: One row per customer with order history and lifetime value. Used by marketing and finance dashboards.
    columns:
      - name: customer_id
        description: Primary key of the customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last name.
      - name: email
        description: Lower-cased email address.
      - name: country_code
        description: ISO 3166-1 alpha-2 country code.
      - name: created_at
        description: UTC timestamp when the account was created.
      - name: first_order_date
        description: Date of the customer's first order (null if no orders).
      - name: most_recent_order_date
        description: Date of the customer's most recent order (null if no orders).
      - name: number_of_orders
        description: Count of orders placed, including cancelled ones.
      - name: lifetime_value
        description: Sum of payments on non-cancelled orders, in currency units.
        data_tests:
          - not_null

  - name: fct_orders
    description: One row per order with payment amounts pivoted by method. Grain must match stg_orders (one row per order).
    data_tests:
      - equal_row_count:
          arguments:
            compare_model: ref('stg_orders')
    columns:
      - name: order_id
        description: Primary key of the order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order (foreign key to dim_customers).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order lifecycle status.
      - name: credit_card_amount
        description: Amount paid by credit card.
      - name: bank_transfer_amount
        description: Amount paid by bank transfer.
      - name: voucher_amount
        description: Amount paid with vouchers.
      - name: gift_card_amount
        description: Amount paid with gift cards.
      - name: amount
        description: Total amount paid for the order (0 if no payments, e.g. cancelled orders).
        data_tests:
          - not_null
