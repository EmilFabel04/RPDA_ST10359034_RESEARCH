<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #deded8;
  --accent: #2f5d8a; --accent-ink: #ffffff; --done: #3d7a4f; --part: #b7791f; --warn-bg: #fff4d6;
  --code-bg: #f0f0eb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #20201e; --ink: #ecece6; --muted: #a3a39b; --line: #3a3a36;
    --accent: #7fb0e0; --accent-ink: #10202f; --done: #6fbf86; --part: #e0a84a; --warn-bg: #3a3220;
    --code-bg: #2a2a27;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #20201e; --ink: #ecece6; --muted: #a3a39b; --line: #3a3a36;
  --accent: #7fb0e0; --accent-ink: #10202f; --done: #6fbf86; --part: #e0a84a; --warn-bg: #3a3220;
  --code-bg: #2a2a27;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
.progress { color: var(--muted); font-size: 14px; }
.spacer { flex: 1; }
button, .button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
.banner { margin: 12px 16px 0; padding: 10px 14px; border-radius: 8px; background: var(--warn-bg); font-size: 14px; }
main { display: grid; grid-template-columns: minmax(0, 55fr) minmax(0, 45fr); gap: 16px; padding: 16px; }
@media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); } }
section.col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px;
  min-width: 0; }
@media (min-width: 1001px) { section.col { max-height: calc(100vh - 140px); overflow-y: auto; } }
.itemhead { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 8px; }
.itemhead h2 { font-size: 18px; margin: 0; }
details { border-top: 1px solid var(--line); padding: 6px 0; }
details > summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.plain { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
pre { background: var(--code-bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-size: 13px;
  line-height: 1.45; white-space: pre; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px;
  background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
pre code { background: none; padding: 0; }
fieldset { border: 0; padding: 0; margin: 0 0 14px; }
legend { font-weight: 600; padding: 0; margin-bottom: 4px; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices label { border: 1px solid var(--line); border-radius: 6px; padding: 5px 14px; cursor: pointer;
  user-select: none; }
.choices input { margin-right: 6px; }
.choices label:has(input:checked) { border-color: var(--accent); outline: 1px solid var(--accent); }
textarea { width: 100%; min-height: 110px; font: inherit; font-size: 14px; padding: 8px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.msg { color: var(--part); font-size: 14px; }
.grid { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 0; }
.grid button { min-width: 52px; padding: 3px 6px; font-size: 12px; }
.grid button.complete { background: var(--done); color: #fff; border-color: var(--done); }
.grid button.current { outline: 2px solid var(--accent); }
.rater-pick { display: flex; gap: 8px; align-items: center; font-size: 14px; }
select { font: inherit; font-size: 14px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span class="rater-pick">Checking as <select id="raterSelect"></select></span>
  <span class="progress" id="progress"></span>
  <span class="spacer"></span>
  <label class="button" for="loadFile">Load CSV</label>
  <input type="file" id="loadFile" accept=".csv,text/csv" hidden>
  <button type="button" class="primary" id="exportBtn">Export CSV</button>
</header>
<div class="banner" id="banner"></div>
<div style="padding: 0 16px"><div class="grid" id="grid"></div></div>
<main>
  <section class="col" aria-label="Scenario">
    <div class="itemhead"><h2 id="scenarioTitle"></h2></div>
    <div id="scenario"></div>
  </section>
  <section class="col" aria-label="Reference fix and questions">
    <div class="itemhead"><h2>Reference fix (researcher)</h2></div>
    <div id="reference"></div>
    <form id="form" autocomplete="off" style="border-top: 2px solid var(--line); margin-top: 18px; padding-top: 12px">
      <div id="fields"></div>
      <fieldset>
        <legend>Comments <span class="hint">(please explain any "Mostly", "Partly" or "No")</span></legend>
        <textarea id="comments"></textarea>
      </fieldset>
      <div class="nav">
        <button type="button" id="prevBtn">Previous</button>
        <button type="button" class="primary" id="nextBtn">Save and next</button>
        <span class="msg" id="msg"></span>
      </div>
    </form>
  </section>
</main>

<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const PAGE = DATA.page, ITEMS = DATA.items, QUESTIONS = DATA.questions;
const COLUMNS = ["rater_id", "scenario_id", "position", ...QUESTIONS.map((q) => q.key), "comments", "checked_at"];
const $ = (id) => document.getElementById(id);

// ------------------------------------------------------------ storage (this browser only)
let rater = "", answers = {}, current = 0, dirty = false;
const storeKey = () => `rpda8411:${PAGE.id}:${rater}`;
function save() { try { localStorage.setItem(storeKey(), JSON.stringify({answers, current, dirty})); } catch (e) {} }
function restore() {
  answers = {}; current = 0; dirty = false;
  try { const raw = localStorage.getItem(storeKey());
        if (raw) { const s = JSON.parse(raw); answers = s.answers || {}; current = s.current || 0; dirty = !!s.dirty; }
  } catch (e) {}
  if (current >= ITEMS.length) current = 0;
}
const isComplete = (a) => a && QUESTIONS.every((q) => a[q.key]);

// ------------------------------------------------------------ text rendering (all input escaped)
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) { return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>"); }
function plain(src) {
  const out = []; const parts = String(src).split(/^\s*```[^\n]*$/m);
  parts.forEach((part, i) => {
    if (i % 2 === 1) out.push("<pre><code>" + esc(part.replace(/^\n/, "").replace(/\n$/, "")) + "</code></pre>");
    else if (part.trim()) out.push(`<div class="plain">${inline(esc(part.replace(/^\n+|\n+$/g, "")))}</div>`);
  });
  return out.join("");
}

// ------------------------------------------------------------ rendering
$("fields").innerHTML = QUESTIONS.map((q) => `
  <fieldset><legend>${esc(q.question)}</legend><p class="hint">${esc(q.hint)}</p>
    <div class="choices">${q.choices.map((c) =>
      `<label><input type="radio" name="${q.key}" value="${esc(c)}">${esc(c)}</label>`).join("")}</div>
  </fieldset>`).join("");
function renderProgress() {
  const done = ITEMS.filter((it) => isComplete(answers[it.position])).length;
  $("progress").textContent = rater ? `${done} of ${ITEMS.length} checked` + (dirty ? " · not exported since last change" : "") : "";
  $("grid").innerHTML = ITEMS.map((it, i) =>
    `<button type="button" class="${isComplete(answers[it.position]) ? "complete" : ""} ${i === current ? "current" : ""}"
       data-i="${i}">${esc(it.scenario_id)}</button>`).join("");
}
function render() {
  const it = ITEMS[current], sc = DATA.scenarios[it.scenario_id];
  $("scenarioTitle").textContent = `Scenario ${it.scenario_id} (${it.position} of ${ITEMS.length})`;
  $("scenario").innerHTML = sc.sections.map(([title, text]) =>
    `<details open><summary>${esc(title)}</summary>${plain(text)}</details>`).join("");
  $("reference").innerHTML = plain(sc.reference);
  const a = answers[it.position] || {};
  for (const q of QUESTIONS) for (const input of document.getElementsByName(q.key)) input.checked = a[q.key] === input.value;
  $("comments").value = a.comments || "";
  $("prevBtn").disabled = current === 0;
  $("nextBtn").textContent = current === ITEMS.length - 1 ? "Save" : "Save and next";
  $("msg").textContent = "";
  renderProgress();
  document.querySelectorAll("section.col").forEach((el) => { el.scrollTop = 0; });
}
function go(i) { current = Math.max(0, Math.min(ITEMS.length - 1, i)); save(); render(); window.scrollTo(0, 0); }

// ------------------------------------------------------------ editing (saved on every change)
function update() {
  if (!rater) { $("msg").textContent = "Choose who is checking (top of the page) first."; return; }
  const it = ITEMS[current], a = Object.assign({}, answers[it.position] || {});
  for (const q of QUESTIONS) { const c = document.querySelector(`input[name="${q.key}"]:checked`); if (c) a[q.key] = c.value; }
  a.comments = $("comments").value;
  if (isComplete(a)) a.checked_at = new Date().toISOString().slice(0, 19) + "Z";
  answers[it.position] = a; dirty = true; save(); renderProgress();
}
$("form").addEventListener("change", update);
$("comments").addEventListener("input", update);
$("prevBtn").onclick = () => go(current - 1);
$("nextBtn").onclick = () => {
  if (!isComplete(answers[ITEMS[current].position])) { $("msg").textContent = "Please answer both questions first."; return; }
  if (current < ITEMS.length - 1) go(current + 1);
  else $("msg").textContent = "Saved. Export the CSV and email it to the researcher.";
};
$("grid").onclick = (e) => { const b = e.target.closest("button[data-i]"); if (b) go(+b.dataset.i); };

// ------------------------------------------------------------ CSV export / import
function csvCell(v) { v = String(v ?? ""); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
$("exportBtn").onclick = () => {
  if (!rater) { $("msg").textContent = "Choose who is checking (top of the page) first."; return; }
  const rows = ITEMS.filter((it) => answers[it.position]).map((it) => {
    const a = answers[it.position];
    return Object.assign({rater_id: rater, scenario_id: it.scenario_id, position: it.position,
                          comments: (a.comments || "").trim(), checked_at: a.checked_at || ""},
                         Object.fromEntries(QUESTIONS.map((q) => [q.key, a[q.key] || ""])));
  });
  const text = [COLUMNS.join(","), ...rows.map((r) => COLUMNS.map((c) => csvCell(r[c])).join(","))].join("\n") + "\n";
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([text], {type: "text/csv"}));
  link.download = `scenario_check_${rater}.csv`;
  document.body.appendChild(link); link.click(); link.remove();
  dirty = false; save(); renderProgress();
};
function parseCsv(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const head = rows.shift() || [];
  return rows.filter((r) => r.length > 1).map((r) => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""])));
}
$("loadFile").onchange = async (e) => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  const rows = parseCsv(await file.text());
  const byPos = Object.fromEntries(ITEMS.map((it) => [String(it.position), it]));
  const ok = rows.filter((r) => byPos[r.position] && byPos[r.position].scenario_id === r.scenario_id && r.rater_id);
  if (!ok.length) { $("msg").textContent = "This CSV does not match this page."; return; }
  rater = ok[0].rater_id; $("raterSelect").value = rater; restore();
  for (const r of ok) answers[r.position] = Object.assign({comments: r.comments, checked_at: r.checked_at},
    Object.fromEntries(QUESTIONS.map((q) => [q.key, r[q.key]])));
  save(); render();
};

// ------------------------------------------------------------ start
document.title = PAGE.title;
$("title").textContent = PAGE.title;
$("banner").innerHTML = PAGE.banner;
$("raterSelect").innerHTML = `<option value="">choose…</option>` +
  PAGE.raters.map(([id, label]) => `<option value="${esc(id)}">${esc(label)}</option>`).join("");
$("raterSelect").onchange = (e) => { rater = e.target.value; restore(); render(); };
render();
</script>
</body>
</html>
