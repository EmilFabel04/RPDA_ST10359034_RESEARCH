d in the last 30 h are present (4 rows, latest order_date 2026-10-13), but every one of them has the same loaded_at, 2026-10-12 13:05 UTC, which for some is earlier than when the order was placed. The orders loader upgraded to v2.3 two days ago stamps loaded_at with its extraction watermark, which is stuck, instead of the load time. The freshness check reads loaded_at, so it reports the source as about 30 h stale.\n\nFix: Ask the ingestion team to fix or roll back loader v2.3 so loaded_at records the actual load time and the watermark advances. Then reload the affected rows so their loaded_at is correct. Do not raise the freshness threshold to make the error go away: a real outage would then go unnoticed.\n\nVerification: `select loaded_at, count(*) from raw.raw_orders group by 1 order by 1 desc limit 5` shows separate hourly load times again, and `dbt source freshness --select source:raw.raw_orders` passes."}, "FV03": {"sections": [["Failure report", "Command: dbt build  (exit code 0)\nResult: 30 passed, 0 failed, 0 errors, 0 warnings, 0 skipped\n\nCommand: dbt source freshness  (exit code 1)\n- ERROR: source raw.raw_customers: max(loaded_at) = 2026-10-13 14:56 UTC, 4.1 h before the check (warn after 1 hour, error after 2 hours)\n- PASS: source raw.raw_orders: max(loaded_at) = 2026-10-13 18:05 UTC, 1.0 h before the check (warn after 6 hours, error after 12 hours)\n- PASS: source raw.raw_payments: max(loaded_at) = 2026-10-13 18:05 UTC, 1.0 h before the check (warn after 6 hours, error after 12 hours)", true], ["Model and source metadata", "### Source raw.raw_customers\nTable: \"ecommerce\".\"raw\".\"raw_customers\"\nDescription: One row per customer account, extracted from the CRM.\nFreshness: measured on `loaded_at`; warn after 1 hour, error after 2 hours\nColumns (name · type in warehouse · description):\n- customer_id · INTEGER · CRM primary key of the customer (integer).\n- first_name · VARCHAR · Customer first name.\n- last_name · VARCHAR · Customer last name.\ \n- 2026-10-13 · vendor · Payment provider notice: gift-card settlement re-sync for the last 30 days runs today (2026-10-13), early morning UTC.\n- 2026-10-08 · ticket · BI-204: 'Weekly revenue' tile added to the finance revenue dashboard (reads fct_orders)\n- 2026-10-07 · deploy · CI image upgraded dbt-duckdb 1.10 → 1.11; full build passed afterwards\nPrevious incidents:\n- INC-0402 (2026-09-13): voucher amounts doubled after a provider file resend. Resolution: provider sent a corrected file; payments re-ingested.\nRecent run history:\n- not_null_stg_payments_amount, last 7 daily runs: pass ×6, fail today (2026-10-13) with 11 rows.\n- Gift-card payments per day: 0–2 (normal).", false]], "reference": "Root cause: All 11 null amounts in raw.raw_payments are payment_method = 'gift_card' rows from the last 30 days, and all share the same loaded_at (2026-10-13 16:05 UTC). The provider's gift-card re-sync reloaded them without the amount value. stg_payments passes amount straight through, so not_null_stg_payments_amount fails and the marts are skipped. dbt is working as intended; the data is wrong at the source.\n\nFix: Confirm the pattern: `select payment_method, loaded_at, count(*) from raw.raw_payments where amount is null group by 1, 2`. Ask the payment provider to resend the re-sync with amounts, then re-run ingestion and `dbt build`. Do not coalesce the nulls to 0: that would understate gift-card revenue on the finance dashboard. If the marts must refresh before the provider fixes it, temporarily set the not_null test on stg_payments.amount to `severity: warn` and tell Finance that gift-card revenue for the last 30 days is incomplete.\n\nVerification: After re-ingestion, `select count(*) from raw.raw_payments where amount is null` returns 0, `dbt build --select stg_payments+` passes, and fct_orders.gift_card_amount for the last 30 days is back to its earlier level."}, "NR02": {"sections": [["Failure report", "Command: dbt build  (exit code 1)\nResult: 29 passed, 1 ull, relationships(to=dim_customers, field=customer_id)\n- order_date · DATE · Date the order was placed.\n- status · VARCHAR · Order lifecycle status.\n- credit_card_amount · DOUBLE · Amount paid by credit card.\n- bank_transfer_amount · DOUBLE · Amount paid by bank transfer.\n- voucher_amount · DOUBLE · Amount paid with vouchers.\n- gift_card_amount · DOUBLE · Amount paid with gift cards.\n- amount · DOUBLE · Total amount paid for the order (0 if no payments, e.g. cancelled orders). · tests: not_null\nModel-level tests: equal_row_count(compare_model=stg_orders)\nSQL (models/marts/fct_orders.sql):\n```sql\nwith orders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\norder_payments as (\n\n    select\n        order_id,\n        sum(case when payment_method = 'credit_card' then amount else 0 end) as credit_card_amount,\n        sum(case when payment_method = 'bank_transfer' then amount else 0 end) as bank_transfer_amount,\n        sum(case when payment_method = 'voucher' then amount else 0 end) as voucher_amount,\n        sum(case when payment_method = 'gift_card' then amount else 0 end) as gift_card_amount,\n        sum(amount) as total_amount\n    from payments\n    group by order_id\n\n),\n\nfinal as (\n\n    select\n        orders.order_id,\n        orders.customer_id,\n        orders.order_date,\n        orders.status,\n        coalesce(order_payments.credit_card_amount, 0) as credit_card_amount,\n        coalesce(order_payments.bank_transfer_amount, 0) as bank_transfer_amount,\n        coalesce(order_payments.voucher_amount, 0) as voucher_amount,\n        coalesce(order_payments.gift_card_amount, 0) as gift_card_amount,\n        coalesce(order_payments.total_amount, 0) as amount\n    from orders\n    left join order_payments on orders.order_id = order_payments.order_id\n\n)\n\nselect * from final\n```\n\n### Model dim_customers\nFile: models/marts/dim_customers.sql · materialized as table\nDescription: One row per customer with order history and lifetime value. Used by marketing and finance dashboards.\nColumns (name · type in warehouse · description · tests):\n- customer_id · INTEGER · Primary key of the customer. · tests: unique, not_null\n- first_name · VARCHAR · Customer first name.\n- last_name · VARCHAR · Customer last name.\n- email · VARCHAR · Lower-cased email address.\n- country_code · VARCHAR · ISO 3166-1 alpha-2 country code.\n- created_at · TIMESTAMP · UTC timestamp when the account was created.\n- first_order_date · DATE · Date of the customer's first order (null if no orders).\n- most_recent_order_date · DATE · Date of the customer's most recent order (null if no orders).\n- number_of_orders · BIGINT · Count of orders placed, including cancelled ones.\n- lifetime_value · DOUBLE · Sum of payments on non-cancelled orders, in currency units. · tests: not_null\nSQL (models/marts/dim_customers.sql):\n```sql\nwith customers as (\n\n    select * from {{ ref('stg_customers') }}\n\n),\n\norders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\ncustomer_orders as (\n\n    select\n        customer_id,\n        min(order_date) as first_order_date,\n        max(order_date) as most_recent_order_date,\n        count(order_id) as number_of_orders\n    from orders\n    group by customer_id\n\n),\n\ncustomer_payments as (\n\n    select\n        orders.customer_id,\n        sum(payments.amount) as lifetime_value\n    from payments\n    inner join orders on payments.order_id = orders.order_id\n    where orders.status != 'cancelled'\n    group by orders.customer_id\n\n),\n\nfinal as (\n\n    select\n        customers.customer_id,\n        customers.first_name,\n        customers.last_name,\n        customers.email,\n        customers.country_code,\n        customers.created_at,\n        customer_orders.first_order_date,\n        customer_orders.most_recent_order_date,\n        coalesce(customer_orders.number_of_orders, 0) as number_of_orders,\n        coalesce(customer_payments.lifetime_value, 0) as lifetime_value\n    from customers\n    left join customer_orders on customers.customer_id = customer_orders.customer_id\n    left join customer_payments on customers.customer_id = customer_payments.customer_id\n\n)\n\nselect * from final\n```\n\n### Source raw.raw_customers\nTable: \"ecommerce\".\"raw\".\"raw_customers\"\nDescription: One row per customer account, extracted from the CRM.\nFreshness: measured on `loaded_at`; warn after 24 hours, error after 48 hours\nColumns (name · type in warehouse · description):\n- customer_id · INTEGER · CRM primary key of the customer (integer).\n- first_name · VARCHAR · Customer first name.\n- last_name · VARCHAR · Customer last name.\n- email · VARCHAR · Customer email address as entered in the CRM.\n- country · VARCHAR · ISO 3166-1 alpha-2 country code of the customer's billing address.\n- created_at · TIMESTAMP · UTC timestamp when the account was created in the CRM.\n- loaded_at · TIMESTAMP · UTC timestamp when the ingestion job wrote the row.", false], ["Lineage", "DAG edges (upstream → downstream; tests omitted):\n- source raw.raw_customers → model stg_customers\n- source raw.raw_orders → model stg_orders\n- source raw.raw_payments → model stg_payments\n- model dim_customers → exposure finance_revenue_dashboard\n- model dim_customers → exposure marketing_customer_dashboard\n- model fct_orders → exposure finance_revenue_dashboard\n- model stg_customers → model dim_customers\n- model stg_orders → model dim_customers\n- model stg_orders → model fct_orders\n- model stg_payments → model dim_customers\n- model stg_payments → model fct_orders\nUpstream nodes and their current warehouse columns:\n- source raw.raw_orders (source table): order_id INTEGER, customer_id INTEGER, order_date DATE, status VARCHAR, loaded_at TIMESTAMP\n- source raw.raw_payments (source table): payment_id INTEGER, order_id IN ived before their orders for 1 hour after a shop outage. Resolution: resolved on the next hourly load.\nRecent run history:\n- relationships test on stg_payments.order_id, last 7 daily runs: pass ×6, fail today (2026-10-13) with 6 rows.", false]], "reference": "Root cause: The 6 payments that fail the relationships test on stg_payments.order_id all belong to orders 12, 22, 36, 179, 264. Those orders, and customer 3, were deleted from the shop and CRM data under erasure request DPR-1093. The payment data was not included in the erasure, so raw.raw_payments still holds those payments. This is not late-arriving data: the orders will never arrive.\n\nFix: Complete the erasure: ask the data-protection owner and the payment provider to delete or anonymise those payments, as the retention policy allows. Meanwhile, keep the orphan payments out of the models explicitly: add a seed `erased_orders` (order_id) and exclude its order_ids in models/staging/stg_payments.sql (`where order_id not in (select order_id from {{ ref('erased_orders') }})`), so the exclusion is auditable. Don't relax the relationships test.\n\nVerification: `dbt build --select stg_payments+` passes. `select count(*) from stg_payments where order_id in (12, 22, 36, 179, 264)` returns 0."}, "SD01": {"sections": [["Failure report", "Command: dbt build  (exit code 1)\nResult: 12 passed, 0 failed, 1 errors, 0 warnings, 19 skipped\n- ERROR: model stg_payments (models/staging/stg_payments.sql)\n    Runtime Error in model stg_payments (models/staging/stg_payments.sql)\n      Binder Error: Column \"amount\" referenced that exists in the SELECT clause - but this column cannot be referenced before it is defined\n- SKIPPED because an upstream node failed: model dim_customers, model fct_orders, 15 tests\n\nCommand: dbt source freshness  (exit code 0)\n- PASS: source raw.raw_customers: max(loaded_at) = 2026-10-13 14:56 UTC, 4.1 h before the check (warn after 24 hours, error after 48 hours)\n- PASS: source raw.raw_orders: ts/schema.yml (no SQL change)\nPrevious incidents:\n- INC-0388 (2026-09-02): stg_payments build warnings after the provider added a `currency` column. Resolution: no change needed; staging ignores the new column.\nRecent run history:\n- stg_payments model status, last 7 daily runs: success ×6, error today (2026-10-13).", false]], "reference": "Root cause: raw.raw_payments no longer has an `amount` column: the provider's export v2 (live 2026-10-12) renamed it to `amount_cents` (still integer cents). stg_payments.sql still selects `amount`, so the view fails with a Binder Error and dim_customers, fct_orders and their tests are skipped.\n\nFix: In models/staging/stg_payments.sql change `cast(amount as decimal(18, 2)) / 100 as amount` to `cast(amount_cents as decimal(18, 2)) / 100 as amount`. Keep the output column name `amount` so dim_customers and fct_orders need no change. In models/staging/sources.yml rename the raw_payments column `amount` to `amount_cents` (payment amount in integer cents).\n\nVerification: Run `dbt build --select stg_payments+`: stg_payments, dim_customers, fct_orders and all their tests pass. Check the unit is unchanged: `select min(amount), max(amount) from stg_payments` should be roughly 5 to 250 (currency units), and the fct_orders revenue total should match the previous run.\n\nNotes: Prevention: enforce a model contract (or a column-presence check) on stg_payments' source columns and follow the provider's changelog."}, "SD02": {"sections": [["Failure report", "Command: dbt build  (exit code 1)\nResult: 18 passed, 0 failed, 1 errors, 0 warnings, 13 skipped\n- ERROR: test not_null_stg_orders_order_date [not_null] on stg_orders.order_date\n  Message: Runtime Error in test not_null_stg_orders_order_date (models/staging/schema.yml)\n  Conversion Error: invalid date field format: \"10/10/2026\", expected format is (YYYY-MM-DD) when casting from source column order_date\n  \n  LINE 18: from \"ecommerce\".\"main\".\"stg_orders\"\n -10 · ticket · SHOP-219: web shop store locale switched from en-US to en-ZA (currency display and date formats).\n- 2026-10-05 · deploy · Warehouse database file moved to faster storage; no schema changes\n- 2026-10-01 · commit d3c24ce · stg_customers: lower-case email and upper-case country code (models/staging/stg_customers.sql)\nPrevious incidents:\n- INC-0351 (2026-08-04): order_date was null for 12 orders after a shop export timeout. Resolution: export re-run, no code change.\nRecent run history:\n- stg_orders tests, last 7 daily runs: all pass ×6; today (2026-10-13) the test that reads order_date errors.\n- New orders per day: 2–5 (normal) for the last 7 days.", false]], "reference": "Root cause: From 2026-10-10 the shop writes order_date as DD/MM/YYYY (e.g. '13/10/2026') instead of ISO 'YYYY-MM-DD' (e.g. '2026-04-17'), after the SHOP-219 locale change. Because the column now mixes formats, raw_orders.order_date loads as VARCHAR and `cast(order_date as date)` in stg_orders raises a Conversion Error on the 10 new rows. Tests that read order_date error, and the marts are skipped.\n\nFix: Root fix: ask the shop team to restore ISO 8601 dates in the export (or set the export date format explicitly). Make staging robust in models/staging/stg_orders.sql: `coalesce(try_strptime(cast(order_date as varchar), '%Y-%m-%d'), try_strptime(cast(order_date as varchar), '%d/%m/%Y'))::date as order_date`. Keep the not_null test on stg_orders.order_date so any value matching neither format still fails.\n\nVerification: `dbt build --select stg_orders+` passes. `select count(*) from stg_orders where order_date is null` returns 0 and `select max(order_date) from stg_orders` is today's date, which shows the new rows were parsed and not dropped.\n\nNotes: Do not read the new values as MM/DD: dates such as 05/10 are ambiguous, so the format must be stated explicitly."}, "SD03": {"sections": [["Failure report", "Command: dbt build  (exit code 1)\nResult: 25 passed, 0 failed, 1 errors, m_customers.sql):\n```sql\nwith customers as (\n\n    select * from {{ ref('stg_customers') }}\n\n),\n\norders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\ncustomer_orders as (\n\n    select\n        customer_id,\n        min(order_date) as first_order_date,\n        max(order_date) as most_recent_order_date,\n        count(order_id) as number_of_orders\n    from orders\n    group by customer_id\n\n),\n\ncustomer_payments as (\n\n    select\n        orders.customer_id,\n        sum(payments.amount) as lifetime_value\n    from payments\n    inner join orders on payments.order_id = orders.order_id\n    where orders.status != 'cancelled'\n    group by orders.customer_id\n\n),\n\nfinal as (\n\n    select\n        customers.customer_id,\n        customers.first_name,\n        customers.last_name,\n        customers.email,\n        customers.country_code,\n        customers.created_at,\n        customer_orders.first_order_date,\n        customer_orders.most_recent_order_date,\n        coalesce(customer_orders.number_of_orders, 0) as number_of_orders,\n        coalesce(customer_payments.lifetime_value, 0) as lifetime_value\n    from customers\n    left join customer_orders on customers.customer_id = customer_orders.customer_id\n    left join customer_payments on customers.customer_id = customer_payments.customer_id\n\n)\n\nselect * from final\n```", false], ["Lineage", "DAG edges (upstream → downstream; tests omitted):\n- source raw.raw_customers → model stg_customers\n- source raw.raw_orders → model stg_orders\n- source raw.raw_payments → model stg_payments\n- model dim_customers → exposure finance_revenue_dashboard\n- model dim_customers → exposure marketing_customer_dashboard\n- model stg_customers → model dim_customers\n- model stg_orders → model dim_customers\n- model stg_payments → model dim_customers\nUpstream nodes and their current warehouse columns:\n- source raw.raw_customers (source table): customer_id VARCHAR, first_name VARCHAR, last_name VARCHAR, email VARCHAR, country VARCHAR, created_at TIMESTAMP, loaded_at TIMESTAMP\n- source raw.raw_orders (source table): order_id INTEGER, customer_id INTEGER, order_date DATE, status VARCHAR, loaded_at TIMESTAMP\n- source raw.raw_payments (source table): payment_id INTEGER, order_id INTEGER, payment_method VARCHAR, amount INTEGER, loaded_at TIMESTAMP\n- model stg_customers (view): customer_id VARCHAR, first_name VARCHAR, last_name VARCHAR, email VARCHAR, country_code VARCHAR, created_at TIMESTAMP, loaded_at TIMESTAMP\n- model stg_orders (view): order_id INTEGER, customer_id INTEGER, order_date DATE, status VARCHAR, loaded_at TIMESTAMP\n- model stg_payments (view): payment_id INTEGER, order_id INTEGER, payment_method VARCHAR, amount DOUBLE, loaded_at TIMESTAMP\nDownstream nodes (affected if the failing node is wrong or skipped):\n- exposure finance_revenue_dashboard (dashboard, owner: Finance analytics): Daily revenue by payment method and order status. Refreshed at 07:00 UTC and used in the daily finance stand-up.\n- exposure marketing_customer_dashboard (dashboard, owner: Marketing analytics): Customer counts, lifetime value and repeat-purchase rate by country.\nColumn-level lineage (as designed):\n- dim_customers.{customer_id, first_name, last_name, email, country_code, created_at} ← stg_customers (same names)\n- dim_customers.{first_order_date, most_recent_order_date, number_of_orders} ← stg_orders.order_date / order_id, per customer_id\n- dim_customers.lifetime_value ← stg_payments.amount joined via stg_orders.order_id, non-cancelled orders, per customer_id\n- stg_customers.customer_id ← raw_customers.customer_id\n- stg_customers.{first_name, last_name, created_at, loaded_at} ← raw_customers (same names)\n- stg_customers.email ← raw_customers.email (lower-cased)\n- stg_customers.country_code ← raw_customers.country (upper-cased)\n- stg_orders.{order_id, customer_id, status, loaded_at} ← raw_orders (same names)\n- stg_orders.order_date ← raw_orders.order_date (cast to date)\n- stg_payments.{payment_id, order_id, payment_method, loaded_at} ← raw_payments (same names)\n- stg_payments.amount ← raw_payments.amount (integer cents / 100)", false], ["Recent history", "Recent changes (newest first):\n- 2026-10-12 · ticket · CRM-77: CRM migrated to a new tenant; customer export regenerated with the tenant's external reference keys.\n- 2026-10-04 · commit 6121d48 · docs: add column descriptions to models/marts/schema.yml (no SQL change)\n- 2026-10-02 · commit 384496e · add accepted_values test on stg_payments.payment_method (models/staging/schema.yml)\nPrevious incidents:\n- INC-0297 (2026-06-15): duplicate customers after a CRM re-sync. Resolution: duplicates removed at source and the CRM export re-run.\nRecent run history:\n- dim_customers model status, last 7 daily runs: success ×6, error today (2026-10-13). stg_customers and its tests passed today.", false]], "reference": "Root cause: raw_customers.customer_id changed from an integer to a prefixed string ('CUST-00042') when the CRM was migrated (CRM-77). stg_customers passes the column through unchanged, so its own unique/not_null tests still pass. The failure only appears in dim_customers, which joins stg_customers.customer_id (VARCHAR) to stg_orders.customer_id (INTEGER) and fails with a Conversion Error. fct_orders' relationships test is skipped.\n\nFix: Normalise the key in models/staging/stg_customers.sql: `cast(regexp_extract(cast(customer_id as varchar), '(\\d+)$', 1) as integer) as customer_id`, and keep the original as `cast(customer_id as varchar) as crm_customer_ref` for traceability. First confirm with the CRM owner that the numeric part matches the shop's customer_id (CUST-00042 = 42). Update the raw_customers.customer_id description in models/staging/sources.yml.\n\nVerification: `dbt build --select stg_customers+` passes, including the relationships test on fct_orders.customer_id. dim_customers has 200 rows and `select typeof(customer_id) from dim_customers limit 1` returns INTEGER.\n\nNotes: Prevention: a model contract with data types on stg_customers would make a key type change fail in staging, where the cause is."}}}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const PAGE = DATA.page, ITEMS = DATA.items, QUESTIONS = DATA.questions;
const COLUMNS = ["rater_id", "scenario_id", "position", ...QUESTIONS.map((q) => q.key), "comments", "checked_at"];
const $ = (id) => document.getElementById(id);

// ------------------------------------------------------------ storage (this browser only)
let rater = "", answers = {}, current = 0, dirty = false;
const storeKey = () => `rpda8411:${PAGE.id}:${rater}`;
function save() { try { localStorage.setItem(storeKey(), JSON.stringify({answers, current, dirty})); } catch (e) {} }
function restore() {
  answers = {}; current = 0; dirty = false;
  try { const raw = localStorage.getItem(storeKey());
        if (raw) { const s = JSON.parse(raw); answers = s.answers || {}; current = s.current || 0; dirty = !!s.dirty; }
  } catch (e) {}
  if (current >= ITEMS.length) current = 0;
}
const isComplete = (a) => a && QUESTIONS.every((q) => a[q.key]);

// ------------------------------------------------------------ text rendering (all input escaped)
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) { return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>"); }
function plain(src) {
  const out = []; const parts = String(src).split(/^\s*```[^\n]*$/m);
  parts.forEach((part, i) => {
    if (i % 2 === 1) out.push("<pre><code>" + esc(part.replace(/^\n/, "").replace(/\n$/, "")) + "</code></pre>");
    else if (part.trim()) out.push(`<div class="plain">${inline(esc(part.replace(/^\n+|\n+$/g, "")))}</div>`);
  });
  return out.join("");
}

// ------------------------------------------------------------ rendering
$("fields").innerHTML = QUESTIONS.map((q) => `
  <fieldset><legend>${esc(q.question)}</legend><p class="hint">${esc(q.hint)}</p>
    <div class="choices">${q.choices.map((c) =>
      `<label><input type="radio" name="${q.key}" value="${esc(c)}">${esc(c)}</label>`).join("")}</div>
  </fieldset>`).join("");
function renderProgress() {
  const done = ITEMS.filter((it) => isComplete(answers[it.position])).length;
  $("progress").textContent = rater ? `${done} of ${ITEMS.length} checked` + (dirty ? " · not exported since last change" : "") : "";
  $("grid").innerHTML = ITEMS.map((it, i) =>
    `<button type="button" class="${isComplete(answers[it.position]) ? "complete" : ""} ${i === current ? "current" : ""}"
       data-i="${i}">${esc(it.scenario_id)}</button>`).join("");
}
function render() {
  const it = ITEMS[current], sc = DATA.scenarios[it.scenario_id];
  $("scenarioTitle").textContent = `Scenario ${it.scenario_id} (${it.position} of ${ITEMS.length})`;
  $("scenario").innerHTML = sc.sections.map(([title, text]) =>
    `<details open><summary>${esc(title)}</summary>${plain(text)}</details>`).join("");
  $("reference").innerHTML = plain(sc.reference);
  const a = answers[it.position] || {};
  for (const q of QUESTIONS) for (const input of document.getElementsByName(q.key)) input.checked = a[q.key] === input.value;
  $("comments").value = a.comments || "";
  $("prevBtn").disabled = current === 0;
  $("nextBtn").textContent = current === ITEMS.length - 1 ? "Save" : "Save and next";
  $("msg").textContent = "";
  renderProgress();
  document.querySelectorAll("section.col").forEach((el) => { el.scrollTop = 0; });
}
function go(i) { current = Math.max(0, Math.min(ITEMS.length - 1, i)); save(); render(); window.scrollTo(0, 0); }

// ------------------------------------------------------------ editing (saved on every change)
function update() {
  if (!rater) { $("msg").textContent = "Choose who is checking (top of the page) first."; return; }
  const it = ITEMS[current], a = Object.assign({}, answers[it.position] || {});
  for (const q of QUESTIONS) { const c = document.querySelector(`input[name="${q.key}"]:checked`); if (c) a[q.key] = c.value; }
  a.comments = $("comments").value;
  if (isComplete(a)) a.checked_at = new Date().toISOString().slice(0, 19) + "Z";
  answers[it.position] = a; dirty = true; save(); renderProgress();
}
$("form").addEventListener("change", update);
$("comments").addEventListener("input", update);
$("prevBtn").onclick = () => go(current - 1);
$("nextBtn").onclick = () => {
  if (!isComplete(answers[ITEMS[current].position])) { $("msg").textContent = "Please answer both questions first."; return; }
  if (current < ITEMS.length - 1) go(current + 1);
  else $("msg").textContent = "Saved. Export the CSV and email it to the researcher.";
};
$("grid").onclick = (e) => { const b = e.target.closest("button[data-i]"); if (b) go(+b.dataset.i); };

// ------------------------------------------------------------ CSV export / import
function csvCell(v) { v = String(v ?? ""); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
$("exportBtn").onclick = () => {
  if (!rater) { $("msg").textContent = "Choose who is checking (top of the page) first."; return; }
  const rows = ITEMS.filter((it) => answers[it.position]).map((it) => {
    const a = answers[it.position];
    return Object.assign({rater_id: rater, scenario_id: it.scenario_id, position: it.position,
                          comments: (a.comments || "").trim(), checked_at: a.checked_at || ""},
                         Object.fromEntries(QUESTIONS.map((q) => [q.key, a[q.key] || ""])));
  });
  const text = [COLUMNS.join(","), ...rows.map((r) => COLUMNS.map((c) => csvCell(r[c])).join(","))].join("\n") + "\n";
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([text], {type: "text/csv"}));
  link.download = `scenario_check_${rater}.csv`;
  document.body.appendChild(link); link.click(); link.remove();
  dirty = false; save(); renderProgress();
};
function parseCsv(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const head = rows.shift() || [];
  return rows.filter((r) => r.length > 1).map((r) => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""])));
}
$("loadFile").onchange = async (e) => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  const rows = parseCsv(await file.text());
  const byPos = Object.fromEntries(ITEMS.map((it) => [String(it.position), it]));
  const ok = rows.filter((r) => byPos[r.position] && byPos[r.position].scenario_id === r.scenario_id && r.rater_id);
  if (!ok.length) { $("msg").textContent = "This CSV does not match this page."; return; }
  rater = ok[0].rater_id; $("raterSelect").value = rater; restore();
  for (const r of ok) answers[r.position] = Object.assign({comments: r.comments, checked_at: r.checked_at},
    Object.fromEntries(QUESTIONS.map((q) => [q.key, r[q.key]])));
  save(); render();
};

// ------------------------------------------------------------ start
document.title = PAGE.title;
$("title").textContent = PAGE.title;
$("banner").innerHTML = PAGE.banner;
$("raterSelect").innerHTML = `<option value="">choose…</option>` +
  PAGE.raters.map(([id, label]) => `<option value="${esc(id)}">${esc(label)}</option>`).join("");
$("raterSelect").onchange = (e) => { rater = e.target.value; restore(); render(); };
render();
</script>
</body>
