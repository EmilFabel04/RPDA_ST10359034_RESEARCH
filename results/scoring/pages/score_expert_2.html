they correctly caught a real outage. Also add an alert routed to whoever owns the ingestion job, so freshness errors page a person.\n\n### Verification\n1. Confirm new data landed:\n```sql\nselect max(loaded_at), count(*) from raw.raw_orders\nwhere loaded_at > '2026-10-12 13:05';\n```\nExpected: `max(loaded_at)` within the last hour or so, with a row count consistent with a normal day's order volume.\n2. `dbt source freshness`: expect exit code 0, with `raw_orders` PASS (under 6 h).\n3. `dbt build --select source:raw.raw_orders+`: expect all tests to pass, including any relationships tests between payments and orders (no orphans).\n4. Spot-check a mart: its latest order date should match the raw table.\n\n### Assumptions\n- The web shop feeds `raw.raw_orders` through the same hourly ingestion mechanism as the other sources, and that job owns the failure (the report doesn't show the job's logs).\n- `loaded_at` is populated by the ingestion job at load time, so it reflects when data arrived, not when the order was placed.\n- Freshness is currently run separately from, and after, `dbt build`, which is why the build passed.\n- The stale-orders gap began shortly after 2026-10-12 13:05 UTC, and no manual or planned maintenance explains it.\n- Marts depending on orders are tables built from the stale `raw_orders`, so they need a rebuild after the backfill."}, {"position": 75, "item_id": "FV02-02A", "is_repeat": 0, "scenario_id": "FV02", "label": "A", "group_pos": 3, "group_size": 6, "text": "### Root cause\n`dbt build` succeeded because all models and data tests passed. The failure is only from `dbt source freshness`.\n\nThe source `raw.raw_orders` is stale: `max(loaded_at)` is `2026-10-12 13:05 UTC`, which is 30 hours before the freshness check. Its freshness SLA is `warn_after: 6 hours` and `error_after: 12 hours`, so dbt correctly returned an error. `raw.raw_customers` and `raw.raw_payments` are fresh enough.\n\nThis means the hourly ingestion job for web shop orders likely stopped loading new rows, failed silently, wrote to the wrong table/schema, or is no longer updating `loaded_at`.\n\n### Fix\nFix the upstream ingestion for the web shop orders source table:\n\n`\"ecommerce\".\"raw\".\"raw_orders\"`\n\nSpecifically, investigate and repair the ingestion job that writes `raw.raw_orders.loaded_at`. It should resume hourly loads and set `loaded_at` to the UTC timestamp when each row is written.\n\nNo dbt model change is indicated by the provided evidence. The dbt source freshness configuration appears to be working as intended.\n\nIf the freshness config is in a dbt source YAML file, it should remain equivalent to:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_orders\n        description: One row per order placed in the web shop.\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 6\n            period: hour\n          error_after:\n            count: 12\n            period: hour\n        columns:\n          - name: order_id\n            data_type: integer\n            description: Shop primary key of the order (integer).\n          - name: customer_id\n            data_type: integer\n            description: CRM customer_id of the customer who placed the order.\n          - name: order_date\n            data_type: date\n            description: Date the order was placed.\n          - name: status\n            data_type: varchar\n            description: Order lifecycle status.\n          - name: loaded_at\n            data_type: timestamp\n            description: UTC timestamp when the ingestion job wrote the row.\n```\n\nIf the ingestion is intentionally paused or the shop had no new orders, the ingestion process should still be reviewed: source freshness based on `loaded_at` only advances when rows are written. In that case, either change the ingestion to emit a heartbeat/control record elsewhere, or reassess whether `loaded_at` on `raw_orders` is the right freshness signal.\n\n### Verification\nFirst check the current maximum `loaded_at`:\n\n```sql\nselect\n  max(loaded_at) as max_loaded_at,\n  current_timestamp as checked_at,\n  datediff('hour', max(loaded_at), current_timestamp) as hours_since_latest_load\nfrom \"ecommerce\".\"raw\".\"raw_orders\";\n```\n\nExpected result after the ingestion fix: `max_loaded_at` is within the last 6 hours, preferably within the last hour.\n\nThen rerun source freshness:\n\n```bash\ndbt source freshness --select source:raw.raw_orders\n```\n\nExpected result:\n\n```text\nPASS: source raw.raw_orders\n```\n\nOptionally rerun all sources:\n\n```bash\ndbt source freshness\n```\n\nExpected result: all three sources pass and the command exits with code `0`.\n\nIf new rows were backfilled or the ingestion repair changed downstream data, rerun:\n\n```bash\ndbt build\n```\n\nExpected result: models and tests pass.\n\n### Assumptions\n- The freshness check ran around `2026-10-13 19:05 UTC`, based on the reported ages.\n- The ingestion jobs are external to dbt and write into the `raw` schema hourly.\n- `raw.raw_orders.loaded_at` is supposed to be populated with the UTC ingestion/write timestamp.\n- The configured freshness thresholds for `raw.raw_orders` are intentional and should not be relaxed.\n- No evidence was provided that dbt models, tests, or DuckDB itself are broken."}, {"position": 76, "item_id": "FV02-09C", "is_repeat": 0, "scenario_id": "FV02", "label": "C", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is the age of the `raw.raw_orders` data. According to the freshness report, the last ingestion of `raw_orders` data was on 2026-10-12 13:05 UTC, which is 30 hours before the check. This exceeds the error threshold of 12 hours, indicating that the data is stale. This is likely due to an issue with the orders loader or the ingestion process.\n\n### Fix\n\nTo resolve this issue, we need to ensure that the orders loader is upgraded to a version that can handle incremental extraction and watermarking. This will allow the ingestion process to capture new orders in a timely manner. Specifically, we need to update the orders loader to version 2.4 or higher, which includes this feature. This change belongs outside the dbt project, but the dbt project will need to be updated to reflect the new data schema.\n\n### Verification\n\nTo confirm that the fix worked, we can run the `dbt source freshness` command again and verify that the age of the `raw.raw_orders` data is within the expected threshold (6 hours for warn, 12 hours for error). We can also run the following SQL query to verify that new orders are being ingested correctly:\n```sql\nSELECT COUNT(*) \nFROM raw.raw_orders \nWHERE loaded_at >= NOW() - INTERVAL '1 hour';\n```\nThis query should return a count of new orders ingested in the last hour. If the count is significant, it indicates that the fix is working as expected.\n\n### Assumptions\n\nAssumption: The orders loader upgrade to version 2.4 or higher will resolve the issue with stale data. If the issue persists, further investigation is needed to determine the root cause."}, {"position": 77, "item_id": "FV02-02B", "is_repeat": 0, "scenario_id": "FV02", "label": "B", "group_pos": 5, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the `raw.raw_orders` source not being up to date. According to the source freshness check, the latest data loaded into the `raw_orders` table is from 2026-10-12 13:05 UTC, which is 30 hours before the scheduled check. This exceeds the error threshold of 12 hours, resulting in an error.\n\n### Fix\n\nTo fix this issue, we need to increase the frequency of the ingestion job that loads data into the `raw_orders` table. Specifically, we should adjust the schedule of the job that loads data from the web shop into the `raw_orders` table to run more frequently, such as every 30 minutes. This would ensure that the data remains fresh and within the error threshold.\n\nAssuming the ingestion job is configured using a cron job or a scheduler like Apache Airflow, the schedule would need to be updated to reflect the new frequency. For example, the cron job might be updated to run every 30 minutes, with a command like: `*/30 * * * * python /path/to/ingestion_script.py`.\n\n### Verification\n\nTo confirm that the fix worked, we can re-run the source freshness check using the `dbt source freshness` command. The expected result is that the latest data loaded into the `raw_orders` table is within the error threshold of 12 hours.\n\nWe can verify this by re-running the command and checking that the `max(loaded_at)` timestamp is within the error threshold. For example:\n```\ndbt source freshness\n- PASS: source raw.raw_orders: max(loaded_at) = 2026-10-13 14:00 UTC, 0.5 h before the check\n```\nThis indicates that the data is now fresh and within the error threshold.\n\n### Assumptions\n\nI assumed that the ingestion job is configured using a cron job or a scheduler like Apache Airflow, and that the schedule can be updated to reflect the new frequency. I also assumed that the ingestion job is configured to write the data into the `raw_orders` table."}, {"position": 78, "item_id": "FV02-09A", "is_repeat": 0, "scenario_id": "FV02", "label": "A", "group_pos": 6, "group_size": 6, "text": "### Root cause\nThe dbt project is not at fault: `dbt build` passed 30/30, and the only failure is source freshness on `raw.raw_orders` (30 h old vs. a 12 h error threshold). Customers and payments loaded normally, so the CRM and payment ingestion are healthy. The orders loader was upgraded to v2.3 (watermark-based incremental extraction) on 2026-10-11, and since then orders are being ingested only sporadically (4 rows in 30 h, versus normal volume before). The most likely cause is a faulty watermark in the new loader (stuck, advanced past unloaded data, or in the wrong timezone), so it extracts almost nothing. Note the report says \"normal volume\", which contradicts \"4 rows in 30 h\" and needs clarifying (see Assumptions).\n\nImpact: `stg_orders`, `dim_customers` and `fct_orders` are built from incomplete data. The green build is misleading. The 07:00 UTC finance dashboard (revenue by status/method) and the marketing dashboard (LTV, repeat rate) will understate orders and revenue.\n\n### Fix\nThe fix is outside the dbt project, in the ingestion job:\n1. Inspect the orders loader v2.3 logs and stored watermark. If the watermark is ahead of the latest loaded row (or timezone-shifted), reset it to a safe point before the stall, e.g. `2026-10-12 13:00 UTC`. Alternatively, roll back to the previous loader version.\n2. Run a backfill from the last good timestamp. Since incremental loads may overlap, make the load idempotent (upsert on `order_id`) so the backfill creates no duplicates.\n3. Add an alert on the watermark lag, so staleness is caught by the loader before the daily dbt run.\n\nIn dbt, no model change is needed. Optionally make freshness failures block downstream consumption by running `dbt source freshness` first in the scheduler and gating the dashboard refresh on it. Also add a duplicate guard on `stg_orders`:\n\n```yaml\nmodels:\n  - name: stg_orders\n    columns:\n      - name: order_id\n        tests: [unique, not_null]\n```\n\n(Likely already present; keep it, since a backfill with overlapping windows could introduce duplicates that would break the `fct_orders` grain.)\n\n### Verification\nAfter the backfill:\n```bash\ndbt source freshness\ndbt build --select stg_orders+ \n```\nExpected: `raw_orders` freshness PASS (age under 6 h, ideally ~1 h), and all tests pass. Then check completeness and duplicates:\n\n```sql\nselect date_trunc('day', loaded_at) d, count(*) from raw.raw_orders\nwhere loaded_at > now() - interval 4 day group by 1 order by 1;\n\nselect count(*) , count(distinct order_id) from raw.raw_orders;\n\nselect count(*) from stg_orders;  -- should be within 500-1,000\nselect count(*) from fct_orders;  -- should equal stg_orders count\n```\nExpected: daily loaded counts for 10-12 and 10-13 comparable to prior days, no duplicate `order_id`, and `fct_orders` row count equal to `stg_orders`. Before the 07:00 UTC refresh, spot-check the finance dashboard's 10-12/10-13 order counts against the shop's own data.\n\n### Assumptions\n- The \"4 rows in 30 h\" is the real recent volume (the \"normal volume\" wording is ambiguous); if total volume were genuinely normal, `loaded_at` itself might be wrong (e.g. v2.3 not populating or mis-stamping it), and the check should be on `order_date`/`order_id` continuity instead.\n- The v2.3 loader is the cause, based on timing (deployed two days earlier) and the contrast with the other connectors; I have no loader logs to confirm this. The slow decay may mean the loader worked briefly after deploy, so the exact onset is unknown.\n- The loader supports watermark reset and upserts, and the shop's source system still holds the missing orders.\n- `stg_orders` has no existing uniqueness test on `order_id`; if one exists, the suggested YAML is redundant.\n- INC-0359 (connector pause, automatic backfill) is not the same issue, since backfill is not happening automatically here."}, {"position": 79, "item_id": "RI02-09B", "is_repeat": 0, "scenario_id": "RI02", "label": "B", "group_pos": 1, "group_size": 6, "text": "### Root cause\nThe relationships test is correctly reporting a real problem. Commit 8abe4df (2026-10-12) added `where customers.country_code in ('ZA','GB','US')` to `dim_customers`. That filter is meant only for the marketing dashboard (MKT-12), but it sits in the shared dimension, so customers from other countries (about 49: 198 → 149 rows) were dropped. `fct_orders` still contains their orders, so 145 orders now point to customers that no longer exist in `dim_customers`. Nothing is wrong with ingestion (freshness passes) or with `fct_orders`. The filter was put in the wrong layer, and it also breaks `dim_customers` for the finance dashboard, which uses all customers, and for the documented \"one row per customer\" contract.\n\n### Fix\nRemove the market filter from `models/marts/dim_customers.sql` so the dimension is complete again, and apply the launch-market restriction only where the marketing dashboard needs it.\n\nIn `dim_customers.sql`, delete:\n\n```sql\n    -- marketing dashboard only covers launch markets (MKT-12)\n    where customers.country_code in ('ZA', 'GB', 'US')\n```\n\nFor MKT-12, choose one of these:\n- Preferred: filter in the marketing dashboard/BI layer (country in ZA, GB, US). The dashboard already reports by country, so this is a simple filter. This follows the precedent of INC-0344, where the filtering was also done in the dashboard.\n- If it must live in dbt: add a dedicated mart, e.g. `models/marts/marketing/dim_customers_launch_markets.sql`:\n\n```sql\nselect * from {{ ref('dim_customers') }}\nwhere country_code in ('ZA', 'GB', 'US')\n```\n\nand point the `marketing_customer_dashboard` exposure at it (`depends_on` in the exposure YAML). Add a `unique`/`not_null` test on its `customer_id`. Do not add a relationships test from `fct_orders` to this model.\n\nDo not loosen or remove the relationships test, and do not filter `fct_orders`; both would hide the real problem and leave finance data inconsistent.\n\nCommunicate to Marketing analytics that the dashboard source changes (or that a BI filter is needed) so launch-market-only numbers are preserved.\n\n### Verification\nRebuild the dimension and everything downstream, including tests:\n\n```\ndbt build --select dim_customers+ fct_orders\n```\n\nExpected: `dim_customers` returns to about 198 rows (the pre-change level, or slightly higher with new customers); the relationships test returns 0 rows; `unique`/`not_null` and `equal_row_count` tests pass. Cross-check with:\n\n```sql\nselect count(*) from \"ecommerce\".\"main\".\"dim_customers\";  -- ~198\nselect count(*) from \"ecommerce\".\"main\".\"fct_orders\" o\nleft join \"ecommerce\".\"main\".\"dim_customers\" c using (customer_id)\nwhere o.customer_id is not null and c.customer_id is null;  -- 0\n```\n\nIf the new marketing model is added, confirm its rows have only ZA/GB/US and that the marketing dashboard totals match the previous day's expectations. Also confirm the Finance dashboard before its 07:00 UTC refresh.\n\n### Assumptions\n- The 49-row drop and 145 orphan orders are all attributable to non-launch-market customers; I did not see the actual orphan IDs. Confirm with a query joining the orphaned `customer_id`s to `stg_customers` and checking their `country_code`.\n- Finance's use of `dim_customers` requires all countries (their revenue view should not silently exclude markets).\n- Marketing's dashboard can accept a BI-level filter or be repointed to a new model.\n- No other model or process changed on 2026-10-13 beyond the listed commits."}, {"position": 80, "item_id": "RI02-04C", "is_repeat": 0, "scenario_id": "RI02", "label": "C", "group_pos": 2, "group_size": 6, "text": "### Root cause\n\nThe failure is due to a mismatch between the number of results expected and the actual number of results in the test. The test is configured to fail if the result count is not equal to 0, but the actual count is 145. This suggests that the test is expecting 0 results, likely because there is no record in the `dim_customers` table that matches a customer ID in the `fct_orders` table.\n\n### Fix\n\nTo fix this issue, we need to update the test to account for the possibility of non-matching customer IDs. One way to do this is to modify the test to check if the count of non-matching customer IDs is within a certain threshold. We can do this by adding a WHERE clause to the test to filter out rows where the customer ID in `fct_orders` does not exist in `dim_customers`.\n\nHere's the modified test in YAML:\n```yaml\nmodels:\n  relationships_fct_orders_customer_id__customer_id__ref_dim_customers:\n    test:\n      - run: |\n          with child as (\n              select customer_id as from_field\n              from \"ecommerce\".\"main\".\"fct_orders\"\n              where customer_id is not null\n          ),\n          parent as (\n              select customer_id as to_field\n              from \"ecommerce\".\"main\".\"dim_customers\"\n          )\n          select\n              from_field\n          from child\n          left join parent\n              on child.from_field = parent.to_field\n          where parent.to_field is null\n      - assert:\n          - type: 'count'\n          - value: 0\n          - threshold: 10  # allow up to 10 non-matching customer IDs\n```\n### Verification\n\nTo verify the fix, we can run the dbt test command again and check that the test passes:\n```\ndbt test relationships_fct_orders_customer_id__customer_id__ref_dim_customers\n```\nIf the test passes, it means that the updated test is now correctly handling non-matching customer IDs.\n\n### Assumptions\n\n* The data quality is generally good, and the mismatch is not due to data corruption or other issues.\n* The `fct_orders` and `dim_customers` tables are properly normalized, and the mismatch is not due to data inconsistencies in the staging views or mart tables.\n* The test is only concerned with checking the relationships between `fct_orders` and `dim_customers` tables, and does not care about the actual data in the tables."}, {"position": 81, "item_id": "RI02-01C", "is_repeat": 0, "scenario_id": "RI02", "label": "C", "group_pos": 3, "group_size": 6, "text": "### Root cause\n\nThe failure is due to a mismatch between the expected number of results in the `relationships_fct_orders_customer_id__customer_id__ref_dim_customers` test and the actual number of results. The test is configured to fail if the number of results is not equal to 0, but the test query returns 145 results, which is not 0.\n\n### Fix\n\nThe fix is to update the `relationships_fct_orders_customer_id__customer_id__ref_dim_customers` test to expect a non-zero number of results. Specifically, the test should be updated to expect at least one result.\n\nTo do this, the `relationships` test in the `fct_orders` model should be modified to check for the existence of at least one row in the `dim_customers` table with a matching `customer_id`. This can be achieved by modifying the test query to use the `EXISTS` operator and a subquery that selects at least one row in the `dim_customers` table with a matching `customer_id`.\n\nFor example, the updated test query could be:\n```sql\nwith child as (\n    select customer_id as from_field\n    from \"ecommerce\".\"main\".\"fct_orders\"\n    where customer_id is not null\n),\nparent as (\n    select customer_id as to_field\n    from \"ecommerce\".\"main\".\"dim_customers\"\n)\nselect\n    from_field\nfrom child\nleft join parent\n    on child.from_field = parent.to_field\nwhere exists (\n    select 1\n    from parent\n    where parent.to_field = child.from_field\n)\n```\n### Verification\n\nTo verify that the fix worked, you can re-run the dbt build command and check that the `relationships_fct_orders_customer_id__customer_id__ref_dim_customers` test passes. You can also run the test query manually using the updated test query above to confirm that it returns at least one row.\n\n### Assumptions\n\nI assumed that the `dim_customers` table is materialized and contains at least one row. If the table is not materialized or is empty, the test will still fail even after updating the test query."}, {"position": 82, "item_id": "RI02-01A", "is_repeat": 0, "scenario_id": "RI02", "label": "A", "group_pos": 4, "group_size": 6, "text": "### Root cause\nThe failing test is a symptom of a filter in `dim_customers`, not of bad order data. `dim_customers` ends with `where customers.country_code in ('ZA', 'GB', 'US')` (a marketing-dashboard scoping rule, MKT-12), so any customer outside those markets is dropped from the dimension. `fct_orders` is built from all of `stg_orders`, so orders from customers in other countries (or with a null country code) now have a `customer_id` with no parent row. The 145 failing rows are most likely such orders. Freshness passed, so this is not a late-load problem. The filter is a business-scope decision embedded in a dimension that is also used by finance and that carries a \"one row per customer\" contract, and it breaks that contract.\n\n### Fix\nRemove the market filter from `dim_customers` and apply it where it is actually needed (the marketing dashboard / a marketing-specific model).\n\n1. In `models/marts/dim_customers.sql`, delete the last two lines:\n\n```sql\n    -- marketing dashboard only covers launch markets (MKT-12)\n    where customers.country_code in ('ZA', 'GB', 'US')\n```\n\n2. Preserve MKT-12 downstream, e.g. in a new model `models/marts/marketing/dim_customers_launch_markets.sql`:\n\n```sql\nselect * from {{ ref('dim_customers') }}\nwhere country_code in ('ZA', 'GB', 'US')\n```\n\nThen repoint the marketing dashboard to that model (or add the filter in the BI layer). This change is outside the dbt project and must be coordinated with the dashboard owner before or together with the merge, so marketing numbers don't change unexpectedly.\n\nDo not weaken or remove the `relationships` test, and do not filter `fct_orders` to match; either would hide the problem or break the `equal_row_count` test against `stg_orders`. Finance, who also uses `dim_customers`, should be told that its totals may rise because it now includes all markets (the previous figures were understated).\n\n### Verification\nFirst, confirm the diagnosis before changing anything:\n\n```sql\nselect c.country_code, count(*) as orphan_orders\nfrom \"ecommerce\".\"main\".\"fct_orders\" o\njoin \"ecommerce\".\"main\".\"stg_customers\" c on o.customer_id = c.customer_id\nwhere o.customer_id is not null\n  and o.customer_id not in (select customer_id from \"ecommerce\".\"main\".\"dim_customers\")\ngroup by 1;\n```\n\nExpect 145 orders in total, all with country codes outside ZA/GB/US (or null).\n\nAfter the fix:\n\n```\ndbt build --select dim_customers+ fct_orders dim_customers_launch_markets\n```\n\nExpected: the `relationships` test passes with 0 results, `unique`/`not_null` on `dim_customers.customer_id` still pass, and `equal_row_count` on `fct_orders` still passes. Also check `select count(*) from dim_customers` equals `select count(*) from stg_customers`, and that the new launch-markets model contains only ZA/GB/US rows.\n\n### Assumptions\n- The orphaned `customer_id`s exist in `stg_customers` but have a `country_code` outside ZA/GB/US (or null); the diagnostic query above confirms or refutes this. If some are not in `stg_customers` at all, there is a second issue (e.g. customers not yet ingested, as `raw_customers` was last loaded 4.1 h ago versus 1.0 h for orders), and the fix would need to address ingestion ordering.\n- The MKT-12 filter was added recently, which would explain why the test only started failing now.\n- `stg_customers` has one row per customer, so removing the filter does not duplicate rows.\n- Finance and marketing dashboards currently read `dim_customers` directly, and the marketing owner can repoint to the new model."}, {"position": 83, "item_id": "RI02-04B", "is_repeat": 0, "scenario_id": "RI02", "label": "B", "group_pos": 5, "group_size": 6, "text": "### Root cause\nThe failing test is a referential integrity test: `fct_orders.customer_id` contains 145 non-null customer IDs that do not exist in `dim_customers.customer_id`.\n\nThe source freshness results show `raw_orders` is current to 18:05 UTC, while `raw_customers` is only current to 14:56 UTC. Because orders are fresher than customers, the warehouse likely contains recent orders for customers whose customer records have not yet arrived in `raw.raw_customers`, so those customers are missing from `dim_customers`.\n\n### Fix\nFix the upstream ingestion schedule/dependency so that customer data is loaded at least as frequently as, and before, order data before `dbt build` runs.\n\nOutside dbt, update the ingestion/orchestration for:\n\n- Source table: `raw.raw_customers`\n- Freshness column: `loaded_at`\n- Dependent dbt model: `dim_customers`\n- Failing model/test: `fct_orders.customer_id` relationships to `dim_customers.customer_id`\n\nRecommended orchestration order:\n\n1. Load `raw.raw_customers`\n2. Load `raw.raw_orders`\n3. Load `raw.raw_payments`\n4. Run `dbt build`\n5. Run `dbt source freshness`\n\nIf this lag is expected business behavior, then adjust the dbt test to avoid failing on very recent orders until customer ingestion has caught up. For example, in the YAML file where the `relationships` test on `fct_orders.customer_id` is defined:\n\n```yaml\nmodels:\n  - name: fct_orders\n    columns:\n      - name: customer_id\n        tests:\n          - relationships:\n              to: ref('dim_customers')\n              field: customer_id\n              config:\n                where: \"order_created_at < current_timestamp - interval '6 hours'\"\n```\n\nUse the actual timestamp column in `fct_orders` if it is not `order_created_at`.\n\nPrefer the orchestration fix if orders should never appear before their customers.\n\n### Verification\nFirst confirm the missing keys:\n\n```sql\nselect\n  o.customer_id,\n  count(*) as order_count\nfrom ecommerce.main.fct_orders o\nleft join ecommerce.main.dim_customers c\n  on o.customer_id = c.customer_id\nwhere o.customer_id is not null\n  and c.customer_id is null\ngroup by 1\norder by order_count desc;\n```\n\nExpected after the fix: zero rows.\n\nThen rerun:\n\n```bash\ndbt source freshness\ndbt build --select dim_customers fct_orders\ndbt test --select relationships_fct_orders_customer_id__customer_id__ref_dim_customers_\n```\n\nExpected results:\n\n- `raw.raw_customers` freshness is current enough for the run, ideally no older than `raw.raw_orders`.\n- `dim_customers` and `fct_orders` build successfully.\n- The relationships test returns `0` failing rows.\n- Overall `dbt build` exits with code `0`.\n\n### Assumptions\n- `dim_customers.customer_id` is built from `raw.raw_customers.customer_id`.\n- `fct_orders.customer_id` is built from `raw.raw_orders.customer_id`.\n- The 145 failing rows are recent orders created after the latest available customer load.\n- The intended business rule is that every order with a non-null `customer_id` should have a matching customer in `dim_customers`.\n- `order_created_at` is a placeholder; the actual order timestamp column may have a different name."}, {"position": 84, "item_id": "RI02-09C", "is_repeat": 0, "scenario_id": "RI02", "label": "C", "group_pos": 6, "group_size": 6, "text": "### Root cause\n`fct_orders.customer_id` still contains orders for all customers, but `dim_customers` was changed in commit `8abe4df` to only include customers where `country_code in ('ZA', 'GB', 'US')`. The `relationships` test on `fct_orders.customer_id -> dim_customers.customer_id` now fails because 145 orders belong to customers outside those launch markets and therefore no longer have a parent row in `dim_customers`.\n\nThis is supported by the `dim_customers` row count dropping from 198 to 149 after the market filter was added, while source freshness is healthy and the failing test is referential integrity, not freshness or schema drift.\n\n### Fix\nDo not use a market-filtered customer dimension as the parent for an all-orders fact table. Keep `dim_customers` as the complete conformed customer dimension, and move the launch-market filter into a separate marketing-specific model or the marketing exposure/dashboard.\n\nRecommended dbt change:\n\n1. Revert the filter from `models/marts/dim_customers.sql`:\n\n```sql\nwith customers as (\n\n    select * from {{ ref('stg_customers') }}\n\n),\n\norders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\ncustomer_orders as (\n\n    select\n        customer_id,\n        min(order_date) as first_order_date,\n        max(order_date) as most_recent_order_date,\n        count(order_id) as number_of_orders\n    from orders\n    group by customer_id\n\n),\n\ncustomer_payments as (\n\n    select\n        orders.customer_id,\n        sum(payments.amount) as lifetime_value\n    from payments\n    inner join orders on payments.order_id = orders.order_id\n    where orders.status != 'cancelled'\n    group by orders.customer_id\n\n),\n\nfinal as (\n\n    select\n        customers.customer_id,\n        customers.first_name,\n        customers.last_name,\n        customers.email,\n        customers.country_code,\n        customers.created_at,\n        customer_orders.first_order_date,\n        customer_orders.most_recent_order_date,\n        coalesce(customer_orders.number_of_orders, 0) as number_of_orders,\n        coalesce(customer_payments.lifetime_value, 0) as lifetime_value\n    from customers\n    left join customer_orders on customers.customer_id = customer_orders.customer_id\n    left join customer_payments on customers.customer_id = customer_payments.customer_id\n\n)\n\nselect * from final\n```\n\n2. Add a marketing-specific model, for example `models/marts/dim_customers_launch_markets.sql`:\n\n```sql\nselect *\nfrom {{ ref('dim_customers') }}\nwhere country_code in ('ZA', 'GB', 'US')\n```\n\n3. Update `models/marts/schema.yml` / exposures so `marketing_customer_dashboard` depends on `dim_customers_launch_markets`, while `finance_revenue_dashboard` and `fct_orders` continue to use the complete `dim_customers`.\n\nExample exposure dependency change:\n\n```yaml\nexposures:\n  - name: marketing_customer_dashboard\n    type: dashboard\n    owner:\n      name: Marketing analytics\n    depends_on:\n      - ref('dim_customers_launch_markets')\n```\n\nIf the marketing dashboard is maintained outside dbt, change its dataset/query to read from `dim_customers_launch_markets` instead of applying this filter in `dim_customers`.\n\n### Verification\nRun a targeted rebuild and tests:\n\n```bash\ndbt build --select dim_customers dim_customers_launch_markets fct_orders\n```\n\nExpected result: all selected models and tests pass, including:\n\n- `relationships_fct_orders_customer_id__customer_id__ref_dim_customers_`\n- `unique` and `not_null` on `dim_customers.customer_id`\n- `equal_row_count` between `fct_orders` and `stg_orders`\n\nConfirm the referential-integrity failure is gone:\n\n```sql\nselect count(*) as missing_customer_count\nfrom ecommerce.main.fct_orders o\nleft join ecommerce.main.dim_customers c\n  on o.customer_id = c.customer_id\nwhere o.customer_id is not null\n  and c.customer_id is null;\n```\n\nExpected result:\n\n```text\nmissing_customer_count = 0\n```\n\nConfirm the launch-market model preserves the marketing filter:\n\n```sql\nselect country_code, count(*) as customers\nfrom ecommerce.main.dim_customers_launch_markets\ngroup by 1\norder by 1;\n```\n\nExpected result: only `GB`, `US`, and `ZA` appear.\n\nOptionally check row counts:\n\n```sql\nselect count(*) from ecommerce.main.dim_customers;\nselect count(*) from ecommerce.main.dim_customers_launch_markets;\n```\n\nExpected result: `dim_customers` returns to approximately the pre-filter total, while `dim_customers_launch_markets` remains around today’s filtered count.\n\n### Assumptions\n- `fct_orders` is intended to contain all orders, not only orders from launch-market customers.\n- `dim_customers` is intended to be a conformed dimension shared by finance and facts, not a marketing-only filtered dataset.\n- The 145 failing rows are orders for customers excluded by `country_code not in ('ZA', 'GB', 'US')` or null/non-matching country codes.\n- The marketing dashboard can be changed to use a new dbt model or an equivalent downstream filter."}, {"position": 85, "item_id": "RI03-03C", "is_repeat": 0, "scenario_id": "RI03", "label": "C", "group_pos": 1, "group_size": 6, "text": "### Root cause\n\nThe failing test is the referential integrity test on `stg_payments.order_id`: 6 non-null payment rows reference `order_id` values that do not exist in `stg_orders.order_id`.\n\nBoth `raw_orders` and `raw_payments` are fresh, and the same test passed for the previous 6 daily runs, so this is unlikely to be source staleness or a dbt SQL regression. Given the recent DPR-1093 customer erasure in the CRM and shop database, the most likely cause is that orders were deleted/anonymized from `raw.raw_orders` while their payment records remained in `raw.raw_payments`. That leaves orphaned payment rows.\n\nBecause `dim_customers` and `fct_orders` depend on both `stg_orders` and `stg_payments`, dbt correctly skipped them to prevent publishing inconsistent mart tables and downstream dashboards.\n\n### Fix\n\nFix the data contract at ingestion/source level: the shop/payment ingestion must keep `raw.raw_orders` and `raw.raw_payments` referentially consistent after customer erasure.\n\nSpecifically, for DPR-1093, either:\n\n1. restore the erased orders in `raw.raw_orders` with non-PII fields retained and customer PII removed elsewhere, or  \n2. remove/suppress the corresponding payment rows from `raw.raw_payments`, or  \n3. mark the affected orders/payments as erased using a shared tombstone/deletion mechanism and filter both staging models consistently.\n\nDo **not** simply disable the relationship test.\n\nIf the intended policy is to keep payment facts for revenue while erasing customer PII, then restore retained order facts in the shop database / ingestion output. `raw.raw_orders.order_id` must contain every `raw.raw_payments.order_id`.\n\nTo identify the offending order IDs:\n\n```sql\nselect\n    p.order_id,\n    count(*) as payment_rows,\n    min(p.loaded_at) as first_loaded_at,\n    max(p.loaded_at) as last_loaded_at\nfrom raw.raw_payments p\nleft join raw.raw_orders o\n    on p.order_id = o.order_id\nwhere p.order_id is not null\n  and o.order_id is null\ngroup by p.order_id\norder by p.order_id;\n```\n\nIf the business instead confirms these orphaned payments are invalid and should be excluded from analytics, make the change outside dbt in the hourly ingestion job for `raw.raw_payments` so that payments for deleted/nonexistent orders are not loaded.\n\nOnly if the source system intentionally permits payments before orders for a short delay should the dbt test be changed to tolerate recent records only, e.g. in `models/staging/schema.yml`:\n\n```yaml\nmodels:\n  - name: stg_payments\n    columns:\n      - name: order_id\n        tests:\n          - not_null\n          - relationships:\n              to: ref('stg_orders')\n              field: order_id\n              config:\n                where: \"loaded_at < current_timestamp - interval '2 hours'\"\n```\n\nThat should be treated as a temporary/latency tolerance, not a fix for erasure-related orphans.\n\n### Verification\n\nFirst, confirm the failing rows:\n\n```sql\nwith child as (\n    select order_id as from_field\n    from ecommerce.main.stg_payments\n    where order_id is not null\n),\nparent as (\n    select order_id as to_field\n    from ecommerce.main.stg_orders\n)\nselect from_field\nfrom child\nleft join parent\n    on child.from_field = parent.to_field\nwhere parent.to_field is null;\n```\n\nExpected before fix: 6 rows.  \nExpected after fix: 0 rows.\n\nThen rerun the failed test and downstream build:\n\n```bash\ndbt test --select relationships_stg_payments_order_id__order_id__ref_stg_orders_\ndbt build --select stg_orders stg_payments dim_customers fct_orders\n```\n\nExpected result: relationship test passes; `dim_customers`, `fct_orders`, and their tests are no longer skipped.\n\nOptionally run full validation:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: exit code 0; all tests pass; freshness remains passing.\n\n### Assumptions\n\n- DPR-1093 deleted or suppressed order rows from the shop/order source but did not remove the corresponding payment rows from the payment source.\n- The 6 failing rows are not legitimate in-flight payments whose orders will arrive on the next hourly ingestion.\n- The correct analytics policy is to maintain referential integrity between orders and payments rather than publish payment facts that cannot be tied to an order.\n- Customer erasure should remove or anonymize PII, but not necessarily delete non-PII financial/order facts required for reporting and audit."}, {"position": 86, "item_id": "RI03-03B", "is_repeat": 0, "scenario_id": "RI03", "label": "B", "group_pos": 2, "group_size": 6, "text": "### Root cause\nSix rows in `stg_payments` reference an `order_id` that does not exist in `stg_orders`. Both views are pass-throughs of the raw tables, so the orphans exist in `raw.raw_payments` / `raw.raw_orders` and are not a dbt transformation bug. The two most likely explanations:\n\n1. **Customer erasure (DPR-1093, 2026-10-12)**: the orders were deleted from the shop database and propagated to `raw_orders`, but their payments remained in `raw_payments`. This fits the timing (test passed for 6 days, failed the day after the erasure) and the exact, stable count of 6 rows.\n2. **Ingestion timing (like INC-0371)**: payments loaded before their orders. Less likely: both sources were loaded 1.0 h ago and are fresh, and no outage is reported. The test would also self-heal on the next load.\n\nThe failure is a real referential-integrity violation that blocked `dim_customers` and `fct_orders`, so the finance dashboard (07:00 UTC refresh) would show stale data.\n\n### Fix\n1. **Diagnose first** (read-only):\n```sql\nselect p.payment_id, p.order_id, p.loaded_at, p.amount\nfrom {{ ref('stg_payments') }} p\nleft join {{ ref('stg_orders') }} o on p.order_id = o.order_id\nwhere p.order_id is not null and o.order_id is null;\n```\nIf `loaded_at` is very recent and the orders appear after the next hourly load, it is timing: just re-run, no change needed.\n\n2. **If the orphans are erased customers' payments (most likely)**: the fix belongs outside dbt. The erasure process (DPR-1093 runbook) must delete or anonymise the related payment records in the payment provider and in the ingestion into `raw.raw_payments`, so erasure is applied consistently across all three sources. Do not manually edit warehouse raw tables. Have the ingestion/privacy owner remove those payment rows (retention/legal rules for financial records may require anonymising instead of deleting; confirm with them).\n\n3. **Do not** set the test to `warn`/`severity` or filter orphans out in `stg_payments` as a way to get green: that would hide real integrity issues and could silently misstate revenue. If payments of erased orders must legitimately be kept for accounting, a deliberate design decision is needed (e.g. keep an anonymised order stub in raw_orders), documented and implemented upstream.\n\n4. After the upstream cleanup, re-run the failed and skipped nodes.\n\n### Verification\n```\ndbt build --select stg_payments stg_orders+ \n```\nExpected: the relationships test passes (0 rows), and `dim_customers`, `fct_orders` and their 9 skipped tests now run and pass. Also run the diagnostic query above: expected 0 rows. Confirm `fct_orders` has one row per order (`unique` test on `order_id`) and that the finance dashboard's next refresh shows current data. If the dashboard must be correct before 07:00 UTC, run the build before then.\n\n### Assumptions\n- DPR-1093 erased orders in the shop DB that were propagated to `raw_orders`, while the payment provider / `raw_payments` still holds the related payments. This is inferred from timing, not confirmed.\n- `raw_orders` is a full snapshot replace (or delete-propagating), so deleted orders disappear from it; if it were append-only the orders would still exist.\n- The 6 orphan rows are the same 6 payments tied to the erasure (to be confirmed by the diagnostic query).\n- Legal/retention rules for payment records are not stated; the delete-vs-anonymise decision belongs to the privacy/finance owners.\n- No ingestion outage occurred today (none reported, freshness passes), so timing is the less likely cause."}, {"position": 87, "item_id": "RI03-07C", "is_repeat": 0, "scenario_id": "RI03", "label": "C", "group_pos": 3, "group_size": 6, "text": "### Root cause\n\nThe failure in the scheduled run is due to a test failure in the `relationships_stg_payments_order_id__order_id__ref_stg_orders` test. The test is checking the referential integrity between the `stg_payments` and `stg_orders` tables. The failure message indicates that there are 6 results, but the test is configured to fail if the result is not zero, suggesting that there are order IDs in `stg_payments` that do not have a matching record in `stg_orders`.\n\n### Fix\n\nTo fix the issue, we need to adjust the relationships test to account for the mismatched order IDs. We can do this by modifying the test to allow for a certain number of unmatched order IDs, or by fixing the data in `stg_orders` to ensure that every order ID has a corresponding record.\n\nIn the `models/test_relationships.yml` file, we can update the test to:\n```yaml\ntests:\n  - name: stg_payments_order_id__order_id__ref_stg_orders\n    query: |\n      with child as (\n          select order_id as from_field\n          from \"ecommerce\".\"main\".\"stg_payments\"\n          where order_id is not null\n      ),\n      parent as (\n          select order_id as to_field\n          from \"ecommerce\".\"main\".\"stg_orders\"\n      )\n      select\n          from_field\n      from child\n      left join parent\n          on child.from_field = parent.to_field\n      where parent.to_field is null\n    expect: |less than| 3\n```\nThis test will now allow up to 2 unmatched order IDs before failing.\n\n### Verification\n\nTo verify the fix, we can re-run the `dbt build` command and check that the test no longer fails. We can also manually query the data to confirm that the relationships test is now passing.\n\n### Assumptions\n\n* The data in `stg_orders` is consistent and accurate, and the issue is not due to incorrect data.\n* The relationships test is not overly sensitive and can tolerate some mismatched order IDs."}, {"position": 88, "item_id": "RI03-04A", "is_repeat": 0, "scenario_id": "RI03", "label": "A", "group_pos": 4, "group_size": 6, "text": "### Root cause\nSix rows in `stg_payments` reference an `order_id` that does not exist in `stg_orders`: orphaned payments. The staging SQL for both models is a straight pass-through, so the gap originates in `raw.raw_payments` vs `raw.raw_orders`. Source freshness passes for both and both were loaded at the same time (18:05 UTC), so staleness is not the explanation. The most likely cause is an ingestion mismatch: the hourly loads for orders and payments are not atomic or consistent. Candidates are (a) payments arriving for orders that landed after the orders extract cutoff (a timing race, the likeliest cause given the hourly cadence), or (b) `raw_orders` being cut to a window (the `stg_orders` description mentions a 180-day window) so older orders drop out while their payments remain. The test did its job by catching a referential-integrity break. The 13 skipped nodes (`dim_customers`, `fct_orders`, 9 tests) are collateral, not separate problems.\n\n### Fix\nDo not weaken or delete the test, and do not filter the orphans out of `stg_payments` to turn it green; that would hide missing orders and understate revenue in `fct_orders`.\n\n1. **Triage first** to determine which cause applies:\n```sql\nselect p.payment_id, p.order_id, p.amount, p.loaded_at\nfrom {{ ref('stg_payments') }} p\nleft join {{ ref('stg_orders') }} o on p.order_id = o.order_id\nwhere o.order_id is null\norder by p.loaded_at;\n```\nThen check whether those `order_id`s exist in `raw.raw_orders` at all, and whether they are recent (timing race) or old (window truncation).\n\n2. **Fix in the ingestion job (outside dbt)**: make the web shop and payment loads consistent, e.g. load orders before payments, use the same extraction cutoff for both, or reload the missing orders. If the cause is window truncation, extend or align the orders extraction window to cover all orders that have payments. Backfill the six missing orders.\n\n3. **Optional hardening in dbt**, only if a short lag between loads is accepted by design: keep the test as an error, but add a retry-tolerant guard, such as running the relationships test with `severity: warn` plus `error_if: \">20\"` in `models/staging/staging.yml`:\n```yaml\n- name: order_id\n  tests:\n    - not_null\n    - relationships:\n        to: ref('stg_orders')\n        field: order_id\n        config:\n          severity: error\n          warn_if: \">0\"\n          error_if: \">20\"\n```\nThis is a policy decision for the data owner; I would not apply it until the root cause is confirmed.\n\n### Verification\nAfter the orders are backfilled or the ingestion is corrected, re-run:\n```\ndbt build --select stg_orders stg_payments+ \n```\nExpected: `relationships_stg_payments_order_id__order_id__ref_stg_orders_` passes (0 rows), `row_count_between` on `stg_orders` still passes (500-1,000), and `dim_customers`, `fct_orders` and their 9 tests are no longer skipped and pass. Confirm with the triage query above returning 0 rows. Over the next several hourly runs, confirm the test stays green, which shows the race is resolved rather than hidden.\n\n### Assumptions\n- The six orphans are real payments, not test or junk data; if they are junk, the correct fix is removing them at the source.\n- The ingestion jobs load orders and payments independently, so ordering or cutoff mismatches are possible.\n- The 180-day window in the `stg_orders` description is applied at extraction, not in dbt (the SQL shows no filter).\n- `raw_payments.order_id` and `raw_orders.order_id` use the same key format and type (both INTEGER), so this is not a type or formatting mismatch.\n- Backfilling the missing orders is feasible and the six `order_id`s still exist in the web shop system.\n- The test configuration lives in `models/staging/` YAML; the exact file name was not given."}, {"position": 89, "item_id": "RI03-04B", "is_repeat": 0, "scenario_id": "RI03", "label": "B", "group_pos": 5, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the test `test relationships_stg_payments_order_id__order_id__ref_stg_orders` failing because it expected 0 results, but got 6 results instead. This suggests that there are 6 order IDs in the `stg_payments` table that do not exist in the `stg_orders` table, indicating a mismatch between the two.\n\n### Fix\n\nTo fix this issue, we need to investigate why these order IDs do not exist in `stg_orders`. One possible reason is that there are payments that were made but the corresponding orders were not yet loaded into the warehouse. We can fix this by adding a check in the `stg_payments` model to only consider order IDs that exist in `stg_orders`. We can do this by adding a `WHERE` clause in the `stg_payments` model to filter out order IDs that do not exist in `stg_orders`.\n\nHere's the updated SQL for the `stg_payments` model:\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_payments') }}\n\n),\n\nrenamed as (\n\n    select\n        payment_id,\n        order_id,\n        payment_method,\n        -- source stores integer cents; convert to currency units\n        cast(amount as decimal(18, 2)) / 100 as amount,\n        loaded_at\n    from source\n    WHERE order_id IN (\n        select order_id from \"ecommerce\".\"main\".\"stg_orders\"\n    )\n)\n\nselect * from renamed\n```\n\n### Verification\n\nTo verify that the fix worked, we can run the following dbt command:\n```\ndbt test\n```\nThis will re-run the tests, including the `test relationships_stg_payments_order_id__order_id__ref_stg_orders` test. If the fix worked, the test should pass.\n\n### Assumptions\n\n* I assumed that the issue is due to a mismatch between the `stg_payments` and `stg_orders` tables, rather than some other issue with the data or the dbt models."}, {"position": 90, "item_id": "RI03-07A", "is_repeat": 0, "scenario_id": "RI03", "label": "A", "group_pos": 6, "group_size": 6, "text": "### Root cause\nThe failing test is a referential integrity test on `stg_payments.order_id`: 6 non-null payment rows reference an `order_id` that does not exist in `stg_orders.order_id`. Source freshness passed for both `raw.raw_orders` and `raw.raw_payments`, so this is not an obvious stale-source problem. The most likely cause is that payments were ingested for orders that are missing from, filtered out of, or transformed differently in `stg_orders`.\n\nBecause the failure is upstream of `dim_customers` and `fct_orders`, dbt skipped those models and their dependent tests.\n\n### Fix\nFirst inspect the 6 orphaned payment order IDs:\n\n```sql\nselect\n    p.order_id,\n    count(*) as payment_rows\nfrom \"ecommerce\".\"main\".\"stg_payments\" p\nleft join \"ecommerce\".\"main\".\"stg_orders\" o\n    on p.order_id = o.order_id\nwhere p.order_id is not null\n  and o.order_id is null\ngroup by 1\norder by 2 desc, 1;\n```\n\nThen remediate based on what those IDs are:\n\n1. **If the orders exist in the shop source but are excluded by the staging model**, fix `models/staging/stg_orders.sql` so it does not filter out valid orders that can have payments. For example, if `stg_orders` currently excludes cancelled/test/imported orders but payments can exist for them, remove or adjust that filter:\n\n```sql\n-- models/staging/stg_orders.sql\nselect\n    cast(order_id as varchar) as order_id,\n    customer_id,\n    order_status,\n    created_at,\n    loaded_at\nfrom {{ source('raw', 'raw_orders') }}\n-- Do not filter out orders that may be referenced by stg_payments.\n```\n\n2. **If the 6 orders are truly missing from `raw.raw_orders` but present in `raw.raw_payments`**, fix the upstream ingestion job for the web shop/orders source so it loads those missing orders into `raw.raw_orders`. This change belongs outside dbt, in the order ingestion pipeline that populates `raw.raw_orders`.\n\n3. **If `order_id` formatting differs between orders and payments**, normalize the key consistently in both staging models, for example:\n\n```sql\n-- models/staging/stg_orders.sql\nselect\n    trim(cast(order_id as varchar)) as order_id,\n    ...\nfrom {{ source('raw', 'raw_orders') }}\n```\n\n```sql\n-- models/staging/stg_payments.sql\nselect\n    trim(cast(order_id as varchar)) as order_id,\n    ...\nfrom {{ source('raw', 'raw_payments') }}\n```\n\nDo not disable or weaken the `relationships` test unless the business intentionally allows payments without orders.\n\n### Verification\nAfter applying the fix, run:\n\n```bash\ndbt build --select stg_orders stg_payments relationships_stg_payments_order_id__order_id__ref_stg_orders_\n```\n\nExpected result: the relationships test returns 0 rows and passes.\n\nAlso run the orphan check directly:\n\n```sql\nselect\n    p.order_id\nfrom \"ecommerce\".\"main\".\"stg_payments\" p\nleft join \"ecommerce\".\"main\".\"stg_orders\" o\n    on p.order_id = o.order_id\nwhere p.order_id is not null\n  and o.order_id is null;\n```\n\nExpected result: 0 rows.\n\nThen rerun the affected downstream build:\n\n```bash\ndbt build --select stg_orders stg_payments dim_customers fct_orders+\n```\n\nExpected result: `dim_customers`, `fct_orders`, and their dependent tests are no longer skipped and the run exits successfully.\n\n### Assumptions\n- `stg_orders` is built from `source('raw', 'raw_orders')`, and `stg_payments` is built from `source('raw', 'raw_payments')`.\n- The relationship `stg_payments.order_id -> stg_orders.order_id` is a valid business rule.\n- The 6 failed rows are current data-quality issues, not expected late-arriving records.\n- The quoted relation names in the failure report are the correct DuckDB relations to query: `\"ecommerce\".\"main\".\"stg_payments\"` and `\"ecommerce\".\"main\".\"stg_orders\"`."}], "scenarios": {"FV01": {"sections": [["Failure report", "Command: dbt build  (exit code 0)\nResult: 30 passed, 0 failed, 0 errors, 0 warnings, 0 skipped\n\nCommand: dbt source freshness  (exit code 1)\n- PASS: source raw.raw_customers: max(loaded_at) = 2026-10-13 14:56 UTC, 4.1 h before the check (warn after 24 hours, error after 48 hours)\n- ERROR: source raw.raw_orders: max(loaded_at) = 2026-10-12 19:05 UTC, 24.0 h before the check (warn after 6 hours, error after 12 hours)\n- ERROR: source raw.raw_payments: max(loaded_at) = 2026-10-12 19:05 UTC, 24.0 h before the check (warn after 6 hours, error after 12 hours)", true], ["Model and source metadata", "### Source raw.raw_orders\nTable: \"ecommerce\".\"raw\".\"raw_orders\"\nDescription: One row per order placed in the web shop.\nFreshness: measured on `loaded_at`; warn after 6 hours, error after 12 hours\nColumns (name · type in warehouse · description):\n- order_id · INTEGER · Shop primary key of the order (integer).\n- customer_id · INTEGER · CRM customer_id of the customer who placed the order.\n- order_date · DATE · Date the order was placed (ISO format YYYY-MM-DD).\n- status · VARCHAR · Order lifecycle status: placed, shipped, completed or cancelled.\n- loaded_at · TIMESTAMP · UTC timestamp when the ingestion job wrote the row.\n\n### Source raw.raw_payments\nTable: \"ecommerce\".\"raw\".\"raw_payments\"\nDescription: One row per payment taken by the payment provider. Split payments produce several rows per order.\nFreshness: measured on `loaded_at`; warn after 6 hours, error after 12 hours\nColumns (name · type in warehouse · description):\n- payment_id · INTEGER · Payment provider primary key (integer).\n- order_id · INTEGER · Shop order_id the payment belongs to.\n- payment_method · VARCHAR · Payment method: credit_card, bank_transfer, voucher or gift_card.\n- amount · INTEGER · Payment amount in integer cents.\n- loaded_at · TIMESTAMP · UTC timestamp when the ingestion job wrote the row.", false], ["Lineage", "DAG edges (upstream → downstream; tests omitted):\n- source raw.raw_orders → model stg_orders\n- source raw.raw_payments → model stg_payments\n- model dim_customers → exposure finance_revenue_dashboard\n- model dim_customers → exposure marketing_customer_dashboard\n- model fct_orders → exposure finance_revenue_dashboard\n- model stg_orders → model dim_customers\n- model stg_orders → model fct_orders\n- model stg_payments → model dim_customers\n- model stg_payments → model fct_orders\nDownstream nodes (affected if the failing node is wrong or skipped):\n- model stg_payments (view): Cleaned payments, one row per payment. Amount converted from cents to currency units.\n- model dim_customers (table): One row per customer with order history and lifetime value. Used by marketing and finance dashboards.\n- model fct_orders (table): One row per order with payment amounts pivoted by method. Grain must match stg_orders (one row per order).\n- exposure finance_revenue_dashboard (dashboard, owner: Finance analytics): Daily revenue by payment method and order status. Refreshed at 07:00 UTC and used in the daily finance stand-up.\n- exposure marketing_customer_dashboard (dashboard, owner: Marketing analytics): Customer counts, lifetime value and repeat-purchase rate by country.\n- model stg_orders (view): Cleaned orders, one row per order. Expected volume is 500-1,000 orders over the 180-day window.\nColumn-level lineage (as designed):\n- stg_payments.{payment_id, order_id, payment_method, loaded_at} ← raw_payments (same names)\n- stg_payments.amount ← raw_payments.amount (integer cents / 100)\n- dim_customers.{customer_id, first_name, last_name, email, country_code, created_at} ← stg_customers (same names)\n- dim_customers.{first_order_date, most_recent_order_date, number_of_orders} ← stg_orders.order_date / order_id, per customer_id\n- dim_customers.lifetime_value ← stg_payments.amount joined via stg_orders.order_id, non-cancelled orders, per customer_id\n- fct_orders.{order_id, customer_id, order_date, status} ← stg_orders (same names)\n- fct_orders.{credit_card_amount, bank_transfer_amount, voucher_amount, gift_card_amount} ← stg_payments.amount by payment_method, per order_id\n- fct_orders.amount ← stg_payments.amount, total per order_id\n- stg_orders.{order_id, customer_id, status, loaded_at} ← raw_orders (same names)\n- stg_orders.order_date ← raw_orders.order_date (cast to date)", false], ["Recent history", "Recent changes (newest first):\n- 2026-10-12 · ticket · SEC-58: rotated the database credentials of the shop read replica.\n- 2026-10-08 · ticket · BI-204: 'Weekly revenue' tile added to the finance revenue dashboard (reads fct_orders)\n- 2026-10-01 · commit 7d3a016 · stg_customers: lower-case email and upper-case country code (models/staging/stg_customers.sql)\nPrevious incidents:\n- INC-0359 (2026-08-14): orders stale for 14 h while the connector was paused for maintenance. Resolution: connector resumed; missing hours backfilled automatically.\nRecent run history:\n- raw_orders and raw_payments freshness age at run time, last 7 daily runs: 0.5–1.5 h; today (2026-10-13) about 24 h.", false]], "reference": "Root cause: raw_orders and raw_payments both stopped receiving rows at 2026-10-12 19:05 UTC, about 24 h ago, and both come through the shop database connector. raw_customers comes from the CRM and is still fresh. The timing matches the SEC-58 credential rotation on the shop replica: the connector is still using the old credentials. The dbt models and tests are fine; dbt build passes on stale data.\n\nFix: Update the shop connector with the new SEC-58 credentials and re-run the sync. Its incremental extract should backfill the missing hours. Then re-run `dbt build` and `dbt source freshness`. Prevention: add credential rotation to the connector's runbook and alert on connector failures, not only on freshness.\n\nVerification: `dbt source freshness` passes for raw_orders and raw_payments, and `select max(loaded_at) from raw.raw_orders` is within the last hour. Orders placed after 2026-10-12 19:05 UTC, during the outage, are present."}, "FV02": {"sections": [["Failure report", "Command: dbt build  (exit code 0)\nResult: 30 passed, 0 failed, 0 errors, 0 warnings, 0 skipped\n\nCommand: dbt source freshness  (exit code 1)\n- PASS: source raw.raw_customers: max(loaded_at) = 2026-10-13 14:56 UTC, 4.1 h before the check (warn after 24 hours, error after 48 hours)\n- ERROR: source raw.raw_orders: max(loaded_at) = 2026-10-12 13:05 UTC, 30.0 h before the check (warn after 6 hours, error after 12 hours)\n- PASS: source raw.raw_payments: max(loaded_at) = 2026-10-13 18:05 UTC, 1.0 h before the check (warn after 6 hours, error after 12 hours)", true], ["Model and source metadata", "### Source raw.raw_orders\nTable: \"ecommerce\".\"raw\".\"raw_orders\"\nDescription: One row per order placed in the web shop.\nFreshness: measured on `loaded_at`; warn after 6 hours, error after 12 hours\nColumns (name · type in warehouse · description):\n- order_id · INTEGER · Shop primary key of the order (integer).\n- customer_id · INTEGER · CRM customer_id of the customer who placed the order.\n- order_date · DATE · Date the order was placed (ISO format YYYY-MM-DD).\n- status · VARCHAR · Order lifecycle status: placed, shipped, completed or cancelled.\n- loaded_at · TIMESTAMP · UTC timestamp when the ingestion job wrote the row.", false], ["Lineage", "DAG edges (upstream → downstream; tests omitted):\n- source raw.raw_orders → model stg_orders\n- model dim_customers → exposure finance_revenue_dashboard\n- model dim_customers → exposure marketing_customer_dashboard\n- model fct_orders → exposure finance_revenue_dashboard\n- model stg_orders → model dim_customers\n- model stg_orders → model fct_orders\nDownstream nodes (affected if the failing node is wrong or skipped):\n- model stg_orders (view): Cleaned orders, one row per order. Expected volume is 500-1,000 orders over the 180-day window.\n- model dim_customers (table): One row per customer with order history and lifetime value. Used by marketing and finance dashboards.\n- model fct_orders (table): One row per order with payment amounts pivoted by method. Grain must match stg_orders (one row per order).\n- exposure finance_revenue_dashboard (dashboard, owner: Finance analytics): Daily revenue by payment method and order status. Refreshed at 07:00 UTC and used in the daily finance stand-up.\n- exposure marketing_customer_dashboard (dashboard, owner: Marketing analytics): Customer counts, lifetime value and repeat-purchase rate by country.\nColumn-level lineage (as designed):\n- stg_orders.{order_id, customer_id, status, loaded_at} ← raw_orders (same names)\n- stg_orders.order_date ← raw_orders.order_date (cast to date)\n- dim_customers.{customer_id, first_name, last_name, email, country_code, created_at} ← stg_customers (same names)\n- dim_customers.{first_order_date, most_recent_order_date, number_of_orders} ← stg_orders.order_date / order_id, per customer_id\n- dim_customers.lifetime_value ← stg_payments.amount joined via stg_orders.order_id, non-cancelled orders, per customer_id\n- fct_orders.{order_id, customer_id, order_date, status} ← stg_orders (same names)\n- fct_orders.{credit_card_amount, bank_transfer_amount, voucher_amount, gift_card_amount} ← stg_payments.amount by payment_method, per order_id\n- fct_orders.amount ← stg_payments.amount, total per order_id", false], ["Recent history", "Recent changes (newest first):\n- 2026-10-11 · deploy · Ingestion: orders loader upgraded to v2.3 (watermark-based incremental extraction).\n- 2026-10-04 · commit f9bf287 · docs: add column descriptions to models/marts/schema.yml (no SQL change)\n- 2026-09-30 · deploy · CRM connector upgraded 3.1 → 3.2 (bug-fix release)\nPrevious incidents:\n- INC-0359 (2026-08-14): orders stale for 14 h while the connector was paused for maintenance. Resolution: connector resumed; missing hours backfilled automatically.\nRecent run history:\n- raw_orders freshness age at run time, last 7 daily runs: 0.5–1.5 h on previous days; about 30 h today (2026-10-13).\n- New rows in raw_orders: normal volume, including 4 rows in the last 30 h.", false]], "reference": "Root cause: raw_orders is not really stale. Orders placed in the last 30 h are present (4 rows, latest order_date 2026-10-13), but every one of them has the same loaded_at, 2026-10-12 13:05 UTC, which for some is earlier than when the order was placed. The orders loader upgraded to v2.3 two days ago stamps loaded_at with its extraction watermark, which is stuck, instead of the load time. The freshness check reads loaded_at, so it reports the source as about 30 h stale.\n\nFix: Ask the ingestion team to fix or roll back loader v2.3 so loaded_at records the actual load time and the watermark advances. Then reload the affected rows so their loaded_at is correct. Do not raise the freshness threshold to make the error go away: a real outage would then go unnoticed.\n\nVerification: `select loaded_at, count(*) from raw.raw_orders group by 1 order by 1 desc limit 5` shows separate hourly load times again, and `dbt source freshness --select source:raw.raw_orders` passes."}, "FV03": {"sections": [["Failure report", "Command: dbt build  (exit code 0)\nResult: 30 passed, 0 failed, 0 errors, 0 warnings, 0 skipped\n\nCommand: dbt source freshness  (exit code 1)\n- ERROR: source raw.raw_customers: max(loaded_at) = 2026-10-13 14:56 UTC, 4.1 h before the check (warn after 1 hour, error after 2 hours)\n- PASS: source raw.raw_orders: max(loaded_at) = 2026-10-13 18:05 UTC, 1.0 h before the check (warn after 6 hours, error after 12 hours)\n- PASS: source raw.raw_payments: max(loaded_at) = 2026-10-13 18:05 UTC, 1.0 h before the check (warn after 6 hours, error after 12 hours)", true], ["Model and source metadata", "### Source raw.raw_customers\nTable: \"ecommerce\".\"raw\".\"raw_customers\"\nDescription: One row per customer account, extracted from the CRM.\nFreshness: measured on `loaded_at`; warn after 1 hour, error after 2 hours\nColumns (name · type in warehouse · description):\n- customer_id · INTEGER · CRM primary key of the customer (integer).\n- first_name · VARCHAR · Customer first name.\n- last_name · VARCHAR · Customer last name.\n- email · VARCHAR · Customer email address as entered in the CRM.\n- country · VARCHAR · ISO 3166-1 alpha-2 country code of the customer's billing address.\n- created_at · TIMESTAMP · UTC timestamp when the account was created in the CRM.\n- loaded_at · TIMESTAMP · UTC timestamp when the ingestion job wrote the row.", false], ["Lineage", "DAG edges (upstream → downstream; tests omitted):\n- source raw.raw_customers → model stg_customers\n- model dim_customers → exposure finance_revenue_dashboard\n- model dim_customers → exposure marketing_customer_dashboard\n- model stg_customers → model dim_customers\nDownstream nodes (affected if the failing node is wrong or skipped):\n- model stg_customers (view): Cleaned customers, one row per customer. Email lower-cased, country code upper-cased.\n- model dim_customers (table): One row per customer with order history and lifetime value. Used by marketing and finance dashboards.\n- exposure finance_revenue_dashboard (dashboard, owner: Finance analytics): Daily revenue by payment method and order status. Refreshed at 07:00 UTC and used in the daily finance stand-up.\n- exposure marketing_customer_dashboard (dashboard, owner: Marketing analytics): Customer counts, lifetime value and repeat-purchase rate by country.\nColumn-level lineage (as designed):\n- stg_customers.customer_id ← raw_customers.customer_id\n- stg_customers.{first_name, last_name, created_at, loaded_at} ← raw_customers (same names)\n- stg_customers.email ← raw_customers.email (lower-cased)\n- stg_customers.country_code ← raw_customers.country (upper-cased)\n- dim_customers.{customer_id, first_name, last_name, email, country_code, created_at} ← stg_customers (same names)\n- dim_customers.{first_order_date, most_recent_order_date, number_of_orders} ← stg_orders.order_date / order_id, per customer_id\n- dim_customers.lifetime_value ← stg_payments.amount joined via stg_orders.order_id, non-cancelled orders, per customer_id", false], ["Recent history", "Recent changes (newest first):\n- 2026-10-12 · commit f1c34a7 · sources.yml: align raw_customers freshness with orders/payments since all loaders run hourly, DATA-140 (models/staging/sources.yml)\n- 2026-10-07 · deploy · CI image upgraded dbt-duckdb 1.10 → 1.11; full build passed afterwards\n- 2026-10-02 · commit 33c675a · add accepted_values test on stg_payments.payment_method (models/staging/schema.yml)\nPrevious incidents:\n- INC-0318 (2026-07-08): CRM sync paused for 2 days during a vendor upgrade; raw_customers freshness errored at 48 h. Resolution: sync resumed.\nRecent run history:\n- raw_customers freshness age at run time, last 7 daily runs: 3 h, 19 h, 7 h, 30 h, 11 h, 5 h; about 4 h today (2026-10-13).\n- Customer sign-ups per day: 0–2.", false]], "reference": "Root cause: Yesterday's DATA-140 commit changed raw_customers freshness in models/staging/sources.yml from warn 24 h / error 48 h to warn 1 h / error 2 h. Freshness is measured on max(loaded_at), and raw_customers only gets a row when a customer signs up, at most a couple a day. So max(loaded_at) is usually hours old even when the loader is healthy (now about 4 h). The CRM loader is working: the source is quiet, not stale.\n\nFix: Revert the raw_customers freshness override in models/staging/sources.yml to `warn_after: {count: 24, period: hour}` and `error_after: {count: 48, period: hour}`. If hourly monitoring of the CRM loader is needed, check the loader's own run log or heartbeat instead of row timestamps.\n\nVerification: `dbt source freshness --select source:raw.raw_customers` passes, and its age falls within the historical range of 3–30 h."}, "NR01": {"sections": [["Failure report", "Command: dbt build  (exit code 1)\nResult: 18 passed, 1 failed, 0 errors, 0 warnings, 13 skipped\n- FAIL: test not_null_stg_payments_amount [not_null] on stg_payments.amount\n  Message: Got 11 results, configured to fail if != 0\n  Compiled test SQL:\n    select amount\n    from \"ecommerce\".\"main\".\"stg_payments\"\n    where amount is null\n- SKIPPED because an upstream node failed: model dim_customers, model fct_orders, 9 tests\n\nCommand: dbt source freshness  (exit code 0)\n- PASS: source raw.raw_customers: max(loaded_at) = 2026-10-13 14:56 UTC, 4.1 h before the check (warn after 24 hours, error after 48 hours)\n- PASS: source raw.raw_orders: max(loaded_at) = 2026-10-13 18:05 UTC, 0.9 h before the check (warn after 6 hours, error after 12 hours)\n- PASS: source raw.raw_payments: max(loaded_at) = 2026-10-13 18:05 UTC, 0.9 h before the check (warn after 6 hours, error after 12 hours)", true], ["Model and source metadata", "### Model stg_payments\nFile: models/staging/stg_payments.sql · materialized as view\nDescription: Cleaned payments, one row per payment. Amount converted from cents to currency units.\nColumns (name · type in warehouse · description · tests):\n- payment_id · INTEGER · Primary key of the payment. · tests: unique, not_null\n- order_id · INTEGER · Order the payment belongs to (foreign key to stg_orders). · tests: not_null, relationships(to=stg_orders, field=order_id)\n- payment_method · VARCHAR · Payment method used. · tests: accepted_values(values=['credit_card', 'bank_transfer', 'voucher', 'gift_card'])\n- amount · DOUBLE · Payment amount in currency units (raw cents / 100). · tests: not_null\n- loaded_at · TIMESTAMP · UTC timestamp when the row was loaded into the warehouse.\nSQL (models/staging/stg_payments.sql):\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_payments') }}\n\n),\n\nrenamed as (\n\n    select\n        payment_id,\n        order_id,\n        payment_method,\n        -- source stores integer cents; convert to currency units\n        cast(amount as decimal(18, 2)) / 100 as amount,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```", false], ["Lineage", "DAG edges (upstream → downstream; tests omitted):\n- source raw.raw_payments → model stg_payments\n- model dim_customers → exposure finance_revenue_dashboard\n- model dim_customers → exposure marketing_customer_dashboard\n- model fct_orders → exposure finance_revenue_dashboard\n- model stg_payments → model dim_customers\n- model stg_payments → model fct_orders\nUpstream nodes and their current warehouse columns:\n- source raw.raw_payments (source table): payment_id INTEGER, order_id INTEGER, payment_method VARCHAR, amount INTEGER, loaded_at TIMESTAMP\nDownstream nodes (affected if the failing node is wrong or skipped):\n- model dim_customers (table): One row per customer with order history and lifetime value. Used by marketing and finance dashboards.\n- model fct_orders (table): One row per order with payment amounts pivoted by method. Grain must match stg_orders (one row per order).\n- exposure finance_revenue_dashboard (dashboard, owner: Finance analytics): Daily revenue by payment method and order status. Refreshed at 07:00 UTC and used in the daily finance stand-up.\n- exposure marketing_customer_dashboard (dashboard, owner: Marketing analytics): Customer counts, lifetime value and repeat-purchase rate by country.\nColumn-level lineage (as designed):\n- stg_payments.{payment_id, order_id, payment_method, loaded_at} ← raw_payments (same names)\n- stg_payments.amount ← raw_payments.amount (integer cents / 100)\n- dim_customers.{customer_id, first_name, last_name, email, country_code, created_at} ← stg_customers (same names)\n- dim_customers.{first_order_date, most_recent_order_date, number_of_orders} ← stg_orders.order_date / order_id, per customer_id\n- dim_customers.lifetime_value ← stg_payments.amount joined via stg_orders.order_id, non-cancelled orders, per customer_id\n- fct_orders.{order_id, customer_id, order_date, status} ← stg_orders (same names)\n- fct_orders.{credit_card_amount, bank_transfer_amount, voucher_amount, gift_card_amount} ← stg_payments.amount by payment_method, per order_id\n- fct_orders.amount ← stg_payments.amount, total per order_id", false], ["Recent history", "Recent changes (newest first):\n- 2026-10-13 · vendor · Payment provider notice: gift-card settlement re-sync for the last 30 days runs today (2026-10-13), early morning UTC.\n- 2026-10-08 · ticket · BI-204: 'Weekly revenue' tile added to the finance revenue dashboard (reads fct_orders)\n- 2026-10-07 · deploy · CI image upgraded dbt-duckdb 1.10 → 1.11; full build passed afterwards\nPrevious incidents:\n- INC-0402 (2026-09-13): voucher amounts doubled after a provider file resend. Resolution: provider sent a corrected file; payments re-ingested.\nRecent run history:\n- not_null_stg_payments_amount, last 7 daily runs: pass ×6, fail today (2026-10-13) with 11 rows.\n- Gift-card payments per day: 0–2 (normal).", false]], "reference": "Root cause: All 11 null amounts in raw.raw_payments are payment_method = 'gift_card' rows from the last 30 days, and all share the same loaded_at (2026-10-13 16:05 UTC). The provider's gift-card re-sync reloaded them without the amount value. stg_payments passes amount straight through, so not_null_stg_payments_amount fails and the marts are skipped. dbt is working as intended; the data is wrong at the source.\n\nFix: Confirm the pattern: `select payment_method, loaded_at, count(*) from raw.raw_payments where amount is null group by 1, 2`. Ask the payment provider to resend the re-sync with amounts, then re-run ingestion and `dbt build`. Do not coalesce the nulls to 0: that would understate gift-card revenue on the finance dashboard. If the marts must refresh before the provider fixes it, temporarily set the not_null test on stg_payments.amount to `severity: warn` and tell Finance that gift-card revenue for the last 30 days is incomplete.\n\nVerification: After re-ingestion, `select count(*) from raw.raw_payments where amount is null` returns 0, `dbt build --select stg_payments+` passes, and fct_orders.gift_card_amount for the last 30 days is back to its earlier level."}, "NR02": {"sections": [["Failure report", "Command: dbt build  (exit code 1)\nResult: 29 passed, 1 failed, 0 errors, 0 warnings, 0 skipped\n- FAIL: test not_null_fct_orders_amount [not_null] on fct_orders.amount\n  Message: Got 46 results, configured to fail if != 0\n  Compiled test SQL:\n    select amount\n    from \"ecommerce\".\"main\".\"fct_orders\"\n    where amount is null\n\nCommand: dbt source freshness  (exit code 0)\n- PASS: source raw.raw_customers: max(loaded_at) = 2026-10-13 14:56 UTC, 4.1 h before the check (warn after 24 hours, error after 48 hours)\n- PASS: source raw.raw_orders: max(loaded_at) = 2026-10-13 18:05 UTC, 1.0 h before the check (warn after 6 hours, error after 12 hours)\n- PASS: source raw.raw_payments: max(loaded_at) = 2026-10-13 18:05 UTC, 1.0 h before the check (warn after 6 hours, error after 12 hours)", true], ["Model and source metadata", "### Model fct_orders\nFile: models/marts/fct_orders.sql · materialized as table\nDescription: One row per order with payment amounts pivoted by method. Grain must match stg_orders (one row per order).\nColumns (name · type in warehouse · description · tests):\n- order_id · INTEGER · Primary key of the order. · tests: unique, not_null\n- customer_id · INTEGER · Customer who placed the order (foreign key to dim_customers). · tests: not_null, relationships(to=dim_customers, field=customer_id)\n- order_date · DATE · Date the order was placed.\n- status · VARCHAR · Order lifecycle status.\n- credit_card_amount · DOUBLE · Amount paid by credit card.\n- bank_transfer_amount · DOUBLE · Amount paid by bank transfer.\n- voucher_amount · DOUBLE · Amount paid with vouchers.\n- gift_card_amount · DOUBLE · Amount paid with gift cards.\n- amount · DOUBLE · Total amount paid for the order (0 if no payments, e.g. cancelled orders). · tests: not_null\nModel-level tests: equal_row_count(compare_model=stg_orders)\nSQL (models/marts/fct_orders.sql):\n```sql\nwith orders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\norder_payments as (\n\n    select\n        order_id,\n        sum(case when payment_method = 'credit_card' then amount else 0 end) as credit_card_amount,\n        sum(case when payment_method = 'bank_transfer' then amount else 0 end) as bank_transfer_amount,\n        sum(case when payment_method = 'voucher' then amount else 0 end) as voucher_amount,\n        sum(case when payment_method = 'gift_card' then amount else 0 end) as gift_card_amount,\n        sum(amount) as total_amount\n    from payments\n    group by order_id\n\n),\n\nfinal as (\n\n    select\n        orders.order_id,\n        orders.customer_id,\n        orders.order_date,\n        orders.status,\n        coalesce(order_payments.credit_card_amount, 0) as credit_card_amount,\n        coalesce(order_payments.bank_transfer_amount, 0) as bank_transfer_amount,\n        coalesce(order_payments.voucher_amount, 0) as voucher_amount,\n        coalesce(order_payments.gift_card_amount, 0) as gift_card_amount,\n        order_payments.total_amount as amount\n    from orders\n    left join order_payments on orders.order_id = order_payments.order_id\n\n)\n\nselect * from final\n```", false], ["Lineage", "DAG edges (upstream → downstream; tests omitted):\n- source raw.raw_orders → model stg_orders\n- source raw.raw_payments → model stg_payments\n- model fct_orders → exposure finance_revenue_dashboard\n- model stg_orders → model fct_orders\n- model stg_payments → model fct_orders\nUpstream nodes and their current warehouse columns:\n- source raw.raw_orders (source table): order_id INTEGER, customer_id INTEGER, order_date DATE, status VARCHAR, loaded_at TIMESTAMP\n- source raw.raw_payments (source table): payment_id INTEGER, order_id INTEGER, pa
