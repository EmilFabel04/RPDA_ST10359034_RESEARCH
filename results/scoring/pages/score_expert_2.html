right column and model, but gives no code, no downstream impact and no way to verify the fix."}, {"score": "3", "example": "“Root cause: raw_orders now contains status = 'returned', which stg_orders passes through unchanged, so accepted_values on stg_orders.status fails. Fix: if returns are a valid business state, add 'returned' to the accepted values for status in models/staging/schema.yml (values: ['placed', 'shipped', 'completed', 'cancelled', 'returned']) and check that fct_orders handles returned orders correctly in revenue totals. Verify: dbt build --select stg_orders+”", "why": "Identifies the root cause, gives the exact fix location with code, names the affected downstream models and gives a verification step."}], "rules": ["Between two anchors: a 3 needs all four elements — the root cause, the exact fix location with code, the affected downstream models, and a verification step. A suggestion that names the right model or column but is missing any of these scores 2. One that names no specific model, column or code scores 1.", "Use the notes field for anything unusual. If a suggestion mentions a model or column that doesn’t exist in the scenario, note it. If the fix depends on it, score technical accuracy as the fix would actually behave: a change to a model that doesn’t exist can’t work as written.", "Each model was also asked to list the assumptions it made. Don’t score that list separately; use it only to understand the rest of the suggestion.", "If you’re unsure between two scores, pick one and add a note. Unclear cases are discussed afterwards. If you still disagree after discussion, both scores are kept and the disagreement is reported."]}, "items": [{"position": 1, "item_id": "RC02-07A", "is_repeat": 0, "scenario_id": "RC02", "label": "A", "group_pos": 1, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is the mismatch between the expected and actual row counts in the `stg_orders` model. The test `row_count_between(min_rows=500, max_rows=1000)` is failing because the actual row count is 1, which is below the minimum threshold of 500. This indicates that the data ingestion or processing is not functioning correctly, resulting in an inconsistent dataset.\n\n### Fix\n\nTo fix this issue, we need to investigate why the row count is not within the expected range. Since the last successful run had a row count of 594, it's possible that the data ingestion is intermittent or experiencing some issues. We should review the recent history and previous incidents to identify any patterns or issues.\n\nAs a remediation, I recommend increasing the tolerance of the `row_count_between` test to account for any temporary fluctuations in the data. We can do this by updating the `models/staging/stg_orders.sql` file to include a higher minimum row count, such as 200. This will allow the test to pass even if the actual row count is lower than expected.\n\nHere's the updated SQL code:\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_orders') }}\n\n),\n\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        cast(order_date as date) as order_date,\n        status,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```\n\n### Verification\n\nTo verify that the fix worked, we can run the `dbt test` command with the updated model. We should expect the `row_count_between` test to pass, and the actual row count should be within the updated tolerance.\n\nCommand: `dbt test`\n\nExpected result: The test should pass, and the actual row count should be within the updated tolerance (e.g., 200-1000).\n\n### Assumptions\n\nAssuming that the recent history and previous incidents do not indicate any issues with the data ingestion or processing that would cause the row count to consistently be below the minimum threshold. Additionally, assuming that the updated tolerance will allow the test to pass even if the actual row count is lower than expected."}, {"position": 2, "item_id": "RC02-03A", "is_repeat": 0, "scenario_id": "RC02", "label": "A", "group_pos": 2, "group_size": 6, "text": "### Root cause\n`stg_orders` is reading all rows from `source('raw', 'raw_orders')` without applying the documented 180-day window. The `row_count_between` test expects 500–1,000 orders over that window, but the model currently exposes a different volume, causing the row-count test to fail.\n\nBecause `stg_payments` also reads all raw payments, it includes 415 payments whose `order_id` does not exist in the current `stg_orders` result set. That is why the `relationships` test on `stg_payments.order_id -> stg_orders.order_id` failed. The likely issue is inconsistent filtering between orders and payments, or missing orders in `raw.raw_orders` relative to `raw.raw_payments`.\n\n### Fix\nApply the same 180-day business window to both staging models so payments are only included when their parent order is in `stg_orders`.\n\nUpdate `models/staging/stg_orders.sql`:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_orders') }}\n\n),\n\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        cast(order_date as date) as order_date,\n        status,\n        loaded_at\n    from source\n\n),\n\nfiltered as (\n\n    select *\n    from renamed\n    where order_date >= current_date - interval '180 days'\n\n)\n\nselect * from filtered\n```\n\nUpdate `models/staging/stg_payments.sql` to keep only payments for orders in the same staged order set:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_payments') }}\n\n),\n\nrenamed as (\n\n    select\n        payment_id,\n        order_id,\n        payment_method,\n        -- source stores integer cents; convert to currency units\n        cast(amount as decimal(18, 2)) / 100 as amount,\n        loaded_at\n    from source\n\n),\n\nfiltered as (\n\n    select p.*\n    from renamed p\n    inner join {{ ref('stg_orders') }} o\n        on p.order_id = o.order_id\n\n)\n\nselect * from filtered\n```\n\nIf the intended contract is instead that `raw.raw_orders` should contain every order referenced by `raw.raw_payments`, then the ingestion job should be fixed outside dbt: the web-shop/raw orders load into `raw.raw_orders` must load all corresponding order records for the payment batch loaded into `raw.raw_payments`.\n\n### Verification\nRun:\n\n```bash\ndbt build --select stg_orders stg_payments+\n```\n\nExpected result: `stg_orders` builds successfully, `row_count_between_stg_orders_1000__500` passes, and the `relationships` test on `stg_payments.order_id` passes with 0 failing rows.\n\nOptionally validate directly in DuckDB:\n\n```sql\nselect count(*) as n_rows\nfrom ecommerce.main.stg_orders;\n```\n\nExpected: between 500 and 1,000.\n\n```sql\nselect count(*) as orphan_payment_orders\nfrom ecommerce.main.stg_payments p\nleft join ecommerce.main.stg_orders o\n    on p.order_id = o.order_id\nwhere o.order_id is null;\n```\n\nExpected: `0`.\n\nThen run the normal job:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected: exit code 0 for both commands, with skipped downstream models/tests now built and tested.\n\n### Assumptions\n- The “Expected volume is 500–1,000 orders over the 180-day window” means `stg_orders` should explicitly filter to the last 180 days.\n- DuckDB accepts `current_date - interval '180 days'` in the project’s environment.\n- It is acceptable for `stg_payments` to be scoped to payments belonging to orders in the staged 180-day order window.\n- The 415 relationship failures are payments outside the staged/intended order window, not valid current-window payments missing from `raw.raw_orders`."}, {"position": 3, "item_id": "RC02-03B", "is_repeat": 0, "scenario_id": "RC02", "label": "B", "group_pos": 3, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the `row_count_between` test in the `stg_orders` model failing. The test checks if the number of rows in the model falls within the expected range of 500-1,000. The failure message indicates that the actual row count is 1, which is less than the minimum expected value. This is likely due to a data issue or a change in the data ingestion process that has caused the row count to drop significantly.\n\n### Fix\n\nTo fix the issue, we need to adjust the expected row count range in the `row_count_between` test to account for the actual row count. Based on the failure message, it seems that the actual row count is 1. Therefore, we can modify the test to expect a row count of 0-1. We can do this by updating the `min_rows` and `max_rows` parameters in the `row_count_between` test in the `stg_orders` model.\n\n**Updated `stg_orders` model:**\n```sql\n-- ... (rest of the model remains the same)\nModel-level tests: row_count_between(min_rows=0, max_rows=1)\n```\n\n### Verification\n\nTo verify that the fix worked, we can re-run the dbt build command and check that the `row_count_between` test is now passing. We can also check the actual row count in the `stg_orders` model to ensure that it is within the expected range.\n\n**Verification command:**\n```\ndbt build\n```\n\n**Expected result:** The `row_count_between` test should pass, indicating that the actual row count is within the expected range of 0-1.\n\n### Assumptions\n\n* The issue is specific to the `stg_orders` model and is not related to any other models or sources in the dbt project.\n* The actual row count in the `stg_orders` model is indeed 1, which is the value reported in the failure message."}, {"position": 4, "item_id": "RC02-07C", "is_repeat": 0, "scenario_id": "RC02", "label": "C", "group_pos": 4, "group_size": 6, "text": "### Root cause\nThe orders ingestion config was changed today (commit 12cac3c, PR #88, ingestion-config repo) to `lookback_days: 60`. The orders extract now loads only the last 60 days instead of the full 180-day window. `raw.raw_orders` therefore dropped from ~597 to 209 rows. `raw.raw_payments` is unchanged (636 rows), so 415 payments now point at orders that are missing from `stg_orders`. This explains both failures: the row-count test (209 < 500) and the relationships test (415 orphan payments).\n\nNeither dbt model is wrong. Freshness passed because the newest rows are current; freshness cannot detect missing history. The failures also caused `dim_customers` and `fct_orders` to be skipped, so both marts (and the finance and marketing dashboards, notably the 07:00 UTC finance refresh) would be stale or built on an incomplete order set. `fct_orders`, `dim_customers` and the finance dashboard must not be fed from the truncated data.\n\n### Fix\n1. **Outside dbt, in the ingestion-config repo:** revert PR #88 (commit 12cac3c), restoring the orders extract to the full 180-day window (or a lookback of at least 180 days).\n2. **Backfill:** trigger a one-off full re-extract of orders for the last 180 days into `raw.raw_orders`. A config revert only affects future loads. If the loader replaces the table on each run, the next full run restores it. If it appends or upserts, the backfill is needed to restore the missing ~390 older orders. Make sure the load is idempotent on `order_id` so no duplicates arise (the `unique` test on `stg_orders.order_id` will catch them).\n3. **No change to dbt tests or models.** Do not loosen `row_count_between` or the `relationships` test; both correctly caught the problem. If a faster hourly load is still wanted, do it as an incremental load that keeps the full history (e.g. upsert recent changes on `order_id`), not a shorter extract window.\n4. Once raw data is restored, rerun the pipeline: `dbt build`. The skipped `dim_customers`, `fct_orders` and their 9 tests will then run.\n5. Optional follow-up: add a row-count or min(`order_date`) check on `source('raw','raw_orders')` so truncation is caught at the source, before the staging layer:\n\n```yaml\nsources:\n  - name: raw\n    tables:\n      - name: raw_orders\n        tests:\n          - row_count_between:\n              min_rows: 500\n              max_rows: 1000\n```\n\n### Verification\nCheck the raw history first:\n\n```sql\nselect count(*) as n_rows, min(order_date) as oldest, max(order_date) as newest\nfrom raw.raw_orders;\n-- expected: ~597+ rows, oldest ≈ 180 days ago\n\nselect count(*) from raw.raw_payments p\nleft join raw.raw_orders o using (order_id)\nwhere p.order_id is not null and o.order_id is null;\n-- expected: 0\n```\n\nThen run:\n\n```\ndbt build\ndbt source freshness\n```\n\nExpected: all tests pass, including `row_count_between` (500–1000) and the `relationships` test on `stg_payments.order_id`. `dim_customers` and `fct_orders` build with no skips. `fct_orders` has the same row count as `stg_orders`. Before the finance stand-up, confirm the finance dashboard totals match yesterday's trend.\n\n### Assumptions\n- The 180-day window is the intended extract scope; `lookback_days: 60` was not meant to shorten history.\n- The extract replaces or overwrites the `raw_orders` contents rather than only appending; either way a backfill is the safe path.\n- The source system still holds the full 180 days of order data, so it can be re-extracted.\n- The ~415 orphan payments are exactly the orders older than 60 days (inferred from the timing and the row counts, not verified).\n- No other changes occurred to the connector or payments extract today (none are listed in the history)."}, {"position": 5, "item_id": "RC02-04A", "is_repeat": 0, "scenario_id": "RC02", "label": "A", "group_pos": 5, "group_size": 6, "text": "### Root cause\nThe failing `row_count_between` test is a fixed-range volume check (500–1000 rows) on `stg_orders`. The 415 orphaned payments are likely a symptom of the same underlying problem rather than a separate defect. The orders table has grown past 1000 rows, so the test now fails. Since the compiled SQL returns exactly one row, the count falls outside [500, 1000], and growth is the most plausible direction for a table that ingestion appends to hourly. The test encodes a size assumption that stopped being true.\n\nThe `relationships` failure suggests `stg_orders` is missing parent orders that `stg_payments` references: 415 payments point to order_ids not present in `stg_orders`. Source freshness passes, so ingestion is current. This is consistent with `stg_orders` filtering or truncating rows (for example a date window or `limit`), or with `raw_orders` being loaded incompletely or later than `raw_payments`. The report doesn't show the model SQL, so which of these applies is not confirmed.\n\nSince dbt skipped `dim_customers`, `fct_orders` and 9 tests, the marts are stale until this is fixed.\n\n### Fix\n1. **Diagnose first (decides the fix).** Inspect `models/staging/stg_orders.sql` for any `where`/`limit`/date-window filter, and compare counts: `raw.raw_orders` vs `stg_orders`.\n\n2. **Replace the hard-coded range test** on `stg_orders` (in `models/staging/schema.yml`). A fixed max on a growing table will keep breaking. Use a lower bound only, or a relative check:\n```yaml\nmodels:\n  - name: stg_orders\n    tests:\n      - row_count_between:\n          min_rows: 500\n          # max_rows removed; table is expected to grow\n```\n(Assumes the macro allows `max_rows` to be omitted; otherwise set it to a generous value such as 10,000,000 or add a null-safe default in the macro.)\n\n3. **If `stg_orders` filters or limits rows** that `stg_payments` still references, remove or align the filter so both staging models cover the same population. For example, drop the restriction:\n```sql\n-- stg_orders.sql: remove e.g. \"where order_date >= '2026-01-01'\" or \"limit 1000\"\nselect * from {{ source('raw', 'raw_orders') }}\n```\n\n4. **If `raw_orders` is genuinely missing orders** (parent rows absent in raw), the fix lies outside dbt: correct the web shop ingestion job (the hourly loader writing `raw.raw_orders`) so it loads complete order history and orders before their payments. Then backfill the missing order_ids. Keep the relationships test as is; it is correctly catching a real integrity issue and should not be loosened or removed.\n\n### Verification\nCheck the counts and orphans directly:\n```sql\nselect count(*) from main.stg_orders;\nselect count(*) from main.stg_payments p\nleft join main.stg_orders o on p.order_id = o.order_id\nwhere p.order_id is not null and o.order_id is null;\n```\nExpected: the orphan query returns 0, and the order count matches `raw.raw_orders` (after any intended dedup).\n\nThen rerun:\n```\ndbt build --select stg_orders stg_payments+\ndbt build\n```\nExpected: both previously failing tests pass, `dim_customers`, `fct_orders` and their 9 tests run and pass, exit code 0.\n\n### Assumptions\n- `stg_orders` row count exceeds 1000 (not below 500); the report only says the count is out of range.\n- The orphaned order_ids exist in `raw_orders` or are missing from it. Which is true is unknown without the model SQL and a raw-vs-staging comparison.\n- `row_count_between` is a custom or package macro whose `max_rows` argument can be dropped or raised.\n- Growth in orders is legitimate business growth, not duplicate loading (check `count(distinct order_id)` vs `count(*)` to rule out duplicates).\n- Freshness passing means the loaders are running, but not that every historical order was loaded."}, {"position": 6, "item_id": "RC02-04C", "is_repeat": 0, "scenario_id": "RC02", "label": "C", "group_pos": 6, "group_size": 6, "text": "### Root cause\n`stg_orders` contains too few or too many rows relative to the expected range of 500–1000 rows; the exact count is not shown, but the row-count test returned one failing row. Because `stg_payments` has 415 `order_id` values that do not exist in `stg_orders`, payments are being loaded for orders that are absent from the staged orders model.\n\nSource freshness passed for both `raw.raw_orders` and `raw.raw_payments`, so this is unlikely to be a late or stale ingestion issue. The most likely cause is that `stg_orders` is filtering out valid orders, using the wrong source/table, or otherwise transforming `raw.raw_orders` incorrectly, while `stg_payments` still includes payments for those orders.\n\n### Fix\nInspect and fix `models/staging/stg_orders.sql`, especially any `where` clause, join, deduplication, date filter, status filter, or cast on `order_id`.\n\nFor example, if `stg_orders` currently filters orders too narrowly, change it to stage all valid raw orders:\n\n```sql\n-- models/staging/stg_orders.sql\n\nselect\n    cast(order_id as varchar) as order_id,\n    cast(customer_id as varchar) as customer_id,\n    cast(order_created_at as timestamp) as order_created_at,\n    status,\n    loaded_at\nfrom {{ source('raw', 'raw_orders') }}\nwhere order_id is not null\n```\n\nAlso ensure `stg_payments.order_id` uses the same type and normalization as `stg_orders.order_id`:\n\n```sql\n-- models/staging/stg_payments.sql\n\nselect\n    cast(payment_id as varchar) as payment_id,\n    cast(order_id as varchar) as order_id,\n    cast(payment_created_at as timestamp) as payment_created_at,\n    amount,\n    status,\n    loaded_at\nfrom {{ source('raw', 'raw_payments') }}\nwhere payment_id is not null\n```\n\nIf the missing orders are actually absent from `raw.raw_orders` but present in the payment provider feed, the fix belongs outside dbt: repair the webshop ingestion job that loads `raw.raw_orders` so it includes all orders corresponding to `raw.raw_payments.order_id`.\n\nThe row-count test may also need review if the business volume has legitimately grown beyond 1000 orders. In that case, update the test threshold in the YAML file defining tests for `stg_orders`, likely `models/staging/schema.yml`:\n\n```yaml\nmodels:\n  - name: stg_orders\n    tests:\n      - row_count_between:\n          min_rows: 500\n          max_rows: 2000\n```\n\nDo not change the threshold merely to hide missing-parent relationship failures.\n\n### Verification\nFirst compare raw and staged counts:\n\n```sql\nselect 'raw_orders' as table_name, count(*) as n_rows from raw.raw_orders\nunion all\nselect 'stg_orders', count(*) from main.stg_orders\nunion all\nselect 'raw_payments', count(*) from raw.raw_payments\nunion all\nselect 'stg_payments', count(*) from main.stg_payments;\n```\n\nCheck the missing payment order IDs:\n\n```sql\nselect p.order_id, count(*) as n_payments\nfrom main.stg_payments p\nleft join main.stg_orders o\n  on p.order_id = o.order_id\nwhere p.order_id is not null\n  and o.order_id is null\ngroup by p.order_id\norder by n_payments desc;\n```\n\nAfter applying the fix, run:\n\n```bash\ndbt build --select stg_orders stg_payments+ --fail-fast\ndbt source freshness\n```\n\nExpected result: the `row_count_between` test on `stg_orders` passes, the `relationships` test on `stg_payments.order_id` returns 0 rows, and downstream models/tests are no longer skipped.\n\n### Assumptions\n- `stg_orders` is built from `source('raw', 'raw_orders')`.\n- `stg_payments` is built from `source('raw', 'raw_payments')`.\n- `main` is the target schema for dbt models in DuckDB.\n- Payment records should only reference orders that exist in `stg_orders`.\n- The 500–1000 row-count range is intended for the current scheduled run volume unless business growth has made it obsolete."}, {"position": 7, "item_id": "NR03-01B", "is_repeat": 0, "scenario_id": "NR03", "label": "B", "group_pos": 1, "group_size": 6, "text": "### Root cause\nThe test failed because the null rate of `stg_customers.email` exceeds 5%. The test SQL returns a row only when `null_rate > 0.05`, so one result row means the threshold was breached. The report doesn't give the actual null rate, total rows or null count, so the size of the breach is unknown. `stg_customers` only applies `lower(email)`, which cannot create nulls, so the nulls come from `raw.raw_customers.email`. The most likely explanation is an upstream problem in the CRM or its ingestion job (for example a changed export, a renamed or dropped field, or a form change). That is a hypothesis until the data is inspected. Source freshness passes (last load 4.1 h ago, well inside the 24 h warn threshold), so ingestion is running and the problem is the content of the data, not staleness. `dim_customers` and its 4 tests were skipped only because of this upstream failure.\n\n### Fix\n1. **Diagnose first.** Quantify and locate the nulls in the raw table:\n\n```sql\nselect\n    date_trunc('day', loaded_at) as load_day,\n    count(*) as total_rows,\n    sum(case when email is null then 1 else 0 end) as null_rows,\n    sum(case when email is null then 1 else 0 end) * 1.0 / count(*) as null_rate,\n    sum(case when trim(email) = '' then 1 else 0 end) as blank_rows\nfrom \"ecommerce\".\"raw\".\"raw_customers\"\ngroup by 1\norder by 1 desc;\n```\n\n   Check whether nulls cluster in recent loads (ingestion/CRM regression) or are spread across history (the data was always this sparse and a customer segment grew).\n\n2. **If it is a recent upstream regression** (the likely case): fix it at the source, outside the dbt project. The CRM export or ingestion job that loads `raw.raw_customers` should populate `email` again, and the affected rows should be re-loaded or backfilled. Do not change dbt to hide it.\n\n3. **If the business has legitimately accepted a higher missing-email share:** raise the threshold in the model's YAML (the `stg_customers` schema file under `models/staging/`), with the owner's agreement:\n\n```yaml\n- name: email\n  tests:\n    - null_rate_below:\n        max_rate: <new agreed value>\n```\n\n   Also update the column description, which currently states the 5% tolerance.\n\n4. **Optional hardening:** if the query shows blank strings (`''`) rather than nulls, they are not counted by this test; consider `nullif(trim(lower(email)), '')` in `stg_customers.sql` so missing emails are represented consistently.\n\nDo not disable the test or use `--exclude` to unblock `dim_customers`; the test is correctly flagging a data quality problem.\n\n### Verification\nAfter the upstream fix and re-ingestion (or the threshold change), run:\n\n```\ndbt build --select stg_customers+ \n```\n\nExpected: `null_rate_below_stg_customers_email__0_05` passes (the compiled query returns 0 rows), and `dim_customers` plus its 4 tests run and pass instead of being skipped. Also re-run the diagnostic query above on `stg_customers` to confirm the null rate is at or below the threshold:\n\n```sql\nselect count(*) filter (where email is null) * 1.0 / count(*) as null_rate\nfrom \"ecommerce\".\"main\".\"stg_customers\";\n```\n\nRun `dbt source freshness` again to confirm all three sources stay within their thresholds.\n\n### Assumptions\n- The null rate was previously below 5%, so this is a change rather than a long-standing condition.\n- Missing emails are real NULLs in `raw_customers`; blank strings are possible but unverified.\n- The `raw` schema is not owned by dbt, so the ingestion/CRM export fix lives with the ingestion owners.\n- No intentional business change (such as guest checkout or a new signup channel without email) is known to have occurred; if one did, option 3 applies.\n- The `null_rate_below` generic test is working as designed, and the schema YAML for `stg_customers` lives in `models/staging/`."}, {"position": 8, "item_id": "NR03-09C", "is_repeat": 0, "scenario_id": "NR03", "label": "C", "group_pos": 2, "group_size": 6, "text": "### Root cause\n`dbt build` failed because the custom generic test `null_rate_below(max_rate=0.05)` on `stg_customers.email` returned one failing row: more than 5% of rows in `\"ecommerce\".\"main\".\"stg_customers\"` have `email is null`. This caused `dim_customers` and its downstream tests to be skipped because `dim_customers` depends on `stg_customers`.\n\nSource freshness is not the issue: `raw.raw_customers` passed freshness, so the CRM/customer ingestion is recent enough under the configured threshold.\n\n### Fix\nFix the customer data quality issue at the source or staging layer, depending on whether null emails are valid.\n\nIf customer emails are required for analytics, remediate outside dbt in the CRM/customer ingestion feeding `raw.raw_customers`: ensure the source field mapped to `stg_customers.email` is populated, or stop loading invalid customer records without email. Then backfill/reload the affected `raw.raw_customers` rows.\n\nAlso verify the staging model mapping in the dbt project, likely:\n\n`models/staging/stg_customers.sql`\n\nEnsure `email` is selected from the correct raw column and that empty strings are normalized consistently:\n\n```sql\nselect\n    customer_id,\n    nullif(trim(email), '') as email,\n    -- other columns\n    loaded_at\nfrom {{ source('raw', 'raw_customers') }}\n```\n\nIf null emails are expected and acceptable for more than 5% of customers, change the test threshold in the YAML file where `stg_customers.email` is tested, likely `models/staging/stg_customers.yml`:\n\n```yaml\nmodels:\n  - name: stg_customers\n    columns:\n      - name: email\n        tests:\n          - null_rate_below:\n              max_rate: 0.05\n```\n\nChange `0.05` to the agreed business threshold, for example:\n\n```yaml\nmodels:\n  - name: stg_customers\n    columns:\n      - name: email\n        tests:\n          - null_rate_below:\n              max_rate: 0.10\n```\n\nOnly loosen the threshold if the business confirms that this null rate is acceptable; otherwise fix the upstream data.\n\n### Verification\nFirst quantify the current failure:\n\n```sql\nselect\n    count(*) as total_rows,\n    sum(case when email is null then 1 else 0 end) as null_rows,\n    sum(case when email is null then 1 else 0 end) * 1.0 / nullif(count(*), 0) as null_rate\nfrom \"ecommerce\".\"main\".\"stg_customers\";\n```\n\nExpected result after remediation: `null_rate <= 0.05`, unless the test threshold was intentionally changed.\n\nThen rerun the affected dbt nodes:\n\n```bash\ndbt build --select stg_customers dim_customers+\n```\n\nExpected result: the `null_rate_below_stg_customers_email__0_05` test passes, `dim_customers` is built, and its previously skipped tests run and pass.\n\nOptionally rerun freshness:\n\n```bash\ndbt source freshness --select source:raw.raw_customers\n```\n\nExpected result: `raw.raw_customers` still passes freshness.\n\n### Assumptions\n- `stg_customers` is built from `source('raw', 'raw_customers')`.\n- `dim_customers` depends on `stg_customers`.\n- Customer email is intended to be mostly populated, and the 5% null threshold is a valid business rule unless changed by stakeholders.\n- The failing null rate is due to source data or staging transformation logic, not DuckDB/dbt infrastructure.\n- The relevant YAML test configuration is in a staging schema YAML file such as `models/staging/stg_customers.yml`."}, {"position": 9, "item_id": "NR03-02B", "is_repeat": 0, "scenario_id": "NR03", "label": "B", "group_pos": 3, "group_size": 6, "text": "### Root cause\n`dbt build` failed because the custom test `null_rate_below(max_rate=0.05)` on `stg_customers.email` found today’s email null rate above 5%: 17.5%. The source `raw.raw_customers` is fresh and the upstream schema still has an `email` column, so this is not a freshness or missing-column issue.\n\nThe most likely cause is the 2026-10-11 CRM setting change: `PRIV-31` enabled “EU privacy mode” on the customer export integration, which appears to redact or omit customer emails for some records. Because `stg_customers.email` is directly derived from `raw_customers.email` via `lower(email)`, the nulls propagate into `stg_customers`, causing `dim_customers` and its tests to be skipped.\n\n### Fix\nIf emails are required for downstream marketing/customer analytics, fix this outside dbt: update the CRM export integration setting changed in `PRIV-31` so that `raw.raw_customers.email` is exported where legally allowed, or provide a compliant replacement field such as a hashed email/customer contact key.\n\nIf EU privacy mode is intentional and missing emails are now expected, update the dbt contract/test to match the new business rule rather than treating this as a pipeline failure.\n\nRecommended dbt change in the column test for `models/staging/stg_customers.sql` metadata/YAML: either raise/remove the global email null-rate threshold, or better, make the tolerance country-aware if privacy mode only affects EU customers.\n\nExample if the accepted new global maximum is 20%:\n\n```yaml\nmodels:\n  - name: stg_customers\n    columns:\n      - name: email\n        description: Lower-cased email address. Missing when suppressed by CRM privacy controls.\n        tests:\n          - null_rate_below:\n              max_rate: 0.20\n```\n\nBetter long-term remediation, if legally/operationally valid, is to add a non-PII stable contact identifier from the CRM export, for example `email_hash`, and use that in downstream use cases that need identity matching without raw email. That would require:\n- CRM export: add `email_hash`\n- source `raw.raw_customers`: include `email_hash`\n- `models/staging/stg_customers.sql`: select and expose `email_hash`\n- `dim_customers`: carry `email_hash` through from `stg_customers`\n\nExample staging change, if `raw_customers.email_hash` exists:\n\n```sql\nselect\n    customer_id,\n    first_name,\n    last_name,\n    lower(email) as email,\n    email_hash,\n    upper(country) as country_code,\n    cast(created_at as timestamp) as created_at,\n    loaded_at\nfrom source\n```\n\n### Verification\nFirst confirm the nulls are coming from the raw CRM export:\n\n```sql\nselect\n    count(*) as total_rows,\n    sum(case when email is null then 1 else 0 end) as null_rows,\n    sum(case when email is null then 1 else 0 end) * 1.0 / nullif(count(*), 0) as null_rate\nfrom raw.raw_customers;\n```\n\nOptionally check whether this is country/privacy related:\n\n```sql\nselect\n    upper(country) as country_code,\n    count(*) as total_rows,\n    sum(case when email is null then 1 else 0 end) as null_rows,\n    sum(case when email is null then 1 else 0 end) * 1.0 / nullif(count(*), 0) as null_rate\nfrom raw.raw_customers\ngroup by 1\norder by null_rate desc, total_rows desc;\n```\n\nAfter fixing the CRM export or updating the dbt test expectation, run:\n\n```bash\ndbt build --select stg_customers+ source:raw.raw_customers\ndbt source freshness --select source:raw.raw_customers\n```\n\nExpected result:\n- `stg_customers` builds successfully.\n- `null_rate_below_stg_customers_email__0_05` passes if the CRM export was restored and null rate is ≤ 5%; or the updated threshold/test passes if the new privacy behavior is accepted.\n- `dim_customers` and its tests are no longer skipped.\n- Source freshness remains passing.\n\n### Assumptions\n- “EU privacy mode” redacts or suppresses email values in the CRM customer export.\n- The 17.5% null rate is computed on the same `stg_customers` view built from `raw.raw_customers`.\n- No dbt code change after 2026-10-01 caused the sudden increase.\n- Whether the correct business response is to restore email export or accept higher null rates depends on privacy/legal requirements not provided here."}, {"position": 10, "item_id": "NR03-09B", "is_repeat": 0, "scenario_id": "NR03", "label": "B", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\nThe failure report indicates that the test `null_rate_below_stg_customers_email__0_05` on the `stg_customers.email` model failed. This test checks the null rate of the `email` column in the `stg_customers` staging table and fails if the null rate exceeds 0.05. Since the test only checks for failures, it's likely that the null rate is above the threshold, indicating that a significant number of customers' emails are null or missing.\n\n### Fix\n\nTo fix this issue, we need to investigate why the null rate is high and update the data to correct the missing emails. One possible solution is to run a data quality check on the `stg_customers` table to identify the customers with missing emails and update their records accordingly. This may involve running a SQL query to identify the affected records and then updating the `email` column using a data enrichment service or by contacting the customers directly.\n\nAssuming that the null rate is due to incorrect or missing data, we can modify the test to allow for a higher null rate or to ignore the null values for a specific column. For example, we can update the test SQL to:\n\n```sql\nwith stats as (\n    select\n        count(*) as total_rows,\n        sum(case when email is null then 1 else 0 end) as null_rows\n    from \"ecommerce\".\"main\".\"stg_customers\"\n)\nselect\n    total_rows,\n    null_rows,\n    null_rows * 1.0 / nullif(total_rows, 0) as null_rate\nfrom stats\nwhere null_rows * 1.0 / nullif(total_rows, 0) <= 0.05\n```\n\nThis modified test will pass if the null rate is 0.05 or less, allowing us to continue building the data mart.\n\n### Verification\n\nTo verify that the fix worked, we can re-run the `dbt build` command and check that the test has passed. We can also run a SQL query to verify the null rate of the `email` column:\n\n```sql\nwith stats as (\n    select\n        count(*) as total_rows,\n        sum(case when email is null then 1 else 0 end) as null_rows\n    from \"ecommerce\".\"main\".\"stg_customers\"\n)\nselect\n    total_rows,\n    null_rows,\n    null_rows * 1.0 / nullif(total_rows, 0) as null_rate\nfrom stats\nwhere null_rows * 1.0 / nullif(total_rows, 0) <= 0.05;\n```\n\nIf the null rate is below 0.05, the test should pass, and we can continue building the data mart.\n\n### Assumptions\n\nAssuming that the null rate is due to incorrect or missing data, and that we have the necessary resources and data enrichment services to correct the missing emails."}, {"position": 11, "item_id": "NR03-01C", "is_repeat": 0, "scenario_id": "NR03", "label": "C", "group_pos": 5, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the `null_rate_below(max_rate=0.05)` test failing on the `stg_customers.email` column. This test is checking if the percentage of null values in the `email` column exceeds 5%. Since the test failed, it implies that there are more than 5% null values in the `email` column, which is outside the allowed threshold.\n\n### Fix\n\nTo fix the issue, we need to update the `stg_customers` model to handle the excessive null values in the `email` column. One possible solution is to increase the allowed null rate threshold in the test. We can do this by updating the `models/staging/stg_customers.sql` file and modifying the test to `null_rate_below(max_rate=0.1)` (allowing up to 10% null values).\n\nAlternatively, if the excessive null values are expected to be addressed through data cleansing or correction, we could also add additional data quality checks or transformations in the `stg_customers` model to reduce the number of null values.\n\n### Verification\n\nTo verify that the fix worked, we can re-run the `dbt build` command and check that the `stg_customers` model builds successfully. We can also re-run the `null_rate_below` test to confirm that the null rate is now below the new threshold.\n\n### Assumptions\n\nI assume that the excessive null values in the `email` column are not a result of any underlying data quality issues, but rather a temporary anomaly that can be addressed through threshold adjustments or data cleansing."}, {"position": 12, "item_id": "NR03-02A", "is_repeat": 0, "scenario_id": "NR03", "label": "A", "group_pos": 6, "group_size": 6, "text": "### Root cause\nThe failure is a real data problem, not a dbt bug. The email null rate jumped from ~0% to 17.5% today. `stg_customers` simply passes `lower(email)` through, so the nulls originate in `raw.raw_customers`. The most plausible cause is the CRM admin enabling \"EU privacy mode\" on the customer export integration (PRIV-31, 2026-10-11), which likely masks or omits emails for EU customers. The 2026-09-30 connector upgrade is a less likely suspect, since the null rate stayed near 0% for ~10 days afterwards. The ~2-day lag between the change and the spike is unexplained, which fits a gradual effect (e.g. the setting applies to newly created or updated records, or after a delayed full sync). Freshness passes, so this is a content problem, not a stale load. The threshold is not the issue: INC-0377 (3.1%) was a legitimate tolerance, 17.5% is not. `dim_customers`, its 4 tests and both dashboards were skipped as a consequence.\n\n### Fix\n1. **Outside dbt (primary fix):** Ask the CRM admin to review/revert \"EU privacy mode\" (PRIV-31) on the customer export integration, or to exclude the `email` field from masking if the business needs it. Then re-run the CRM ingestion (full resync of affected customers) so `raw.raw_customers.email` is repopulated. If privacy mode is intentional and compliance-driven, escalate to the data owner/DPO: the 5% tolerance and the downstream use of email (marketing) must then be redesigned, not the test loosened.\n2. **Do not** raise `max_rate` or disable the test just to unblock the build; that hides the issue and ships degraded data to marketing.\n3. **Optional, in dbt:** make the cause diagnosable by adding a severity split, so a moderate rise warns and a large one errors:\n\n```yaml\n# models/staging/stg_customers.yml\ncolumns:\n  - name: email\n    tests:\n      - null_rate_below:\n          max_rate: 0.05\n```\nKeep this as is. If the unblock is urgent and Finance needs the 07:00 dashboard, run only the unaffected path (the finance dashboard does not depend on email) with `dbt build --exclude stg_customers+ ` only after confirming the finance revenue figures do not need `dim_customers`. Per the lineage, `finance_revenue_dashboard` depends on `dim_customers`, so confirm with Finance whether yesterday's table is acceptable until the resync completes.\n\n### Verification\nCheck the raw source first:\n```sql\nselect\n  count(*) as total_rows,\n  sum(case when email is null then 1 else 0 end) as null_rows,\n  avg(case when email is null then 1.0 else 0 end) as null_rate\nfrom \"ecommerce\".\"raw\".\"raw_customers\";\n\nselect country, avg(case when email is null then 1.0 else 0 end) as null_rate\nfrom \"ecommerce\".\"raw\".\"raw_customers\"\ngroup by 1 order by 2 desc;\n```\nThe second query should show nulls concentrated in EU countries before the fix and a null rate under 5% afterwards. Then run:\n```\ndbt build --select stg_customers+\ndbt source freshness\n```\nExpected: `null_rate_below` passes (rate ≤ 0.05), `dim_customers` and its 4 tests run and pass, nothing is skipped.\n\n### Assumptions\n- EU privacy mode masks or omits email for EU-resident customers; confirm by comparing null rate by `country` (and by `created_at`/`loaded_at`) in raw.\n- The CRM re-export can restore historical emails; if privacy mode is mandated, they cannot be restored.\n- The raw table is a full or upsert reload, so previously populated emails were overwritten with nulls rather than only new rows lacking them.\n- The ingestion tool lets the on-call engineer trigger a resync; otherwise the CRM/ingestion owner must do so.\n- Finance may tolerate the previous day's `dim_customers` temporarily; this has not been confirmed."}, {"position": 13, "item_id": "NR01-07A", "is_repeat": 0, "scenario_id": "NR01", "label": "A", "group_pos": 1, "group_size": 6, "text": "### Root cause\n`dbt build` failed because the `not_null` test on `stg_payments.amount` found 11 rows where `amount` is null. `stg_payments.amount` is derived directly from `raw.raw_payments.amount` via:\n\n```sql\ncast(amount as decimal(18, 2)) / 100 as amount\n```\n\nSo the nulls almost certainly originate in `raw.raw_payments.amount`, not from the dbt transformation. The timing and history point to the payment provider’s 2026-10-13 gift-card settlement re-sync as the likely upstream cause, especially since gift-card volume is normally only 0–2 per day and the failure appeared for the first time today.\n\nDownstream `dim_customers` and `fct_orders` were skipped because they depend on `stg_payments`, which means finance and marketing dashboards may be stale or missing today’s rebuild.\n\n### Fix\nFix the upstream data in `raw.raw_payments.amount`; do not mask the issue in `models/staging/stg_payments.sql` unless the business confirms null payment amounts are valid.\n\nFirst, identify the bad rows:\n\n```sql\nselect\n    payment_id,\n    order_id,\n    payment_method,\n    amount,\n    loaded_at\nfrom raw.raw_payments\nwhere amount is null\norder by loaded_at desc;\n```\n\nIf these are from the provider gift-card re-sync, the remediation belongs outside dbt: the ingestion/payment-provider load for `raw.raw_payments.amount` must populate integer cents for these records, or the provider must resend corrected settlement records. The target source column is:\n\n- Source: `raw.raw_payments`\n- Column: `amount`\n- Expected type/meaning: `INTEGER`, cents, non-null\n\nAfter corrected data is loaded, rerun dbt.\n\nNo dbt model change is recommended if `amount` is required for revenue, lifetime value, and order facts. The existing test is correctly preventing invalid revenue data from reaching:\n\n- `models/staging/stg_payments.sql`\n- `model dim_customers`\n- `model fct_orders`\n- `finance_revenue_dashboard`\n- `marketing_customer_dashboard`\n\nIf the business decides that some payment rows can legitimately have unknown amounts, then update the contract instead: remove or relax the `not_null` test on `stg_payments.amount` in the model YAML and adjust downstream revenue logic to exclude or separately flag unknown amounts. That should be treated as a business rule change, not an incident workaround.\n\n### Verification\nBefore rerunning dbt, confirm the raw source is corrected:\n\n```sql\nselect count(*) as null_amount_rows\nfrom raw.raw_payments\nwhere amount is null;\n```\n\nExpected result:\n\n```text\n0\n```\n\nAlso check whether the failed rows were gift-card related:\n\n```sql\nselect\n    payment_method,\n    count(*) as rows,\n    count(*) filter (where amount is null) as null_amount_rows\nfrom raw.raw_payments\nwhere loaded_at::date = date '2026-10-13'\ngroup by payment_method\norder by payment_method;\n```\n\nExpected result after fix: `null_amount_rows = 0` for every payment method.\n\nThen rerun the affected dbt path:\n\n```bash\ndbt build --select source:raw.raw_payments+ --source-freshness\n```\n\nOr, if using separate commands as in the scheduled job:\n\n```bash\ndbt build --select stg_payments+\ndbt source freshness --select source:raw.raw_payments\n```\n\nExpected result:\n\n- `not_null_stg_payments_amount` passes.\n- `stg_payments`, `dim_customers`, and `fct_orders` build successfully.\n- Previously skipped downstream tests run and pass.\n- Source freshness for `raw.raw_payments` remains passing.\n\nOptionally validate downstream revenue facts:\n\n```sql\nselect count(*) as fct_orders_null_amounts\nfrom fct_orders\nwhere amount is null;\n```\n\nExpected result:\n\n```text\n0\n```\n\n### Assumptions\n- `raw.raw_payments.amount` should never be null for a settled payment.\n- The 11 null rows are related to the 2026-10-13 payment provider gift-card settlement re-sync.\n- The ingestion process loads provider data into `raw.raw_payments` and can be rerun or patched after corrected provider data is available.\n- Dashboards are reading the last successfully built `dim_customers` and `fct_orders` tables until the failed run is remediated."}, {"position": 14, "item_id": "NR01-07C", "is_repeat": 0, "scenario_id": "NR01", "label": "C", "group_pos": 2, "group_size": 6, "text": "### Root cause\n\nThe failure is due to 11 null payment amounts found in the `stg_payments` table, which is a departure from the expected behavior of zero or fewer null values. This issue has been recurring, with 6 previous daily runs passing and 1 failing today.\n\n### Fix\n\nTo fix the issue, we need to update the `stg_payments` model to handle missing or null payment amounts. This can be achieved by adding a check in the `stg_payments` SQL file to set the `amount` column to a reasonable value (e.g., 0) when it's null. The updated SQL file would be:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_payments') }}\n\n),\n\nrenamed as (\n\n    select\n        payment_id,\n        order_id,\n        payment_method,\n        -- set null amount to 0\n        coalesce(cast(amount as decimal(18, 2)) / 100, 0) as amount,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```\n\n### Verification\n\nTo confirm the fix worked, we can re-run the `dbt test` command and verify that the `not_null_stg_payments_amount` test passes. Specifically, we can run the following SQL query to check the number of null values in the `amount` column:\n\n```sql\nSELECT COUNT(*) \nFROM \"ecommerce\".\"main\".\"stg_payments\" \nWHERE amount IS NULL;\n```\n\nIf the result is 0, the fix is successful."}, {"position": 15, "item_id": "NR01-09A", "is_repeat": 0, "scenario_id": "NR01", "label": "A", "group_pos": 3, "group_size": 6, "text": "### Root cause\n`dbt build` failed because the `not_null` test on `stg_payments.amount` found 11 rows where `amount` is `NULL`. The compiled test queries the staged view, and `stg_payments.amount` is derived from `raw.raw_payments.amount` using:\n\n```sql\ncast(amount as decimal(18, 2)) / 100 as amount\n```\n\nIf the raw `amount` is `NULL`, the staged `amount` remains `NULL`. Source freshness passed, so this is not an ingestion-latency issue; fresh payment data arrived, but 11 payment records have missing raw payment amounts.\n\n### Fix\nFix the upstream ingestion/source data for `raw.raw_payments.amount`, not the dbt transformation, unless `NULL` payment amounts are valid business data.\n\nRecommended remediation outside dbt:\n\n- In the web shop/payment provider ingestion job that writes to `raw.raw_payments`, ensure `amount` is populated in integer cents for every payment row.\n- Backfill or correct the 11 affected rows in `raw.raw_payments.amount`.\n\nTo identify the affected rows:\n\n```sql\nselect\n    payment_id,\n    order_id,\n    payment_method,\n    amount,\n    loaded_at\nfrom raw.raw_payments\nwhere amount is null;\n```\n\nAfter correcting the source data, keep the existing dbt model and test as-is:\n\nFile: `models/staging/stg_payments.sql`\n\n```sql\ncast(amount as decimal(18, 2)) / 100 as amount\n```\n\nColumn test to keep:\n\n```yaml\namount:\n  tests:\n    - not_null\n```\n\nDo not replace `NULL` with `0` in `stg_payments`, because that would hide bad payment data and could materially misstate revenue.\n\nIf the business confirms that missing payment amounts are expected for certain records, then update the model/test to reflect that rule, for example by excluding non-monetary or pending payment rows from the `not_null` test. That should only be done after confirming the valid condition.\n\n### Verification\nFirst confirm the raw issue:\n\n```sql\nselect count(*) as null_raw_amount_count\nfrom raw.raw_payments\nwhere amount is null;\n```\n\nExpected before remediation: `11`, assuming all failing staged rows come directly from null raw amounts.\n\nAfter the ingestion fix/backfill, run:\n\n```sql\nselect count(*) as null_raw_amount_count\nfrom raw.raw_payments\nwhere amount is null;\n```\n\nExpected result: `0`.\n\nThen rerun the affected dbt test:\n\n```bash\ndbt test --select stg_payments.amount\n```\n\nExpected result: pass for `not_null_stg_payments_amount`.\n\nFinally rerun the build for impacted downstream models:\n\n```bash\ndbt build --select stg_payments+ \n```\n\nExpected result: `stg_payments`, `dim_customers`, `fct_orders`, and their downstream tests build/pass without skips caused by this failure.\n\nOptionally rerun freshness:\n\n```bash\ndbt source freshness --select source:raw.raw_payments\n```\n\nExpected result: pass, confirming the source is still current.\n\n### Assumptions\n- `raw.raw_payments.amount` is the raw integer-cents field referenced by `stg_payments.sql`.\n- The 11 null staged amounts are caused by `NULL` values in `raw.raw_payments.amount`, not by unusual casting behavior.\n- Payment amounts are required for all rows in `raw.raw_payments`; `NULL` is invalid business data.\n- The ingestion/backfill process is owned outside the dbt project.\n- Downstream skips occurred because `dim_customers`, `fct_orders`, and their tests depend directly or indirectly on `stg_payments`."}, {"position": 16, "item_id": "NR01-05B", "is_repeat": 0, "scenario_id": "NR01", "label": "B", "group_pos": 4, "group_size": 6, "text": "### Root cause\nThe `not_null` test on `stg_payments.amount` found 11 rows where `amount` is NULL, so `dbt build` failed that test and skipped everything downstream (`dim_customers`, `fct_orders`, 9 tests). Source freshness passes (data loaded 0.9 h ago), so this is not a stale or missing load. The problem is the content of the data: either `raw.raw_payments` contains rows with NULL amounts (e.g. failed, pending or voided payments from the payment provider, or an ingestion bug/schema change), or `stg_payments` mis-maps or mis-casts the column (e.g. a renamed field or a failed cast producing NULL). The report doesn't say which, so the first step is to inspect the 11 rows.\n\n### Fix\n1. **Diagnose first.** Compare the 11 rows in staging with raw:\n```sql\nselect s.*, r.*\nfrom \"ecommerce\".\"main\".\"stg_payments\" s\nleft join \"ecommerce\".\"raw\".\"raw_payments\" r on r.<payment_id_col> = s.payment_id\nwhere s.amount is null;\n```\n2. **If raw is NULL for legitimate non-monetary states** (e.g. status `failed`/`pending`), handle it in `models/staging/stg_payments.sql`, not by deleting the test. Either filter those rows out or make the semantics explicit:\n```sql\n-- option A: exclude non-settled payments\nwhere amount is not null\n\n-- option B: keep rows, default to 0 and keep the status for downstream filtering\ncoalesce(amount, 0) as amount\n```\nChoose A if downstream marts only want settled payments; choose B only if a zero amount is semantically correct. Do not silently coalesce if the NULL means \"unknown\".\n\n3. **If the staging cast/mapping is wrong** (e.g. `cast(amount_cents as decimal)/100` on a renamed column, or `try_cast` on a malformed string), fix the expression in `stg_payments.sql` to read the correct source column.\n\n4. **If raw data is genuinely bad** (provider or ingestion defect), the fix belongs outside dbt: correct the payment-provider ingestion job that writes `raw.raw_payments`, then backfill/reload the 11 affected records. Keep the `not_null` test in `models/staging/schema.yml` as is, since it correctly caught a data-quality issue. If NULLs turn out to be expected for some statuses and you want to keep them, scope the test instead:\n```yaml\n- name: amount\n  tests:\n    - not_null:\n        config:\n          where: \"status = 'completed'\"\n```\n(Only do this after confirming with the business that NULL is valid for other statuses.)\n\n### Verification\n```\ndbt build --select stg_payments+\n```\nExpected: `not_null_stg_payments_amount` passes (0 failing rows), and `dim_customers`, `fct_orders` and their 9 tests run and pass instead of being skipped.\n\nAlso confirm directly:\n```sql\nselect count(*) from \"ecommerce\".\"main\".\"stg_payments\" where amount is null;  -- expect 0\n```\nIf you filtered rows, check that the row-count drop is exactly the 11 expected rows. After the next hourly ingestion, rerun the full `dbt build` to confirm the issue doesn't recur.\n\n### Assumptions\n- The column names (`payment_id`, `status`, `amount`) and model file path (`models/staging/stg_payments.sql`, `schema.yml`) follow common dbt conventions; actual names may differ.\n- `stg_payments` is a view over `raw.raw_payments` with light renaming/casting.\n- The 11 NULLs are new or newly surfaced; I don't know whether the test passed on previous runs.\n- Whether NULL amounts are valid business states (failed/pending payments) versus ingestion defects is unknown and determines which fix option applies.\n- The skipped downstream nodes have no independent problems; they were skipped only because of the upstream failure."}, {"position": 17, "item_id": "NR01-05A", "is_repeat": 0, "scenario_id": "NR01", "label": "A", "group_pos": 5, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the presence of null values in the `stg_payments.amount` column, which is not allowed according to the test `not_null_stg_payments_amount`. This is likely due to some issue in the ingestion job or data quality problem in the raw data.\n\n### Fix\n\nTo fix this, we need to update the `not_null_stg_payments_amount` test to allow null values or update the raw data to ensure that the `amount` column does not contain null values. We can do this by updating the `stg_payments` model to handle null values or by fixing the issue in the ingestion job or raw data quality.\n\nAssuming that we want to allow null values in the `stg_payments.amount` column, we can update the `not_null_stg_payments_amount` test in the `tests` directory by updating the YAML file to:\n\n```yaml\ntests/not_null_stg_payments_amount.yml:\n  test: |\n    {{ dbt.utils.test_not_null(table=\"stg_payments\", column=\"amount\", max_nulls=11) }}\n```\n\nThis updated test will allow up to 11 null values in the `stg_payments.amount` column.\n\n### Verification\n\nTo verify that the fix worked, we can run the `dbt test` command again and ensure that the `not_null_stg_payments_amount` test passes.\n\n```\ndbt test\n```\n\nExpected result: The test should pass without any failures.\n\n### Assumptions\n\n* The issue is not due to any changes in the dbt project configuration or dependencies.\n* The `stg_payments.amount` column is not expected to have a specific value (e.g., a specific amount) but rather any value can be null."}, {"position": 18, "item_id": "NR01-09B", "is_repeat": 0, "scenario_id": "NR01", "label": "B", "group_pos": 6, "group_size": 6, "text": "### Root cause\n`stg_payments.amount` is `cast(amount as decimal(18, 2)) / 100`, which yields NULL only when the raw `amount` is NULL. Casting a non-null integer cannot produce NULL here, so 11 rows in `raw.raw_payments` arrived with a NULL `amount`. The cause is upstream, in the payment provider's feed or the ingestion job. It is not a transformation bug. The failed not_null test blocked `dim_customers`, `fct_orders` and 9 tests, so downstream marts were not refreshed. Source freshness passes because rows are still arriving; it does not check column completeness.\n\n### Fix\n1. **Outside dbt (primary fix):** Have the owner of the payment-provider ingestion job into `raw.raw_payments` find out why `amount` is NULL for these 11 rows (e.g. a changed or missing field in the provider's payload, pending/failed/voided payment events, or a parsing error) and correct the job. Then reload or backfill the affected rows with real amounts.\n2. **Do not weaken the test or coalesce to 0.** That would hide missing revenue and silently distort `fct_orders`.\n3. **Optional dbt change, only if the NULLs turn out to be legitimate** (e.g. non-monetary events that should not be payments): filter them in staging and document it.\n\n```sql\n-- models/staging/stg_payments.sql, in the `source` CTE\nselect * from {{ source('raw', 'raw_payments') }}\nwhere amount is not null\n```\n\nIf the NULLs are bad data, do not add this filter. It would drop payments and cause under-reporting that the test would no longer catch.\n\n4. **Optional hardening:** add a `not_null` test on the raw column and set it to `warn` or `store_failures: true`, so failing rows are captured for triage:\n\n```yaml\nsources:\n  - name: raw\n    tables:\n      - name: raw_payments\n        columns:\n          - name: amount\n            tests:\n              - not_null:\n                  config:\n                    store_failures: true\n```\n\n### Verification\nCheck the raw data first:\n```sql\nselect payment_id, order_id, payment_method, loaded_at\nfrom raw.raw_payments\nwhere amount is null;\n```\nExpected after the fix: 0 rows (or only the rows you deliberately decided to exclude).\n\nThen re-run the pipeline:\n```\ndbt build --select stg_payments+\n```\nExpected: `not_null_stg_payments_amount` passes, and `dim_customers`, `fct_orders` and their tests run and pass, so nothing is skipped. Finally, run `dbt source freshness` again to confirm it still passes.\n\n### Assumptions\n- The raw `amount` column is integer cents, as the model comment states. The cast and division cannot introduce NULLs, so the NULLs exist in the raw table. I have not seen the raw data to confirm this.\n- The 11 NULL rows come from the latest loads (or a specific batch) and are not long-standing legacy rows. I did not check their `loaded_at` values.\n- The cause of the NULLs (provider payload change, ingestion bug, or legitimate non-monetary events) is unknown. Which fix applies depends on that finding.\n- There is a separate team or owner for the ingestion job, and reloading or backfilling `raw.raw_payments` is possible.\n- Downstream models (`dim_customers`, `fct_orders`) have no other problems of their own; they were only skipped, not run, so this is not verified."}, {"position": 19, "item_id": "SD01-07A", "is_repeat": 0, "scenario_id": "SD01", "label": "A", "group_pos": 1, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is an error in the `stg_payments` model. Specifically, the error message suggests that there is an attempt to reference a column (\"amount\") that has not been defined before it is used in the SELECT clause.\n\n### Fix\n\nTo fix this issue, we need to ensure that the \"amount\" column is defined before it is used in the SELECT clause. This can be achieved by moving the \"amount\" column to the top of the SELECT statement, so that it is defined before it is used. Here is the corrected SQL:\n\n```\nSELECT \n  amount,\n  ...\nFROM \n  ...\n```\n\nAlternatively, we can also define the \"amount\" column separately before it is used in the SELECT statement. For example:\n\n```\n{% set amount = (SELECT ...) %}\nSELECT \n  {{ amount }},\n  ...\nFROM \n  ...\n```\n\n### Verification\n\nTo verify that the fix has worked, we can re-run the dbt build command:\n\n```\ndbt build\n```\n\nIf the build command runs successfully, it should not report any errors or warnings related to the `stg_payments` model. We can also verify the fix by checking the `stg_payments` table to ensure that it has been populated correctly.\n\n### Assumptions\n\nBased on the information provided, we assume that the `stg_payments` model is defined in the `models/staging/stg_payments.sql` file, and that it is not a trivial model that can be fixed by simply re-running the build command."}, {"position": 20, "item_id": "SD01-07C", "is_repeat": 0, "scenario_id": "SD01", "label": "C", "group_pos": 2, "group_size": 6, "text": "### Root cause\n`stg_payments` fails with a DuckDB Binder Error: a column named `amount` is referenced in the model's own SELECT list before it is defined. This is the classic \"lateral alias\" problem. DuckDB allows aliases to be reused within the same SELECT, so an expression like `amount / 100.0 as amount_eur` followed by something that uses `amount`, or an alias that shadows a source column and is then referenced, resolves differently than expected. The error is therefore a SQL bug in the model itself, not an ingestion problem. Source freshness passes for all three sources (payments loaded 0.9 h ago), so the data is current; the failure is a compile/bind-time issue. The 19 skipped nodes (`dim_customers`, `fct_orders`, 15 tests) are only downstream casualties of this single failure.\n\n### Fix\nEdit `models/staging/stg_payments.sql`. I can't see the file, so the change below is an illustrative sketch. Find where `amount` is referenced inside the SELECT before it exists as a column or alias (for example, a derived column using `amount` where `amount` is only produced later in the same SELECT). The robust fix is to compute derived values in a CTE and reference them in a following step:\n\n```sql\nwith source as (\n    select * from {{ source('raw', 'raw_payments') }}\n),\n\nrenamed as (\n    select\n        payment_id,\n        order_id,\n        -- define amount once, explicitly, from the raw column\n        cast(amount_cents as decimal(18,2)) / 100 as amount,\n        status,\n        loaded_at\n    from source\n)\n\nselect\n    *,\n    case when amount > 0 then true else false end as is_positive\nfrom renamed\n```\n\nThe key point is that `amount` is defined in one CTE and only referenced in the next. Use the real raw column name (`amount_cents` above is a placeholder). If the raw column is itself called `amount` and the model aliases an expression to `amount` while also referencing the raw column elsewhere in the same SELECT, qualify it (`source.amount`) or rename the derived column. No changes are needed outside the dbt project.\n\n### Verification\nRun the failing model and its downstream nodes:\n\n```\ndbt build --select stg_payments+\n```\n\nExpected: `stg_payments`, `dim_customers`, `fct_orders` and their 15 tests all run, with 0 errors and 0 skipped. Then run a full `dbt build` and confirm exit code 0. A quick sanity check on the data:\n\n```sql\nselect count(*), min(amount), max(amount), count(*) filter (where amount is null)\nfrom stg_payments;\n```\n\nExpect a row count close to `raw.raw_payments` and no unexpected NULLs. If a before/after comparison is possible, check the totals against the previous good run.\n\n### Assumptions\n- The model file contents were not provided, so the exact offending line is inferred from the error message; the SQL above is a sketch, and `amount_cents` is a placeholder column name.\n- The error is a model SQL bug rather than a schema change in `raw.raw_payments`. If the raw table's columns changed recently (for example `amount` renamed or dropped by the payment provider ingestion), the fix would instead be to update the staging model's column mapping, and the ingestion owner should be told. Check with `describe raw.raw_payments`.\n- The run was not interrupted by anything else: the 12 passes plus the ERROR and 19 skips are fully explained by the one failing node.\n- Fixing the model needs no data backfill, since staging models are views and mart tables rebuild on the next successful run."}, {"position": 21, "item_id": "SD01-04A", "is_repeat": 0, "scenario_id": "SD01", "label": "A", "group_pos": 3, "group_size": 6, "text": "### Root cause\n`models/staging/stg_payments.sql` still references `raw.raw_payments.amount`, but the current `raw.raw_payments` table has `amount_cents` instead. This aligns with the 2026-10-12 payment provider v2 change that renamed fields to API v2 naming. DuckDB reports a binder error because `amount` is being defined as a SELECT alias while also being referenced in the same SELECT expression, but there is no upstream `amount` column available.\n\nBecause `stg_payments` failed, downstream models `dim_customers` and `fct_orders` and their tests were skipped. Source freshness passed, so this is a schema/contract drift issue, not a late-ingestion issue.\n\n### Fix\nUpdate `models/staging/stg_payments.sql` to use `amount_cents` from `raw.raw_payments` and keep the staged output column named `amount`.\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_payments') }}\n\n),\n\nrenamed as (\n\n    select\n        payment_id,\n        order_id,\n        payment_method,\n        -- source stores integer cents; convert to currency units\n        cast(amount_cents as decimal(18, 2)) / 100 as amount,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```\n\nAlso update the documented column-level lineage for `stg_payments.amount` from:\n\n```text\nstg_payments.amount ← raw_payments.amount (integer cents / 100)\n```\n\nto:\n\n```text\nstg_payments.amount ← raw_payments.amount_cents (integer cents / 100)\n```\n\nIf the dbt source YAML documents raw source columns, update the raw payments source definition to replace `amount` with `amount_cents`, likely in the relevant `models/sources.yml` or equivalent source YAML file:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_payments\n        columns:\n          - name: payment_id\n          - name: order_id\n          - name: payment_method\n          - name: amount_cents\n            description: Payment amount in integer cents from the payment provider export.\n          - name: loaded_at\n```\n\nOptionally, add a source/schema test or contract check for expected raw columns so future provider schema changes fail earlier with a clearer message.\n\n### Verification\nRun a targeted build of the failed model and its downstream dependencies:\n\n```bash\ndbt build --select stg_payments+\n```\n\nExpected result: `stg_payments`, `dim_customers`, `fct_orders`, and downstream tests build/pass with no runtime binder error.\n\nConfirm the staged amount conversion:\n\n```sql\nselect\n    payment_id,\n    order_id,\n    payment_method,\n    amount,\n    loaded_at\nfrom {{ ref('stg_payments') }}\nlimit 10;\n```\n\nExpected result: `amount` is populated in currency units, e.g. a raw `amount_cents` value of `1234` appears as `12.34`.\n\nOptionally compare raw to staged values:\n\n```sql\nselect\n    r.payment_id,\n    r.amount_cents,\n    s.amount\nfrom raw.raw_payments r\njoin {{ ref('stg_payments') }} s\n  on r.payment_id = s.payment_id\nwhere s.amount <> cast(r.amount_cents as decimal(18, 2)) / 100\nlimit 10;\n```\n\nExpected result: zero rows.\n\nThen run the normal production command:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: all previously skipped downstream models/tests now run; source freshness still passes.\n\n### Assumptions\nThe provider’s v2 field `amount_cents` has the same semantics as the previous `amount`: integer cents requiring division by 100.\n\nNo other v2 payment-provider fields changed in a way that affects `payment_id`, `order_id`, `payment_method`, or `loaded_at`.\n\nThe raw ingestion job is expected to expose provider v2 field names directly in `raw.raw_payments`, rather than mapping them back to the old dbt-facing names before loading."}, {"position": 22, "item_id": "SD01-04B", "is_repeat": 0, "scenario_id": "SD01", "label": "B", "group_pos": 4, "group_size": 6, "text": "### Root cause\nThe payment provider's settlement export v2 (live since 2026-10-12) renamed the cents column in `raw.raw_payments` from `amount` to `amount_cents`. `stg_payments` still does `cast(amount as decimal(18, 2)) / 100 as amount`. Because `amount` no longer exists in the source, DuckDB resolves the reference to the alias being defined in the same SELECT, which produces the misleading \"cannot be referenced before it is defined\" Binder Error. Source freshness passes because data is still arriving; only the schema changed. `dim_customers`, `fct_orders` and the 15 tests were skipped as a consequence, so both dashboards are at risk of stale data (finance refreshes at 07:00 UTC).\n\n### Fix\nEdit `models/staging/stg_payments.sql` so the `renamed` CTE reads from `amount_cents`. The output column name `amount` stays unchanged, so downstream models and tests need no edits.\n\n```sql\nrenamed as (\n\n    select\n        payment_id,\n        order_id,\n        payment_method,\n        -- source stores integer cents (column renamed from amount in export v2)\n        cast(amount_cents as decimal(18, 2)) / 100 as amount,\n        loaded_at\n    from source\n\n)\n```\n\nThen rerun the skipped nodes so the marts and dashboards catch up: `dbt build --select stg_payments+`. If the finance dashboard has already refreshed on stale marts, tell Finance analytics.\n\nOutside the dbt project: ask the data platform/ingestion owner to add a schema-change check on the raw load (or a dbt source column test) so vendor renames are caught at ingestion, and ask the provider/ingestion owner to confirm v2 has no other renamed fields or changed units (see Assumptions).\n\n### Verification\nRun:\n\n```\ndbt build --select stg_payments+\n```\n\nExpected: `stg_payments`, `dim_customers`, `fct_orders` and all their tests (including `unique`/`not_null` on `payment_id`, the `relationships` test to `stg_orders` and `accepted_values` on `payment_method`) pass, with exit code 0.\n\nSanity-check the units, since a silent rename can also mean a silent unit change:\n\n```sql\nselect\n    min(r.amount_cents) as min_cents,\n    max(r.amount_cents) as max_cents,\n    min(s.amount) as min_amount,\n    max(s.amount) as max_amount\nfrom raw.raw_payments r\njoin stg_payments s using (payment_id);\n```\n\nExpected: `amount` equals `amount_cents / 100` for every row, and values are in the same range as before 2026-10-12. Also compare yesterday's daily revenue in `fct_orders` with the previous days to check there is no jump or drop. Confirm `fct_orders` still has one row per order (row count matches `stg_orders`).\n\n### Assumptions\n- The rename `amount` → `amount_cents` is the only schema change in export v2 and `amount_cents` still holds integer cents (the source column list says INTEGER, but I have not seen the values). The vendor notice mentions only naming changes, not unit changes.\n- Rows loaded before 2026-10-12 are already in the table under the new column name (the warehouse shows a single `amount_cents` column), so no backfill or dual-name handling is needed. If the ingestion job stores old and new files differently, a `coalesce` or a backfill might be required.\n- The 2026-10-07 dbt-duckdb upgrade is not related, since six runs succeeded after it.\n- The 15 skipped tests are unaffected by the rename and will pass once the model builds; I have no evidence of other data-quality problems."}, {"position": 23, "item_id": "SD01-06A", "is_repeat": 0, "scenario_id": "SD01", "label": "A", "group_pos": 5, "group_size": 6, "text": "### Root cause\n\nThe failure report indicates a \"Binder Error\" in the `stg_payments` model, specifically that a column \"amount\" referenced in the SELECT clause has not been defined before it is referenced. This suggests that the `amount` column is being used in the `renamed` CTE before it has been defined.\n\n### Fix\n\nTo fix this issue, the `amount` column needs to be defined before it is referenced. This can be done by moving the calculation for `amount` to the SELECT statement before the `renamed` CTE. The corrected SQL for the `stg_payments` model would be:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_payments') }}\n\n),\n\nrenamed as (\n\n    select\n        payment_id,\n        order_id,\n        payment_method,\n        loaded_at,\n        cast(amount as decimal(18, 2)) / 100 as amount  -- move this calculation here\n    from source\n\n)\n\nselect * from renamed\n```\n\n### Verification\n\nTo confirm the fix worked, run the following dbt command:\n\n```\ndbt build\n```\n\nIf the command completes successfully, it should report all tests as passed, and no errors or skipped models.\n\n### Assumptions\n\nI assumed that the `amount` column is being calculated as the payment amount in currency units, and that the issue is not related to any external dependencies or data quality issues."}, {"position": 24, "item_id": "SD01-06C", "is_repeat": 0, "scenario_id": "SD01", "label": "C", "group_pos": 6, "group_size": 6, "text": "### Root cause\n`stg_payments` fails at SQL binding/compilation in DuckDB. In `models/staging/stg_payments.sql`, the expression:\n\n```sql\ncast(amount as decimal(18, 2)) / 100 as amount\n```\n\nselects an output column named `amount` while also referencing `amount` unqualified in the same `SELECT`. DuckDB is interpreting the unqualified `amount` reference ambiguously/as a SELECT-list alias reference before it is defined, causing:\n\n> Column \"amount\" referenced that exists in the SELECT clause - but this column cannot be referenced before it is defined\n\nSource freshness passed for `raw.raw_payments`, so this is not an ingestion freshness issue. Downstream models and tests were skipped because `stg_payments` is upstream of them.\n\n### Fix\nUpdate `models/staging/stg_payments.sql` to avoid the ambiguous self-reference by qualifying the source column, or by renaming the raw cents column before converting it.\n\nRecommended change:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_payments') }}\n\n),\n\nrenamed as (\n\n    select\n        source.payment_id,\n        source.order_id,\n        source.payment_method,\n        -- source stores integer cents; convert to currency units\n        cast(source.amount as decimal(18, 2)) / 100 as amount,\n        source.loaded_at\n    from source\n\n)\n\nselect * from renamed\n```\n\nAlternatively, if the raw column is intended to be named more explicitly, change the upstream ingestion/source schema outside dbt to expose `amount_cents`, then update the model:\n\n```sql\ncast(source.amount_cents as decimal(18, 2)) / 100 as amount\n```\n\nBut based on the provided metadata, the immediate dbt-side fix is to qualify `source.amount`.\n\n### Verification\nFirst validate/build the affected model and its downstream dependencies:\n\n```bash\ndbt build --select stg_payments+\n```\n\nExpected result: `stg_payments`, downstream models such as `dim_customers` and `fct_orders`, and associated tests complete without the previous Binder Error.\n\nOptionally run just the model SQL:\n\n```bash\ndbt run --select stg_payments\n```\n\nExpected result: the `stg_payments` view is created successfully.\n\nThen inspect the output:\n\n```sql\nselect\n    payment_id,\n    order_id,\n    payment_method,\n    amount,\n    loaded_at\nfrom stg_payments\nlimit 10;\n```\n\nExpected result: rows are returned, and `amount` is in currency units rather than integer cents.\n\nFinally rerun the normal job command:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: no model error for `stg_payments`; skipped downstream nodes now run. Source freshness should continue to pass if ingestion remains current.\n\n### Assumptions\n- The raw source table `raw.raw_payments` has a column named `amount` containing integer cents.\n- The intended output column in `stg_payments` should remain named `amount`.\n- The DuckDB schema/search path allows querying `stg_payments` directly in the example SQL; if not, use the fully qualified relation name for the dbt target schema.\n- No additional data quality failures are hidden behind the skipped downstream models/tests; they may surface after `stg_payments` is fixed."}, {"position": 25, "item_id": "FV03-03B", "is_repeat": 0, "scenario_id": "FV03", "label": "B", "group_pos": 1, "group_size": 6, "text": "### Root cause\n`dbt build` succeeded: all models and data tests passed. The failure is only from `dbt source freshness`.\n\nThe source `raw.raw_customers` is stale. Its latest `loaded_at` value is `2026-10-13 14:56 UTC`, which was 4.1 hours before the freshness check. The source freshness config for `raw.raw_customers` errors after 2 hours, so `dbt source freshness` correctly exited with code 1.\n\nThis indicates the CRM customer ingestion job did not load new rows into `\"ecommerce\".\"raw\".\"raw_customers\"` within the expected freshness window, or it loaded rows without updating `loaded_at`.\n\n### Fix\nFix the upstream CRM ingestion for `raw.raw_customers`, outside the dbt project.\n\nSpecifically, check the hourly ingestion job that writes to:\n\n```sql\n\"ecommerce\".\"raw\".\"raw_customers\"\n```\n\nand ensure it either:\n\n1. is running successfully every hour, and\n2. writes fresh records with `loaded_at` set to the ingestion/write timestamp in UTC.\n\nExample expected ingestion behavior:\n\n```sql\ninsert into \"ecommerce\".\"raw\".\"raw_customers\" (\n    customer_id,\n    first_name,\n    last_name,\n    email,\n    country,\n    created_at,\n    loaded_at\n)\nselect\n    customer_id,\n    first_name,\n    last_name,\n    email,\n    country,\n    created_at,\n    current_timestamp as loaded_at\nfrom crm_extract;\n```\n\nIf the CRM feed is intentionally less frequent than every 2 hours, then the dbt source freshness threshold is too strict and should be changed in the source YAML for `raw.raw_customers`.\n\nFor example, in the source definition file for the `raw` source, update only the `raw_customers` freshness setting:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 1\n            period: hour\n          error_after:\n            count: 2\n            period: hour\n```\n\nChange `warn_after` / `error_after` only if the business SLA for CRM customer data is actually longer than the current 1-hour warning / 2-hour error threshold.\n\n### Verification\nFirst confirm the latest customer load timestamp:\n\n```sql\nselect\n    max(loaded_at) as max_loaded_at,\n    current_timestamp as checked_at,\n    date_diff('minute', max(loaded_at), current_timestamp) as age_minutes\nfrom \"ecommerce\".\"raw\".\"raw_customers\";\n```\n\nExpected result after fixing ingestion: `max_loaded_at` should be within 2 hours of `checked_at`, ideally within 1 hour.\n\nThen rerun source freshness:\n\n```bash\ndbt source freshness --select source:raw.raw_customers\n```\n\nExpected result:\n\n```text\nPASS source raw.raw_customers\n```\n\nThen run the normal scheduled checks:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: `dbt build` passes, and all three sources pass freshness.\n\n### Assumptions\nThe freshness check ran around `2026-10-13 19:02 UTC`, based on `14:56 UTC` being reported as 4.1 hours old.\n\nThe CRM ingestion job is expected to run hourly, matching the statement that ingestion jobs load data every hour.\n\nThe conf
