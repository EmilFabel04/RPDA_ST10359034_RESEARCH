yment_method VARCHAR, amount INTEGER, loaded_at TIMESTAMP\n- model stg_orders (view): order_id INTEGER, customer_id INTEGER, order_date DATE, status VARCHAR, loaded_at TIMESTAMP\n- model stg_payments (view): payment_id INTEGER, order_id INTEGER, payment_method VARCHAR, amount DOUBLE, loaded_at TIMESTAMP\nDownstream nodes (affected if the failing node is wrong or skipped):\n- exposure finance_revenue_dashboard (dashboard, owner: Finance analytics): Daily revenue by payment method and order status. Refreshed at 07:00 UTC and used in the daily finance stand-up.\nColumn-level lineage (as designed):\n- fct_orders.{order_id, customer_id, order_date, status} ← stg_orders (same names)\n- fct_orders.{credit_card_amount, bank_transfer_amount, voucher_amount, gift_card_amount} ← stg_payments.amount by payment_method, per order_id\n- fct_orders.amount ← stg_payments.amount, total per order_id\n- stg_orders.{order_id, customer_id, status, loaded_at} ← raw_orders (same names)\n- stg_orders.order_date ← raw_orders.order_date (cast to date)\n- stg_payments.{payment_id, order_id, payment_method, loaded_at} ← raw_payments (same names)\n- stg_payments.amount ← raw_payments.amount (integer cents / 100)", false], ["Recent history", "Recent changes (newest first):\n- 2026-10-12 · commit 75ab2ba · refactor(fct_orders): simplify amount column (models/marts/fct_orders.sql)\n- 2026-10-05 · deploy · Warehouse database file moved to faster storage; no schema changes\n- 2026-10-04 · commit 1bc26ff · docs: add column descriptions to models/marts/schema.yml (no SQL change)\nPrevious incidents:\n- INC-0365 (2026-08-19): fct_orders.amount was null for orders awaiting payment. Resolution: added coalesce(..., 0) to the amount column in fct_orders (PR #41).\nRecent run history:\n- not_null_fct_orders_amount, last 7 daily runs: pass ×6, fail today (2026-10-13) with 46 rows.", false]], "reference": "Root cause: Yesterday's refactor commit changed `coalesce(order_payments.total_amount, 0) as amount` to ` s). · tests: not_null\nModel-level tests: equal_row_count(compare_model=stg_orders)\nSQL (models/marts/fct_orders.sql):\n```sql\nwith orders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\nfinal as (\n\n    select\n        orders.order_id,\n        orders.customer_id,\n        orders.order_date,\n        orders.status,\n        case when payments.payment_method = 'credit_card' then payments.amount else 0 end as credit_card_amount,\n        case when payments.payment_method = 'bank_transfer' then payments.amount else 0 end as bank_transfer_amount,\n        case when payments.payment_method = 'voucher' then payments.amount else 0 end as voucher_amount,\n        case when payments.payment_method = 'gift_card' then payments.amount else 0 end as gift_card_amount,\n        coalesce(payments.amount, 0) as amount\n    from orders\n    left join payments on orders.order_id = payments.order_id\n\n)\n\nselect * from final\n```\n\n### Model stg_orders\nFile: models/staging/stg_orders.sql · materialized as view\nDescription: Cleaned orders, one row per order. Expected volume is 500-1,000 orders over the 180-day window.\nColumns (name · type in warehouse · description · tests):\n- order_id · INTEGER · Primary key of the order. · tests: unique, not_null\n- customer_id · INTEGER · Customer who placed the order (foreign key to stg_customers). · tests: not_null\n- order_date · DATE · Date the order was placed. · tests: not_null\n- status · VARCHAR · Order lifecycle status. · tests: accepted_values(values=['placed', 'shipped', 'completed', 'cancelled'])\n- loaded_at · TIMESTAMP · UTC timestamp when the row was loaded into the warehouse.\nModel-level tests: row_count_between(min_rows=500, max_rows=1000)\nSQL (models/staging/stg_orders.sql):\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_orders') }}\n\n),\n\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        c y method. Grain must match stg_orders (one row per order).\nColumns (name · type in warehouse · description · tests):\n- order_id · INTEGER · Primary key of the order. · tests: unique, not_null\n- customer_id · INTEGER · Customer who placed the order (foreign key to dim_customers). · tests: not_null, relationships(to=dim_customers, field=customer_id)\n- order_date · DATE · Date the order was placed.\n- status · VARCHAR · Order lifecycle status.\n- credit_card_amount · DOUBLE · Amount paid by credit card.\n- bank_transfer_amount · DOUBLE · Amount paid by bank transfer.\n- voucher_amount · DOUBLE · Amount paid with vouchers.\n- gift_card_amount · DOUBLE · Amount paid with gift cards.\n- amount · DOUBLE · Total amount paid for the order (0 if no payments, e.g. cancelled orders). · tests: not_null\nModel-level tests: equal_row_count(compare_model=stg_orders)\nSQL (models/marts/fct_orders.sql):\n```sql\nwith orders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\norder_payments as (\n\n    select\n        order_id,\n        sum(case when payment_method = 'credit_card' then amount else 0 end) as credit_card_amount,\n        sum(case when payment_method = 'bank_transfer' then amount else 0 end) as bank_transfer_amount,\n        sum(case when payment_method = 'voucher' then amount else 0 end) as voucher_amount,\n        sum(case when payment_method = 'gift_card' then amount else 0 end) as gift_card_amount,\n        sum(amount) as total_amount\n    from payments\n    group by order_id\n\n),\n\nfinal as (\n\n    select\n        orders.order_id,\n        orders.customer_id,\n        orders.order_date,\n        orders.status,\n        coalesce(order_payments.credit_card_amount, 0) as credit_card_amount,\n        coalesce(order_payments.bank_transfer_amount, 0) as bank_transfer_amount,\n        coalesce(order_payments.voucher_amount, 0) as voucher_amount,\n        coalesce(order_payments.gift_card_amount, 0) as gift_card_amount,\n        coalesce(order_payments.total_amount, 0) as amount\n    from orders\n    left join order_payments on orders.order_id = order_payments.order_id\n\n)\n\nselect * from final\n```\n\n### Model dim_customers\nFile: models/marts/dim_customers.sql · materialized as table\nDescription: One row per customer with order history and lifetime value. Used by marketing and finance dashboards.\nColumns (name · type in warehouse · description · tests):\n- customer_id · INTEGER · Primary key of the customer. · tests: unique, not_null\n- first_name · VARCHAR · Customer first name.\n- last_name · VARCHAR · Customer last name.\n- email · VARCHAR · Lower-cased email address.\n- country_code · VARCHAR · ISO 3166-1 alpha-2 country code.\n- created_at · TIMESTAMP · UTC timestamp when the account was created.\n- first_order_date · DATE · Date of the customer's first order (null if no orders).\n- most_recent_order_date · DATE · Date of the customer's most recent order (null if no orders).\n- number_of_orders · BIGINT · Count of orders placed, including cancelled ones.\n- lifetime_value · DOUBLE · Sum of payments on non-cancelled orders, in currency units. · tests: not_null\nSQL (models/marts/dim_customers.sql):\n```sql\nwith customers as (\n\n    select * from {{ ref('stg_customers') }}\n\n),\n\norders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\ncustomer_orders as (\n\n    select\n        customer_id,\n        min(order_date) as first_order_date,\n        max(order_date) as most_recent_order_date,\n        count(order_id) as number_of_orders\n    from orders\n    group by customer_id\n\n),\n\ncustomer_payments as (\n\n    select\n        orders.customer_id,\n        sum(payments.amount) as lifetime_value\n    from payments\n    inner join orders on payments.order_id = orders.order_id\n    where orders.status != 'cancelled'\n    group by orders.customer_id\n\n),\n\nfinal  by method. Grain must match stg_orders (one row per order).\nColumns (name · type in warehouse · description · tests):\n- order_id · INTEGER · Primary key of the order. · tests: unique, not_null\n- customer_id · INTEGER · Customer who placed the order (foreign key to dim_customers). · tests: not_null, relationships(to=dim_customers, field=customer_id)\n- order_date · DATE · Date the order was placed.\n- status · VARCHAR · Order lifecycle status.\n- credit_card_amount · DOUBLE · Amount paid by credit card.\n- bank_transfer_amount · DOUBLE · Amount paid by bank transfer.\n- voucher_amount · DOUBLE · Amount paid with vouchers.\n- gift_card_amount · DOUBLE · Amount paid with gift cards.\n- amount · DOUBLE · Total amount paid for the order (0 if no payments, e.g. cancelled orders). · tests: not_null\nModel-level tests: equal_row_count(compare_model=stg_orders)\nSQL (models/marts/fct_orders.sql):\n```sql\nwith orders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\norder_payments as (\n\n    select\n        order_id,\n        sum(case when payment_method = 'credit_card' then amount else 0 end) as credit_card_amount,\n        sum(case when payment_method = 'bank_transfer' then amount else 0 end) as bank_transfer_amount,\n        sum(case when payment_method = 'voucher' then amount else 0 end) as voucher_amount,\n        sum(case when payment_method = 'gift_card' then amount else 0 end) as gift_card_amount,\n        sum(amount) as total_amount\n    from payments\n    group by order_id\n\n),\n\nfinal as (\n\n    select\n        orders.order_id,\n        orders.customer_id,\n        orders.order_date,\n        orders.status,\n        coalesce(order_payments.credit_card_amount, 0) as credit_card_amount,\n        coalesce(order_payments.bank_transfer_amount, 0) as bank_transfer_amount,\n        coalesce(order_payments.voucher_amount, 0) as voucher_amount,\n        coalesce(order_payments.gift_card_amount, 0) as gift_card_amount,\n        coalesce(order_payments.total_amount, 0) as amount\n    from orders\n    left join order_payments on orders.order_id = order_payments.order_id\n\n)\n\nselect * from final\n```\n\n### Model dim_customers\nFile: models/marts/dim_customers.sql · materialized as table\nDescription: One row per customer with order history and lifetime value. Used by marketing and finance dashboards.\nColumns (name · type in warehouse · description · tests):\n- customer_id · INTEGER · Primary key of the customer. · tests: unique, not_null\n- first_name · VARCHAR · Customer first name.\n- last_name · VARCHAR · Customer last name.\n- email · VARCHAR · Lower-cased email address.\n- country_code · VARCHAR · ISO 3166-1 alpha-2 country code.\n- created_at · TIMESTAMP · UTC timestamp when the account was created.\n- first_order_date · DATE · Date of the customer's first order (null if no orders).\n- most_recent_order_date · DATE · Date of the customer's most recent order (null if no orders).\n- number_of_orders · BIGINT · Count of orders placed, including cancelled ones.\n- lifetime_value · DOUBLE · Sum of payments on non-cancelled orders, in currency units. · tests: not_null\nSQL (models/marts/dim_customers.sql):\n```sql\nwith customers as (\n\n    select * from {{ ref('stg_customers') }}\n\n),\n\norders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\ncustomer_orders as (\n\n    select\n        customer_id,\n        min(order_date) as first_order_date,\n        max(order_date) as most_recent_order_date,\n        count(order_id) as number_of_orders\n    from orders\n    group by customer_id\n\n),\n\ncustomer_payments as (\n\n    select\n        orders.customer_id,\n        sum(payments.amount) as lifetime_value\n    from payments\n    inner join orders on payments.order_id = orders.order_id\n    where orders.status != 'cancelled'\n    group by orders.customer_id\n\n),\n\nfinal as (\n\n    select\n        customers.customer_id,\n        customers.first_name,\n        customers.last_name,\n        customers.email,\n        customers.country_code,\n        customers.created_at,\n        customer_orders.first_order_date,\n        customer_orders.most_recent_order_date,\n        coalesce(customer_orders.number_of_orders, 0) as number_of_orders,\n        coalesce(customer_payments.lifetime_value, 0) as lifetime_value\n    from customers\n    left join customer_orders on customers.customer_id = customer_orders.customer_id\n    left join customer_payments on customers.customer_id = customer_payments.customer_id\n    -- marketing dashboard only covers launch markets (MKT-12)\n    where customers.country_code in ('ZA', 'GB', 'US')\n\n)\n\nselect * from final\n```", false], ["Lineage", "DAG edges (upstream → downstream; tests omitted):\n- source raw.raw_customers → model stg_customers\n- source raw.raw_orders → model stg_orders\n- source raw.raw_payments → model stg_payments\n- model dim_customers → exposure finance_revenue_dashboard\n- model dim_customers → exposure marketing_customer_dashboard\n- model fct_orders → exposure finance_revenue_dashboard\n- model stg_customers → model dim_customers\n- model stg_orders → model dim_customers\n- model stg_orders → model fct_orders\n- model stg_payments → model dim_customers\n- model stg_payments → model fct_orders\nUpstream nodes and their current warehouse columns:\n- source raw.raw_customers (source table): customer_id INTEGER, first_name VARCHAR, last_name VARCHAR, email VARCHAR, country VARCHAR, created_at TIMESTAMP, loaded_at TIMESTAMP\n- source raw.raw_orders (source table): order_id INTEGER, customer_id INTEGER, order_date DATE, status VARCHAR, loaded_at TIMESTAMP\n- source raw.raw_payments (source table): payment_id INTEGER, order_id INTEGER, payment_method VARCHAR, amount INTEGER, loaded_at TIMESTAMP\n- model stg_customers (view): customer_id INTEGER, first_name VARCHAR, last_name VARCHAR, emai ger cents / 100)", false], ["Recent history", "Recent changes (newest first):\n- 2026-10-12 · commit 8abe4df · dim_customers: only include launch markets (ZA, GB, US) for the marketing dashboard, MKT-12 (models/marts/dim_customers.sql)\n- 2026-10-07 · deploy · CI image upgraded dbt-duckdb 1.10 → 1.11; full build passed afterwards\n- 2026-10-04 · commit dfff95a · docs: add column descriptions to models/marts/schema.yml (no SQL change)\nPrevious incidents:\n- INC-0344 (2026-07-25): marketing dashboard showed test accounts. Resolution: test accounts flagged in the CRM and filtered in the dashboard.\nRecent run history:\n- dim_customers row count, last 7 daily runs: 194, 194, 195, 195, 196, 198, 149 today (2026-10-13).", false]], "reference": "Root cause: Yesterday's MKT-12 commit added `where customers.country_code in ('ZA', 'GB', 'US')` to models/marts/dim_customers.sql. That removes 51 DE, NL and AU customers from the dimension, but fct_orders still has their 145 orders, so the relationships test on fct_orders.customer_id fails. The finance revenue dashboard also reads dim_customers and would lose those customers.\n\nFix: Remove the where filter from models/marts/dim_customers.sql so the dimension again holds every customer. Meet the marketing need without changing the grain: add a column `customers.country_code in ('ZA', 'GB', 'US') as is_launch_market` and filter on it in the marketing dashboard, or build a separate model for the marketing view.\n\nVerification: `dbt build --select dim_customers+` passes. dim_customers has 200 rows and the relationships test from fct_orders passes."}, "RI03": {"sections": [["Failure report", "Command: dbt build  (exit code 1)\nResult: 18 passed, 1 failed, 0 errors, 0 warnings, 13 skipped\n- FAIL: test relationships_stg_payments_order_id__order_id__ref_stg_orders_ [relationships(to=stg_orders, field=order_id)] on stg_payments.order_id\n  Message: Got 6 results, configured to fail if != 0\n  Compiled test SQL:\n    with child as (\n  Payment provider notice: settlement export v2 is live from 2026-10-12. Field names now follow the provider's API v2 naming.\n- 2026-10-07 · deploy · CI image upgraded dbt-duckdb 1.10 → 1.11; full build passed afterwards\n- 2026-10-04 · commit 544b92f · docs: add column descriptions to models/marts/schema.yml (no SQL change)\nPrevious incidents:\n- INC-0388 (2026-09-02): stg_payments build warnings after the provider added a `currency` column. Resolution: no change needed; staging ignores the new column.\nRecent run history:\n- stg_payments model status, last 7 daily runs: success ×6, error today (2026-10-13).", false]], "reference": "Root cause: raw.raw_payments no longer has an `amount` column: the provider's export v2 (live 2026-10-12) renamed it to `amount_cents` (still integer cents). stg_payments.sql still selects `amount`, so the view fails with a Binder Error and dim_customers, fct_orders and their tests are skipped.\n\nFix: In models/staging/stg_payments.sql change `cast(amount as decimal(18, 2)) / 100 as amount` to `cast(amount_cents as decimal(18, 2)) / 100 as amount`. Keep the output column name `amount` so dim_customers and fct_orders need no change. In models/staging/sources.yml rename the raw_payments column `amount` to `amount_cents` (payment amount in integer cents).\n\nVerification: Run `dbt build --select stg_payments+`: stg_payments, dim_customers, fct_orders and all their tests pass. Check the unit is unchanged: `select min(amount), max(amount) from stg_payments` should be roughly 5 to 250 (currency units), and the fct_orders revenue total should match the previous run.\n\nNotes: Prevention: enforce a model contract (or a column-presence check) on stg_payments' source columns and follow the provider's changelog."}, "SD02": {"sections": [["Failure report", "Command: dbt build  (exit code 1)\nResult: 18 passed, 0 failed, 1 errors, 0 warnings, 13 skipped\n- ERROR: test not_null_stg_orders_order_date [not_null] on stg_orders.order_date\n  Message: Runtime Error in test not_null_stg_orders_order_date (models/staging/schema.yml)\n  Conversion Error: invalid date field format: \"10/10/2026\", expected format is (YYYY-MM-DD) when casting from source column order_date\n  \n  LINE 18: from \"ecommerce\".\"main\".\"stg_orders\"\n                   ^\n  Compiled test SQL:\n    select order_date\n    from \"ecommerce\".\"main\".\"stg_orders\"\n    where order_date is null\n- SKIPPED because an upstream node failed: model dim_customers, model fct_orders, 9 tests\n\nCommand: dbt source freshness  (exit code 0)\n- PASS: source raw.raw_customers: max(loaded_at) = 2026-10-13 14:56 UTC, 4.1 h before the check (warn after 24 hours, error after 48 hours)\n- PASS: source raw.raw_orders: max(loaded_at) = 2026-10-13 18:05 UTC, 0.9 h before the check (warn after 6 hours, error after 12 hours)\n- PASS: source raw.raw_payments: max(loaded_at) = 2026-10-13 18:05 UTC, 0.9 h before the check (warn after 6 hours, error after 12 hours)", true], ["Model and source metadata", "### Model stg_orders\nFile: models/staging/stg_orders.sql · materialized as view\nDescription: Cleaned orders, one row per order. Expected volume is 500-1,000 orders over the 180-day window.\nColumns (name · type in warehouse · description · tests):\n- order_id · INTEGER · Primary key of the order. · tests: unique, not_null\n- customer_id · INTEGER · Customer who placed the order (foreign key to stg_customers). · tests: not_null\n- order_date · DATE · Date the order was placed. · tests: not_null\n- status · VARCHAR · Order lifecycle status. · tests: accepted_values(values=['placed', 'shipped', 'completed', 'cancelled'])\n- loaded_at · TIMESTAMP · UTC timestamp when the row was loaded into the warehouse.\nModel-level tests: row_count_between(min_rows=500, max_rows=1000)\nSQL (models/staging/stg_orders.sql):\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_orders') }}\n\n),\n\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        cast(order_date as date) as order_date,\n        status,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```", false], ["Lineage", "DAG edges (upstream → downstream; tests omitted):\n- source raw.raw_orders → model stg_orders\n- model dim_customers → exposure finance_revenue_dashboard\n- model dim_customers → exposure marketing_customer_dashboard\n- model fct_orders → exposure finance_revenue_dashboard\n- model stg_orders → model dim_customers\n- model stg_orders → model fct_orders\nUpstream nodes and their current warehouse columns:\n- source raw.raw_orders (source table): order_id INTEGER, customer_id INTEGER, order_date VARCHAR, status VARCHAR, loaded_at TIMESTAMP\nDownstream nodes (affected if the failing node is wrong or skipped):\n- model dim_customers (table): One row per customer with order history and lifetime value. Used by marketing and finance dashboards.\n- model fct_orders (table): One row per order with payment amounts pivoted by method. Grain must match stg_orders (one row per order).\n- exposure finance_revenue_dashboard (dashboard, owner: Finance analytics): Daily revenue by payment method and order status. Refreshed at 07:00 UTC and used in the daily finance stand-up.\n- exposure marketing_customer_dashboard (dashboard, owner: Marketing analytics): Customer counts, lifetime value and repeat-purchase rate by country.\nColumn-level lineage (as designed):\n- stg_orders.{order_id, customer_id, status, loaded_at} ← raw_orders (same names)\n- stg_orders.order_date ← raw_orders.order_date (cast to date)\n- dim_customers.{customer_id, first_name, last_name, email, country_code, created_at} ← stg_customers (same names)\n- dim_customers.{first_order_date, most_recent_order_date, number_of_orders} ← stg_orders.order_date / order_id, per customer_id\n- dim_customers.lifetime_value ← stg_payments.amount joined via stg_orders.order_id, non-cancelled orders, per customer_id\n- fct_orders.{order_id, customer_id, order_date, status} ← stg_orders (same names)\n- fct_orders.{credit_card_amount, bank_transfer_amount, voucher_amount, gift_card_amount} ← stg_payments.amount by payment_method, per order_id\n- fct_orders.amount ← stg_payments.amount, total per order_id", false], ["Recent history", "Recent changes (newest first):\n- 2026-10-10 · ticket · SHOP-219: web shop store locale switched from en-US to en-ZA (currency display and date formats).\n- 2026-10-05 · deploy · Warehouse database file moved to faster storage; no schema changes\n- 2026-10-01 · commit d3c24ce · stg_customers: lower-case email and upper-case country code (models/staging/stg_customers.sql)\nPrevious incidents:\n- INC-0351 (2026-08-04): order_date was null for 12 orders after a shop export timeout. Resolution: export re-run, no code change.\nRecent run history:\n- stg_orders tests, last 7 daily runs: all pass ×6; today (2026-10-13) the test that reads order_date errors.\n- New orders per day: 2–5 (normal) for the last 7 days.", false]], "reference": "Root cause: From 2026-10-10 the shop writes order_date as DD/MM/YYYY (e.g. '13/10/2026') instead of ISO 'YYYY-MM-DD' (e.g. '2026-04-17'), after the SHOP-219 locale change. Because the column now mixes formats, raw_orders.order_date loads as VARCHAR and `cast(order_date as date)` in stg_orders raises a Conversion Error on the 10 new rows. Tests that read order_date error, and the marts are skipped.\n\nFix: Root fix: ask the shop team to restore ISO 8601 dates in the export (or set the export date format explicitly). Make staging robust in models/staging/stg_orders.sql: `coalesce(try_strptime(cast(order_date as varchar), '%Y-%m-%d'), try_strptime(cast(order_date as varchar), '%d/%m/%Y'))::date as order_date`. Keep the not_null test on stg_orders.order_date so any value matching neither format still fails.\n\nVerification: `dbt build --select stg_orders+` passes. `select count(*) from stg_orders where order_date is null` returns 0 and `select max(order_date) from stg_orders` is today's date, which shows the new rows were parsed and not dropped.\n\nNotes: Do not read the new values as MM/DD: dates such as 05/10 are ambiguous, so the format must be stated explicitly."}, "SD03": {"sections": [["Failure report", "Command: dbt build  (exit code 1)\nResult: 25 passed, 0 failed, 1 errors, 0 warnings, 6 skipped\n- ERROR: model dim_customers (models/marts/dim_customers.sql)\n    Runtime Error in model dim_customers (models/marts/dim_customers.sql)\n      Conversion Error: Could not convert string 'CUST-00001' to INT32 when casting from source column customer_id\n      \n      LINE 66:     left join customer_orders on customers.customer_id = customer_orders.customer_id\n                                                ^\n- SKIPPED because an upstream node failed: 4 tests\n\nCommand: dbt source freshness  (exit code 0)\n- PASS: source raw.raw_customers: max(loaded_at) = 2026-10-13 14:56 UTC, 4.1 h before the check (warn after 24 hours, error after 48 hours)\n- PASS: source raw.raw_orders: max(loaded_at) = 2026-10-13 18:05 UTC, 0.9 h before the check (warn after 6 hours, error after 12 hours)\n- PASS: source raw.raw_payments: max(loaded_at) = 2026-10-13 18:05 UTC, 0.9 h before the check (warn after 6 hours, error after 12 hours)", true], ["Model and source metadata", "### Model dim_customers\nFile: models/marts/dim_customers.sql · materialized as table\nDescription: One row per customer with order history and lifetime value. Used by marketing and finance dashboards.\nColumns (name · type in warehouse · description · tests):\n- customer_id · INTEGER · Primary key of the customer. · tests: unique, not_null\n- first_name · VARCHAR · Customer first name.\n- last_name · VARCHAR · Customer last name.\n- email · VARCHAR · Lower-cased email address.\n- country_code · VARCHAR · ISO 3166-1 alpha-2 country code.\n- created_at · TIMESTAMP · UTC timestamp when the account was created.\n- first_order_date · DATE · Date of the customer's first order (null if no orders).\n- most_recent_order_date · DATE · Date of the customer's most recent order (null if no orders).\n- number_of_orders · BIGINT · Count of orders placed, including cancelled ones.\n- lifetime_value · DOUBLE · Sum of payments on non-cancelled orders, in currency units. · tests: not_null\nSQL (models/marts/dim_customers.sql):\n```sql\nwith customers as (\n\n    select * from {{ ref('stg_customers') }}\n\n),\n\norders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\ncustomer_orders as (\n\n    select\n        customer_id,\n        min(order_date) as first_order_date,\n        max(order_date) as most_recent_order_date,\n        count(order_id) as number_of_orders\n    from orders\n    group by customer_id\n\n),\n\ncustomer_payments as (\n\n    select\n        orders.customer_id,\n        sum(payments.amount) as lifetime_value\n    from payments\n    inner join orders on payments.order_id = orders.order_id\n    where orders.status != 'cancelled'\n    group by orders.customer_id\n\n),\n\nfinal as (\n\n    select\n        customers.customer_id,\n        customers.first_name,\n        customers.last_name,\n        customers.email,\n        customers.country_code,\n        customers.created_at,\n        customer_orders.first_order_date,\n        customer_orders.most_recent_order_date,\n        coalesce(customer_orders.number_of_orders, 0) as number_of_orders,\n        coalesce(customer_payments.lifetime_value, 0) as lifetime_value\n    from customers\n    left join customer_orders on customers.customer_id = customer_orders.customer_id\n    left join customer_payments on customers.customer_id = customer_payments.customer_id\n\n)\n\nselect * from final\n```", false], ["Lineage", "DAG edges (upstream → downstream; tests omitted):\n- source raw.raw_customers → model stg_customers\n- source raw.raw_orders → model stg_orders\n- source raw.raw_payments → model stg_payments\n- model dim_customers → exposure finance_revenue_dashboard\n- model dim_customers → exposure marketing_customer_dashboard\n- model stg_customers → model dim_customers\n- model stg_orders → model dim_customers\n- model stg_payments → model dim_customers\nUpstream nodes and their current warehouse columns:\n- source raw.raw_customers (source table): customer_id VARCHAR, first_name VARCHAR, last_name VARCHAR, email VARCHAR, country VARCHAR, created_at TIMESTAMP, loaded_at TIMESTAMP\n- source raw.raw_orders (source table): order_id INTEGER, customer_id INTEGER, order_date DATE, status VARCHAR, loaded_at TIMESTAMP\n- source raw.raw_payments (source table): payment_id INTEGER, order_id INTEGER, payment_method VARCHAR, amount INTEGER, loaded_at TIMESTAMP\n- model stg_customers (view): customer_id VARCHAR, first_name VARCHAR, last_name VARCHAR, email VARCHAR, country_code VARCHAR, created_at TIMESTAMP, loaded_at TIMESTAMP\n- model stg_orders (view): order_id INTEGER, customer_id INTEGER, order_date DATE, status VARCHAR, loaded_at TIMESTAMP\n- model stg_payments (view): payment_id INTEGER, order_id INTEGER, payment_method VARCHAR, amount DOUBLE, loaded_at TIMESTAMP\nDownstream nodes (affected if the failing node is wrong or skipped):\n- exposure finance_revenue_dashboard (dashboard, owner: Finance analytics): Daily revenue by payment method and order status. Refreshed at 07:00 UTC and used in the daily finance stand-up.\n- exposure marketing_customer_dashboard (dashboard, owner: Marketing analytics): Customer counts, lifetime value and repeat-purchase rate by country.\nColumn-level lineage (as designed):\n- dim_customers.{customer_id, first_name, last_name, email, country_code, created_at} ← stg_customers (same names)\n- dim_customers.{first_order_date, most_recent_order_date, number_of_orders} ← stg_orders.order_date / order_id, per customer_id\n- dim_customers.lifetime_value ← stg_payments.amount joined via stg_orders.order_id, non-cancelled orders, per customer_id\n- stg_customers.customer_id ← raw_customers.customer_id\n- stg_customers.{first_name, last_name, created_at, loaded_at} ← raw_customers (same names)\n- stg_customers.email ← raw_customers.email (lower-cased)\n- stg_customers.country_code ← raw_customers.country (upper-cased)\n- stg_orders.{order_id, customer_id, status, loaded_at} ← raw_orders (same names)\n- stg_orders.order_date ← raw_orders.order_date (cast to date)\n- stg_payments.{payment_id, order_id, payment_method, loaded_at} ← raw_payments (same names)\n- stg_payments.amount ← raw_payments.amount (integer cents / 100)", false], ["Recent history", "Recent changes (newest first):\n- 2026-10-12 · ticket · CRM-77: CRM migrated to a new tenant; customer export regenerated with the tenant's external reference keys.\n- 2026-10-04 · commit 6121d48 · docs: add column descriptions to models/marts/schema.yml (no SQL change)\n- 2026-10-02 · commit 384496e · add accepted_values test on stg_payments.payment_method (models/staging/schema.yml)\nPrevious incidents:\n- INC-0297 (2026-06-15): duplicate customers after a CRM re-sync. Resolution: duplicates removed at source and the CRM export re-run.\nRecent run history:\n- dim_customers model status, last 7 daily runs: success ×6, error today (2026-10-13). stg_customers and its tests passed today.", false]], "reference": "Root cause: raw_customers.customer_id changed from an integer to a prefixed string ('CUST-00042') when the CRM was migrated (CRM-77). stg_customers passes the column through unchanged, so its own unique/not_null tests still pass. The failure only appears in dim_customers, which joins stg_customers.customer_id (VARCHAR) to stg_orders.customer_id (INTEGER) and fails with a Conversion Error. fct_orders' relationships test is skipped.\n\nFix: Normalise the key in models/staging/stg_customers.sql: `cast(regexp_extract(cast(customer_id as varchar), '(\\d+)$', 1) as integer) as customer_id`, and keep the original as `cast(customer_id as varchar) as crm_customer_ref` for traceability. First confirm with the CRM owner that the numeric part matches the shop's customer_id (CUST-00042 = 42). Update the raw_customers.customer_id description in models/staging/sources.yml.\n\nVerification: `dbt build --select stg_customers+` passes, including the relationships test on fct_orders.customer_id. dim_customers has 200 rows and `select typeof(customer_id) from dim_customers limit 1` returns INTEGER.\n\nNotes: Prevention: a model contract with data types on stg_customers would make a key type change fail in staging, where the cause is."}}}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const PAGE = DATA.page, ITEMS = DATA.items, RUBRIC = DATA.rubric;
const COLUMNS = ["rater_id", "status", "item_id", "position", "is_repeat", "technical_accuracy",
                 "root_cause_correctness", "actionability", "notes", "scored_at"];
const DIMS = RUBRIC.dimensions;
const CHOICES = {technical_accuracy: ["0", "0.5", "1"], root_cause_correctness: ["0", "1"], actionability: ["1", "2", "3"]};
const $ = (id) => document.getElementById(id);

// ------------------------------------------------------------ storage (this browser only)
let rater = PAGE.rater_id || "";
let scores = {};        // position -> {technical_accuracy, root_cause_correctness, actionability, notes, scored_at}
let current = 0;
let dirtySinceExport = false;
const storeKey = () => `rpda8411:${PAGE.id}:${rater}`;
function save() {
  try { localStorage.setItem(storeKey(), JSON.stringify({scores, current, dirtySinceExport})); } catch (e) {}
}
function restore() {
  scores = {}; current = 0; dirtySinceExport = false;
  try {
    const raw = localStorage.getItem(storeKey());
    if (raw) { const s = JSON.parse(raw); scores = s.scores || {}; current = s.current || 0;
               dirtySinceExport = !!s.dirtySinceExport; }
  } catch (e) {}
  if (current >= ITEMS.length) current = 0;
}
const isComplete = (s) => s && DIMS.every((d) => s[d.key] !== undefined && s[d.key] !== "");

// ------------------------------------------------------------ text rendering (all input escaped)
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {   // s is already escaped
  return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function fenced(src, renderText) {   // split ``` code blocks from the text around them
  const out = []; const parts = String(src).split(/^\s*```[^\n]*$/m);
  parts.forEach((part, i) => {
    if (i % 2 === 1) out.push("<pre><code>" + esc(part.replace(/^\n/, "").replace(/\n$/, "")) + "</code></pre>");
    else if (part.trim()) out.push(renderText(part));
  });
  return out.join("");
}
function plain(src) {   // scenario text: keep line breaks and indentation
  return fenced(src, (t) => `<div class="plain">${inline(esc(t.replace(/^\n+|\n+$/g, "")))}</div>`);
}
function markdown(src) {   // model suggestions: headings, lists, paragraphs, code
  return fenced(src, (text) => {
    let html = "", list = null, para = [];
    const flush = () => { if (para.length) { html += "<p>" + inline(esc(para.join(" "))) + "</p>"; para = []; } };
    const close = () => { if (list) { html += `</${list}>`; list = null; } };
    for (const line of text.split("\n")) {
      const h = line.match(/^\s*(#{1,6})\s+(.*)$/);
      const ul = line.match(/^\s*[-*•]\s+(.*)$/);
      const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (h) { flush(); close(); const n = Math.min(5, h[1].length + 2); html += `<h${n}>${inline(esc(h[2]))}</h${n}>`; }
      else if (ul || ol) { flush(); const t = ul ? "ul" : "ol"; if (list !== t) { close(); html += `<${t}>`; list = t; }
                           html += "<li>" + inline(esc((ul || ol)[1])) + "</li>"; }
      else if (!line.trim()) { flush(); close(); }
      else { close(); para.push(line.trim()); }
    }
    flush(); close(); return html;
  });
}

// ------------------------------------------------------------ rendering
function renderFields() {
  $("fields").innerHTML = DIMS.map((d) => `
    <fieldset>
      <legend>${esc(d.name)} <span class="hint">(${esc(d.scale)})</span></legend>
      <p class="hint">${esc(d.question)}</p>
      <div class="choices">${CHOICES[d.key].map((v) =>
        `<label><input type="radio" name="${d.key}" value="${v}">${v}</label>`).join("")}</div>
    </fieldset>`).join("");
}
function renderProgress() {
  const done = ITEMS.filter((it) => isComplete(scores[it.position])).length;
  $("progress").textContent = `${done} of ${ITEMS.length} scored` + (dirtySinceExport ? " · not exported since last change" : "");
}
function renderGrid() {
  $("grid").innerHTML = ITEMS.map((it, i) => {
    const s = scores[it.position];
    const cls = [isComplete(s) ? "complete" : (s ? "partial" : ""), i === current ? "current" : ""].join(" ");
    return `<button type="button" class="${cls}" data-i="${i}" title="Item ${it.position}">${it.position}</button>`;
  }).join("");
}
let shownScenario = null;   // the scenario panel is kept (open sections, scroll) while its answers are scored
function render() {
  const it = ITEMS[current], sc = DATA.scenarios[it.scenario_id];
  $("scenarioTitle").textContent = `Scenario ${it.scenario_id}` +
    (it.group_size > 1 ? ` · answer ${it.group_pos} of ${it.group_size}` : "");
  const newScenario = shownScenario !== it.scenario_id;
  if (newScenario) {
    $("scenario").innerHTML = sc.sections.map(([title, text, open]) =>
      `<details${open ? " open" : ""}><summary>${esc(title)}</summary>${plain(text)}</details>`).join("") +
      `<details open><summary>Reference fix (researcher)</summary>${plain(sc.reference)}</details>`;
    shownScenario = it.scenario_id;
  }
  $("itemTitle").textContent = `Item ${it.position} of ${ITEMS.length} · Model ${it.label}`;
  $("itemCode").textContent = it.item_id;
  $("repeatNote").hidden = !it.is_repeat;
  $("suggestion").innerHTML = markdown(it.text);
  const s = scores[it.position] || {};
  for (const d of DIMS) for (const input of document.getElementsByName(d.key)) input.checked = s[d.key] === input.value;
  $("notes").value = s.notes || "";
  $("prevBtn").disabled = current === 0;
  $("nextBtn").textContent = current === ITEMS.length - 1 ? "Save" : "Save and next";
  $("msg").textContent = "";
  renderProgress(); renderGrid();
  document.querySelectorAll("section.col").forEach((el, i) => { if (i === 1 || newScenario) el.scrollTop = 0; });
}
function go(i) { current = Math.max(0, Math.min(ITEMS.length - 1, i)); save(); render(); window.scrollTo(0, 0); }

// ------------------------------------------------------------ editing (saved on every change)
function update() {
  if (!rater) { $("msg").textContent = "Choose who is scoring (top of the page) first."; return; }
  const it = ITEMS[current], s = Object.assign({}, scores[it.position] || {});
  for (const d of DIMS) { const c = document.querySelector(`input[name="${d.key}"]:checked`); if (c) s[d.key] = c.value; }
  s.notes = $("notes").value;
  if (isComplete(s)) s.scored_at = new Date().toISOString().slice(0, 19) + "Z";
  scores[it.position] = s; dirtySinceExport = true; save(); renderProgress(); renderGrid();
}
$("form").addEventListener("change", update);
$("notes").addEventListener("input", update);
$("prevBtn").onclick = () => go(current - 1);
$("nextBtn").onclick = () => {
  if (!isComplete(scores[ITEMS[current].position])) { $("msg").textContent = "Please score all three dimensions first."; return; }
  if (current < ITEMS.length - 1) go(current + 1); else { $("msg").textContent = "Saved. Remember to export the CSV."; }
};
$("unscoredBtn").onclick = () => {
  for (let k = 1; k <= ITEMS.length; k++) { const i = (current + k) % ITEMS.length;
    if (!isComplete(scores[ITEMS[i].position])) return go(i); }
  $("msg").textContent = "Every item is scored. Export the CSV and send it to the researcher.";
};
$("grid").onclick = (e) => { const b = e.target.closest("button[data-i]"); if (b) go(+b.dataset.i); };
$("gridBtn").onclick = () => { $("gridWrap").hidden = !$("gridWrap").hidden; };

// ------------------------------------------------------------ CSV export / import
function csvCell(v) { v = String(v ?? ""); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCsv() {
  if (!rater) { alert("Choose who is scoring first."); return; }
  const rows = ITEMS.filter((it) => isComplete(scores[it.position])).map((it) => {
    const s = scores[it.position];
    return {rater_id: rater, status: PAGE.status, item_id: it.item_id, position: it.position,
            is_repeat: it.is_repeat ? 1 : 0, technical_accuracy: s.technical_accuracy,
            root_cause_correctness: s.root_cause_correctness, actionability: s.actionability,
            notes: (s.notes || "").trim(), scored_at: s.scored_at || ""};
  });
  const text = [COLUMNS.join(","), ...rows.map((r) => COLUMNS.map((c) => csvCell(r[c])).join(","))].join("\n") + "\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: "text/csv"}));
  a.download = `${PAGE.file_prefix}${rater}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  dirtySinceExport = false; save(); renderProgress();
}
function parseCsv(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const head = rows.shift() || [];
  return rows.filter((r) => r.length > 1).map((r) => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""])));
}
$("exportBtn").onclick = exportCsv;
$("loadFile").onchange = async (e) => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  const rows = parseCsv(await file.text());
  const byPos = Object.fromEntries(ITEMS.map((it) => [String(it.position), it]));
  const ok = rows.filter((r) => byPos[r.position] && byPos[r.position].item_id === r.item_id);
  if (!ok.length) { alert("This CSV does not match this scoring page."); return; }
  if (PAGE.rater_id && ok.some((r) => r.rater_id !== PAGE.rater_id)) { alert("This CSV belongs to a different rater."); return; }
  if (!confirm(`Load ${ok.length} scores from ${file.name}? Scores for those items in this browser are replaced.`)) return;
  if (!PAGE.rater_id && ok[0].rater_id) { rater = ok[0].rater_id; $("raterSelect").value = rater; restore(); }
  for (const r of ok) scores[r.position] = {technical_accuracy: r.technical_accuracy,
    root_cause_correctness: r.root_cause_correctness, actionability: r.actionability, notes: r.notes, scored_at: r.scored_at};
  save(); render();
};

// ------------------------------------------------------------ rubric
$("rubricBody").innerHTML = `<h2 style="margin-top:0">Rubric</h2>` +
  RUBRIC.general.map((t) => `<p>${esc(t)}</p>`).join("") +
  DIMS.map((d) => `<h3>${esc(d.name)} (${esc(d.scale)})</h3><p>${esc(d.question)}</p>`).join("") +
  `<h3>Actionability anchors</h3><p>${esc(RUBRIC.anchor_failure)}</p>` +
  RUBRIC.anchors.map((a) => `<p><strong>${esc(a.score)}</strong> — ${esc(a.example)}<br><span class="hint">${esc(a.why)}</span></p>`).join("") +
  `<h3>Rules</h3><ul>${RUBRIC.rules.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>`;
$("rubricBtn").onclick = () => $("rubric").showModal();
$("rubricClose").onclick = () => $("rubric").close();

// ------------------------------------------------------------ start
document.title = PAGE.title;
$("title").textContent = PAGE.title;
$("banner").innerHTML = PAGE.banner;
if (PAGE.banner_class) $("banner").classList.add(PAGE.banner_class);
if (!PAGE.rater_id) {
  $("raterPick").hidden = false;
  $("raterSelect").innerHTML = `<option value="">choose…</option>` +
    PAGE.raters.map(([id, label]) => `<option value="${esc(id)}">${esc(label)}</option>`).join("");
  $("raterSelect").onchange = (e) => { rater = e.target.value; restore(); render(); };
}
renderFields(); restore(); render();
</script>
</body>
