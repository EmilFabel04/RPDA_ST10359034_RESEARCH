m(coalesce(amount, 0)) as total_amount\n```\n\nand similarly inside the payment-method sums if needed:\n\n```sql\nsum(case when payment_method = 'credit_card' then coalesce(amount, 0) else 0 end) as credit_card_amount\n```\n\nIf payment amount nulls are possible, add or keep a `not_null` test on `stg_payments.amount` in the staging model YAML.\n\n### Verification\nRebuild the model and run its tests:\n\n```bash\ndbt build --select fct_orders\n```\n\nExpected result: the `not_null` test on `fct_orders.amount` passes, along with `unique`, `not_null`, `relationships`, and `equal_row_count` tests for `fct_orders`.\n\nYou can also confirm directly with SQL:\n\n```sql\nselect count(*) as null_amount_orders\nfrom \"ecommerce\".\"main\".\"fct_orders\"\nwhere amount is null;\n```\n\nExpected result:\n\n```text\nnull_amount_orders = 0\n```\n\nTo confirm the affected rows are now zero-valued no-payment orders:\n\n```sql\nselect count(*) as zero_amount_orders\nfrom \"ecommerce\".\"main\".\"fct_orders\"\nwhere amount = 0;\n```\n\nExpected result: at least 46, assuming those failed rows were orders without payments.\n\nThen run the normal pipeline check:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: `dbt build` exits `0`; source freshness continues to pass.\n\n### Assumptions\nThe 46 null `amount` rows are orders with no matching records in `stg_payments`, such as cancelled or unpaid orders.\n\nThe business rule in the `fct_orders.amount` column description is correct: orders without payments should have `amount = 0`.\n\n`stg_orders` has one row per order and `stg_payments.order_id` refers to orders, as implied by the model grain and existing tests.\n\nNo upstream ingestion failure occurred, because source freshness passed for `raw_orders` and `raw_payments`."}, {"position": 51, "item_id": "NR02-07C", "is_repeat": 0, "scenario_id": "NR02", "label": "C", "group_pos": 3, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the presence of null values in the `amount` column of the `fct_orders` model. The test `not_null_fct_orders_amount` is configured to fail if there are any null values in this column, and the test reported 46 results, indicating that the issue is not isolated to a single row.\n\n### Fix\n\nTo resolve this issue, we need to identify the root cause of the null values in the `amount` column. One possible solution is to update the `fct_orders` model to handle missing values or to investigate the data source and ensure that the data is being correctly ingested. If the issue is due to incorrect data, we may need to consult with the data source team to resolve the issue.\n\nAssuming the issue is due to incorrect data, we can update the `fct_orders` model to use a default value for the `amount` column. In the `models/fct_orders.sql` file, we can add a `default` statement to the `amount` column:\n```sql\n{{ define \"fct_orders\" }}\n  {{ incremental() }}\n  select\n    {{ dbt_utilsColumnType('amount', 'float64') }}\n  from\n    \"ecommerce\".\"main\".\"raw_orders\"\n  where\n    {{ dbt_utilsIfNull('amount', 0) }}\n{{ end define }}\n```\nThis will set any null values in the `amount` column to 0.\n\n### Verification\n\nTo verify the fix, we can re-run the `dbt test` command and check that the test `not_null_fct_orders_amount` passes. We can also run a query to verify that the `amount` column no longer contains null values:\n```sql\nselect count(*)\nfrom \"ecommerce\".\"main\".\"fct_orders\"\nwhere amount is null;\n```\nThis query should return 0.\n\n### Assumptions\n\n* The issue is due to incorrect data and not due to a problem with the `fct_orders` model or the data ingestion process.\n* The `raw_orders` table is the correct source for the `fct_orders` model.\n* The `amount` column in the `raw_orders` table is the correct column to update."}, {"position": 52, "item_id": "NR02-08C", "is_repeat": 0, "scenario_id": "NR02", "label": "C", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the `not_null` test on the `amount` column in the `fct_orders` model. The test is configured to fail if there are more than 0 null values. The fact that 46 rows have null values in the `amount` column means that the test failed.\n\nThe issue is likely related to the way the `amount` column is calculated in the `fct_orders` model. The SQL logic is based on aggregating payments by payment method, but it seems that there are orders with no payments (e.g., cancelled orders) that are still included in the calculation.\n\n### Fix\n\nTo fix the issue, we need to ensure that the `amount` column only includes payments for orders that have actually been paid. One way to do this is by adding a condition to the `order_payments` CTE to only include payments where the `amount` is greater than 0. We can modify the SQL as follows:\n\n```sql\norder_payments as (\n\n    select\n        order_id,\n        sum(case when payment_method = 'credit_card' and amount > 0 then amount else 0 end) as credit_card_amount,\n        sum(case when payment_method = 'bank_transfer' and amount > 0 then amount else 0 end) as bank_transfer_amount,\n        sum(case when payment_method = 'voucher' and amount > 0 then amount else 0 end) as voucher_amount,\n        sum(case when payment_method = 'gift_card' and amount > 0 then amount else 0 end) as gift_card_amount,\n        sum(case when amount > 0 then amount else 0 end) as total_amount\n    from payments\n    group by order_id\n\n),\n```\n\n### Verification\n\nTo verify the fix, we can re-run the `dbt build` command and check that the `not_null` test on the `amount` column now passes. We can also verify that the `amount` column only includes payments for orders that have actually been paid by checking the data in the `fct_orders` table.\n\n### Assumptions\n\nI assumed that the `amount` column in the `fct_orders` model represents the total amount paid for each order. I also assumed that the `amount` column should only include payments for orders that have actually been paid, and not include orders with no payments (e.g., cancelled orders)."}, {"position": 53, "item_id": "NR02-07B", "is_repeat": 0, "scenario_id": "NR02", "label": "B", "group_pos": 5, "group_size": 6, "text": "### Root cause\nThe pipeline itself is current: all three sources passed freshness, including `raw.raw_orders` and `raw.raw_payments`, which were loaded about 1 hour before the check. The failure is a data quality failure in the mart: `fct_orders.amount` contains 46 `NULL` values, violating the `not_null` test `not_null_fct_orders_amount`.\n\nMost likely, `fct_orders.amount` is derived from payment data and some orders now have no matching payment amount, or the transformation allows `NULL` amounts through. This is not a freshness issue.\n\n### Fix\nFix the transformation that builds `fct_orders.amount`, likely in the `fct_orders` model file, for example `models/marts/fct_orders.sql`.\n\nIf `amount` should represent paid amount and unpaid/no-payment orders should be `0`, coalesce the payment amount:\n\n```sql\n-- models/marts/fct_orders.sql\n\nselect\n    o.order_id,\n    o.customer_id,\n    o.order_date,\n\n    coalesce(p.amount, 0) as amount\n\nfrom {{ ref('stg_orders') }} as o\nleft join {{ ref('stg_payments') }} as p\n    on o.order_id = p.order_id\n```\n\nIf an order must always have a payment row before entering `fct_orders`, change the model to exclude or separate unpaid orders instead of allowing `NULL`:\n\n```sql\n-- models/marts/fct_orders.sql\n\nselect\n    o.order_id,\n    o.customer_id,\n    o.order_date,\n    p.amount as amount\n\nfrom {{ ref('stg_orders') }} as o\ninner join {{ ref('stg_payments') }} as p\n    on o.order_id = p.order_id\nwhere p.amount is not null\n```\n\nIf the `NULL`s come from ingestion, fix the upstream ingestion job that writes to `raw.raw_payments.amount` or `raw.raw_orders`, depending on where the amount originates. The source system/load process should ensure the amount field is populated for records that are expected to appear in `fct_orders`.\n\nDo not disable the `not_null` test unless the business definition of `fct_orders.amount` allows `NULL`. If `NULL` is valid, then update the schema YAML test definition, for example in `models/marts/schema.yml`, to remove the test from `fct_orders.amount`.\n\n### Verification\nFirst identify the affected rows:\n\n```sql\nselect *\nfrom \"ecommerce\".\"main\".\"fct_orders\"\nwhere amount is null;\n```\n\nAfter applying the fix, run:\n\n```bash\ndbt build --select fct_orders\n```\n\nExpected result: `fct_orders` builds successfully and `test not_null_fct_orders_amount` passes with 0 failing rows.\n\nOptionally rerun the full job:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: all dbt models and tests pass, and all three sources remain fresh.\n\nYou can also verify directly:\n\n```sql\nselect count(*) as null_amount_count\nfrom \"ecommerce\".\"main\".\"fct_orders\"\nwhere amount is null;\n```\n\nExpected result:\n\n```text\nnull_amount_count = 0\n```\n\n### Assumptions\n`fct_orders.amount` is produced by a dbt model named `fct_orders`, likely located under `models/marts/`.\n\n`fct_orders.amount` is expected to be non-null because the existing dbt test enforces `not_null`.\n\nThe amount is derived from `stg_payments` or another staging model built from `raw.raw_payments`; the failure report does not show the actual model SQL.\n\nThe correct business behavior is either to use `0` for orders without payments, exclude unpaid orders from `fct_orders`, or fix missing upstream payment amounts; this must be confirmed with the business/data owner."}, {"position": 54, "item_id": "NR02-02A", "is_repeat": 0, "scenario_id": "NR02", "label": "A", "group_pos": 6, "group_size": 6, "text": "### Root cause\nIn `fct_orders`, `amount` is defined as `order_payments.total_amount` with no `coalesce`. `total_amount` is NULL for any order with no matching rows in `stg_payments`, because the left join from `orders` yields NULL. The four per-method columns are already wrapped in `coalesce(..., 0)`, so only `amount` was missed. The column description says `amount` should be 0 for orders without payments (e.g. cancelled orders), so the model violates its own contract. The 46 failing rows are most likely orders with no payment records. Source freshness passes and the row-count and uniqueness tests passed, so this is a model logic bug, not an ingestion delay or a grain problem.\n\n### Fix\nEdit `models/marts/fct_orders.sql`, in the `final` CTE, and coalesce the total:\n\n```sql\n        coalesce(order_payments.total_amount, 0) as amount\n```\n\nreplacing:\n\n```sql\n        order_payments.total_amount as amount\n```\n\nKeep the `not_null` test on `amount`. It is correct and caught a real contract violation. Do not relax or remove it.\n\nNo change is needed outside the dbt project for this failure. If the 46 orders turn out not to be cancelled or otherwise legitimately unpaid (see Verification), that points to a payment-ingestion gap, which should be raised with the owner of the payment provider load into `raw.raw_payments`. It would not be fixed in dbt.\n\n### Verification\n1. Before rebuilding, confirm the diagnosis by checking that the null-amount orders have no payments (run against the current table, or equivalently against the staging models):\n\n```sql\nselect o.status, count(*) as n\nfrom \"ecommerce\".\"main\".\"stg_orders\" o\nleft join \"ecommerce\".\"main\".\"stg_payments\" p using (order_id)\nwhere p.order_id is null\ngroup by o.status;\n```\n\n   Expected: 46 rows in total. Mostly or entirely statuses like cancelled or other non-paid states.\n\n2. Rebuild and test the model and everything downstream:\n\n```\ndbt build --select fct_orders+\n```\n\n   Expected: `not_null_fct_orders_amount` passes (0 failing rows), and `unique`, `relationships` and `equal_row_count` still pass.\n\n3. Spot-check the result:\n\n```sql\nselect count(*) from \"ecommerce\".\"main\".\"fct_orders\" where amount is null;      -- expect 0\nselect count(*) from \"ecommerce\".\"main\".\"fct_orders\" where amount = 0;          -- expect >= 46\n```\n\n### Assumptions\n- The 46 null rows come from orders with no rows in `stg_payments`. I inferred this from the SQL and the other tests passing, not from inspecting the data. Step 1 of the verification checks it.\n- `stg_payments.amount` itself contains no NULLs. If it did, `sum(amount)` could also return NULL for an order that does have payment rows, and the staging model would need a separate fix.\n- Unpaid orders are legitimately possible (such as cancelled ones), so 0 is the correct business value, as the column description states.\n- The `fct_orders` table's `amount` column has no downstream consumers that depend on NULL meaning \"no payment\". If any exist, they should be reviewed.\n- This is a new failure, caused by data containing unpaid orders now or a recent change to the model, rather than a long-standing issue. The history of previous runs was not provided."}, {"position": 55, "item_id": "RC01-07A", "is_repeat": 0, "scenario_id": "RC01", "label": "A", "group_pos": 1, "group_size": 6, "text": "### Root cause\nThe orders connector upgrade to loader v2.4 (new default write settings) was deployed today. The row count in `raw.raw_orders` went from about 597 to exactly 1200, and 600 `order_id`s are duplicated, so every order from the previous baseline appears to have been loaded twice, most likely a re-load or append instead of upsert/replace. `stg_orders` is a plain pass-through view with no deduplication, so the duplicates flow straight in. Both tests are symptoms of the same problem. The `unique` test caught the duplicates and the `row_count_between` test caught the doubled volume. `dbt build` then correctly skipped `dim_customers` and `fct_orders`, which protected the dashboards from double-counted orders and revenue (fan-out in the payments join). Source freshness passed because the duplicate rows have fresh `loaded_at` values. It does not detect duplicates.\n\n### Fix\n1. **Outside dbt (the real fix):** in the orders connector, revert or reconfigure the loader v2.4 write settings so loading is idempotent: merge/upsert keyed on `order_id`, or full replace, instead of append. Then remove the duplicate rows from `raw.raw_orders` (as in INC-0333). Keep the first-loaded row:\n\n```sql\n-- run against the raw schema, after taking a backup/snapshot of the table\ncreate table raw.raw_orders_dedup as\nselect * exclude (rn)\nfrom (\n    select *, row_number() over (partition by order_id order by loaded_at asc) as rn\n    from raw.raw_orders\n)\nwhere rn = 1;\n-- then swap tables (or delete the rn > 1 rows in place)\n```\n\n2. **In dbt, do not loosen the tests.** Both are correctly flagging bad data. Optionally add defense in depth to `models/staging/stg_orders.sql` so a future loader retry cannot fan out downstream:\n\n```sql\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        cast(order_date as date) as order_date,\n        status,\n        loaded_at\n    from source\n    qualify row_number() over (partition by order_id order by loaded_at desc) = 1\n\n)\n```\n\nThis should be a stopgap, because it can mask upstream problems (the `unique` test would stop firing). If you add it, keep a test on the raw source (e.g. a warn-severity uniqueness check on `raw_orders.order_id`) so the issue stays visible.\n\n3. Re-run the pipeline so `dim_customers` and `fct_orders` are rebuilt before the 07:00 UTC finance refresh.\n\n### Verification\n```sql\nselect count(*) as n_rows, count(distinct order_id) as n_ids\nfrom raw.raw_orders;   -- expect n_rows = n_ids, roughly 600\n```\nThen:\n```\ndbt build\n```\nExpected: all tests pass (`unique_stg_orders_order_id`, `row_count_between_stg_orders_1000__500`), and `dim_customers` and `fct_orders` run and pass instead of being skipped. Also check that `fct_orders` has one row per `order_id` and that the next hourly load keeps `raw_orders` free of duplicates (confirms the connector fix).\n\n### Assumptions\n- The 600 duplicate `order_id`s are exact or near-exact re-loads (the same orders loaded twice), not genuinely different orders sharing an ID. I did not see the raw rows, so check this before deleting. Compare `loaded_at` and the other columns of duplicate pairs.\n- The loader v2.4 write-settings change (append vs. upsert) is the cause. It matches the timing, but the connector config was not provided.\n- Raw tables can be modified by the on-call engineer, and a backup is possible, as in INC-0333.\n- The dashboards have not yet refreshed with bad data (skipped models mean the old tables are still in place), so only stale-but-correct data was exposed.\n- The 500-1,000 row range remains valid, given the daily growth of about 3 to 4 orders."}, {"position": 56, "item_id": "RC01-04C", "is_repeat": 0, "scenario_id": "RC01", "label": "C", "group_pos": 2, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the test `row_count_between(min_rows=500, max_rows=1000)` on the `stg_orders` model, which failed because the actual row count is only 1. This suggests that there might be an issue with the ingestion job or the data quality, causing the model to not materialize correctly.\n\n### Fix\n\nThe fix is to investigate and resolve the issue causing the low row count in the `stg_orders` model. This could be due to an error in the ingestion job, a data quality issue, or a problem with the `raw_orders` source. \n\nAssuming that the issue is with the ingestion job, the fix would be to check the logs and configuration of the job to ensure it is running correctly and processing the expected volume of data. \n\nIf the issue is with the data quality, the fix would be to investigate and resolve the root cause of the data quality issue. This could involve adding data validation or cleaning logic to the ingestion job or the `stg_orders` model.\n\nThe relevant code change would be to update the ingestion job or the `stg_orders` model to correct the issue, depending on the root cause.\n\n### Verification\n\nTo confirm the fix worked, you would need to re-run the `dbt build` command and verify that the `row_count_between` test passes. You can also run the SQL query used in the test to verify the actual row count is within the expected range.\n\nAdditionally, you can run the `dbt source freshness` command to verify that the source freshness tests are passing, indicating that the ingestion job is running correctly and processing the expected volume of data.\n\n### Assumptions\n\n* The issue is with the ingestion job or the `stg_orders` model, and not with the `raw_orders` source or the `unique_stg_orders_order_id` test.\n* The `row_count_between` test is the only failing test, and not one of the skipped tests."}, {"position": 57, "item_id": "RC01-07C", "is_repeat": 0, "scenario_id": "RC01", "label": "C", "group_pos": 3, "group_size": 6, "text": "### Root cause\n`stg_orders` failed because it now has 1,200 rows instead of the expected 500–1,000, and 600 `order_id` values are duplicated. The timing strongly points to the 2026-10-13 orders ingestion connector upgrade to loader v2.4 with new default write settings.\n\nMost likely, `raw.raw_orders` received duplicate rows during ingestion, probably by appending a second copy of the current 180-day order window instead of replacing/upserting it. `stg_orders` is a view that selects directly from `raw.raw_orders` without deduplication, so the raw duplicates propagated into `stg_orders`, causing the row-count and uniqueness tests to fail and skipping `dim_customers`, `fct_orders`, and downstream tests.\n\n### Fix\nFix the ingestion behavior outside dbt first.\n\nIn the orders ingestion job for source table `raw.raw_orders`, change loader v2.4 write settings back to the intended behavior: upsert/merge or replace for the 180-day window keyed by `order_id`, instead of append-only. Also clean up the duplicated rows already loaded into `raw.raw_orders`.\n\nIf cleanup can be done by keeping the latest record per `order_id`, run a raw-table repair similar to:\n\n```sql\ncreate or replace table raw.raw_orders as\nselect\n    order_id,\n    customer_id,\n    order_date,\n    status,\n    loaded_at\nfrom (\n    select\n        *,\n        row_number() over (\n            partition by order_id\n            order by loaded_at desc\n        ) as rn\n    from raw.raw_orders\n)\nwhere rn = 1;\n```\n\nBecause `stg_orders` is documented as “one row per order,” also make it resilient to duplicate raw loads by deduplicating in `models/staging/stg_orders.sql`:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_orders') }}\n\n),\n\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        cast(order_date as date) as order_date,\n        status,\n        loaded_at\n    from source\n\n),\n\ndeduplicated as (\n\n    select\n        order_id,\n        customer_id,\n        order_date,\n        status,\n        loaded_at\n    from renamed\n    qualify row_number() over (\n        partition by order_id\n        order by loaded_at desc\n    ) = 1\n\n)\n\nselect * from deduplicated\n```\n\nNo YAML test change is recommended: the existing `unique`, `not_null`, accepted-values, and row-count tests correctly detected the issue.\n\n### Verification\nAfter fixing ingestion settings and repairing `raw.raw_orders`, check the raw duplicate count:\n\n```sql\nselect\n    count(*) as total_rows,\n    count(distinct order_id) as distinct_orders,\n    count(*) - count(distinct order_id) as duplicate_rows\nfrom raw.raw_orders;\n```\n\nExpected: `duplicate_rows = 0`, and total rows return to the normal range, around 600 for the current 180-day window.\n\nThen rebuild the affected lineage:\n\n```bash\ndbt build --select source:raw.raw_orders+ --source-freshness\n```\n\nExpected result:\n- `stg_orders` row count test passes with a count between 500 and 1,000.\n- `unique_stg_orders_order_id` passes with 0 duplicate `order_id`s.\n- `dim_customers`, `fct_orders`, and their downstream tests are no longer skipped.\n- Source freshness for `raw.raw_orders`, `raw.raw_payments`, and `raw.raw_customers` still passes.\n\nOptionally confirm `stg_orders` directly:\n\n```sql\nselect\n    count(*) as total_rows,\n    count(distinct order_id) as distinct_orders\nfrom main.stg_orders;\n```\n\nExpected: `total_rows = distinct_orders`, with `total_rows` between 500 and 1,000.\n\n### Assumptions\nThe 1,200 rows are caused by duplicate raw order loads after the loader v2.4 upgrade, not by a real doubling of order volume.\n\nFor duplicate `order_id`s, the row with the greatest `loaded_at` is the correct row to keep.\n\n`raw.raw_orders` represents only the intended 180-day window, matching the documented expected volume for `stg_orders`.\n\nDuckDB supports the `qualify` syntax in the project’s deployed version."}, {"position": 58, "item_id": "RC01-03C", "is_repeat": 0, "scenario_id": "RC01", "label": "C", "group_pos": 4, "group_size": 6, "text": "### Root cause\n`stg_orders` contains duplicate `order_id` values: the dbt `unique` test found 600 duplicated `order_id`s. Because `stg_orders` is the upstream model for `dim_customers` and `fct_orders`, those models and their downstream tests were skipped.\n\nThe `row_count_between` test also failed because `stg_orders` has more than 1000 rows. Given source freshness passed for `raw.raw_orders`, this is not a stale ingestion problem. The most likely cause is that `raw.raw_orders` now contains multiple rows per `order_id`, such as repeated hourly loads, order updates, or duplicated ingestion records, and `stg_orders` is passing them through without deduplicating.\n\n### Fix\nUpdate the staging model for orders to return one row per `order_id`.\n\nIn `models/staging/stg_orders.sql`, deduplicate `raw.raw_orders` using the latest available ingestion/update timestamp. Based on the freshness report, `loaded_at` exists on `raw.raw_orders`, so use it to keep the most recently loaded record per order.\n\n```sql\nwith source as (\n\n    select *\n    from {{ source('raw', 'raw_orders') }}\n\n),\n\ndeduplicated as (\n\n    select *\n    from source\n    qualify row_number() over (\n        partition by order_id\n        order by loaded_at desc\n    ) = 1\n\n),\n\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        order_date,\n        status,\n        loaded_at\n        -- include the existing stg_orders columns here\n    from deduplicated\n\n)\n\nselect *\nfrom renamed\n```\n\nIf the raw table has a better business timestamp such as `updated_at`, prefer that as the primary ordering key:\n\n```sql\nqualify row_number() over (\n    partition by order_id\n    order by updated_at desc, loaded_at desc\n) = 1\n```\n\nAlso review the ingestion job that writes to `raw.raw_orders`. If the intended contract is one row per `order_id`, fix the ingestion/upsert logic outside dbt so hourly loads do not append duplicate full snapshots into `raw.raw_orders`.\n\nIf duplicates are expected because `raw.raw_orders` is an event/history table, keep the dbt deduplication in `stg_orders`, and optionally rename or document the raw source contract accordingly.\n\nThe row count test may not need changing. After deduplication, `stg_orders` should fall back to the expected 500–1000 row range. If legitimate business growth means there are now more than 1000 unique orders, update the test threshold in the YAML file defining `stg_orders`, for example `models/staging/schema.yml`:\n\n```yaml\nmodels:\n  - name: stg_orders\n    tests:\n      - row_count_between:\n          min_rows: 500\n          max_rows: 1500\n    columns:\n      - name: order_id\n        tests:\n          - not_null\n          - unique\n```\n\n### Verification\nFirst inspect the duplicate pattern:\n\n```sql\nselect\n    order_id,\n    count(*) as n_records,\n    min(loaded_at) as first_loaded_at,\n    max(loaded_at) as last_loaded_at\nfrom raw.raw_orders\ngroup by order_id\nhaving count(*) > 1\norder by n_records desc, order_id\nlimit 50;\n```\n\nThen rebuild and test the affected part of the DAG:\n\n```bash\ndbt build --select stg_orders+\n```\n\nExpected result: `stg_orders`, `dim_customers`, `fct_orders`, and their downstream tests pass; no nodes are skipped because of `stg_orders`.\n\nConfirm the specific failures are resolved:\n\n```bash\ndbt test --select test_name:unique_stg_orders_order_id test_name:row_count_between_stg_orders_1000__500\n```\n\nExpected result: both tests pass.\n\nOptionally check the final row count:\n\n```sql\nselect count(*) as n_rows, count(distinct order_id) as distinct_orders\nfrom main.stg_orders;\n```\n\nExpected result: `n_rows = distinct_orders`, and `n_rows` is within the configured `row_count_between` range.\n\n### Assumptions\n`raw.raw_orders` has a `loaded_at` column because source freshness uses `max(loaded_at)`.\n\n`stg_orders.order_id` is intended to be unique, since the dbt project has a `unique` test on that column.\n\nThe duplicate rows are either ingestion duplicates or multiple versions/snapshots of the same order, not separate valid orders sharing an ID.\n\nThe staging model is located at `models/staging/stg_orders.sql`, and the tests are defined in a YAML file such as `models/staging/schema.yml`.\n\nIf a business timestamp such as `updated_at` exists, it is preferable to `loaded_at` for choosing the current order record."}, {"position": 59, "item_id": "RC01-04B", "is_repeat": 0, "scenario_id": "RC01", "label": "B", "group_pos": 5, "group_size": 6, "text": "### Root cause\n`stg_orders` is a pass-through view over `raw.raw_orders`, which is loaded hourly. The loads are evidently append-only, with no deduplication or incremental/merge logic. Each run re-inserts the same orders, so `order_id` repeats and the row count exceeds the expected 500-1,000 window. The two failures are one symptom: 600 duplicated `order_id` values (at least 600 extra rows) pushed the count over 1,000. The staging model has no dedup step, and source freshness passes because rows keep arriving, so it cannot detect this. The 13 skipped nodes (`dim_customers`, `fct_orders`, 9 tests) are collateral from the upstream failure.\n\n### Fix\nTwo changes, in order of priority:\n\n1. **Outside dbt (root fix):** change the orders ingestion job that writes `raw.raw_orders` to upsert/merge on `order_id` (or load into a staging table and merge) instead of blind append. Then remove the existing duplicates from `raw.raw_orders`, keeping the latest `loaded_at` per `order_id`.\n\n2. **In dbt (defensive, and an immediate unblock):** deduplicate in `models/staging/stg_orders.sql` so staging honors its \"one row per order\" contract regardless of raw behavior:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_orders') }}\n\n),\n\ndeduplicated as (\n\n    select *\n    from source\n    qualify row_number() over (\n        partition by order_id\n        order by loaded_at desc\n    ) = 1\n\n),\n\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        cast(order_date as date) as order_date,\n        status,\n        loaded_at\n    from deduplicated\n\n)\n\nselect * from renamed\n```\n\nKeep the `unique` and `row_count_between` tests unchanged. They caught the problem and should stay as guards. Do not widen the row-count bounds or delete the unique test to make the build green.\n\n### Verification\nFirst, confirm the diagnosis in DuckDB:\n\n```sql\nselect count(*) as total_rows,\n       count(distinct order_id) as distinct_orders\nfrom \"ecommerce\".\"main\".\"stg_orders\";   -- run against raw.raw_orders before the fix\n```\n\nBefore the fix, `total_rows` should exceed `distinct_orders` and `total_rows` should be above 1,000.\n\nAfter the change, run:\n\n```\ndbt build --select stg_orders+\n```\n\nExpected: `unique_stg_orders_order_id` and `row_count_between_stg_orders_1000__500` pass, and `dim_customers`, `fct_orders` and their 9 tests run (no skips). Then run the query above against `stg_orders`: `total_rows` should equal `distinct_orders` and fall between 500 and 1,000. After the ingestion fix, check that `raw.raw_orders` itself stays unique across a couple of hourly loads.\n\n### Assumptions\n- Duplicates are repeated loads of the same order (identical or updated versions of the same order), not distinct orders with colliding ids. If `order_id` collisions between different orders exist, deduplicating would hide a real data problem and the source system needs investigation.\n- Keeping the row with the latest `loaded_at` is the correct \"current\" version (e.g., latest status). If the source has a better ordering column (such as an updated-at timestamp), use that.\n- Once duplicates are removed, the true order count falls within 500-1,000, as the model description states. The report doesn't show the distinct count, so confirm this with the verification query.\n- The ingestion job is append-only and owned outside the dbt project. The report doesn't show this directly; it is inferred from the duplicates in a pass-through staging view.\n- The `row_count_between` test's name suffix `_1000__500` doesn't affect behavior; the compiled SQL shows the correct bounds (500-1,000)."}, {"position": 60, "item_id": "RC01-03B", "is_repeat": 0, "scenario_id": "RC01", "label": "B", "group_pos": 6, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is that two tests failed: `test row_count_between_stg_orders_1000__500` and `test unique_stg_orders_order_id`. The `row_count_between` test failed because it expected a row count between 500 and 1000, but got only 1 result. The `unique` test failed because it found 600 duplicate `order_id` values, which exceeded the expected count of 0.\n\n### Fix\n\nTo fix this, we need to adjust the `stg_orders` model to ensure it has a reasonable number of rows and order IDs are unique. Specifically, we need to add a `unique` constraint to the `order_id` column and ensure the model is populated with a sufficient number of rows.\n\nIn the `stg_orders` model, add the following line to the `columns` section:\n```yaml\ncolumns:\n  - name: order_id\n    tests: [unique]\n```\nThis will enforce uniqueness on the `order_id` column.\n\nTo increase the row count, we need to adjust the ingestion job to load more data into the `raw` schema. This could involve changing the data retrieval query or increasing the frequency of the ingestion job.\n\nAssuming the data retrieval query is the issue, we would need to modify the ingestion job to load more data. For example, if the query is currently filtering by a specific date range, we could adjust the range to include more data.\n\n### Verification\n\nTo verify the fix worked, we can run the following dbt command:\n```\ndbt test\n```\nThis will re-run all tests, including the two that failed initially. We should see both tests pass, indicating that the `stg_orders` model is now populated with a sufficient number of rows and `order_id` values are unique.\n\nWe can also verify the fix by running the following SQL query:\n```sql\nSELECT count(*) as n_rows FROM \"ecommerce\".\"main\".\"stg_orders\";\nSELECT count(*) as n_unique FROM \"ecommerce\".\"main\".\"stg_orders\" WHERE order_id IS NOT NULL GROUP BY order_id HAVING count(*) = 1;\n```\nThe first query should return a reasonable row count, and the second query should return 0 rows, indicating that all `order_id` values are unique.\n\n### Assumptions\n\n* The ingestion job is the source of the data issue, rather than the dbt project itself.\n* The data retrieval query is the primary cause of the low row count, and adjusting the query will resolve the issue.\n* The CRM, payment provider, and web shop data ingestion jobs are all configured correctly and are not the source of the issue."}, {"position": 61, "item_id": "RI01-01B", "is_repeat": 0, "scenario_id": "RI01", "label": "B", "group_pos": 1, "group_size": 6, "text": "### Root cause\nThe relationships test fails because 5 `fct_orders` rows carry a `customer_id` that does not exist in `dim_customers`. The source freshness check explains why. `raw.raw_customers` was last loaded 38 hours ago, while `raw.raw_orders` loaded an hour ago. The CRM ingestion has stalled (or the CRM feed is delayed) while web shop orders keep arriving, so orders reference customers that were created after the last CRM load. This is an upstream ingestion problem (a late-arriving dimension), not a modelling bug. The freshness warning (24 h threshold) was exceeded but did not block anything, because `dbt source freshness` exited 0 and the test failure was the only signal.\n\n### Fix\n1. **Outside the dbt project (primary fix):** investigate and repair the hourly CRM-to-`raw.raw_customers` ingestion job, which has not loaded since 2026-10-12 05:00 UTC. Once it loads again, the missing customers should appear and the test will pass on the next `dbt build`. Do not delete the 5 orders or loosen the test to make it green.\n2. **In the dbt project (hardening):** make freshness a gate so this fails with a clear cause, and run it before the build. The warn threshold was crossed but nothing stopped the build. In the `sources` YAML for `raw_customers`, tighten the error threshold to match the hourly cadence:\n```yaml\nsources:\n  - name: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after: {count: 6, period: hour}\n          error_after: {count: 12, period: hour}\n```\n   In the scheduler, run `dbt source freshness` first and stop the pipeline if it exits non-zero, so a stale CRM feed is reported as the cause rather than as a downstream relationships failure.\n3. **Optional, only if the business accepts orders from not-yet-synced customers:** keep the test but set `severity: warn` temporarily, or add a `where` config limiting it to orders older than the expected CRM lag. Do this only as a deliberate decision, since it reduces protection.\n\n### Verification\n1. After the CRM job is fixed, confirm that `dbt source freshness` shows `raw_customers` as PASS (loaded within 24 h, ideally within 6 h).\n2. Rebuild and retest the affected models:\n   `dbt build --select +dim_customers+ fct_orders` (or simply `dbt build`).\n   Expected: the relationships test passes with 0 failing rows and the exit code is 0.\n3. Optionally, before the rebuild, inspect the orphans directly:\n```sql\nselect o.order_id, o.customer_id\nfrom \"ecommerce\".\"main\".\"fct_orders\" o\nleft join \"ecommerce\".\"main\".\"dim_customers\" c using (customer_id)\nwhere o.customer_id is not null and c.customer_id is null;\n```\n   Check that these 5 customer IDs exist in `raw.raw_customers` after the reload. If they still don't exist after a fresh CRM load, the cause is different (see assumptions).\n\n### Assumptions\n- The 5 orphaned orders belong to customers created in the CRM after the last successful load (2026-10-12 05:00 UTC). I have not seen the order timestamps or IDs to confirm this.\n- `dim_customers` is built directly from `raw.raw_customers` (via staging) without other sources, and has no filtering that would drop valid customers.\n- The CRM ingestion job is failing or stalled, rather than the CRM having genuinely had no changes for 38 hours. The hourly schedule makes a real lack of changes unlikely but not impossible.\n- The ingestion job lives outside the dbt project, and I don't know its tooling or the cause of its failure.\n- If the 5 IDs are still missing after a successful CRM load, they may be deleted or guest customers, which would require a data-quality decision (e.g. an \"unknown customer\" member in `dim_customers`)."}, {"position": 62, "item_id": "RI01-03A", "is_repeat": 0, "scenario_id": "RI01", "label": "A", "group_pos": 2, "group_size": 6, "text": "### Root cause\n`fct_orders.customer_id` has 5 customer IDs that do not exist in `dim_customers.customer_id`, so the `relationships` test failed. The most likely reason is that `raw.raw_customers` is stale: its latest `loaded_at` is `2026-10-12 05:00 UTC`, 38 hours old, while `raw.raw_orders` is current. New orders have arrived for customers whose CRM/customer records have not yet been ingested, so `stg_orders`/`fct_orders` contain customer IDs that `stg_customers`/`dim_customers` do not.\n\nThe source freshness check only warned, not errored, because `raw_customers` is stale beyond `warn_after: 24 hours` but not yet beyond `error_after: 48 hours`.\n\n### Fix\nFix the upstream CRM ingestion job that writes to:\n\n```text\n\"ecommerce\".\"raw\".\"raw_customers\"\n```\n\nSpecifically, restore the hourly load so `raw.raw_customers.loaded_at` is current and includes the missing customer records referenced by recent orders. After the raw customer data is backfilled/current, rerun dbt so these models rebuild:\n\n```text\nmodels/staging/... stg_customers\nmodels/marts/dim_customers.sql\nmodels/marts/fct_orders.sql\n```\n\nNo SQL change is indicated in `models/marts/fct_orders.sql` or `models/marts/dim_customers.sql`; the relationship test is correctly identifying referential inconsistency.\n\nRecommended dbt configuration change: make stale customers fail sooner, because orders depend on customers and a stale customer source can break marts before the current 48-hour error threshold. In the source YAML for `raw.raw_customers`, reduce the freshness error threshold, for example:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 6\n            period: hour\n          error_after:\n            count: 12\n            period: hour\n```\n\nThis aligns customer freshness with orders/payments and prevents a build from proceeding for many hours with stale customer data.\n\n### Verification\nFirst identify the orphaned customer IDs:\n\n```sql\nselect distinct f.customer_id\nfrom \"ecommerce\".\"main\".\"fct_orders\" f\nleft join \"ecommerce\".\"main\".\"dim_customers\" c\n  on f.customer_id = c.customer_id\nwhere f.customer_id is not null\n  and c.customer_id is null;\n```\n\nExpected before the fix: 5 rows or 5 offending customer IDs, matching the failed test.\n\nAfter fixing/backfilling CRM ingestion, confirm freshness:\n\n```bash\ndbt source freshness\n```\n\nExpected result: `raw.raw_customers` passes, with `max(loaded_at)` within the configured threshold.\n\nThen rebuild and retest the affected lineage:\n\n```bash\ndbt build --select source:raw.raw_customers+ fct_orders dim_customers\n```\n\nOr run the full scheduled command:\n\n```bash\ndbt build\n```\n\nExpected result: all tests pass, including:\n\n```text\nrelationships_fct_orders_customer_id__customer_id__ref_dim_customers_\n```\n\nRe-run the orphan query above. Expected result: 0 rows.\n\n### Assumptions\n- `stg_customers` is built directly from `raw.raw_customers`, and `dim_customers.customer_id` comes from `stg_customers.customer_id`.\n- `stg_orders.customer_id` is populated from the current `raw.raw_orders` feed.\n- The 5 missing relationships are caused by delayed CRM ingestion rather than invalid customer IDs in the order source.\n- Orders are allowed to arrive in the warehouse before the corresponding customer record, but this should be temporary and resolved by the customer ingestion job.\n- The source YAML file path is not provided; the freshness YAML change should be made wherever `raw.raw_customers` is declared."}, {"position": 63, "item_id": "RI01-01C", "is_repeat": 0, "scenario_id": "RI01", "label": "C", "group_pos": 3, "group_size": 6, "text": "### Root cause\n\n`fct_orders.customer_id` contains 5 non-null customer IDs that do not exist in `dim_customers.customer_id`, causing the dbt `relationships` test to fail.\n\nThe likely reason is upstream data freshness skew: `raw.raw_orders` is current as of `2026-10-13 18:05 UTC`, but `raw.raw_customers` is stale, with latest `loaded_at = 2026-10-12 05:00 UTC`. Orders are arriving for customers that have not yet been ingested into `raw.raw_customers`, so `dim_customers` is missing those customers while `fct_orders` already contains their orders.\n\n### Fix\n\nFix the customer ingestion job outside dbt so that the CRM/customer source loading `raw.raw_customers` into the `raw` schema resumes hourly ingestion and catches up through at least `2026-10-13 18:05 UTC`.\n\nSpecifically:\n\n- Source: `raw.raw_customers`\n- Freshness column: `loaded_at`\n- Downstream dbt model affected: `dim_customers`\n- Failing model/test: `fct_orders.customer_id` relationships test to `dim_customers.customer_id`\n\nNo dbt model change is indicated by the evidence. The data contract appears correct: every `fct_orders.customer_id` should exist in `dim_customers.customer_id`.\n\nAfter the upstream job is fixed and backfilled, rebuild the affected models:\n\n```bash\ndbt build --select source:raw.raw_customers+ fct_orders\n```\n\nIf the source name is not literally `raw.raw_customers` in dbt selection syntax, use the actual dbt source selector from `sources.yml`, for example:\n\n```bash\ndbt build --select source:raw.raw_customers+ fct_orders\n```\n\nor rebuild the full project:\n\n```bash\ndbt build\n```\n\nOptional short-term operational mitigation: if customer freshness should block the pipeline earlier, lower or enforce the freshness threshold for `raw.raw_customers` so stale customer data becomes an error before mart tests fail. In the dbt source YAML, this would be configured on the `raw_customers` source table, for example:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 24\n            period: hour\n          error_after:\n            count: 48\n            period: hour\n```\n\nIf 38 hours of staleness is already unacceptable, change `error_after` to a lower threshold, such as 24 hours:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 6\n            period: hour\n          error_after:\n            count: 24\n            period: hour\n```\n\n### Verification\n\nFirst confirm the customer source has caught up:\n\n```bash\ndbt source freshness --select source:raw.raw_customers\n```\n\nExpected result:\n\n- `raw.raw_customers` passes freshness.\n- `max(loaded_at)` is recent enough to be within the configured threshold, ideally close to the latest successful order ingestion time.\n\nThen rerun the failing relationship check, or rebuild the affected models and tests:\n\n```bash\ndbt build --select fct_orders dim_customers\n```\n\nExpected result:\n\n- The relationships test on `fct_orders.customer_id` to `dim_customers.customer_id` passes.\n- `dbt build` exits with code 0.\n\nYou can also directly inspect remaining orphaned customer IDs:\n\n```sql\nselect o.customer_id, count(*) as order_count\nfrom ecommerce.main.fct_orders o\nleft join ecommerce.main.dim_customers c\n  on o.customer_id = c.customer_id\nwhere o.customer_id is not null\n  and c.customer_id is null\ngroup by 1\norder by order_count desc;\n```\n\nExpected result: zero rows.\n\n### Assumptions\n\n- `dim_customers` is built from `raw.raw_customers`.\n- `fct_orders` is built from `raw.raw_orders`.\n- The 5 failing relationship rows are caused by orders for recently created customers missing from the stale customer feed.\n- The intended business rule is that every non-null `fct_orders.customer_id` must exist in `dim_customers.customer_id`.\n- The issue is with the upstream CRM/customer ingestion job, not with a transformation bug in the dbt model."}, {"position": 64, "item_id": "RI01-05B", "is_repeat": 0, "scenario_id": "RI01", "label": "B", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\nThe failure of the `relationships test` on `fct_orders.customer_id` is caused by the mismatch between the `customer_id` values in `fct_orders` and `dim_customers`. The test is configured to fail if the number of results is not equal to 0, but in this case, there are 5 rows that do not have a corresponding customer in `dim_customers`.\n\nThe root cause is likely due to the data quality issue in the CRM data, where the `customer_id` values in `raw_customers` do not match the expected values in `dim_customers`.\n\n### Fix\n\nTo fix this issue, we need to update the `dim_customers` model to include the correct `customer_id` values from `raw_customers`. We can do this by joining the `raw_customers` table with the `stg_customers` table on the `customer_id` column, and then updating the `dim_customers` model to reflect the correct `customer_id` values.\n\nThe updated `dim_customers` model would be:\n```sql\nwith customers as (\n\n    select * from {{ ref('stg_customers') }}\n\n),\n\ncustomer_orders as (\n\n    select\n        customer_id,\n        min(order_date) as first_order_date,\n        max(order_date) as most_recent_order_date,\n        count(order_id) as number_of_orders\n    from orders\n    group by customer_id\n\n),\n\ncustomer_payments as (\n\n    select\n        orders.customer_id,\n        sum(payments.amount) as lifetime_value\n    from payments\n    inner join orders on payments.order_id = orders.order_id\n    where orders.status != 'cancelled'\n    group by orders.customer_id\n\n),\n\nfinal as (\n\n    select\n        customers.customer_id,\n        customers.first_name,\n        customers.last_name,\n        customers.email,\n        customers.country_code,\n        customers.created_at,\n        customer_orders.first_order_date,\n        customer_orders.most_recent_order_date,\n        coalesce(customer_orders.number_of_orders, 0) as number_of_orders,\n        coalesce(customer_payments.lifetime_value, 0) as lifetime_value\n    from customers\n    left join customer_orders on customers.customer_id = customer_orders.customer_id\n    left join customer_payments on customers.customer_id = customer_payments.customer_id\n\n)\n\nselect * from final\n```\n\n### Verification\n\nTo verify that the fix worked, we can run the `relationships test` again and ensure that the test passes. We can also verify the data quality by running a query that joins `fct_orders` with `dim_customers` on the `customer_id` column and checking that the results match the expected values.\n\nFor example, we can run the following query:\n```sql\nselect *\nfrom fct_orders\njoin dim_customers on fct_orders.customer_id = dim_customers.customer_id\n```\n\nThis query should return all the rows in `fct_orders` that have a matching `customer_id` value in `dim_customers`.\n\n### Assumptions\n\n* The `customer_id` values in `raw_customers` are incorrect or missing.\n* The `customer_id` values in `dim_customers` are correct and up-to-date.\n* The `stg_customers` table is accurate and reflects the correct `customer_id` values."}, {"position": 65, "item_id": "RI01-05A", "is_repeat": 0, "scenario_id": "RI01", "label": "A", "group_pos": 5, "group_size": 6, "text": "### Root cause\nThe failure is an upstream data-latency problem, not a dbt code defect. The CRM connector has hit HTTP 429 rate-limit errors since 2026-10-12 05:00 UTC, with retries exhausted, so `raw.raw_customers` has not been refreshed for 38 h (freshness WARN). Orders and payments kept loading hourly, so `raw_orders` contains orders from new customers who are not yet in `raw_customers` → `stg_customers` → `dim_customers`. The 5 `fct_orders.customer_id` values therefore have no parent row. This matches INC-0391 (same symptom during a CRM outage, resolved by the sync catching up). The model SQL, the column types and the 2026-10-07 dbt-duckdb upgrade are not implicated: the test passed on 6 of the last 7 runs and the build was green after the upgrade.\n\n### Fix\n**Outside dbt (the actual fix):** fix or restart the CRM customer sync, e.g. back off or reduce request rate, raise the API quota, or resume incremental sync from the last successful watermark (2026-10-12 05:00 UTC), then backfill `raw.raw_customers`. No code change in `fct_orders`, `dim_customers` or `stg_customers` is needed. Do not delete the orphan orders or switch to an inner join, which would silently drop revenue from `finance_revenue_dashboard`.\n\n**In dbt (hardening, optional):** the freshness warning already fired but nobody was alerted, so make staleness actionable before the relationships test fails. Tighten the source threshold and route freshness warnings to on-call (`sources.yml`):\n\n```yaml\nsources:\n  - name: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after: {count: 12, period: hour}\n          error_after: {count: 24, period: hour}\n```\n\nCalibrate this against the normal 3–30 h age range first (current thresholds already sit inside it, so tune to avoid alert fatigue), or measure freshness against the latest `created_at` instead. Optionally keep the relationships test but set `config: {severity: warn}` only if the business accepts temporary orphans; the default error severity is the safer choice because it blocks stale marts from feeding the dashboards.\n\n**Immediate action:** until the CRM catches up, notify Finance analytics (the 07:00 UTC stand-up dashboard) and Marketing analytics that customer data is ~38 h stale.\n\n### Verification\n1. Confirm the raw backfill landed:\n```sql\nselect max(loaded_at) from \"ecommerce\".\"raw\".\"raw_customers\";\n```\nExpect a timestamp within the last few hours.\n2. Confirm the orphans are resolved in raw data:\n```sql\nselect distinct o.customer_id\nfrom \"ecommerce\".\"raw\".\"raw_orders\" o\nleft join \"ecommerce\".\"raw\".\"raw_customers\" c using (customer_id)\nwhere c.customer_id is null;\n```\nExpect 0 rows.\n3. Rebuild and test:\n```\ndbt source freshness\ndbt build --select stg_customers+ stg_orders+ \n```\n(or `dbt build --select +fct_orders+ dim_customers+`). Expect the `raw_customers` freshness PASS, the relationships test returning 0 rows, and all 30 nodes passing with exit code 0.\n\n### Assumptions\n- The 5 failing `customer_id` values belong to customers who signed up after 2026-10-12 05:00 UTC (not confirmed by a query; step 2 checks this). If any remain orphaned after the sync is caught up, they are genuinely missing from the CRM and need a separate investigation.\n- The CRM sync is a job outside the dbt repo that can be fixed or re-run by the ingestion owners, and it supports backfilling from a watermark.\n- The 429 errors are the only cause of the stale `raw_customers`; no schema change in the CRM extract occurred.\n- Alerting infrastructure exists to route freshness warnings to on-call.\n- The dashboards have not already been consumed with incomplete customer data by Marketing/Finance."}, {"position": 66, "item_id": "RI01-03B", "is_repeat": 0, "scenario_id": "RI01", "label": "B", "group_pos": 6, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the test `relationships_fct_orders_customer_id__customer_id__ref_dim_customers_` failing. This test is checking if there is a relationship between the `fct_orders.customer_id` and `dim_customers.customer_id`. The failure message suggests that the test expected 0 results, but got 5 results, which indicates that there are duplicate customer IDs in the `fct_orders` table.\n\n### Fix\n\nTo fix this issue, we need to ensure that the `fct_orders` table does not contain duplicate customer IDs. We can do this by adding a unique constraint on the `customer_id` column in the `fct_orders` table. This can be done by adding the following code to the `fct_orders.sql` file:\n\n```sql\nalter table fct_orders\nadd constraint unique_customer_id unique (customer_id);\n```\n\n### Verification\n\nTo verify that the fix worked, we can run the following dbt command:\n\n```\ndbt test\n```\n\nThis will re-run all the tests, including the failed test, and check if the issue is resolved. If the issue is resolved, the test should pass.\n\n### Assumptions\n\n* The `fct_orders` table is a materialized view, and the unique constraint is not already present.\n* The duplicate customer IDs are not present in the `dim_customers` table, and the relationship test is failing because of the duplicate IDs in the `fct_orders` table."}, {"position": 67, "item_id": "SD03-06A", "is_repeat": 0, "scenario_id": "SD03", "label": "A", "group_pos": 1, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is a conversion error in the `dim_customers` model, specifically when casting the `customer_id` column from the `customers` table to an `INT32` type. This is due to the presence of non-numeric values in the `customer_id` column, which are causing the casting to fail.\n\n### Fix\n\nTo resolve this issue, we need to modify the `dim_customers` model to correctly handle the non-numeric values in the `customer_id` column. We can do this by casting the `customer_id` column to a string type instead of `INT32`, since the column appears to contain string values. We can make this change in the `dim_customers.sql` model file.\n\nHere is the modified SQL:\n```sql\nSELECT \n    customers.customer_id::TEXT AS customer_id,\n    ...\nFROM \n    customers\n    left join customer_orders on customers.customer_id = customer_orders.customer_id\n```\nThis change will allow the model to correctly handle the non-numeric values in the `customer_id` column.\n\n### Verification\n\nTo verify that the fix worked, we can re-run the `dbt build` command and check that the error no longer occurs. We can also run the `dbt test` command to ensure that the data tests are passing.\n\nIf we want to verify the fix specifically, we can run the following SQL query to check the data type of the `customer_id` column:\n```sql\nSELECT data_type FROM information_schema.columns WHERE table_name = 'dim_customers' AND column_name = 'customer_id';\n```\nThis should return a result like `text` or `varchar`, indicating that the column is now being stored as a string type.\n\n### Assumptions\n\nI assumed that the `customer_id` column in the `customers` table contains string values, as suggested by the error message. I also assumed that the model `dim_customers` is intended to handle this column as a string type, rather than as an integer type."}, {"position": 68, "item_id": "SD03-01B", "is_repeat": 0, "scenario_id": "SD03", "label": "B", "group_pos": 2, "group_size": 6, "text": "### Root cause\n`dim_customers` fails because the join keys have incompatible types and now incompatible values. `stg_customers.customer_id` is `VARCHAR` and now contains CRM external reference keys like `'CUST-00001'`, while `stg_orders.customer_id` is `INTEGER`. In DuckDB, the join:\n\n```sql\ncustomers.customer_id = customer_orders.customer_id\n```\n\ncauses an implicit cast from the customer string to `INT32`, which fails for values like `'CUST-00001'`.\n\nThe likely trigger is CRM-77 on 2026-10-12: the CRM customer export was regenerated with external reference keys. `stg_customers` and its tests passed because this is not a freshness issue and there is no test checking compatibility between customer IDs in customers and orders.\n\n### Fix\nThe correct remediation is to restore a shared customer key between CRM customers and web-shop orders. The best fix is outside dbt: update the CRM/raw customer ingestion feeding `raw.raw_customers.customer_id` so it again contains the same internal numeric customer ID used by `raw.raw_orders.customer_id`, or add a separate column for the CRM external reference key.\n\nRecommended raw contract:\n\n```text\nraw.raw_customers.customer_id           INTEGER or VARCHAR numeric internal shop customer ID\nraw.raw_customers.crm_external_ref      VARCHAR, e.g. 'CUST-00001'\n```\n\nThen update `models/staging/stg_customers.sql` to expose the internal key as the dbt join key and optionally expose the external CRM key separately.\n\nExample if `raw.raw_customers.customer_id` is restored as numeric-compatible:\n\n```sql\nselect\n    cast(customer_id as integer) as customer_id,\n    first_name,\n    last_name,\n    lower(email) as email,\n    upper(country) as country_code,\n    created_at,\n    loaded_at\nfrom {{ source('raw', 'raw_customers') }}\n```\n\nAlso update `models/staging/schema.yml` and `models/marts/schema.yml` so the documented type for `stg_customers.customer_id` and `dim_customers.customer_id` matches the actual internal key type.\n\nAdd a relationship test so this fails earlier and more clearly:\n\n```yaml\nmodels:\n  - name: stg_orders\n    columns:\n      - name: customer_id\n        tests:\n          - not_null\n          - relationships:\n              to: ref('stg_customers')\n              field: customer_id\n```\n\nIf the business decision is instead to make `'CUST-00001'` the canonical customer key, then `raw.raw_orders.customer_id` / `stg_orders.customer_id` must also be changed to the same external key via an authoritative mapping table. Do not fix this by blindly casting `stg_orders.customer_id` to `VARCHAR`, because `'1'` will not equal `'CUST-00001'`.\n\n### Verification\nAfter the ingestion/key fix, confirm the key types and values align:\n\n```sql\nselect customer_id\nfrom {{ ref('stg_customers') }}\nwhere try_cast(customer_id as integer) is null\nlimit 10;\n```\n\nExpected result if internal numeric IDs are restored: zero rows.\n\nCheck for orphaned orders:\n\n```sql\nselect count(*) as orphaned_orders\nfrom {{ ref('stg_orders') }} o\nleft join {{ ref('stg_customers') }} c\n  on o.customer_id = c.customer_id\nwhere c.customer_id is null;\n```\n\nExpected result: `orphaned_orders = 0`, or only known/accepted historical exceptions.\n\nRun:\n\n```bash\ndbt build --select stg_customers stg_orders stg_payments dim_customers\ndbt source freshness\n```\n\nExpected result: `dim_customers` builds successfully, its `unique` and `not_null` tests pass, `lifetime_value` `not_null` test passes, and previously skipped downstream tests run instead of being skipped. Source freshness should remain passing.\n\nOptionally verify exposed dashboards after the model build:\n\n```bash\ndbt build --select +exposure:finance_revenue_dashboard +exposure:marketing_customer_dashboard\n```\n\n### Assumptions\nThe intended join key for customers and orders is the internal web-shop customer ID, not the new CRM external reference key.\n\nThere is or can be an authoritative mapping between the CRM external reference key, such as `'CUST-00001'`, and the internal order-system customer ID.\n\nThe CRM-77 migration is the source of the changed `raw.raw_customers.customer_id` values, based on timing and the error value, but this is inferred from the provided history rather than directly proven."}, {"position": 69, "item_id": "SD03-06B", "is_repeat": 0, "scenario_id": "SD03", "label": "B", "group_pos": 3, "group_size": 6, "text": "### Root cause\n`dim_customers` joins `customers.customer_id` to `customer_orders.customer_id` (line 66), and the two columns have incompatible types. The error shows the customer side now contains string values like `'CUST-00001'`, while the other side is INT32, so DuckDB's implicit cast fails. The most likely explanation is an upstream change: the CRM ingestion into `raw.raw_customers` started delivering a prefixed string key (`CUST-00001`) where it previously delivered integers, while `raw.raw_orders` still carries the integer key. This is an inference from the error message; the report doesn't show the source schemas. Freshness passing confirms data is arriving, so this is a key-format/type mismatch, not a stale-data problem. The 4 skipped tests are collateral: they never ran because `dim_customers` failed.\n\n### Fix\nFirst, confirm which side changed (see Verification query) and which format is canonical. Then:\n\n1. **Short term, in dbt:** normalize the key to a single type in the staging layer, so marts never see mixed types. Assuming the staging models are `stg_customers` and `stg_orders` (file names assumed), cast explicitly there. If the canonical key is now the prefixed string, make both sides strings:\n\n```sql\n-- models/staging/stg_customers.sql\ncast(customer_id as varchar) as customer_id\n\n-- models/staging/stg_orders.sql\n-- only if orders still carries the old integer key\n'CUST-' || lpad(cast(customer_id as varchar), 5, '0') as customer_id\n```\n\nCheck that the padding width (5) matches the real format of the prefixed keys. If orders is *also* about to migrate to the prefixed format, use `try_cast`-free logic that handles both (e.g. `case when cast(customer_id as varchar) like 'CUST-%' then ... else ... end`) so the model survives the transition.\n\n2. **Add a guard:** declare the expected type in the staging YAML and add a relationships test so a future mismatch fails at staging, not deep in a mart:\n\n```yaml\nmodels:\n  - name: stg_orders\n    columns:\n      - name: customer_id\n        data_tests:\n          - relationships:\n              to: ref('stg_customers')\n              field: customer_id\n```\n\nIf the project uses dbt model contracts (`contract: {enforced: true}` with `data_type: varchar`), enable them on the staging models too.\n\n3. **Outside the dbt project:** the CRM ingestion job (the owner of `raw.raw_customers`) changed a key's type without notice. Agree with its owner on the canonical `customer_id` format, and ask that schema changes to the raw tables be announced or versioned. If the change was unintentional, the better long-term fix is for ingestion to revert or to apply the same format to orders.\n\nDo not use `try_cast` to silently null out the non-numeric keys; that would drop customers from the dimension and fail quietly.\n\n### Verification\nInspect the types and sample values on both sides:\n\n```sql\ndescribe raw.raw_customers;\ndescribe raw.raw_orders;\nselect customer_id from raw.raw_customers limit 5;\nselect count(*) from raw.raw_customers where try_cast(customer_id as integer) is null;\n```\n\nAfter the fix, run:\n\n```\ndbt build --select stg_customers stg_orders dim_customers+\n```\n\nExpected: `dim_customers` builds, the 4 previously skipped tests run and pass, and exit code is 0. Also check that the join didn't lose rows:\n\n```sql\nselect count(*) from dim_customers;  -- should match distinct customers in stg_customers\nselect count(*) from stg_orders o\nleft join stg_customers c using (customer_id) where c.customer_id is null; -- expect 0\n```\n\nThen rerun the full `dbt build` on the next schedule.\n\n### Assumptions\n- Staging models are named `stg_customers` and `stg_orders` and are views over the raw sources; actual names weren't given.\n- The type change originated in the CRM ingestion (`raw_customers`), and `raw_orders.customer_id` is still an integer, inferred from the INT32 side of the error.\n- Keys follow the pattern `CUST-` plus five zero-padded digits, based on the single example `CUST-00001`.\n- No contracts or relationships tests on `customer_id` currently exist at staging, which is why the mismatch surfaced only in the mart.\n- The 4 skipped tests all depend on `dim_customers`, as the report states."}, {"position": 70, "item_id": "SD03-01A", "is_repeat": 0, "scenario_id": "SD03", "label": "A", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is a conversion error in the `dim_customers` model when casting the `customer_id` column from the `customer_orders` join to an INT32. This is due to the `customer_id` column in the `raw_customers` table being stored as a VARCHAR.\n\n### Fix\n\nTo fix this issue, the `customer_id` column in the `customer_orders` CTE needs to be cast to INT32. This can be achieved by adding the following line in the `customer_orders` CTE:\n\n```sql\ncustomer_id::INT32 as customer_id\n```\n\nThe full SQL statement would be:\n\n```sql\ncustomer_orders as (\n    select\n        customer_id::INT32 as customer_id,\n        min(order_date) as first_order_date,\n        max(order_date) as most_recent_order_date,\n        count(order_id) as number_of_orders\n    from orders\n    group by customer_id\n)\n```\n\n### Verification\n\nTo verify the fix, run the following dbt command:\n\n```\ndbt build\n```\n\nAnd check the output for any errors or warnings. Also, run the following SQL query to verify the data types:\n\n```sql\nSELECT \n    column_name, \n    data_type\nFROM \n    information_schema.columns\nWHERE \n    table_name = 'customer_orders'\nAND \n    column_name = 'customer_id';\n```\n\nThe expected result is that the `customer_id` column is of type INT32.\n\n### Assumptions\n\nIt is assumed that the `customer_id` column in the `raw_customers` table is indeed stored as a VARCHAR, and that the issue is specific to this particular model and not a general issue with the dbt project or the warehouse."}, {"position": 71, "item_id": "SD03-03B", "is_repeat": 0, "scenario_id": "SD03", "label": "B", "group_pos": 5, "group_size": 6, "text": "### Root cause\n`dim_customers` fails while joining `stg_customers.customer_id` to `stg_orders.customer_id` via `customer_orders.customer_id`. One side is typed as `INTEGER` and the other now contains string IDs like `'CUST-00001'`. DuckDB is trying to cast `'CUST-00001'` to `INT32` during the join and cannot.\n\nSource freshness passed, so this is not a stale ingestion issue. It is a schema/type mismatch, likely caused by a change in the upstream customer ID format or inconsistent typing between staging models.\n\n### Fix\nUse a single canonical type for customer identifiers across staging and marts. Because the source now contains values like `CUST-00001`, `customer_id` should be treated as a string, not an integer.\n\nChange the staging models that expose `customer_id`, most importantly:\n\n- `models/staging/stg_customers.sql`\n- `models/staging/stg_orders.sql`\n\nCast `customer_id` to `VARCHAR` in both models.\n\nExample change:\n\n```sql\n-- models/staging/stg_customers.sql\n\nselect\n    cast(customer_id as varchar) as customer_id,\n    first_name,\n    last_name,\n    lower(email) as email,\n    country_code,\n    created_at\nfrom {{ source('raw', 'raw_customers') }}\n```\n\n```sql\n-- models/staging/stg_orders.sql\n\nselect\n    order_id,\n    cast(customer_id as varchar) as customer_id,\n    order_date,\n    status\nfrom {{ source('raw', 'raw_orders') }}\n```\n\nThen update the documented warehouse type for `dim_customers.customer_id` from `INTEGER` to `VARCHAR` in the model YAML file that documents `dim_customers`, for example:\n\n```yaml\nmodels:\n  - name: dim_customers\n    description: One row per customer with order history and lifetime value. Used by marketing and finance dashboards.\n    columns:\n      - name: customer_id\n        data_type: varchar\n        description: Primary key of the customer.\n        tests:\n          - unique\n          - not_null\n```\n\nIf downstream dashboards, semantic models, or BI tools expect `dim_customers.customer_id` to be numeric, update them to use a string customer key.\n\nDo not fix this by stripping `CUST-` and casting to integer unless the business has confirmed that the canonical customer ID is still numeric and the prefix is only a presentation artifact.\n\n### Verification\nRun the affected lineage first:\n\n```bash\ndbt build --select stg_customers stg_orders dim_customers+\n```\n\nExpected result: `dim_customers` builds successfully, and the previously skipped tests run.\n\nConfirm the column types and join compatibility in DuckDB:\n\n```sql\nselect\n    typeof(customer_id) as customer_id_type\nfrom dim_customers\nlimit 1;\n```\n\nExpected result: `VARCHAR`.\n\nCheck that prefixed customer IDs are present and not dropped:\n\n```sql\nselect customer_id\nfrom dim_customers\nwhere customer_id like 'CUST-%'\nlimit 10;\n```\n\nExpected result: rows such as `CUST-00001`, if those exist in the raw source.\n\nRun the normal scheduled command:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: no model errors; `dim_customers` tests `unique`, `not_null`, and `lifetime_value not_null` pass; source freshness remains passing.\n\n### Assumptions\n- `stg_customers` and `stg_orders` both expose a `customer_id` column used by `dim_customers`.\n- The new value `'CUST-00001'` is a valid customer ID, not corrupt data.\n- String customer IDs are now the canonical format from the web shop or CRM.\n- The YAML file documenting `dim_customers` exists under `models/`, though its exact filename was not provided.\n- No other mart or staging model still casts `customer_id` to `INTEGER`; if they do, they need the same `VARCHAR` treatment."}, {"position": 72, "item_id": "SD03-03A", "is_repeat": 0, "scenario_id": "SD03", "label": "A", "group_pos": 6, "group_size": 6, "text": "### Root cause\nThe join in `dim_customers` compares `customers.customer_id` with `customer_orders.customer_id`, and the two columns now have different types. The error says the string `'CUST-00001'` cannot be cast to INT32. So one side of the join is still an integer, while the other now carries prefixed string IDs. The upstream customer ID format has most likely changed in the `raw` data, and the staging models do not normalise or cast it. Freshness passes and the load itself succeeded; this is a schema/format drift problem, not a stale-data problem. The 4 skipped tests are only collateral damage, because `dim_customers` never built.\n\nWhich side changed is not stated. Since `dim_customers.customer_id` is documented as INTEGER, the likely candidate is `stg_orders.customer_id` (or `stg_customers`, if the CRM switched format). Check both.\n\n### Fix\n1. **Find the drift.** Compare the types of `customer_id` in `raw.raw_customers` and `raw.raw_orders`, and look at `stg_customers.sql` and `stg_orders.sql`, to see which one now contains `CUST-` values.\n2. **Decide the canonical key.** The warehouse contract is INTEGER, so the preferred fix is to normalise in the staging layer, not in the mart. If the prefix is purely cosmetic (`CUST-00001` = customer 1), strip it in whichever staging model receives the new format:\n\n```sql\n-- stg_orders.sql (and/or stg_customers.sql), wherever the new format arrives\ncast(regexp_replace(cast(customer_id as varchar), '^CUST-', '') as integer) as customer_id\n```\n\n   Use `try_cast` instead of `cast` temporarily if you suspect other malformed values, and investigate any NULLs it produces.\n3. **Guard the contract.** Add to the staging YAML a `not_null` test on `customer_id`, plus a `relationships` test from `stg_orders.customer_id` to `stg_customers.customer_id`. Consider `contract: {enforced: true}` with `data_type: integer` on the staging models so type drift fails at the staging layer, not in the mart join.\n4. **Outside dbt.** Ask the owner of the web shop/CRM ingestion why the ID format changed, and whether it applies to one source or both. If the format change is permanent and intended, the long-term fix is to agree on a canonical ID (and possibly migrate `dim_customers.customer_id` to VARCHAR, which would also require notifying dashboard owners in marketing and finance). Do not change the mart's column type unilaterally.\n\n### Verification\n```\ndbt build --select +dim_customers\n```\nExpect `dim_customers` to build and all its tests (`unique`, `not_null` on `customer_id`, `not_null` on `lifetime_value`, plus any new tests) to pass, with 0 skipped.\n\nSpot-check join integrity:\n```sql\nselect count(*) from dim_customers where number_of_orders > 0;   -- should be roughly as before\nselect count(*) from {{ ref('stg_orders') }} o\n  left join {{ ref('stg_customers') }} c using (customer_id)\n where c.customer_id is null;                                     -- expect 0\n```\nAlso confirm that `lifetime_value` and `number_of_orders` totals match the previous successful run (assuming the last good build is available for comparison).\n\n### Assumptions\n- The `CUST-` prefix is a pure format change and maps one-to-one to the old integer IDs (e.g. `CUST-00001` = 1); this must be confirmed with the source owner before stripping the prefix.\n- `stg_*` models are simple views over `raw` without existing casts on `customer_id`, since their SQL was not provided.\n- The new format started with a recent ingestion load, and the last successful `dim_customers` build is still available for comparison.\n- Rows with old integer IDs and new prefixed IDs may coexist in the raw tables; the normalisation expression handles both."}, {"position": 73, "item_id": "FV02-07A", "is_repeat": 0, "scenario_id": "FV02", "label": "A", "group_pos": 1, "group_size": 6, "text": "### Root cause\n`dbt build` succeeded, so the dbt models and tests that ran did not detect a modeling/test failure. The failure is from `dbt source freshness`: `raw.raw_orders` is stale. Its latest `loaded_at` is `2026-10-12 13:05 UTC`, which is 30 hours before the check and exceeds the configured error threshold of 12 hours. This likely means the hourly ingestion job for webshop orders stopped loading into `raw.raw_orders` or is no longer populating `loaded_at` correctly.\n\n### Fix\nFix the upstream ingestion for the webshop orders feed that writes to the DuckDB table/source:\n\n- Source: `raw.raw_orders`\n- Freshness column: `loaded_at`\n- Expected behavior: append/load new order records hourly with `loaded_at` set to the ingestion/load timestamp in UTC.\n\nThis change is outside the dbt project: update or rerun the ingestion job that loads webshop orders into `raw.raw_orders`.\n\nIf the ingestion pipeline is healthy but the freshness configuration is wrong, verify the source YAML in the dbt project and ensure it points at the correct column:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_orders\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 6\n            period: hour\n          error_after:\n            count: 12\n            period: hour\n```\n\nDo not change the threshold just to make the alert pass unless the business freshness SLA for orders has intentionally changed.\n\n### Verification\nFirst confirm the current max `loaded_at` in DuckDB:\n\n```sql\nselect max(loaded_at) as max_loaded_at\nfrom raw.raw_orders;\n```\n\nExpected after the fix: `max_loaded_at` should be within the last 6 hours for a full pass, and definitely within the last 12 hours to avoid an error.\n\nThen rerun source freshness for the affected source:\n\n```bash\ndbt source freshness --select source:raw.raw_orders\n```\n\nExpected result:\n\n```text\nPASS: source raw.raw_orders\n```\n\nOptionally rerun all freshness checks:\n\n```bash\ndbt source freshness\n```\n\nExpected result: exit code `0`, with `raw.raw_customers`, `raw.raw_orders`, and `raw.raw_payments` all passing, assuming no other source has become stale.\n\nIf ingestion was backfilled, also rerun the downstream dbt build for order-dependent models:\n\n```bash\ndbt build --select source:raw.raw_orders+\n```\n\nExpected result: all selected staging views, mart tables, and tests pass.\n\n### Assumptions\nThe `loaded_at` column is intended to represent the ingestion timestamp in UTC.\n\nThe source YAML is configured with `loaded_at_field: loaded_at` for `raw.raw_orders`.\n\nThe `raw.raw_orders` data comes from the webshop ingestion job, not the payment provider or CRM.\n\nThe freshness SLA for orders is still warn after 6 hours and error after 12 hours.\n\nThe scheduled freshness check ran around `2026-10-13 19:05 UTC`, based on the reported ages."}, {"position": 74, "item_id": "FV02-07B", "is_repeat": 0, "scenario_id": "FV02", "label": "B", "group_pos": 2, "group_size": 6, "text": "### Root cause\nThe failure is not in dbt's transformations. `dbt build` passed (30/30), but `raw.raw_orders` has received no new rows for 30 hours: its latest `loaded_at` is 2026-10-12 13:05 UTC, while customers (4.1 h) and payments (1.0 h) are current. Because only the orders feed is stale, the problem is almost certainly in the hourly web-shop ingestion job (failed, stuck, or disabled around 13:05 on 10/12), not in the warehouse or dbt.\n\nThe green build is misleading: it ran on stale data, so all downstream marts that depend on orders are 30 hours behind while looking healthy. The tests pass because they check data validity, not recency. Payments continued to load, so there may be payments referencing orders that don't exist yet in `raw_orders` (an orphan risk once the backlog loads).\n\n### Fix\n1. **Outside dbt (primary fix):** Check the web-shop → `raw.raw_orders` ingestion job's logs and scheduler around 2026-10-12 13:05 UTC. Fix the underlying cause (expired credentials, schema change at the source, upstream API outage, stuck/disabled schedule), then re-run it with a backfill from `2026-10-12 13:05 UTC` onward so no orders are skipped. Make sure the backfill is idempotent (upsert or dedupe on the order key) to avoid duplicates.\n2. **After the backfill,** rebuild the affected models: `dbt build --select source:raw.raw_orders+` (this covers `stg_orders` and downstream marts). Incremental models, if any, may need `--full-refresh` or a date-bounded rebuild if the watermark logic skipped the gap.\n3. **Prevent silent staleness in dbt:** make sure the freshness check actually gates the pipeline. Run `dbt source freshness` *before* `dbt build` in the scheduled job and stop on failure, or use `dbt build --select source_status:fresher+` in CI/orchestration. Confirm the source definition is as intended (in `models/staging/_sources.yml`, or wherever `raw` is defined):\n\n```yaml\nsources:\n  - name: raw\n    tables:\n      - name: raw_orders\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after: {count: 6, period: hour}\n          error_after: {count: 12, period: hour}\n```\n\nDo not loosen the thresholds to make the error go away;
