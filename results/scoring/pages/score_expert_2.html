igured `loaded_at_field` for `raw.raw_customers` is `loaded_at`.\n\nThere were no dbt model failures because the stale source affected only the source freshness command, not the build command."}, {"position": 26, "item_id": "FV03-04B", "is_repeat": 0, "scenario_id": "FV03", "label": "B", "group_pos": 2, "group_size": 6, "text": "### Root cause\nThe freshness check is mis-calibrated, not the data pipeline. Commit f1c34a7 (DATA-140, 2026-10-12) set raw_customers to warn after 1 h / error after 2 h on the assumption that the CRM loader runs hourly, like the orders and payments loaders. The history says otherwise: freshness age was 3, 19, 7, 30, 11 and 5 h across the last runs (and about 4 h today), and sign-ups are only 0–2 per day. `loaded_at` is the time the ingestion job wrote a row, and the max only advances when the job writes new or changed rows. Intermittent ages of 3–30 h are normal for this source. The `dbt build` passed (30/30), so staging and marts built fine, and nothing indicates a data defect. This is unlike INC-0318, where the sync was paused for 48 h. The new threshold now fails on every normal run.\n\n### Fix\nRevert the freshness block for `raw_customers` in `models/staging/sources.yml` to a threshold matching its real cadence. The 30 h observation is the worst case in the data, so the error threshold must exceed it. A reasonable setting is warn at 36 h, error at 72 h. That tolerates normal gaps while still catching a multi-day pause like INC-0318.\n\n```yaml\nsources:\n  - name: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after: {count: 36, period: hour}\n          error_after: {count: 72, period: hour}\n```\n\nOutside dbt: if the CRM loader is meant to run hourly (as DATA-140 assumed), then the loader's schedule or incremental logic is the thing to investigate and fix. In the ingestion job, consider writing a heartbeat or `_synced_at` column on every run, even with zero changed rows, so freshness measures job liveness rather than data change. Until that is confirmed, align the threshold with observed behavior and update the DATA-140 ticket accordingly.\n\n### Verification\nRun:\n\n```\ndbt source freshness --select source:raw.raw_customers\n```\n\nExpected: PASS at about 4 h (and at ages up to 36 h, no warning). Then run `dbt source freshness` for all sources and confirm exit code 0, with orders and payments still passing at their 6 h / 12 h thresholds.\n\nTo sanity-check the loader behavior:\n\n```sql\nselect date_trunc('hour', loaded_at) as load_hour, count(*) as rows_loaded\nfrom \"ecommerce\".\"raw\".\"raw_customers\"\nwhere loaded_at >= current_timestamp - interval 7 day\ngroup by 1 order by 1;\n```\n\nExpected: sparse load hours consistent with the 3–30 h gaps, which confirms the data changes infrequently rather than the loader failing.\n\n### Assumptions\n- The 6 observed ages (and today's 4 h) are representative of normal behavior, and no outage occurred during those runs.\n- `loaded_at` is only updated when rows are written or changed, not on every loader run (not stated in the metadata).\n- The CRM loader is not actually hourly for customers; if it is, the loader is skipping runs and needs investigation.\n- Stakeholders (marketing, finance) accept customer data up to 36 h stale; the dashboards do not require tighter customer freshness.\n- Source freshness errors affect only the freshness job's exit code and do not block `dbt build` in this orchestration.\n- No data content problems exist in `raw_customers`, since all 30 tests passed."}, {"position": 27, "item_id": "FV03-03A", "is_repeat": 0, "scenario_id": "FV03", "label": "A", "group_pos": 3, "group_size": 6, "text": "### Root cause\n\nThe failure report indicates that the `source freshness` command failed for the `raw.raw_customers` source. The source freshness check is failing because the maximum `loaded_at` timestamp is older than 1 hour, which is the configured warning threshold. This suggests that the ingestion job for `raw.raw_customers` has not completed within the expected timeframe, resulting in stale data.\n\n### Fix\n\nTo resolve the issue, we need to adjust the freshness thresholds for the `raw.raw_customers` source. We can do this by updating the `freshness` configuration in the `models` directory, specifically in the `raw_raw_customers.sql` file.\n\nHere's the recommended change:\n```sql\n{{\n  config(freshness = {\"max_age\": \"2 hours\", \"warn_after\": \"2 hours\"})\n}}\n```\nThis sets the maximum age to 2 hours, which is the error threshold, and sets the warn-after threshold to 2 hours, as well.\n\n### Verification\n\nTo confirm that the fix worked, we can re-run the `dbt source freshness` command and verify that the `raw.raw_customers` source no longer fails the freshness check.\n\nFor example:\n```bash\ndbt source freshness\n```\nIf the fix is successful, the command should report that the `raw.raw_customers` source is fresh, without any errors or warnings.\n\n### Assumptions\n\n* The ingestion job for `raw.raw_customers` is configured to run at the same frequency as other ingestion jobs (i.e., every hour).\n* The CRM system is not experiencing any issues that would prevent data from being written to the `raw.raw_customers` table.\n\nBy addressing the freshness threshold for `raw.raw_customers`, we should be able to resolve the failure and ensure that our data warehouse reflects the latest data from the CRM system."}, {"position": 28, "item_id": "FV03-04A", "is_repeat": 0, "scenario_id": "FV03", "label": "A", "group_pos": 4, "group_size": 6, "text": "### Root cause\n`dbt build` succeeded, so model SQL and data tests passed. The failure is only the `dbt source freshness` check for `source raw.raw_customers`.\n\nThe immediate cause is that `raw.raw_customers.loaded_at` was last updated at `2026-10-13 14:56 UTC`, about 4.1 hours before the check, but its freshness threshold is `error_after: 2 hours`. Given the last 7 daily runs show `raw_customers` often ages 3–30 hours, the 2026-10-12 change in `models/staging/sources.yml` likely made the CRM source threshold too strict by aligning it with hourly loaders, even though customer sign-ups are rare and the CRM extract may not write rows hourly when there are no changes.\n\n### Fix\nDo **not** treat this as a failed dbt build/model issue. Remediate the source freshness configuration or the CRM ingestion behavior.\n\nRecommended dbt fix: revert/tune `raw_customers` freshness in `models/staging/sources.yml` to match expected CRM update behavior, rather than orders/payments. For example, set warn/error to daily-style thresholds:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_customers\n        description: One row per customer account, extracted from the CRM.\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 24\n            period: hour\n          error_after:\n            count: 48\n            period: hour\n        columns:\n          - name: customer_id\n            data_type: integer\n            description: CRM primary key of the customer.\n          - name: first_name\n            data_type: varchar\n          - name: last_name\n            data_type: varchar\n          - name: email\n            data_type: varchar\n          - name: country\n            data_type: varchar\n          - name: created_at\n            data_type: timestamp\n          - name: loaded_at\n            data_type: timestamp\n```\n\nIf the business requirement is truly “CRM loader must prove it ran hourly,” then the fix belongs outside dbt: change the CRM ingestion job to update/write a heartbeat or refresh `loaded_at` on `raw.raw_customers` every hour, even when there are no new or changed customers. In that case, keep the 1h/2h threshold.\n\nAlso notify owners of downstream exposures that customer data is stale by about 4 hours:\n- `finance_revenue_dashboard`\n- `marketing_customer_dashboard`\n\nImpact should be limited to customer attributes and customer-count/LTV dimensions; orders/payments freshness passed.\n\n### Verification\nAfter changing the dbt freshness threshold, run:\n\n```bash\ndbt source freshness --select source:raw.raw_customers\n```\n\nExpected result: `PASS` if current `max(loaded_at)` is within the new `error_after` threshold, e.g. 4.1h old passes a 48h error threshold.\n\nOptionally confirm the source timestamp directly:\n\n```sql\nselect\n  max(loaded_at) as max_loaded_at,\n  current_timestamp as checked_at,\n  date_diff('hour', max(loaded_at), current_timestamp) as age_hours\nfrom ecommerce.raw.raw_customers;\n```\n\nExpected result: `age_hours` is below the configured `error_after` threshold.\n\nThen run:\n\n```bash\ndbt build --select source:raw.raw_customers+ \ndbt source freshness --select source:raw.raw_customers\n```\n\nExpected result: build still passes, and freshness for `raw_customers` no longer errors under normal CRM cadence.\n\nIf instead the ingestion job is changed to update hourly, verify:\n\n```sql\nselect max(loaded_at) as max_loaded_at\nfrom ecommerce.raw.raw_customers;\n```\n\nExpected result: `max_loaded_at` is within 2 hours of the check time, then `dbt source freshness` passes with the existing 1h/2h setting.\n\n### Assumptions\n- The CRM ingestion may only write rows when customer records are created or changed, not every hour.\n- The low customer sign-up volume, 0–2 per day, explains why `max(loaded_at)` can be several hours old without meaning the warehouse models are broken.\n- The 2026-10-12 freshness change in `models/staging/sources.yml` is the likely trigger because recent history shows `raw_customers` commonly exceeds 2 hours.\n- Business stakeholders can tolerate up to 24–48 hours of CRM customer-source freshness, similar to the prior July incident threshold behavior."}, {"position": 29, "item_id": "FV03-02A", "is_repeat": 0, "scenario_id": "FV03", "label": "A", "group_pos": 5, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is that the `raw.raw_customers` source has stale data, as its `loaded_at` timestamp is 4.1 hours before the scheduled check, exceeding the allowed 2-hour threshold for an error. This is not the case for the `raw.raw_orders` and `raw.raw_payments` sources, which are fresh enough.\n\n### Fix\n\nTo resolve the issue, we need to increase the allowed threshold for the `raw.raw_customers` source to avoid the error. We can do this by updating the `max_lag_hours` configuration in the `profiles.yml` file, which is responsible for setting the freshness thresholds for each source.\n\nHere's the YAML change:\n```yaml\nraw:\n  raw_customers:\n    max_lag_hours: 2.1  # Increase the allowed threshold to 2.1 hours\n```\n### Verification\n\nTo verify the fix, we can re-run the `dbt source freshness` command and check that the `raw.raw_customers` source is no longer flagged as stale. We can also verify that the other sources (`raw.raw_orders` and `raw.raw_payments`) continue to pass their freshness checks.\n\nWe can re-run the `dbt source freshness` command and check the output for any errors or warnings.\n\n### Assumptions\n\nAssuming that the data ingestion jobs are running correctly and the `loaded_at` timestamp in the `raw.raw_customers` source is accurate."}, {"position": 30, "item_id": "FV03-02B", "is_repeat": 0, "scenario_id": "FV03", "label": "B", "group_pos": 6, "group_size": 6, "text": "### Root cause\nThe `dbt build` is green because dbt only tests the rows that exist; it cannot know that new rows stopped arriving. Only the freshness check caught the real problem: `raw.raw_customers` has had no new load since 14:56 UTC (about 4.1 h stale at check time), while orders and payments loaded at 18:05. Since all three come from the same hourly ingestion, the likely cause is that the CRM ingestion job failed, stalled or was skipped, and nothing upstream alerted. Downstream marts that join customers (e.g. order or revenue models by customer) are therefore built on a stale customer snapshot, while the orders and payments they join to are current. That gap can silently produce missing or outdated customer attributes without any test failing.\n\ndbt itself is almost certainly not at fault: the model and test results are clean and the other two sources are fresh.\n\n### Fix\n1. **Outside dbt (primary fix):** investigate and repair the CRM → `raw.raw_customers` ingestion job. Check its scheduler logs for the first failed or missing run after ~14:56 UTC (credentials/token expiry, CRM API rate limit or outage, schema change, stuck run). Re-run it, and backfill any missed window if the job is not idempotent. Add failure alerting to the ingestion job itself so it does not rely on the dbt freshness check.\n\n2. **In dbt (detection/guardrails):** make the freshness result block downstream work and surface earlier. Confirm the source definition (e.g. `models/staging/_sources.yml`) declares freshness and the correct timestamp column:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    loaded_at_field: loaded_at\n    tables:\n      - name: raw_customers\n        freshness:\n          warn_after: {count: 1, period: hour}\n          error_after: {count: 2, period: hour}\n      - name: raw_orders\n        freshness:\n          warn_after: {count: 6, period: hour}\n          error_after: {count: 12, period: hour}\n      - name: raw_payments\n        freshness:\n          warn_after: {count: 6, period: hour}\n          error_after: {count: 12, period: hour}\n```\n\nIn the scheduler, run `dbt source freshness` **before** `dbt build` and stop the pipeline (or at least alert and skip customer-dependent marts) when it exits non-zero, e.g.:\n\n```bash\ndbt source freshness && dbt build\n```\n\nAlternatively, select only models not downstream of the stale source: `dbt build --exclude source:raw.raw_customers+`.\n\n### Verification\n1. After the ingestion fix, confirm new rows landed:\n```sql\nselect max(loaded_at), now() - max(loaded_at) as age from raw.raw_customers;\n```\nExpected: `max(loaded_at)` within the last hour (age < 1 h).\n2. Run `dbt source freshness`: expect all three sources PASS and exit code 0.\n3. Run `dbt build`: expect all tests pass, and customer-dependent marts reflect the newly loaded customers.\n4. Next hourly cycle: confirm the freshness check stays green, proving the job recovered rather than being run once.\n\n### Assumptions\n- All three tables are loaded by the same hourly orchestration, but the CRM extract is a separate job/connector that can fail independently.\n- `loaded_at` is the ingestion timestamp (not a business timestamp) and is configured as `loaded_at_field` for each source; the thresholds shown in the report match the current YAML.\n- The cause is the ingestion side (not, say, a changed `loaded_at` column or a dbt misconfiguration); I have no ingestion logs to confirm which failure mode occurred.\n- File names and the existence of marts depending on `raw_customers` are illustrative; adjust to your project layout.\n- The scheduler currently runs `dbt build` and `dbt source freshness` independently and does not gate on freshness."}, {"position": 31, "item_id": "FV01-08A", "is_repeat": 0, "scenario_id": "FV01", "label": "A", "group_pos": 1, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the `raw` schema containing data that is older than the expected maximum age for freshness checks. Specifically, the `raw.raw_orders` and `raw.raw_payments` sources have data that is 24 hours older than the latest ingestion job, which exceeded the 12-hour error threshold. This indicates that the data ingestion jobs are not up to date, and dbt is reporting errors accordingly.\n\n### Fix\n\nTo fix this issue, we need to ensure that the data ingestion jobs are running successfully and consistently updating the `raw` schema. Specifically, we need to investigate and resolve the issue causing the data ingestion jobs to be delayed or not running at all.\n\nAssuming that the issue is due to a scheduling problem or a dependency issue, we can try to fix the problem by checking the job logs and adjusting the scheduling configuration to ensure that the jobs are running correctly. If the issue persists, we may need to investigate the dependencies and check for any errors or timeouts in the job execution.\n\nNo code changes are needed in the dbt project itself, as the issue is not related to the dbt models or configuration. The fix lies in resolving the underlying data ingestion issue.\n\n### Verification\n\nTo verify the fix, we can run the dbt command `dbt source freshness` again and check if the errors are resolved. Specifically, we should see that the maximum age for the `raw.raw_orders` and `raw.raw_payments` sources is within the acceptable threshold (e.g., within 6 hours of the latest ingestion job).\n\n### Assumptions\n\nI assumed that the data ingestion jobs are scheduled to run hourly and that the issue is not related to any specific dbt model or configuration. I also assumed that the scheduling system and job logs are available for investigation and that the dependencies for the data ingestion jobs are properly configured."}, {"position": 32, "item_id": "FV01-05A", "is_repeat": 0, "scenario_id": "FV01", "label": "A", "group_pos": 2, "group_size": 6, "text": "### Root cause\nThis is an upstream ingestion stall, not a dbt defect. `raw_orders` and `raw_payments` (both fed from the web shop and payment provider) stopped receiving rows at 2026-10-12 19:05 UTC. `raw_customers` (CRM) kept loading, so the ingestion platform and warehouse are healthy, and the failure is specific to the shop/payment feeds. Both tables stalled at the identical timestamp, which points to one shared cause. The best-supported candidate is the SEC-58 credential rotation of the shop read replica on 2026-10-12: the ingestion connector for the shop is likely still using the old credentials and failing authentication. (The payment feed stalling at the same instant is not explained by that ticket alone; see Assumptions.)\n\n`dbt build` passed (30/30) because tests only validate the stale data that exists; they cannot detect missing new data. Only the freshness check caught this. Consequence: `fct_orders` and `dim_customers` are built on data that is 24 h old, so the finance dashboard (refreshed 07:00 UTC) and marketing dashboard show incomplete revenue and orders. The models are structurally correct, and no dbt code change is needed.\n\n### Fix\nThe fix belongs outside the dbt project, in the ingestion layer:\n\n1. Check the ingestion job/connector logs for the shop (`raw_orders`) and payment (`raw_payments`) loads, starting from 2026-10-12 19:05 UTC. Look for authentication errors.\n2. Update the shop read-replica connection credentials in the ingestion tool's secret store to the values rotated under SEC-58, then resume or re-run the connector. For payments, check the logs for its own failure (expired API key, paused job, or shared scheduler/worker failure) and fix that separately if it is not credential-related.\n3. Ensure the load backfills the ~24 missing hours (as in INC-0359) or trigger a manual backfill from 2026-10-12 19:05 UTC onward. Make sure no gap or duplicate rows result.\n4. Once fresh data lands, rebuild downstream: `dbt build --select source:raw.raw_orders+ source:raw.raw_payments+` (stg_orders, stg_payments, fct_orders, dim_customers), then refresh the Finance dashboard and notify Finance analytics and Marketing analytics that figures for 2026-10-12 evening onward were stale.\n5. Prevention: add the ingestion jobs to the credential-rotation checklist for SEC-type tickets, and alert on ingestion job failure (or on the freshness warn threshold, 6 h) so the on-call is paged well before the 12 h error threshold. No YAML change to the freshness thresholds is needed; they worked as designed.\n\n### Verification\nRun, after the connector is fixed and the backfill completes:\n\n```\ndbt source freshness\n```\nExpected: all three sources PASS, with `raw_orders` and `raw_payments` ages under 6 h (the normal 0.5–1.5 h) and exit code 0.\n\nCheck continuity of the backfill:\n```sql\nselect date_trunc('hour', loaded_at) as h, count(*)\nfrom ecommerce.raw.raw_orders\nwhere loaded_at >= timestamp '2026-10-12 18:00'\ngroup by 1 order by 1;\n```\nExpected: rows in every hour since 2026-10-12 19:00, with no gap. Run the same for `raw_payments`.\n\nThen run `dbt build --select +fct_orders +dim_customers`. Expected: all tests pass, `fct_orders` row count equals `stg_orders` row count (one row per order), and `max(order_date)` in `fct_orders` is 2026-10-13.\n\n### Assumptions\n- The SEC-58 credential rotation is the cause. This is a hypothesis: the logs are not provided, and the rotation touched only the shop replica, so it does not on its own explain the payments stall. The two feeds may share an orchestrator, worker or schedule, or have a separate failure at the same time.\n- Ingestion runs on a separate tool or scheduler outside dbt, with its own logs and secret store.\n- The connector can backfill missed hours after resuming, as in INC-0359.\n- The source systems themselves are up and had orders and payments during the gap, so the stall is not a genuine lack of activity.\n- `loaded_at` reflects ingestion writes accurately."}, {"position": 33, "item_id": "FV01-08C", "is_repeat": 0, "scenario_id": "FV01", "label": "C", "group_pos": 3, "group_size": 6, "text": "### Root cause\n`dbt build` passed, so the staging/mart models and data tests succeeded. The failure is isolated to `dbt source freshness`.\n\nThe `raw.raw_orders` and `raw.raw_payments` sources are stale: their `max(loaded_at)` is `2026-10-12 19:05 UTC`, about 24 hours before the freshness check. Their freshness policy is `warn_after: 6 hours` and `error_after: 12 hours`, so both correctly errored. `raw.raw_customers` is fresh enough and passed.\n\nThis most likely means the hourly ingestion jobs for web shop orders and payment-provider payments stopped loading new rows or stopped updating the `loaded_at` column after `2026-10-12 19:05 UTC`.\n\n### Fix\nFix the upstream ingestion outside the dbt project:\n\n- Web shop ingestion job that writes to `raw.raw_orders`\n- Payment-provider ingestion job that writes to `raw.raw_payments`\n- Ensure both jobs resume hourly loads into the `raw` schema\n- Ensure the `loaded_at` column is populated with the actual ingestion/load timestamp in UTC\n\nNo dbt model change is indicated by the report. The relevant dbt source freshness configuration should remain as-is unless the 6h/12h SLA is intentionally too strict.\n\nExample expected source YAML, to confirm the configuration is pointing at the right freshness column:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_orders\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 6\n            period: hour\n          error_after:\n            count: 12\n            period: hour\n\n      - name: raw_payments\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 6\n            period: hour\n          error_after:\n            count: 12\n            period: hour\n\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 24\n            period: hour\n          error_after:\n            count: 48\n            period: hour\n```\n\nIf the ingestion jobs did run but no rows arrived because there were genuinely no new orders or payments, the remediation depends on the intended freshness semantics: either load heartbeat/update records with current `loaded_at`, or relax/change the freshness check to use an ingestion audit table rather than business-event rows.\n\n### Verification\nFirst check the raw tables directly:\n\n```sql\nselect\n  'raw_orders' as table_name,\n  max(loaded_at) as max_loaded_at,\n  count(*) as row_count\nfrom raw.raw_orders\n\nunion all\n\nselect\n  'raw_payments' as table_name,\n  max(loaded_at) as max_loaded_at,\n  count(*) as row_count\nfrom raw.raw_payments;\n```\n\nExpected result: `max_loaded_at` for both tables is within the last 6 hours for a clean pass, and definitely within the last 12 hours to avoid an error.\n\nThen rerun freshness:\n\n```bash\ndbt source freshness --select source:raw.raw_orders source:raw.raw_payments\n```\n\nExpected result:\n\n- `PASS` for `source raw.raw_orders`\n- `PASS` for `source raw.raw_payments`\n- exit code `0`\n\nOptionally rerun the full scheduled checks:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: both commands exit `0`; all models/tests pass and all sources pass freshness.\n\n### Assumptions\n- `loaded_at` is the configured `loaded_at_field` for all three sources.\n- The freshness check ran around `2026-10-13 19:05 UTC`.\n- The shop normally receives or ingests orders and payments at least every few hours.\n- `raw.raw_orders` is loaded by the web shop ingestion job, and `raw.raw_payments` is loaded by the payment-provider ingestion job.\n- There was no intentional maintenance window or pause of the orders/payments ingestion pipelines."}, {"position": 34, "item_id": "FV01-01A", "is_repeat": 0, "scenario_id": "FV01", "label": "A", "group_pos": 4, "group_size": 6, "text": "### Root cause\n`dbt build` passed only because it tests the data that exists; it never checks whether new data is arriving. The freshness check shows that `raw_orders` and `raw_payments` have received no new rows since 2026-10-12 19:05 UTC (24.0 h), while `raw_customers` loaded 4.1 h ago. The identical max(`loaded_at`) on both tables suggests one shared upstream event at that moment: the web shop and payment provider ingestion jobs stopped or failed together, while the CRM job kept running. This is an ingestion problem outside dbt, not a model or test defect. Every mart built today therefore reflects stale orders and payments, silently, even though the build is green. The 24 h gap is double the 12 h error threshold, so roughly 10+ hourly runs were missed.\n\n### Fix\n1. **Outside the dbt project (the actual fix):** investigate and restart the hourly ingestion jobs that load `raw.raw_orders` and `raw.raw_payments` in the orchestrator/scheduler (check job logs, credentials/API tokens for the shop and payment provider, and any schema change on their side around 2026-10-12 19:00 UTC). Once running, backfill the missed window. Ingestion should be idempotent (e.g. upsert on `order_id`/`payment_id`) to avoid duplicates, especially for `raw_payments`, where multiple rows per order are legitimate and only `payment_id` is unique.\n2. **Re-run dbt after the backfill** so staging views and marts refresh.\n3. **Prevent silent staleness (dbt side):** make the scheduled job run freshness as a gate, not a side step, so stale data fails the pipeline before marts are published and alerts reach on-call:\n\n```\ndbt source freshness && dbt build\n```\n\n(If the orchestrator supports it, run `dbt build --select source_status:fresher+` after `dbt source freshness` so only models with new upstream data rebuild.) The existing thresholds in the source YAML (warn 6 h / error 12 h, `loaded_at_field: loaded_at`) are sensible for an hourly load and need no change.\n\n### Verification\nAfter the ingestion jobs are restored and backfilled:\n\n```sql\nselect 'raw_orders' as src, max(loaded_at) as max_loaded_at from raw.raw_orders\nunion all\nselect 'raw_payments', max(loaded_at) from raw.raw_payments;\n```\n\nExpected: both values within roughly the last hour, with rows present for the gap period (2026-10-12 19:05 UTC onward). A quick completeness check, e.g. `select date_trunc('hour', loaded_at) h, count(*) from raw.raw_orders where loaded_at >= '2026-10-12 19:00' group by 1 order by 1`, should show no empty hours, aside from genuinely quiet shop periods.\n\nThen run:\n\n```\ndbt source freshness\ndbt build\n```\n\nExpected: freshness exits 0 with `raw_orders`/`raw_payments` PASS (well under 6 h) and `raw_customers` still PASS; `dbt build` again passes all 30 nodes with exit code 0.\n\n### Assumptions\n- The upstream ingestion jobs (not dbt, DuckDB, or the `loaded_at` column definition) caused the stall; I have no job logs to confirm this. The shared 19:05 timestamp is the evidence.\n- `loaded_at` is populated correctly by the ingestion job, so a stale value means no new rows, not a broken timestamp.\n- The shop was actually trading during the gap (a night-time lull alone wouldn't explain it, since `loaded_at` reflects job writes, not order times; but if the job only writes when new data exists, a true zero-order period would look the same).\n- Ingestion can safely backfill the missed window and is idempotent.\n- The scheduler can chain commands and alert on non-zero exit codes."}, {"position": 35, "item_id": "FV01-01B", "is_repeat": 0, "scenario_id": "FV01", "label": "B", "group_pos": 5, "group_size": 6, "text": "### Root cause\n`dbt build` succeeded, so the modeled data and tests that ran are currently passing. The failure is only from `dbt source freshness`: `raw.raw_orders` and `raw.raw_payments` have not received newer rows since `2026-10-12 19:05 UTC`, making them 24 hours stale at the check time. Their freshness policy errors after 12 hours, so the command correctly exited with code 1.\n\n`raw.raw_customers` is fresh enough, so this likely affects the web shop orders ingestion and payment provider ingestion, not the whole warehouse or dbt project.\n\n### Fix\nFix the upstream hourly ingestion jobs that write to these raw tables:\n\n- Source: `raw.raw_orders`\n  - Warehouse table: `\"ecommerce\".\"raw\".\"raw_orders\"`\n  - Freshness column: `loaded_at`\n- Source: `raw.raw_payments`\n  - Warehouse table: `\"ecommerce\".\"raw\".\"raw_payments\"`\n  - Freshness column: `loaded_at`\n\nRemediation outside dbt:\n\n1. Check and restart/rerun the ingestion job for web shop orders that loads `\"ecommerce\".\"raw\".\"raw_orders\"`.\n2. Check and restart/rerun the ingestion job for payment provider payments that loads `\"ecommerce\".\"raw\".\"raw_payments\"`.\n3. Backfill any missing data from after `2026-10-12 19:05 UTC`.\n4. Ensure newly inserted rows set `loaded_at` to the UTC ingestion timestamp.\n\nNo dbt model or source YAML change is indicated by the report. The configured freshness thresholds are working as intended:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_orders\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 6\n            period: hour\n          error_after:\n            count: 12\n            period: hour\n\n      - name: raw_payments\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 6\n            period: hour\n          error_after:\n            count: 12\n            period: hour\n```\n\nOnly change these thresholds if the business intentionally accepts orders/payments being more than 12 hours old; based on the metadata, that does not appear to be the desired fix.\n\n### Verification\nFirst confirm the raw tables have fresh rows after rerunning ingestion:\n\n```sql\nselect\n  'raw_orders' as source_table,\n  max(loaded_at) as max_loaded_at,\n  datediff('hour', max(loaded_at), current_timestamp) as hours_old\nfrom \"ecommerce\".\"raw\".\"raw_orders\"\n\nunion all\n\nselect\n  'raw_payments' as source_table,\n  max(loaded_at) as max_loaded_at,\n  datediff('hour', max(loaded_at), current_timestamp) as hours_old\nfrom \"ecommerce\".\"raw\".\"raw_payments\";\n```\n\nExpected result: both `max_loaded_at` values are recent, ideally from the current hourly load, and `hours_old < 6`.\n\nThen rerun dbt source freshness:\n\n```bash\ndbt source freshness --select source:raw.raw_orders source:raw.raw_payments\n```\n\nExpected result:\n\n- `PASS` for `source raw.raw_orders`\n- `PASS` for `source raw.raw_payments`\n- exit code `0`\n\nOptionally rerun the full scheduled workflow:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: both commands exit `0`.\n\n### Assumptions\n- The `loaded_at` column is populated by the ingestion jobs, not by dbt.\n- The `2026-10-12 19:05 UTC` timestamp is the last successful ingestion time for both orders and payments.\n- The freshness thresholds of warn after 6 hours and error after 12 hours are intentional.\n- There was no hidden dbt model failure because `dbt build` reported 30 passed and exit code 0."}, {"position": 36, "item_id": "FV01-05B", "is_repeat": 0, "scenario_id": "FV01", "label": "B", "group_pos": 6, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is the age of the source data in `raw.raw_orders` and `raw.raw_payments`. Both sources have exceeded their configured freshness thresholds: `raw.raw_orders` is 24 hours old, while `raw.raw_payments` is also 24 hours old. This means that the data in these tables is stale, and the scheduled dbt run is failing to detect this staleness.\n\n### Fix\n\nTo fix this issue, we need to backfill the missing data in `raw.raw_orders` and `raw.raw_payments` to bring their freshness up to the current time. We can do this by running the ingestion jobs again to load the missing data. This will update the `loaded_at` timestamp in both tables, bringing their freshness up to the current time.\n\nTo prevent this issue from happening in the future, we can also configure the freshness thresholds to be more aggressive, such as warning after 3 hours and erroring after 6 hours.\n\n### Verification\n\nTo verify that the fix worked, we can run the following dbt command:\n```\ndbt source freshness\n```\nThis command will check the freshness of all sources, including `raw.raw_orders` and `raw.raw_payments`. If the fix is successful, the command should report that both sources are up to date and fresh.\n\n### Assumptions\n\nI assumed that the ingestion jobs are configured to load data from the web shop, payment provider, and CRM into the `raw` schema every hour. I also assumed that the freshness thresholds are configured correctly in the dbt project, and that the data in the `raw` tables is not corrupted or missing."}, {"position": 37, "item_id": "SD02-05B", "is_repeat": 0, "scenario_id": "SD02", "label": "B", "group_pos": 1, "group_size": 6, "text": "### Root cause\n`dbt build` failed while running the `not_null` test on `stg_orders.order_date`, but the real problem is upstream of the test: the `stg_orders` view casts `raw.raw_orders.order_date` to `DATE` using `cast(order_date as date)`. At least one raw row contains `order_date = '10/10/2026'`, which does not match DuckDB’s default expected date format `YYYY-MM-DD`, so querying the view errors before the `not_null` predicate can be evaluated.\n\nSource freshness passed, so this is not a stale ingestion issue. It is a data format/parsing issue in `raw.raw_orders.order_date` or in the staging model’s date normalization logic.\n\n### Fix\nFix the date format at the ingestion boundary if possible: the job loading `raw.raw_orders.order_date` into the `raw` schema should write dates consistently as ISO `YYYY-MM-DD`, or load the column as a proper `DATE` type.\n\nIf the raw source can contain multiple valid date formats, make `models/staging/stg_orders.sql` parse them explicitly instead of using a single implicit cast.\n\nReplace:\n\n```sql\ncast(order_date as date) as order_date\n```\n\nwith something like:\n\n```sql\ncoalesce(\n    try_strptime(order_date, '%Y-%m-%d')::date,\n    try_strptime(order_date, '%m/%d/%Y')::date\n) as order_date\n```\n\nFull model:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_orders') }}\n\n),\n\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        coalesce(\n            try_strptime(order_date, '%Y-%m-%d')::date,\n            try_strptime(order_date, '%m/%d/%Y')::date\n        ) as order_date,\n        status,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```\n\nFile: `models/staging/stg_orders.sql`  \nColumn affected: `order_date`  \nSource affected: `raw.raw_orders.order_date`\n\nOptionally, add a source-level data quality test to catch unparseable raw dates before they break downstream models. For example, create a custom test or dbt-utils expression test, if available, checking that `raw.raw_orders.order_date` matches one of the accepted formats.\n\n### Verification\nFirst, inspect the bad raw values:\n\n```sql\nselect order_id, order_date, loaded_at\nfrom raw.raw_orders\nwhere try_strptime(order_date, '%Y-%m-%d') is null\n  and try_strptime(order_date, '%m/%d/%Y') is null;\n```\n\nExpected result after the model change: zero rows for unparseable dates, assuming only ISO and `MM/DD/YYYY` are valid.\n\nThen run the affected model and its tests:\n\n```bash\ndbt build --select stg_orders+\n```\n\nExpected result: `stg_orders`, downstream models such as `dim_customers` and `fct_orders`, and their tests build successfully. The `not_null_stg_orders_order_date` test should pass rather than error.\n\nYou can also directly validate the staged column:\n\n```sql\nselect count(*) as null_order_dates\nfrom main.stg_orders\nwhere order_date is null;\n```\n\nExpected result: `0`, provided every raw order has a valid populated date.\n\nFinally, rerun the scheduled commands:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: no dbt build errors, no skipped downstream nodes due to `stg_orders`, and source freshness still passing.\n\n### Assumptions\nThe value `\"10/10/2026\"` represents October 10, 2026 in `MM/DD/YYYY` format, not another locale-specific format such as `DD/MM/YYYY`.\n\n`raw.raw_orders.order_date` is stored as a string-like column in DuckDB, or at least arrives in a form that requires parsing in `stg_orders`.\n\nOnly `YYYY-MM-DD` and `MM/DD/YYYY` are intended valid formats unless the ingestion owner confirms additional formats.\n\nThe preferred long-term contract is to store `raw.raw_orders.order_date` consistently as ISO-formatted text or as a native `DATE` before dbt staging."}, {"position": 38, "item_id": "SD02-03C", "is_repeat": 0, "scenario_id": "SD02", "label": "C", "group_pos": 2, "group_size": 6, "text": "### Root cause\nThe failure is not a null-check failure. The `not_null_stg_orders_order_date` test errored at runtime because `stg_orders` (a view) casts the raw order date to `DATE`, and at least one row in `raw.raw_orders` now carries the value `10/10/2026`, which DuckDB cannot cast (it expects `YYYY-MM-DD`). The cast is evaluated lazily when the view is queried, so the staging view built fine, but the test that scans it failed. The 13 skipped nodes (`dim_customers`, `fct_orders` and their tests) were blocked by that upstream error. Source freshness passed, so ingestion is running; the problem is a format change or a bad record in the data being loaded. Note that `10/10/2026` is ambiguous (DD/MM or MM/DD), so a blanket re-parse cannot be trusted without confirming the upstream format.\n\n### Fix\n1. **Immediate (dbt):** make `stg_orders` tolerant of bad dates instead of failing the whole run. In `models/staging/stg_orders.sql`, replace the plain cast with a `try_cast`, and handle the known alternative format explicitly only after confirming its meaning (see assumptions):\n\n```sql\n-- models/staging/stg_orders.sql (excerpt)\ncoalesce(\n    try_cast(order_date as date),\n    try_strptime(order_date, '%d/%m/%Y')::date   -- only if source confirms DD/MM/YYYY\n) as order_date\n```\n\nIf the format is unconfirmed, use only `try_cast(order_date as date)`. That turns the bad rows into NULLs, so the existing `not_null` test fails cleanly (a data failure with a clear row count) instead of erroring, and the offending rows can be quarantined.\n\n2. **Keep the test:** leave `not_null` on `stg_orders.order_date` in `models/staging/schema.yml`. Optionally add `config: {severity: warn}` temporarily, plus a singular test that selects `raw_orders` rows where `try_cast(order_date as date) is null` so the offending raw values are visible.\n\n3. **Root fix (outside dbt):** the owner of the web shop ingestion job should emit order dates in ISO `YYYY-MM-DD` (or a proper timestamp type) consistently and explain why the format changed. Until then, a source-side schema or contract check on `raw.raw_orders.order_date` is worth adding.\n\n### Verification\n- Find the bad rows:\n```sql\nselect order_date, count(*)\nfrom raw.raw_orders\nwhere try_cast(order_date as date) is null\ngroup by 1;\n```\n- Rebuild the affected path: `dbt build --select stg_orders+`. Expected: `stg_orders`, `dim_customers`, `fct_orders` and all their tests run, none skipped; `not_null_stg_orders_order_date` passes (zero NULLs) once the dates are parsed correctly, or fails with a row count if unparseable values remain.\n- Sanity check on parsed dates: `select min(order_date), max(order_date) from stg_orders;` should fall in a plausible range, with no days/months swapped (e.g., no future-dated orders).\n- Then run the full `dbt build` and `dbt source freshness`; expect exit code 0.\n\n### Assumptions\n- `raw.raw_orders.order_date` is stored as text (VARCHAR) and `stg_orders` casts it to `DATE`; the report does not show the model SQL.\n- The failing value is a format change, not a single typo; the count of affected rows is unknown.\n- `10/10/2026` is ambiguous, so I assumed DD/MM/YYYY only as a candidate; it must be confirmed with the ingestion owner before using the `strptime` fallback.\n- No other date columns or models share the same cast.\n- Dropping or NULLing bad rows in staging is acceptable short term, with the rows reviewed and reloaded once the source is fixed."}, {"position": 39, "item_id": "SD02-08A", "is_repeat": 0, "scenario_id": "SD02", "label": "A", "group_pos": 3, "group_size": 6, "text": "### Root cause\nThe web shop's locale switch (SHOP-219, 2026-10-10) changed the date format in the raw export. `raw.raw_orders.order_date` is a VARCHAR, and new rows now arrive as `DD/MM/YYYY` (e.g. `10/10/2026`) instead of ISO `YYYY-MM-DD`. `stg_orders` is a view that does `cast(order_date as date)`, which DuckDB only accepts for ISO strings. The view is evaluated lazily, so the error surfaced when the `not_null` test queried it, and `dim_customers` and `fct_orders` were skipped. It is not a freshness problem (ingestion is current) and not a data-volume problem. The test only failed on the third day after the change, plausibly because the earlier runs' tests passed before any non-ISO rows were loaded or the cast was not exercised on them (assumption). Note: `10/10/2026` is ambiguous between DD/MM and MM/DD, so the format must be confirmed.\n\n### Fix\n**1. Immediate (dbt):** make `stg_orders` tolerant of both formats, using `try_strptime` so an unparseable value becomes NULL (and is caught by `not_null`) instead of crashing the model. Edit `models/staging/stg_orders.sql`:\n\n```sql\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        cast(\n            coalesce(\n                try_strptime(order_date, '%Y-%m-%d'),   -- legacy en-US/ISO rows\n                try_strptime(order_date, '%d/%m/%Y')    -- en-ZA rows since 2026-10-10\n            ) as date\n        ) as order_date,\n        status,\n        loaded_at\n    from source\n\n)\n```\n\nDo not add `%m/%d/%Y` as a fallback: it would silently misparse en-ZA dates such as 10/10 vs 03/10. Because en-ZA formatting is day-first, rows like `13/10/2026` would also fail an MM/DD parse, so a single explicit `%d/%m/%Y` is the safe choice.\n\n**2. Root fix (outside dbt):** ask the web shop/ingestion owners to export `order_date` as ISO 8601 regardless of store locale (or load it as a DATE), and to confirm what the format is for any previously loaded non-ISO rows. Once done, the fallback can be removed.\n\n**3. Optional guard:** add a test (e.g. `dbt_expectations.expect_column_values_to_match_regex` on `raw_orders.order_date`, or a singular test) so a format change is flagged at the source rather than in staging.\n\n**4. Recovery:** after merging, re-run so `dim_customers`, `fct_orders` and the dashboards (Finance refresh at 07:00 UTC) are rebuilt before stand-up.\n\n### Verification\n1. Confirm the offending values and that all parse:\n```sql\nselect order_date, count(*) from raw.raw_orders\nwhere try_strptime(order_date,'%Y-%m-%d') is null group by 1;   -- non-ISO rows\n\nselect count(*) from stg_orders where order_date is null;       -- expect 0\nselect min(order_date), max(order_date) from stg_orders;        -- max should be ~2026-10-13\n```\n2. Run `dbt build --select stg_orders+` (includes downstream `dim_customers`, `fct_orders` and their tests). Expected: exit code 0, no errors, nothing skipped, and `row_count_between` (500–1,000) still passing.\n3. Spot-check that `10/10/2026` became `2026-10-10` and that `fct_orders` still has one row per order (`unique` test on `order_id`).\n4. Next scheduled run passes, and `dbt source freshness` remains green.\n\n### Assumptions\n- The new format is `DD/MM/YYYY`, based on the en-ZA locale. This must be confirmed with the shop team or by inspecting rows with day values >12.\n- Only `order_date` is affected; other columns (including amounts, which en-ZA may format with decimal commas elsewhere) are unchanged. Payment amounts come from the payment provider and are not impacted per the info given.\n- Rows loaded before 2026-10-10 are ISO formatted.\n- `try_strptime` is available in the DuckDB version used (it is in current releases).\n- No other models read `raw_orders.order_date` directly."}, {"position": 40, "item_id": "SD02-05A", "is_repeat": 0, "scenario_id": "SD02", "label": "A", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\nThe failure is due to an invalid date field format in the `stg_orders` model. The error message indicates that the format \"10/10/2026\" is not recognized, and dbt expects the format to be \"YYYY-MM-DD\" when casting the `order_date` column. This is likely because the data in the `raw_orders` table is not in the expected format.\n\n### Fix\n\nTo fix this issue, the `order_date` column needs to be cast to the expected format in the `stg_orders` model. This can be done by updating the `stg_orders.sql` file to include the correct cast statement. The updated SQL would be:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_orders') }}\n\n),\n\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        cast(to_char(order_date, 'YYYY-MM-DD') as date) as order_date,\n        status,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```\n\nIn this updated SQL, the `to_char` function is used to convert the `order_date` column to the expected format, which is then cast to a date type.\n\n### Verification\n\nTo verify that the fix worked, you can run the following dbt command:\n\n```\ndbt test\n```\n\nThis command will re-run all the tests, including the one that failed earlier. If the fix was successful, the test should now pass.\n\n### Assumptions\n\nIt is assumed that the issue is specific to the `order_date` column in the `raw_orders` table, and that the other columns in the table are in the expected format. It is also assumed that the `raw_orders` table is the source of truth for the `order_date` column, and that any issues with the data in this table need to be addressed before the `stg_orders` model can be re-run successfully."}, {"position": 41, "item_id": "SD02-08B", "is_repeat": 0, "scenario_id": "SD02", "label": "B", "group_pos": 5, "group_size": 6, "text": "### Root cause\n`raw.raw_orders.order_date` is a `VARCHAR`, and `models/staging/stg_orders.sql` casts it with `cast(order_date as date)`. Today the raw data contains at least one value in `MM/DD/YYYY` format, e.g. `\"10/10/2026\"`, while DuckDB’s plain `cast(... as date)` expects `YYYY-MM-DD`. Because `stg_orders` is a view, the cast is evaluated when the `not_null` test queries the view, so the test errors before it can check for nulls.\n\nThe likely trigger is the 2026-10-10 shop locale change from `en-US` to `en-ZA`, which appears to have changed the exported date string format or exposed a non-ISO date format in `raw.raw_orders.order_date`. Since `stg_orders` is upstream of `dim_customers` and `fct_orders`, those models and their dependent tests were skipped.\n\n### Fix\nBest fix: change the web shop ingestion/export for `raw.raw_orders.order_date` to write an unambiguous ISO date string, `YYYY-MM-DD`, or a real date type, before data lands in the `raw` schema. This belongs outside dbt in the ingestion job for `raw.raw_orders.order_date`.\n\nAlso make `stg_orders` robust to the known raw formats. Update `models/staging/stg_orders.sql` to parse both ISO and slash-delimited dates explicitly:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_orders') }}\n\n),\n\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        coalesce(\n            try_strptime(order_date, '%Y-%m-%d')::date,\n            try_strptime(order_date, '%m/%d/%Y')::date\n        ) as order_date,\n        status,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```\n\nIf the shop now emits `DD/MM/YYYY` rather than `MM/DD/YYYY`, use `'%d/%m/%Y'` instead of, or before, `'%m/%d/%Y'`. Do not silently include both slash formats unless the business confirms how ambiguous dates like `10/10/2026` should be interpreted.\n\nAfter the parser change, the existing `not_null` test on `stg_orders.order_date` should continue to catch unparseable date strings, because they will become null instead of causing a runtime cast error.\n\n### Verification\nFirst identify the raw formats currently present:\n\n```sql\nselect\n  order_date,\n  count(*) as rows\nfrom raw.raw_orders\nwhere loaded_at >= timestamp '2026-10-10'\ngroup by 1\norder by 1;\n```\n\nOptionally check which values would fail the intended parser:\n\n```sql\nselect order_id, order_date, loaded_at\nfrom raw.raw_orders\nwhere coalesce(\n  try_strptime(order_date, '%Y-%m-%d')::date,\n  try_strptime(order_date, '%m/%d/%Y')::date\n) is null;\n```\n\nExpected result: zero rows, unless there are genuinely bad or missing dates that need source-data remediation.\n\nThen run the affected dbt path:\n\n```bash\ndbt build --select source:raw.raw_orders+ --exclude source:*\n```\n\nor more narrowly:\n\n```bash\ndbt build --select stg_orders+ \n```\n\nExpected result: `stg_orders`, `dim_customers`, `fct_orders`, and their tests pass; no runtime conversion error from `stg_orders.order_date`.\n\nFinally run freshness:\n\n```bash\ndbt source freshness --select source:raw.raw_orders\n```\n\nExpected result: `raw.raw_orders` freshness still passes.\n\n### Assumptions\n- The raw value `\"10/10/2026\"` is intended to mean October 10, 2026, matching `MM/DD/YYYY`; this must be confirmed because it is ambiguous.\n- The ingestion job can be changed to emit ISO `YYYY-MM-DD` dates or a native date type.\n- Existing downstream models expect `stg_orders.order_date` to remain a DuckDB `DATE`.\n- No other columns were changed by the locale switch, though currency and numeric formatting should be checked separately because SHOP-219 mentioned currency display as well as date formats."}, {"position": 42, "item_id": "SD02-03A", "is_repeat": 0, "scenario_id": "SD02", "label": "A", "group_pos": 6, "group_size": 6, "text": "### Root cause\n\nThe failure is due to an invalid date format in the `stg_orders.order_date` column. The `not_null_stg_orders_order_date` test is failing because it's trying to cast the `order_date` column to a date, but the format \"10/10/2026\" is not recognized as a valid date format.\n\n### Fix\n\nTo fix this issue, we need to update the `stg_orders` model to handle the incorrect date format. We can do this by specifying the correct format in the `date_format` setting in the `stg_orders` model.\n\nUpdate the `models/staging/schema.yml` file to add the following setting:\n```yaml\nstg_orders:\n  date_format: 'YYYY-MM-DD'\n```\nThis setting will tell dbt to expect dates in the \"YYYY-MM-DD\" format when processing the `stg_orders` model.\n\n### Verification\n\nTo verify that the fix worked, we can re-run the `dbt build` command and check that the `not_null_stg_orders_order_date` test is now passing.\n\nRun the following command:\n```\ndbt build\n```\nIf the test is now passing, we can proceed with re-building the staging views and mart tables.\n\n### Assumptions\n\n* The `stg_orders` model is the only one affected by this issue, and updating its `date_format` setting will resolve the problem.\n* The incorrect date format is consistent across all data loaded into the `stg_orders` table, and there are no other formats present in the data."}, {"position": 43, "item_id": "RC03-06B", "is_repeat": 0, "scenario_id": "RC03", "label": "B", "group_pos": 1, "group_size": 6, "text": "### Root cause\n\n`fct_orders` no longer preserves the intended grain of one row per order. Commit `82ffbf3` changed `models/marts/fct_orders.sql` to join `stg_orders` directly to `stg_payments` without aggregating payments first. Because some orders have multiple payment rows, the left join multiplies those orders.\n\nThat explains both failures:\n\n- `fct_orders` has 682 rows while `stg_orders` has 600 rows: +82 extra rows from one-to-many payment joins.\n- `unique_fct_orders_order_id` returned 82 duplicate `order_id` values.\n- Source freshness passed, so this is not an ingestion-delay issue.\n\nThis is the same failure pattern as prior incident `INC-0309`: payment rows must be aggregated to order grain before joining to orders.\n\n### Fix\n\nUpdate `models/marts/fct_orders.sql` so `stg_payments` is aggregated to one row per `order_id` before joining to `stg_orders`.\n\nReplace the current direct join with an `order_payments` CTE:\n\n```sql\nwith orders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\norder_payments as (\n\n    select\n        order_id,\n\n        sum(case when payment_method = 'credit_card' then amount else 0 end) as credit_card_amount,\n        sum(case when payment_method = 'bank_transfer' then amount else 0 end) as bank_transfer_amount,\n        sum(case when payment_method = 'voucher' then amount else 0 end) as voucher_amount,\n        sum(case when payment_method = 'gift_card' then amount else 0 end) as gift_card_amount,\n\n        sum(amount) as amount\n\n    from payments\n    group by order_id\n\n),\n\nfinal as (\n\n    select\n        orders.order_id,\n        orders.customer_id,\n        orders.order_date,\n        orders.status,\n\n        coalesce(order_payments.credit_card_amount, 0) as credit_card_amount,\n        coalesce(order_payments.bank_transfer_amount, 0) as bank_transfer_amount,\n        coalesce(order_payments.voucher_amount, 0) as voucher_amount,\n        coalesce(order_payments.gift_card_amount, 0) as gift_card_amount,\n        coalesce(order_payments.amount, 0) as amount\n\n    from orders\n    left join order_payments\n        on orders.order_id = order_payments.order_id\n\n)\n\nselect * from final\n```\n\nNo source freshness or ingestion change is indicated. The change belongs in the dbt model file:\n\n- `models/marts/fct_orders.sql`\n\nRecommended additional guardrail: add a test to ensure `stg_payments.payment_method` only contains expected values, if not already present.\n\nExample YAML change in the relevant staging schema YAML file:\n\n```yaml\nmodels:\n  - name: stg_payments\n    columns:\n      - name: payment_method\n        tests:\n          - accepted_values:\n              values: ['credit_card', 'bank_transfer', 'voucher', 'gift_card']\n```\n\n### Verification\n\nRun the affected model and tests:\n\n```bash\ndbt build --select stg_orders stg_payments fct_orders\n```\n\nExpected result:\n\n- `fct_orders` builds successfully.\n- `unique_fct_orders_order_id` passes with 0 duplicate rows.\n- `equal_row_count_fct_orders_ref_stg_orders_` passes.\n- `fct_orders` row count equals `stg_orders` row count: expected 600 based on the failed run.\n\nOptional SQL checks in DuckDB:\n\n```sql\nselect count(*) as stg_orders_rows\nfrom ecommerce.main.stg_orders;\n\nselect count(*) as fct_orders_rows\nfrom ecommerce.main.fct_orders;\n\nselect order_id, count(*) as n_records\nfrom ecommerce.main.fct_orders\ngroup by order_id\nhaving count(*) > 1;\n```\n\nExpected:\n\n- Both counts are equal.\n- Duplicate query returns 0 rows.\n\nAlso verify payment totals did not change unintentionally except for fixing duplication:\n\n```sql\nselect\n    sum(credit_card_amount) as credit_card_amount,\n    sum(bank_transfer_amount) as bank_transfer_amount,\n    sum(voucher_amount) as voucher_amount,\n    sum(gift_card_amount) as gift_card_amount,\n    sum(amount) as total_amount\nfrom ecommerce.main.fct_orders;\n```\n\nExpected: totals reflect summed `stg_payments.amount` per order, with cancelled or unpaid orders showing `amount = 0`.\n\n### Assumptions\n\n- Multiple rows per `order_id` in `stg_payments` are valid, for example split payments or multiple payment methods per order.\n- `stg_payments.amount` is already correctly converted to major currency units, as described by the lineage.\n- `fct_orders.amount` should be the total payment amount per order, not the amount of an individual payment row.\n- Orders without payments should remain in `fct_orders` with all payment amount columns set to `0`.\n- No upstream schema change occurred in `raw.raw_orders` or `raw.raw_payments`; the failure is caused by the recent `fct_orders` model change."}, {"position": 44, "item_id": "RC03-08B", "is_repeat": 0, "scenario_id": "RC03", "label": "B", "group_pos": 2, "group_size": 6, "text": "### Root cause\n\n`fct_orders` has duplicate `order_id` values: the `unique` test found 82 duplicated order IDs. Because of those extra duplicate rows, `fct_orders` also has a different row count than `stg_orders`, causing the `equal_row_count` test to fail.\n\nSource freshness passed for `raw_orders`, `raw_payments`, and `raw_customers`, so this is probably not a stale-source issue. The most likely cause is a fanout join in `fct_orders`, commonly from joining `stg_orders` to `stg_payments` where there can be multiple payment records per order. If `fct_orders` is intended to be one row per order, payments must be aggregated to one row per `order_id` before joining.\n\n### Fix\n\nUpdate the `fct_orders` model so every joined input is one row per `order_id`, especially payments.\n\nAssuming the model is `models/marts/fct_orders.sql` and it currently joins directly to `stg_payments`, change it to aggregate payments first:\n\n```sql\nwith orders as (\n\n    select *\n    from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select\n        order_id,\n        sum(amount) as total_payment_amount,\n        count(*) as payment_count,\n        min(payment_created_at) as first_payment_created_at,\n        max(payment_created_at) as last_payment_created_at\n    from {{ ref('stg_payments') }}\n    group by order_id\n\n)\n\nselect\n    orders.order_id,\n    orders.customer_id,\n    orders.order_created_at,\n    orders.order_status,\n\n    coalesce(payments.total_payment_amount, 0) as total_payment_amount,\n    coalesce(payments.payment_count, 0) as payment_count,\n    payments.first_payment_created_at,\n    payments.last_payment_created_at\n\nfrom orders\nleft join payments\n    on orders.order_id = payments.order_id\n```\n\nUse the actual column names from your project if they differ.\n\nAlso add or confirm a uniqueness test on `stg_payments` only if it is expected to be one row per order. If payments are naturally many-to-one with orders, do **not** test `stg_payments.order_id` as unique; instead, keep the aggregation in `fct_orders`.\n\nIf the duplicates are already present in `stg_orders`, then the fix belongs upstream: deduplicate `raw.raw_orders` in `stg_orders` using the latest record per `order_id`, for example by `loaded_at`.\n\nExample for `models/staging/stg_orders.sql`:\n\n```sql\nwith source as (\n\n    select *\n    from {{ source('raw', 'raw_orders') }}\n\n),\n\ndeduplicated as (\n\n    select *\n    from source\n    qualify row_number() over (\n        partition by order_id\n        order by loaded_at desc\n    ) = 1\n\n)\n\nselect\n    order_id,\n    customer_id,\n    order_created_at,\n    order_status,\n    loaded_at\nfrom deduplicated\n```\n\n### Verification\n\nFirst identify where the duplicates enter:\n\n```sql\nselect order_id, count(*) as n_records\nfrom ecommerce.main.stg_orders\ngroup by order_id\nhaving count(*) > 1;\n```\n\nExpected result: zero rows. If not, fix `stg_orders`.\n\nCheck whether payments are causing fanout:\n\n```sql\nselect order_id, count(*) as n_payments\nfrom ecommerce.main.stg_payments\ngroup by order_id\nhaving count(*) > 1;\n```\n\nExpected result: this may return rows if multiple payments per order are valid.\n\nAfter applying the fix, run:\n\n```bash\ndbt build --select fct_orders\n```\n\nExpected result: pass, including:\n\n- `unique_fct_orders_order_id`: 0 failures\n- `equal_row_count_fct_orders_ref_stg_orders_`: 0 failures\n\nOptionally confirm row counts directly:\n\n```sql\nselect\n    (select count(*) from ecommerce.main.fct_orders) as fct_orders_rows,\n    (select count(*) from ecommerce.main.stg_orders) as stg_orders_rows;\n```\n\nExpected result: both counts are equal.\n\n### Assumptions\n\n- `fct_orders` is intended to be one row per `order_id`.\n- `stg_orders` is also intended to be one row per `order_id`.\n- `stg_payments` may contain multiple rows per `order_id`, such as multiple payments, retries, partial captures, refunds, or adjustments.\n- The failing row-count test compares `fct_orders` to `stg_orders` because every staged order should appear exactly once in the fact table.\n- Model paths and column names such as `models/marts/fct_orders.sql`, `models/staging/stg_orders.sql`, `amount`, `payment_created_at`, `order_created_at`, and `order_status` may need to be adjusted to match the actual project."}, {"position": 45, "item_id": "RC03-01B", "is_repeat": 0, "scenario_id": "RC03", "label": "B", "group_pos": 3, "group_size": 6, "text": "### Root cause\n\nThe failure is due to a mismatch between the expected row count in the `fct_orders` model and the actual row count in the `stg_orders` model. The test `equal_row_count(compare_model=stg_orders)` in the `fct_orders` model is configured to fail if the row count is not equal to 0, but it is expecting a count of 0 and is getting a count of 1 instead. This suggests that the `fct_orders` model is not properly materialized or is missing a row.\n\n### Fix\n\nTo fix this issue, the `fct_orders` model needs to be updated to correctly materialize the data. Specifically, the `order_id` column in the `fct_orders` model is not properly linked to the `stg_orders` model, which is causing the row count test to fail. The fix is to add a join clause in the `fct_orders` model to correctly link the `order_id` column to the `stg_orders` model.\n\nHere is the updated SQL for the `fct_orders` model:\n\n```sql\nwith orders as (\n    select * from {{ ref('stg_orders') }}\n),\n\npayments as (\n    select * from {{ ref('stg_payments') }}\n),\n\nfinal as (\n    select\n        orders.order_id,\n        orders.customer_id,\n        orders.order_date,\n        orders.status,\n        case when payments.payment_method = 'credit_card' then payments.amount else 0 end as credit_card_amount,\n        case when payments.payment_method = 'bank_transfer' then payments.amount else 0 end as bank_transfer_amount,\n        case when payments.payment_method = 'voucher' then payments.amount else 0 end as voucher_amount,\n        case when payments.payment_method = 'gift_card' then payments.amount else 0 end as gift_card_amount,\n        coalesce(payments.amount, 0) as amount\n    from orders\n    left join payments on orders.order_id = payments.order_id\n    and orders.order_date = payments.order_date\n    and orders.status = payments.status\n)\n\nselect * from final\n```\n\n### Verification\n\nTo verify that the fix worked, you can run the following dbt command:\n\n```\ndbt test fct_orders\n```\n\nIf the test passes, you should see a message indicating that the test was successful."}, {"position": 46, "item_id": "RC03-08A", "is_repeat": 0, "scenario_id": "RC03", "label": "A", "group_pos": 4, "group_size": 6, "text": "### Root cause\n`fct_orders` contains duplicate `order_id` values (82 order_ids appear more than once), which is also why its row count differs from `stg_orders`. The row-count test and the uniqueness test fail for the same reason. Freshness passes and every other test passes, so the raw data is arriving on time and the problem is a grain error in `fct_orders`, not a stale source.\n\nThe most likely mechanism is a fan-out join: `fct_orders` joins `stg_orders` to a one-to-many table (probably `stg_payments`, since an order can have several payment attempts, partial payments or refunds) without aggregating that table to one row per order first. A second possibility is that `raw_orders` itself holds duplicate rows because the hourly ingestion re-delivered orders, and `stg_orders` does not deduplicate. I can't tell which from the report, because `stg_orders` has no listed `unique` test result and I can't see the model SQL.\n\n### Fix\nIn `models/marts/fct_orders.sql`, aggregate payments to order grain in a CTE before joining:\n\n```sql\nwith orders as (\n    select * from {{ ref('stg_orders') }}\n),\npayments as (\n    select\n        order_id,\n        sum(amount) as total_paid,\n        count(*)    as payment_count\n    from {{ ref('stg_payments') }}\n    group by order_id\n)\nselect\n    o.*,\n    coalesce(p.total_paid, 0) as total_paid,\n    coalesce(p.payment_count, 0) as payment_count\nfrom orders o\nleft join payments p on o.order_id = p.order_id\n```\n\nAdjust the aggregates to whatever columns `fct_orders` currently exposes from payments (e.g. filter on successful payment status if that is the existing business rule).\n\nIf instead the duplicates come from `stg_orders`, deduplicate there on the latest load:\n\n```sql\nselect * from {{ source('raw', 'raw_orders') }}\nqualify row_number() over (partition by order_id order_by loaded_at desc) = 1\n```\n\n(DuckDB syntax: `order by`, not `order_by`.) In that case also fix the ingestion job outside dbt so it upserts on `order_id` rather than appending, and add a `unique` test on `stg_orders.order_id`.\n\nDo not weaken or remove the two failing tests; they caught a real defect.\n\n### Verification\nFirst, locate where duplication begins:\n\n```sql\nselect order_id, count(*) from \"ecommerce\".\"main\".\"stg_orders\"\ngroup by 1 having count(*) > 1;\n```\n\nZero rows means the fan-out is in the `fct_orders` join; any rows means the source/staging duplicate path.\n\nAfter the fix, run:\n\n```\ndbt build --select stg_orders+ fct_orders\n```\n\nExpected: both `unique_fct_orders_order_id` and `equal_row_count_fct_orders_ref_stg_orders_` pass (0 results), and the full `dbt build` exits 0. Also spot-check that revenue totals match the pre-fix numbers once duplicates are excluded, to confirm aggregation didn't drop or double-count payments:\n\n```sql\nselect sum(total_paid) from fct_orders;  -- compare with select sum(amount) from stg_payments (same filter)\n```\n\n### Assumptions\n- `fct_orders` is built from `stg_orders` joined to `stg_payments` (and possibly customers); I have not seen the model SQL.\n- The join key is `order_id`, and `stg_payments` has an `amount` column and potentially multiple rows per order.\n- `stg_orders` is intended to be one row per order, so `fct_orders` should match its row count one-to-one.\n- The failure is a modeling/grain defect, not a transient ingestion issue, since freshness passes and the previous runs presumably passed; if the duplicates only appeared today, a change to the model or a re-delivered batch in `raw_orders` may be the trigger.\n- Marts are materialized as tables, so a rebuild fully replaces the bad data with no manual cleanup."}, {"position": 47, "item_id": "RC03-01A", "is_repeat": 0, "scenario_id": "RC03", "label": "A", "group_pos": 5, "group_size": 6, "text": "### Root cause\n`fct_orders` left-joins `stg_payments` directly at payment-row grain. An order with several payment rows (e.g. a credit card plus a voucher) is emitted once per payment row, so `order_id` is duplicated (82 duplicated ids) and `fct_orders` has more rows than `stg_orders`. The description says \"payment amounts pivoted by method\" with one row per order, but the model only does the `case` per row and never aggregates. As a side effect, `amount` on each duplicated row holds only that single payment, not the order total, so the numbers are wrong as well as the grain. Both failing tests are symptoms of the same defect. Source freshness passes and `stg_orders` passes its own `unique`/row-count tests, so ingestion and staging are not the cause.\n\n### Fix\nAggregate payments to one row per order in `models/marts/fct_orders.sql` before joining. No change to sources or ingestion is needed.\n\n```sql\nwith orders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\norder_payments as (\n\n    select\n        order_id,\n        sum(case when payment_method = 'credit_card'   then amount else 0 end) as credit_card_amount,\n        sum(case when payment_method = 'bank_transfer' then amount else 0 end) as bank_transfer_amount,\n        sum(case when payment_method = 'voucher'       then amount else 0 end) as voucher_amount,\n        sum(case when payment_method = 'gift_card'     then amount else 0 end) as gift_card_amount,\n        sum(amount) as total_amount\n    from payments\n    group by order_id\n\n),\n\nfinal as (\n\n    select\n        orders.order_id,\n        orders.customer_id,\n        orders.order_date,\n        orders.status,\n        coalesce(order_payments.credit_card_amount, 0)   as credit_card_amount,\n        coalesce(order_payments.bank_transfer_amount, 0) as bank_transfer_amount,\n        coalesce(order_payments.voucher_amount, 0)       as voucher_amount,\n        coalesce(order_payments.gift_card_amount, 0)     as gift_card_amount,\n        coalesce(order_payments.total_amount, 0)         as amount\n    from orders\n    left join order_payments on orders.order_id = order_payments.order_id\n\n)\n\nselect * from final\n```\n\nKeep the tests as they are; they correctly caught the defect.\n\n### Verification\n1. Rebuild and test: `dbt build --select stg_payments+ fct_orders` (or `dbt build --select fct_orders`). Expected: `unique_fct_orders_order_id` and `equal_row_count_fct_orders_ref_stg_orders_` both pass, and the run exits 0.\n2. Optional sanity checks (both should return 0 rows):\n```sql\nselect order_id, count(*) from \"ecommerce\".\"main\".\"fct_orders\" group by 1 having count(*) > 1;\n\nselect o.order_id\nfrom \"ecommerce\".\"main\".\"fct_orders\" o\njoin (select order_id, sum(amount) as s from \"ecommerce\".\"main\".\"stg_payments\" group by 1) p using (order_id)\nwhere abs(o.amount - p.s) > 0.001;\n```\n3. Confirm the full `dbt build` is green on the next scheduled run.\n\n### Assumptions\n- `stg_payments` has one row per payment (an order can have several), with columns `order_id`, `payment_method`, `amount`; its SQL was not shown.\n- The four payment methods listed are the only ones, and `amount` is non-null. Any other method would be counted in `amount` but in no per-method column; if that is a concern, add an `accepted_values` test on `stg_payments.payment_method`.\n- No payment rows are legitimately duplicated by the source (e.g. double-loaded). If `stg_payments` has its own duplicates, that needs a separate check.\n- `fct_orders` is a full-refresh table, so rebuilding it replaces the bad data with no backfill step.\n- Downstream consumers of `fct_orders` may have been affected by the inflated row counts and understated per-order `amount` since the model was introduced or last changed; that scope is unknown."}, {"position": 48, "item_id": "RC03-06A", "is_repeat": 0, "scenario_id": "RC03", "label": "A", "group_pos": 6, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is a mismatch between the row count of the `fct_orders` model and the `stg_orders` model. The `equal_row_count_fct_orders_ref_stg_orders` test is failing because the `fct_orders` model has 682 rows, whereas the `stg_orders` model has 600 rows.\n\nThis mismatch is likely due to the recent change made to the `fct_orders` model on 2026-10-12, which removed the `order_payments` CTE and joined payments directly. This change may have introduced additional rows or modified the existing rows in the `fct_orders` model, causing the row count to diverge from the `stg_orders` model.\n\n### Fix\n\nTo fix the issue, we need to reconcile the row counts between the `fct_orders` and `stg_orders` models. One possible fix is to adjust the `fct_orders` model to match the expected row count. We can achieve this by modifying the `fct_orders` model to exclude any rows that are not present in the `stg_orders` model.\n\nHere's the proposed fix:\n```sql\n-- Update the fct_orders model to exclude rows not present in stg_orders\nWITH orders AS (\n  SELECT * FROM {{ ref('stg_orders') }}\n),\nfinal AS (\n  SELECT\n    orders.order_id,\n    orders.customer_id,\n    orders.order_date,\n    orders.status,\n    COALESCE(payments.amount, 0) AS amount\n  FROM orders\n  LEFT JOIN payments ON orders.order_id = payments.order_id\n  WHERE EXISTS (SELECT 1 FROM stg_orders WHERE order_id = orders.order_id)\n)\nSELECT * FROM final;\n```\nThis fix modifies the `fct_orders` model to only include rows that exist in the `stg_orders` model. This should reconcile the row counts and allow the `equal_row_count_fct_orders_ref_stg_orders` test to pass.\n\n### Verification\n\nTo verify the fix, we can run the `dbt build` command with the modified `fct_orders` model and check if the `equal_row_count_fct_orders_ref_stg_orders` test passes. We can also verify the row counts by running a SQL query, such as:\n```sql\nSELECT COUNT(*) FROM fct_orders;\nSELECT COUNT(*) FROM stg_orders;\n```\nIf the row counts match, the fix is successful.\n\n### Assumptions\n\nWe assume that the `stg_orders` model is correct and should be used as the reference for the row count comparison. We also assume that the `fct_orders` model is intended to reflect the actual order data and should be adjusted to match the `stg_orders` model."}, {"position": 49, "item_id": "NR02-08B", "is_repeat": 0, "scenario_id": "NR02", "label": "B", "group_pos": 1, "group_size": 6, "text": "### Root cause\nCommit 75ab2ba (2026-10-12, \"simplify amount column\") removed the `coalesce(..., 0)` that INC-0365 / PR #41 had added. The current SQL sets `amount` to `order_payments.total_amount` directly. Because of the left join, any order with no payment rows (e.g. awaiting payment or cancelled) gets `NULL` instead of 0. This contradicts the column description (\"0 if no payments\") and re-introduces the earlier incident. The 46 null rows are most likely those payment-less orders. The test passed for six days because the regression was only deployed in the 2026-10-12 build, which ran before today's failure.\n\nSource freshness, the row-count test and the upstream schemas are fine. The warehouse move on 10-05 and the docs commit are unrelated (no schema or SQL change; the test passed afterwards). The sibling columns (`credit_card_amount` etc.) are still coalesced, which is consistent with the diagnosis.\n\n### Fix\nIn `models/marts/fct_orders.sql`, restore the coalesce in the `final` CTE:\n\n```sql\n        coalesce(order_payments.total_amount, 0) as amount\n```\n\nreplacing `order_payments.total_amount as amount`. Do not weaken or remove the `not_null` test and do not filter the null rows out; that would break the grain (`equal_row_count` with `stg_orders`) and hide orders from the finance dashboard. Add a regression guard: put a comment next to the line referencing INC-0365 so it is not \"simplified\" again.\n\nBecause `fct_orders` is a table, it must be rebuilt after the change is merged. The `finance_revenue_dashboard` exposure reads from this model, so rebuild before the 07:00 UTC refresh (and the stand-up), or notify Finance analytics if the dashboard already refreshed with null amounts.\n\n### Verification\nRun:\n\n```\ndbt build --select fct_orders+\n```\n\nExpected: all `fct_orders` tests pass, including `not_null_fct_orders_amount` (0 failing rows), `unique`/`relationships` on keys and `equal_row_count` vs `stg_orders`. Ad hoc check:\n\n```sql\nselect count(*) as null_amounts,\n       count(*) filter (where amount = 0) as zero_amounts\nfrom fct_orders;\n```\n\nExpected: `null_amounts = 0`; `zero_amounts` should be roughly the 46 orders previously null (assuming those orders have no payments). Also confirm that `sum(amount)` for orders with payments is unchanged from yesterday's build, and that the dashboard totals are unchanged (adding zeros doesn't alter sums).\n\n### Assumptions\n- The diff of commit 75ab2ba is not shown; I infer from the SQL, the commit message and INC-0365 that it removed the coalesce. Please confirm with `git show 75ab2ba`.\n- The 46 null rows are orders with no rows in `stg_payments`. This can be confirmed with `select o.order_id from stg_orders o left join stg_payments p using (order_id) where p.order_id is null`; if the count differs from 46, investigate further (e.g. payments with null amounts upstream).\n- The 10-12 build either ran before the commit was deployed or the test result for that day was not captured; either way, today is the first run with the regression.\n- The dashboard has not yet been refreshed with the bad data (the next refresh is 07:00 UTC); if it has, it needs a manual refresh after the rebuild."}, {"position": 50, "item_id": "NR02-02B", "is_repeat": 0, "scenario_id": "NR02", "label": "B", "group_pos": 2, "group_size": 6, "text": "### Root cause\n`fct_orders.amount` is `NULL` for 46 orders, causing the `not_null` test to fail. In `models/marts/fct_orders.sql`, `orders` is left-joined to aggregated `order_payments`; for orders with no matching rows in `stg_payments`, `order_payments.total_amount` is `NULL`. The column description says `amount` should be `0 if no payments, e.g. cancelled orders`, but the SQL does not `coalesce` `order_payments.total_amount` to `0`.\n\nFreshness passed for `raw_orders` and `raw_payments`, so this does not look like a stale ingestion issue based on the information provided.\n\n### Fix\nUpdate `models/marts/fct_orders.sql` so `amount` defaults to `0` when an order has no payments.\n\nChange this line in the `final` CTE:\n\n```sql\norder_payments.total_amount as amount\n```\n\nto:\n\n```sql\ncoalesce(order_payments.total_amount, 0) as amount\n```\n\nFull relevant section:\n\n```sql\nfinal as (\n\n    select\n        orders.order_id,\n        orders.customer_id,\n        orders.order_date,\n        orders.status,\n        coalesce(order_payments.credit_card_amount, 0) as credit_card_amount,\n        coalesce(order_payments.bank_transfer_amount, 0) as bank_transfer_amount,\n        coalesce(order_payments.voucher_amount, 0) as voucher_amount,\n        coalesce(order_payments.gift_card_amount, 0) as gift_card_amount,\n        coalesce(order_payments.total_amount, 0) as amount\n    from orders\n    left join order_payments on orders.order_id = order_payments.order_id\n\n)\n```\n\nOptional hardening: if `stg_payments.amount` itself can be `NULL`, also update the aggregation to avoid null totals when payment rows exist but all amounts are null:\n\n```sql\nsu
