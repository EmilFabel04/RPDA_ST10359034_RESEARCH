lanation is that the raw orders table lost or never received rows. Payments are fresh (loaded 1.0 h ago), and the stale-looking customers source is within its 24 h threshold, so freshness alone doesn't explain it: a source can be \"fresh\" (max(loaded_at) recent) while missing history, e.g. after a truncate-and-reload or a partial or windowed load in the orders ingestion job. The model has no date filter, so the \"180-day window\" isn't enforced in dbt; it depends entirely on what ingestion delivers. The downstream models were skipped only because these two tests failed.\n\n### Fix\nThe fix belongs primarily outside dbt: repair or backfill the orders ingestion job that writes `raw.raw_orders` (web shop → warehouse) so it again holds the full 180-day order history, and reload. Then re-run dbt. Do not loosen the tests or delete orphaned payments to get a green run, since that would hide real data loss and make `fct_orders` wrong.\n\nOnly if investigation shows the volume has legitimately changed (e.g. business growth beyond 1,000 orders) should you update the bounds in the model's schema YAML:\n\n```yaml\n      - row_count_between:\n          min_rows: 500\n          max_rows: 2000   # only if volume genuinely grew\n```\n\nOptionally, harden freshness so this is caught at the source: add a row-count or min(order_date) check on `raw_orders` (e.g. a source-level test that `min(order_date)` is within ~180 days), since `loaded_at` freshness cannot detect missing history.\n\n### Verification\nFirst diagnose the raw table:\n\n```sql\nselect count(*) as n, min(order_date) as first_day, max(order_date) as last_day,\n       count(distinct order_id) as distinct_orders\nfrom raw.raw_orders;\n```\n\nExpected after the fix: `n` between 500 and 1,000, `first_day` roughly 180 days back, `n = distinct_orders`. Then confirm no orphans remain:\n\n```sql\nselect count(*) from raw.raw_payments p\nleft join raw.raw_orders o using (order_id)\nwhere p.order_id is not null and o.order_id is null;\n```\n\nExpected: 0. Finally run:\n\n```\ndbt build\n```\n\nExpected: both previously failing tests pass, `dim_customers`, `fct_orders` and their 9 tests run and pass, exit code 0.\n\n### Assumptions\n- `raw.raw_orders` is the only input to `stg_orders` and no filtering happens elsewhere (confirmed by the SQL shown), so the problem lies in the raw data, not the model logic.\n- I don't know whether `stg_orders` is above 1,000 or below 500; the 415 orphaned payments make \"below\" (missing orders) most likely, but a duplicate-load inflating the count would be caught by the `unique` test on order_id, which isn't shown failing (it was likely among the passing tests).\n- The ingestion job's behavior (truncate/reload, windowed pull, or API failure) is unknown; I'm inferring it from symptoms and haven't seen its logs.\n- The 500-1,000 bound was correct for current business volume before this run.\n- The orphaned payments are valid payments whose orders are missing, not bad payment data."}, {"position": 76, "item_id": "RC02-03B", "is_repeat": 0, "scenario_id": "RC02", "label": "B", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the `row_count_between` test in the `stg_orders` model failing. The test checks if the number of rows in the model falls within the expected range of 500-1,000. The failure message indicates that the actual row count is 1, which is less than the minimum expected value. This is likely due to a data issue or a change in the data ingestion process that has caused the row count to drop significantly.\n\n### Fix\n\nTo fix the issue, we need to adjust the expected row count range in the `row_count_between` test to account for the actual row count. Based on the failure message, it seems that the actual row count is 1. Therefore, we can modify the test to expect a row count of 0-1. We can do this by updating the `min_rows` and `max_rows` parameters in the `row_count_between` test in the `stg_orders` model.\n\n**Updated `stg_orders` model:**\n```sql\n-- ... (rest of the model remains the same)\nModel-level tests: row_count_between(min_rows=0, max_rows=1)\n```\n\n### Verification\n\nTo verify that the fix worked, we can re-run the dbt build command and check that the `row_count_between` test is now passing. We can also check the actual row count in the `stg_orders` model to ensure that it is within the expected range.\n\n**Verification command:**\n```\ndbt build\n```\n\n**Expected result:** The `row_count_between` test should pass, indicating that the actual row count is within the expected range of 0-1.\n\n### Assumptions\n\n* The issue is specific to the `stg_orders` model and is not related to any other models or sources in the dbt project.\n* The actual row count in the `stg_orders` model is indeed 1, which is the value reported in the failure message."}, {"position": 77, "item_id": "RC02-04B", "is_repeat": 0, "scenario_id": "RC02", "label": "B", "group_pos": 5, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is the non-conformance of the `stg_orders` and `stg_payments` models to the row count and relationships tests, respectively. Specifically, the `stg_orders` test is failing because the table has less than 500 rows, while the `stg_payments` test is failing because the table does not have a corresponding order_id in the `stg_orders` table, indicating a missing relationship.\n\n### Fix\n\nTo fix the issue, we need to adjust the data ingestion jobs to load more data into the `stg_orders` and `stg_payments` tables. For `stg_orders`, we can increase the minimum row count to a value that is reasonable for the data volume, such as 5000. For `stg_payments`, we need to ensure that the order_id in `stg_payments` matches the order_id in `stg_orders`. This can be achieved by updating the data ingestion job to include the order_id from `stg_orders` in the data loaded into `stg_payments`.\n\n### Verification\n\nTo verify the fix, we can run the dbt build command again and check if the tests pass. We can also run the following SQL query to verify the row count and relationships:\n```sql\nSELECT count(*) AS n_rows\nFROM \"ecommerce\".\"main\".\"stg_orders\"\nWHERE n_rows >= 5000;\n\nSELECT\n    from_field\nFROM\n    child\nLEFT JOIN\n    parent\n        ON child.from_field = parent.to_field\nWHERE\n    parent.to_field IS NOT NULL;\n```\nThe expected result is that both queries return the expected values: `n_rows` should be greater than or equal to 5000, and the `from_field` and `to_field` should match in the relationships test.\n\n### Assumptions\n\nI assumed that the data ingestion jobs are running correctly and loading data into the `raw` schema. I also assumed that the data quality checks and tests are designed to validate the relationships between the tables in the `main` schema. If this is not the case, additional changes may be needed to correct the relationships."}, {"position": 78, "item_id": "RC02-07B", "is_repeat": 0, "scenario_id": "RC02", "label": "B", "group_pos": 6, "group_size": 6, "text": "### Root cause\nThe orders source is no longer delivering the 180-day order window that `stg_orders` and its tests expect. On 2026-10-13, ingestion config PR #88 changed the orders extract to `lookback_days: 60`, while `stg_orders` still selects all rows from `raw.raw_orders` and is documented/tested as 500–1,000 orders over 180 days.\n\nAs a result, `stg_orders` dropped from ~597 rows to 209 rows, failing `row_count_between`. `stg_payments` is still stable at 636 rows, so it contains payments for orders that are no longer present in `stg_orders`; this explains the 415 orphaned `stg_payments.order_id` values failing the relationships test. Downstream marts `dim_customers` and `fct_orders` were skipped because they depend on the failing staging models/tests.\n\n### Fix\nRestore the orders extract window to match the dbt contract.\n\nOutside the dbt project, in the ingestion-config repo, revert/update the orders extract setting changed in commit `12cac3c`:\n\n```yaml\n# ingestion-config repo, orders extract configuration\nlookback_days: 180\n```\n\nThen backfill/re-extract `raw.raw_orders` for the full 180-day window so that `raw.raw_orders` again contains all orders needed by `stg_orders`.\n\nNo SQL change is needed in `models/staging/stg_orders.sql` if the intended contract remains “500–1,000 orders over the 180-day window.”\n\nIf the business intentionally wants staging to use only a 60-day order window, then make that a deliberate dbt contract change instead:\n- update `stg_orders` description and tests in the staging schema YAML,\n- align `stg_payments` to the same order window, either by filtering payments to orders present in `stg_orders` or by changing the payment extract window,\n- assess and update downstream marts/dashboards whose definitions assume 180 days.\n\nFor the current incident, the recommended remediation is to restore `lookback_days: 180`, because the dbt model metadata, test threshold, recent history, and downstream marts all indicate the 180-day window is still expected.\n\n### Verification\nAfter changing ingestion config and reloading `raw.raw_orders`, confirm the raw/staging counts and relationship integrity.\n\nSQL checks:\n\n```sql\nselect count(*) as raw_orders_count\nfrom raw.raw_orders;\n\nselect count(*) as stg_orders_count\nfrom main.stg_orders;\n\nselect count(*) as orphan_payment_orders\nfrom main.stg_payments p\nleft join main.stg_orders o\n  on p.order_id = o.order_id\nwhere p.order_id is not null\n  and o.order_id is null;\n```\n\nExpected:\n- `stg_orders_count` returns to the recent range, roughly ~600, and is between 500 and 1000.\n- `orphan_payment_orders = 0`.\n- `raw_orders_count` is consistent with the restored 180-day window.\n\nThen run dbt:\n\n```bash\ndbt build --select source:raw.raw_orders+ source:raw.raw_payments+\ndbt source freshness\n```\n\nExpected:\n- `row_count_between_stg_orders_1000__500` passes.\n- `relationships_stg_payments_order_id__order_id__ref_stg_orders_` passes.\n- `dim_customers`, `fct_orders`, and their downstream tests are no longer skipped.\n- Source freshness remains passing for `raw.raw_orders` and `raw.raw_payments`.\n\nOptionally, build only the impacted lineage first:\n\n```bash\ndbt build --select stg_orders+ stg_payments+\n```\n\nExpected: all selected models/tests pass.\n\n### Assumptions\n- `raw.raw_orders` is a replaced or windowed table populated from the extract, not an append-only historical table retaining older orders independently of `lookback_days`.\n- `raw.raw_payments` still contains payments for the broader order population, or at least for orders no longer included after the orders lookback was reduced.\n- The intended analytical contract remains a 180-day order window for `stg_orders`, `fct_orders`, and `dim_customers`.\n- The 415 relationship failures are caused by missing parent orders, not by malformed `order_id` values in payments."}, {"position": 79, "item_id": "RI02-04C", "is_repeat": 0, "scenario_id": "RI02", "label": "C", "group_pos": 1, "group_size": 6, "text": "### Root cause\n\nThe failure is due to a mismatch between the number of results expected and the actual number of results in the test. The test is configured to fail if the result count is not equal to 0, but the actual count is 145. This suggests that the test is expecting 0 results, likely because there is no record in the `dim_customers` table that matches a customer ID in the `fct_orders` table.\n\n### Fix\n\nTo fix this issue, we need to update the test to account for the possibility of non-matching customer IDs. One way to do this is to modify the test to check if the count of non-matching customer IDs is within a certain threshold. We can do this by adding a WHERE clause to the test to filter out rows where the customer ID in `fct_orders` does not exist in `dim_customers`.\n\nHere's the modified test in YAML:\n```yaml\nmodels:\n  relationships_fct_orders_customer_id__customer_id__ref_dim_customers:\n    test:\n      - run: |\n          with child as (\n              select customer_id as from_field\n              from \"ecommerce\".\"main\".\"fct_orders\"\n              where customer_id is not null\n          ),\n          parent as (\n              select customer_id as to_field\n              from \"ecommerce\".\"main\".\"dim_customers\"\n          )\n          select\n              from_field\n          from child\n          left join parent\n              on child.from_field = parent.to_field\n          where parent.to_field is null\n      - assert:\n          - type: 'count'\n          - value: 0\n          - threshold: 10  # allow up to 10 non-matching customer IDs\n```\n### Verification\n\nTo verify the fix, we can run the dbt test command again and check that the test passes:\n```\ndbt test relationships_fct_orders_customer_id__customer_id__ref_dim_customers\n```\nIf the test passes, it means that the updated test is now correctly handling non-matching customer IDs.\n\n### Assumptions\n\n* The data quality is generally good, and the mismatch is not due to data corruption or other issues.\n* The `fct_orders` and `dim_customers` tables are properly normalized, and the mismatch is not due to data inconsistencies in the staging views or mart tables.\n* The test is only concerned with checking the relationships between `fct_orders` and `dim_customers` tables, and does not care about the actual data in the tables."}, {"position": 80, "item_id": "RI02-01A", "is_repeat": 0, "scenario_id": "RI02", "label": "A", "group_pos": 2, "group_size": 6, "text": "### Root cause\nThe failing test is a symptom of a filter in `dim_customers`, not of bad order data. `dim_customers` ends with `where customers.country_code in ('ZA', 'GB', 'US')` (a marketing-dashboard scoping rule, MKT-12), so any customer outside those markets is dropped from the dimension. `fct_orders` is built from all of `stg_orders`, so orders from customers in other countries (or with a null country code) now have a `customer_id` with no parent row. The 145 failing rows are most likely such orders. Freshness passed, so this is not a late-load problem. The filter is a business-scope decision embedded in a dimension that is also used by finance and that carries a \"one row per customer\" contract, and it breaks that contract.\n\n### Fix\nRemove the market filter from `dim_customers` and apply it where it is actually needed (the marketing dashboard / a marketing-specific model).\n\n1. In `models/marts/dim_customers.sql`, delete the last two lines:\n\n```sql\n    -- marketing dashboard only covers launch markets (MKT-12)\n    where customers.country_code in ('ZA', 'GB', 'US')\n```\n\n2. Preserve MKT-12 downstream, e.g. in a new model `models/marts/marketing/dim_customers_launch_markets.sql`:\n\n```sql\nselect * from {{ ref('dim_customers') }}\nwhere country_code in ('ZA', 'GB', 'US')\n```\n\nThen repoint the marketing dashboard to that model (or add the filter in the BI layer). This change is outside the dbt project and must be coordinated with the dashboard owner before or together with the merge, so marketing numbers don't change unexpectedly.\n\nDo not weaken or remove the `relationships` test, and do not filter `fct_orders` to match; either would hide the problem or break the `equal_row_count` test against `stg_orders`. Finance, who also uses `dim_customers`, should be told that its totals may rise because it now includes all markets (the previous figures were understated).\n\n### Verification\nFirst, confirm the diagnosis before changing anything:\n\n```sql\nselect c.country_code, count(*) as orphan_orders\nfrom \"ecommerce\".\"main\".\"fct_orders\" o\njoin \"ecommerce\".\"main\".\"stg_customers\" c on o.customer_id = c.customer_id\nwhere o.customer_id is not null\n  and o.customer_id not in (select customer_id from \"ecommerce\".\"main\".\"dim_customers\")\ngroup by 1;\n```\n\nExpect 145 orders in total, all with country codes outside ZA/GB/US (or null).\n\nAfter the fix:\n\n```\ndbt build --select dim_customers+ fct_orders dim_customers_launch_markets\n```\n\nExpected: the `relationships` test passes with 0 results, `unique`/`not_null` on `dim_customers.customer_id` still pass, and `equal_row_count` on `fct_orders` still passes. Also check `select count(*) from dim_customers` equals `select count(*) from stg_customers`, and that the new launch-markets model contains only ZA/GB/US rows.\n\n### Assumptions\n- The orphaned `customer_id`s exist in `stg_customers` but have a `country_code` outside ZA/GB/US (or null); the diagnostic query above confirms or refutes this. If some are not in `stg_customers` at all, there is a second issue (e.g. customers not yet ingested, as `raw_customers` was last loaded 4.1 h ago versus 1.0 h for orders), and the fix would need to address ingestion ordering.\n- The MKT-12 filter was added recently, which would explain why the test only started failing now.\n- `stg_customers` has one row per customer, so removing the filter does not duplicate rows.\n- Finance and marketing dashboards currently read `dim_customers` directly, and the marketing owner can repoint to the new model."}, {"position": 81, "item_id": "RI02-04A", "is_repeat": 0, "scenario_id": "RI02", "label": "A", "group_pos": 3, "group_size": 6, "text": "### Root cause\n145 order rows in `fct_orders` reference a `customer_id` that is missing from `dim_customers`. This is an orphaned-key problem, not a model bug. Freshness gives the likely mechanism: `raw_customers` was last loaded 4.1 h ago, while `raw_orders` and `raw_payments` were loaded 1.0 h ago. Customers load more slowly than orders, so recent orders can arrive before their customer record does (a CRM-to-shop ingestion lag). The `dbt build` ran in that window. Freshness passed because its thresholds (24 h/48 h for customers) are far looser than the lag that matters here, so it never flagged the gap. The 145 orphans are most likely recent orders whose customers arrived after the last customers load. Other causes (deleted or merged CRM customers, a dedup/filter in `dim_customers`) cannot be ruled out from the report alone.\n\n### Fix\n1. **Confirm the cause first** (see Verification query 1). If the orphans are all recent orders, proceed with 2-3. If they are old or spread out, investigate `stg_customers`/`dim_customers` filters or CRM deletions instead.\n2. **Ingestion (outside dbt):** align the CRM ingestion job's schedule with the web shop job so customers load before or together with orders. For example, run the CRM load first in the hourly chain, or make the orders load depend on the customers load completing. Ingestion code and scheduler are outside this project, so the exact change is up to the owner of those jobs.\n3. **dbt, tighten freshness** in the sources YAML (e.g. `models/staging/_sources.yml`) so a lagging customers feed is caught by freshness rather than by a downstream test:\n\n```yaml\nsources:\n  - name: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after: {count: 2, period: hour}\n          error_after: {count: 6, period: hour}\n```\n\n4. **Optional, only if late-arriving customers are an accepted fact of life:** keep the test strict but gate the run order: run `dbt source freshness` first and only run `dbt build` if it passes. Don't set the test to `warn` or add `where` filters to hide the orphans unless the business agrees; that masks real integrity problems.\n\nDo not delete the orphan orders or drop the test.\n\n### Verification\n1. Diagnose the orphans:\n```sql\nselect min(o.ordered_at), max(o.ordered_at), count(*)\nfrom \"ecommerce\".\"main\".\"fct_orders\" o\nleft join \"ecommerce\".\"main\".\"dim_customers\" c using (customer_id)\nwhere o.customer_id is not null and c.customer_id is null;\n```\n(`ordered_at` is an assumed column name.) If the date range clusters in the last few hours, the lag hypothesis holds. Also check whether these IDs exist in `raw.raw_customers` now.\n\n2. After the next customers load (or after fixing ingestion order), rerun:\n```\ndbt build\n```\nExpected: 30 passed, 0 failed; the relationships test returns 0 rows.\n\n3. Check `dbt source freshness`: `raw_customers` should now pass under the tighter thresholds, and should fail loudly if the CRM feed stalls.\n\n### Assumptions\n- `fct_orders` and `dim_customers` derive from `raw_orders` and `raw_customers` (via staging) respectively; the report doesn't show lineage.\n- `raw_customers.loaded_at` reflects load time of the whole table/batch, so the 4.1 h gap indicates CRM data was not refreshed in the hourly run (or CRM loads less often).\n- `dim_customers` applies no filter that would drop valid customers.\n- The orphans are new orders, not historical ones; this is a hypothesis to confirm with the diagnostic query.\n- The sources are defined in a YAML file such as `models/staging/_sources.yml`; the actual path may differ.\n- The ingestion jobs are owned by a team or system outside the dbt project, and their schedule can be changed."}, {"position": 82, "item_id": "RI02-09A", "is_repeat": 0, "scenario_id": "RI02", "label": "A", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\nThe failure report indicates a test failure on the `relationships_fct_orders_customer_id__customer_id__ref_dim_customers` test. This test checks that the `customer_id` column in the `fct_orders` model is properly related to the `customer_id` column in the `dim_customers` model. The test result shows that the model failed to return the expected results, indicating that there might be a mismatch between the two models.\n\n### Fix\n\nTo resolve this issue, we need to review the join condition between `fct_orders` and `dim_customers`. The test failure message suggests that there might be extra results returned by the `fct_orders` model that do not match the `dim_customers` model. To fix this, we can modify the join condition in the `fct_orders` model to include a filtering condition that ensures the `customer_id` matches the `customer_id` in the `dim_customers` model.\n\nHere is the proposed fix:\n```sql\n-- models/marts/fct_orders.sql\nselect\n    orders.order_id,\n    orders.customer_id,\n    ...\nfrom orders\nleft join dim_customers\n    on orders.customer_id = dim_customers.customer_id\n    and dim_customers.country_code in ('ZA', 'GB', 'US')  -- added filtering condition\n...\n```\nThe fix involves adding a filtering condition to the join between `fct_orders` and `dim_customers`, ensuring that only rows with matching `customer_id` and `country_code` are returned.\n\n### Verification\n\nTo verify the fix, we can re-run the `dbt build` command and check if the test failure has been resolved. We can also run a query like the following to confirm that the fix has corrected the issue:\n```sql\nwith child as (\n    select customer_id as from_field\n    from fct_orders\n    where customer_id is not null\n),\nparent as (\n    select customer_id as to_field\n    from dim_customers\n)\nselect\n    from_field\nfrom child\nleft join parent\n    on child.from_field = parent.to_field\nwhere parent.to_field is null;\n```\nIf the query returns no rows, it indicates that the fix has corrected the issue.\n\n### Assumptions\n\nI assumed that the `country_code` filtering condition is necessary to match the marketing dashboard's requirements, as stated in the recent history section."}, {"position": 83, "item_id": "RI02-01B", "is_repeat": 0, "scenario_id": "RI02", "label": "B", "group_pos": 5, "group_size": 6, "text": "### Root cause\n`fct_orders.customer_id` is tested as a foreign key to `dim_customers.customer_id`, but `dim_customers` intentionally filters customers to launch markets only:\n\n```sql\nwhere customers.country_code in ('ZA', 'GB', 'US')\n```\n\n`fct_orders` includes all orders from `stg_orders`, regardless of customer country. Therefore, orders for customers outside `ZA`, `GB`, and `US` remain in `fct_orders`, but their customers are excluded from `dim_customers`, causing 145 relationship test failures.\n\nSource freshness passed, so this does not look like a late or stale ingestion issue.\n\n### Fix\nDecide whether `dim_customers` is meant to be the canonical customer dimension or a marketing-only launch-market dimension.\n\nRecommended remediation: make `dim_customers` canonical by removing the launch-market filter from `models/marts/dim_customers.sql`. If marketing needs only launch markets, create a separate filtered model such as `dim_launch_market_customers`.\n\nChange `models/marts/dim_customers.sql`:\n\n```sql\nfinal as (\n\n    select\n        customers.customer_id,\n        customers.first_name,\n        customers.last_name,\n        customers.email,\n        customers.country_code,\n        customers.created_at,\n        customer_orders.first_order_date,\n        customer_orders.most_recent_order_date,\n        coalesce(customer_orders.number_of_orders, 0) as number_of_orders,\n        coalesce(customer_payments.lifetime_value, 0) as lifetime_value\n    from customers\n    left join customer_orders on customers.customer_id = customer_orders.customer_id\n    left join customer_payments on customers.customer_id = customer_payments.customer_id\n\n)\n```\n\nRemove this line:\n\n```sql\nwhere customers.country_code in ('ZA', 'GB', 'US')\n```\n\nOptionally add a new marketing-specific model, for example `models/marts/dim_launch_market_customers.sql`:\n\n```sql\nselect *\nfrom {{ ref('dim_customers') }}\nwhere country_code in ('ZA', 'GB', 'US')\n```\n\nThen update the marketing dashboard to use `dim_launch_market_customers` instead of `dim_customers`.\n\nIf the business requirement is instead that `fct_orders` should only include launch markets, then apply the same country filter to `fct_orders` by joining to `stg_customers`; however, that would change the stated grain/coverage of `fct_orders` and should be confirmed with stakeholders first.\n\n### Verification\nRun the affected models and tests:\n\n```bash\ndbt build --select dim_customers fct_orders\n```\n\nExpected result: the `relationships` test on `fct_orders.customer_id` passes with 0 failing rows.\n\nTo inspect directly:\n\n```sql\nselect count(*) as missing_customer_count\nfrom ecommerce.main.fct_orders o\nleft join ecommerce.main.dim_customers c\n    on o.customer_id = c.customer_id\nwhere o.customer_id is not null\n  and c.customer_id is null;\n```\n\nExpected result:\n\n```text\nmissing_customer_count = 0\n```\n\nAlso check that `dim_customers` now includes customers outside the launch markets:\n\n```sql\nselect country_code, count(*) as customers\nfrom ecommerce.main.dim_customers\ngroup by country_code\norder by country_code;\n```\n\nExpected result: countries other than `ZA`, `GB`, and `US` may appear if present in `stg_customers`.\n\nIf adding the marketing-specific model, run:\n\n```bash\ndbt build --select dim_launch_market_customers\n```\n\nExpected result: model builds successfully and contains only `ZA`, `GB`, and `US`.\n\n### Assumptions\nThe 145 failing rows are orders whose customers exist in `stg_customers`/`raw_customers` but have `country_code` outside `ZA`, `GB`, or `US`.\n\n`dim_customers` is intended to be the parent dimension for all rows in `fct_orders`, because `fct_orders.customer_id` has a relationship test to `dim_customers.customer_id`.\n\nThe marketing dashboard can be moved to a separate filtered model without breaking non-marketing users."}, {"position": 84, "item_id": "RI02-09C", "is_repeat": 0, "scenario_id": "RI02", "label": "C", "group_pos": 6, "group_size": 6, "text": "### Root cause\n`fct_orders.customer_id` still contains orders for all customers, but `dim_customers` was changed in commit `8abe4df` to only include customers where `country_code in ('ZA', 'GB', 'US')`. The `relationships` test on `fct_orders.customer_id -> dim_customers.customer_id` now fails because 145 orders belong to customers outside those launch markets and therefore no longer have a parent row in `dim_customers`.\n\nThis is supported by the `dim_customers` row count dropping from 198 to 149 after the market filter was added, while source freshness is healthy and the failing test is referential integrity, not freshness or schema drift.\n\n### Fix\nDo not use a market-filtered customer dimension as the parent for an all-orders fact table. Keep `dim_customers` as the complete conformed customer dimension, and move the launch-market filter into a separate marketing-specific model or the marketing exposure/dashboard.\n\nRecommended dbt change:\n\n1. Revert the filter from `models/marts/dim_customers.sql`:\n\n```sql\nwith customers as (\n\n    select * from {{ ref('stg_customers') }}\n\n),\n\norders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\ncustomer_orders as (\n\n    select\n        customer_id,\n        min(order_date) as first_order_date,\n        max(order_date) as most_recent_order_date,\n        count(order_id) as number_of_orders\n    from orders\n    group by customer_id\n\n),\n\ncustomer_payments as (\n\n    select\n        orders.customer_id,\n        sum(payments.amount) as lifetime_value\n    from payments\n    inner join orders on payments.order_id = orders.order_id\n    where orders.status != 'cancelled'\n    group by orders.customer_id\n\n),\n\nfinal as (\n\n    select\n        customers.customer_id,\n        customers.first_name,\n        customers.last_name,\n        customers.email,\n        customers.country_code,\n        customers.created_at,\n        customer_orders.first_order_date,\n        customer_orders.most_recent_order_date,\n        coalesce(customer_orders.number_of_orders, 0) as number_of_orders,\n        coalesce(customer_payments.lifetime_value, 0) as lifetime_value\n    from customers\n    left join customer_orders on customers.customer_id = customer_orders.customer_id\n    left join customer_payments on customers.customer_id = customer_payments.customer_id\n\n)\n\nselect * from final\n```\n\n2. Add a marketing-specific model, for example `models/marts/dim_customers_launch_markets.sql`:\n\n```sql\nselect *\nfrom {{ ref('dim_customers') }}\nwhere country_code in ('ZA', 'GB', 'US')\n```\n\n3. Update `models/marts/schema.yml` / exposures so `marketing_customer_dashboard` depends on `dim_customers_launch_markets`, while `finance_revenue_dashboard` and `fct_orders` continue to use the complete `dim_customers`.\n\nExample exposure dependency change:\n\n```yaml\nexposures:\n  - name: marketing_customer_dashboard\n    type: dashboard\n    owner:\n      name: Marketing analytics\n    depends_on:\n      - ref('dim_customers_launch_markets')\n```\n\nIf the marketing dashboard is maintained outside dbt, change its dataset/query to read from `dim_customers_launch_markets` instead of applying this filter in `dim_customers`.\n\n### Verification\nRun a targeted rebuild and tests:\n\n```bash\ndbt build --select dim_customers dim_customers_launch_markets fct_orders\n```\n\nExpected result: all selected models and tests pass, including:\n\n- `relationships_fct_orders_customer_id__customer_id__ref_dim_customers_`\n- `unique` and `not_null` on `dim_customers.customer_id`\n- `equal_row_count` between `fct_orders` and `stg_orders`\n\nConfirm the referential-integrity failure is gone:\n\n```sql\nselect count(*) as missing_customer_count\nfrom ecommerce.main.fct_orders o\nleft join ecommerce.main.dim_customers c\n  on o.customer_id = c.customer_id\nwhere o.customer_id is not null\n  and c.customer_id is null;\n```\n\nExpected result:\n\n```text\nmissing_customer_count = 0\n```\n\nConfirm the launch-market model preserves the marketing filter:\n\n```sql\nselect country_code, count(*) as customers\nfrom ecommerce.main.dim_customers_launch_markets\ngroup by 1\norder by 1;\n```\n\nExpected result: only `GB`, `US`, and `ZA` appear.\n\nOptionally check row counts:\n\n```sql\nselect count(*) from ecommerce.main.dim_customers;\nselect count(*) from ecommerce.main.dim_customers_launch_markets;\n```\n\nExpected result: `dim_customers` returns to approximately the pre-filter total, while `dim_customers_launch_markets` remains around today’s filtered count.\n\n### Assumptions\n- `fct_orders` is intended to contain all orders, not only orders from launch-market customers.\n- `dim_customers` is intended to be a conformed dimension shared by finance and facts, not a marketing-only filtered dataset.\n- The 145 failing rows are orders for customers excluded by `country_code not in ('ZA', 'GB', 'US')` or null/non-matching country codes.\n- The marketing dashboard can be changed to use a new dbt model or an equivalent downstream filter."}, {"position": 85, "item_id": "RI01-05A", "is_repeat": 0, "scenario_id": "RI01", "label": "A", "group_pos": 1, "group_size": 6, "text": "### Root cause\nThe failure is an upstream data-latency problem, not a dbt code defect. The CRM connector has hit HTTP 429 rate-limit errors since 2026-10-12 05:00 UTC, with retries exhausted, so `raw.raw_customers` has not been refreshed for 38 h (freshness WARN). Orders and payments kept loading hourly, so `raw_orders` contains orders from new customers who are not yet in `raw_customers` → `stg_customers` → `dim_customers`. The 5 `fct_orders.customer_id` values therefore have no parent row. This matches INC-0391 (same symptom during a CRM outage, resolved by the sync catching up). The model SQL, the column types and the 2026-10-07 dbt-duckdb upgrade are not implicated: the test passed on 6 of the last 7 runs and the build was green after the upgrade.\n\n### Fix\n**Outside dbt (the actual fix):** fix or restart the CRM customer sync, e.g. back off or reduce request rate, raise the API quota, or resume incremental sync from the last successful watermark (2026-10-12 05:00 UTC), then backfill `raw.raw_customers`. No code change in `fct_orders`, `dim_customers` or `stg_customers` is needed. Do not delete the orphan orders or switch to an inner join, which would silently drop revenue from `finance_revenue_dashboard`.\n\n**In dbt (hardening, optional):** the freshness warning already fired but nobody was alerted, so make staleness actionable before the relationships test fails. Tighten the source threshold and route freshness warnings to on-call (`sources.yml`):\n\n```yaml\nsources:\n  - name: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after: {count: 12, period: hour}\n          error_after: {count: 24, period: hour}\n```\n\nCalibrate this against the normal 3–30 h age range first (current thresholds already sit inside it, so tune to avoid alert fatigue), or measure freshness against the latest `created_at` instead. Optionally keep the relationships test but set `config: {severity: warn}` only if the business accepts temporary orphans; the default error severity is the safer choice because it blocks stale marts from feeding the dashboards.\n\n**Immediate action:** until the CRM catches up, notify Finance analytics (the 07:00 UTC stand-up dashboard) and Marketing analytics that customer data is ~38 h stale.\n\n### Verification\n1. Confirm the raw backfill landed:\n```sql\nselect max(loaded_at) from \"ecommerce\".\"raw\".\"raw_customers\";\n```\nExpect a timestamp within the last few hours.\n2. Confirm the orphans are resolved in raw data:\n```sql\nselect distinct o.customer_id\nfrom \"ecommerce\".\"raw\".\"raw_orders\" o\nleft join \"ecommerce\".\"raw\".\"raw_customers\" c using (customer_id)\nwhere c.customer_id is null;\n```\nExpect 0 rows.\n3. Rebuild and test:\n```\ndbt source freshness\ndbt build --select stg_customers+ stg_orders+ \n```\n(or `dbt build --select +fct_orders+ dim_customers+`). Expect the `raw_customers` freshness PASS, the relationships test returning 0 rows, and all 30 nodes passing with exit code 0.\n\n### Assumptions\n- The 5 failing `customer_id` values belong to customers who signed up after 2026-10-12 05:00 UTC (not confirmed by a query; step 2 checks this). If any remain orphaned after the sync is caught up, they are genuinely missing from the CRM and need a separate investigation.\n- The CRM sync is a job outside the dbt repo that can be fixed or re-run by the ingestion owners, and it supports backfilling from a watermark.\n- The 429 errors are the only cause of the stale `raw_customers`; no schema change in the CRM extract occurred.\n- Alerting infrastructure exists to route freshness warnings to on-call.\n- The dashboards have not already been consumed with incomplete customer data by Marketing/Finance."}, {"position": 86, "item_id": "RI01-03C", "is_repeat": 0, "scenario_id": "RI01", "label": "C", "group_pos": 2, "group_size": 6, "text": "### Root cause\nThe CRM ingestion into `raw.raw_customers` is stale: the last load was 2026-10-12 05:00 UTC, 38 h ago, while `raw_orders` and `raw_payments` were loaded an hour ago. Five orders therefore reference customers who exist in `stg_orders` but not yet in `stg_customers`, and so not in `dim_customers`. The `relationships` test on `fct_orders.customer_id` correctly caught the orphans.\n\nThe dbt models are sound: `dim_customers` is built from `stg_customers` with a left join, so it cannot drop customers present in staging. The source freshness check only warned (24 h warn / 48 h error, exit code 0), so the problem was visible but didn't block the build. The thresholds are also loose for an hourly job.\n\n### Fix\nThe fix is outside the dbt project: repair or re-run the hourly CRM ingestion job into `raw.raw_customers` (check the scheduler logs for why loads stopped after 2026-10-12 05:00 UTC). Once customers land, re-run `dbt build`. Do not delete the test, filter out the orphan orders, or add placeholder customers: that would hide the missing data and understate revenue and order counts.\n\nInside dbt, tighten freshness so this fails early instead of surfacing as a downstream test failure (e.g. in `models/staging/_sources.yml`):\n\n```yaml\nsources:\n  - name: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after: {count: 3, period: hour}\n          error_after: {count: 6, period: hour}\n```\n\nRun `dbt source freshness` as a gate before `dbt build` in the scheduled job (stop if it errors), so stale sources block the run rather than producing failing tests. If the CRM is expected to be late occasionally, keep the relationships test at its default severity but consider `severity: warn` only after the team agrees; I wouldn't recommend it here.\n\n### Verification\n1. After the ingestion is fixed, confirm freshness:\n   `dbt source freshness`. Expect `raw.raw_customers` to PASS (age below 3 h).\n2. Rebuild and test:\n   `dbt build --select stg_customers+ fct_orders dim_customers` (or a full `dbt build`). Expect exit code 0 and `relationships_fct_orders_customer_id__customer_id__ref_dim_customers_` PASS with 0 results.\n3. Optionally check the orphans directly before and after (should return 0 rows after):\n\n```sql\nselect o.order_id, o.customer_id\nfrom \"ecommerce\".\"main\".\"fct_orders\" o\nleft join \"ecommerce\".\"main\".\"dim_customers\" c using (customer_id)\nwhere o.customer_id is not null and c.customer_id is null;\n```\n\nIf rows remain after fresh CRM data has loaded, the customer IDs genuinely don't exist in the CRM, which would be a separate data-quality issue to raise with the web shop/CRM owners.\n\n### Assumptions\n- The 5 orphaned `customer_id`s belong to customers created in the CRM after the last successful load (2026-10-12 05:00 UTC). I have not seen the failing IDs or their order dates; checking that the orders are newer than the last customer load would confirm this.\n- `stg_customers` is a straightforward rename/cast view over `raw_customers` with no filters that could drop rows (its SQL wasn't provided).\n- The CRM ingestion job exists as a separate scheduled process and is the component that stalled; the reason for the stall (job failure, CRM API issue, credentials) is unknown.\n- The scheduler can be configured to run `dbt source freshness` before `dbt build` and halt on error.\n- `raw_orders` is not itself referencing invalid customer IDs (e.g. test or deleted accounts); this is only ruled out once fresh CRM data loads and the test still passes."}, {"position": 87, "item_id": "RI01-05C", "is_repeat": 0, "scenario_id": "RI01", "label": "C", "group_pos": 3, "group_size": 6, "text": "### Root cause\n`fct_orders.customer_id` now contains 5 customer IDs that are not present in `dim_customers.customer_id`, so the `relationships` test failed. `fct_orders` is built from fresh `stg_orders`, while `dim_customers` gets its base customer rows from `stg_customers` / `raw.raw_customers`, whose source freshness is stale: `raw_customers` has not loaded since `2026-10-12 05:00 UTC` due to CRM connector HTTP 429 rate-limit failures.\n\nThis is most likely not a dbt model logic bug. It is the same failure mode as prior incident INC-0391: orders for newly created customers arrived, but the CRM customer sync has not caught up, so those customers are missing from `dim_customers`.\n\n### Fix\nFix the upstream CRM ingestion job outside dbt: the connector that writes to `\"ecommerce\".\"raw\".\"raw_customers\"` must recover from the API rate-limit errors and backfill all missing customer records since `2026-10-12 05:00 UTC`.\n\nSpecific external remediation:\n- In the CRM ingestion/scheduler configuration, adjust retry/backoff and/or API rate limiting so HTTP 429 responses do not exhaust retries permanently.\n- Re-run or backfill the CRM customer sync for `raw.raw_customers`.\n- Ensure `raw.raw_customers.loaded_at` advances to the current run window.\n\nNo dbt SQL change is recommended based on the evidence. The failing test is correctly protecting referential integrity between:\n\n```yaml\nmodels:\n  - name: fct_orders\n    columns:\n      - name: customer_id\n        tests:\n          - not_null\n          - relationships:\n              to: ref('dim_customers')\n              field: customer_id\n```\n\nDo not disable the relationship test unless the business explicitly accepts temporarily orphaned orders in published marts. If dashboards must be unblocked before the CRM catch-up completes, communicate that `finance_revenue_dashboard` and `marketing_customer_dashboard` may be inconsistent, and consider a one-off operational rerun after the source is fresh rather than changing model logic.\n\n### Verification\nAfter the CRM sync/backfill completes, run source freshness:\n\n```bash\ndbt source freshness --select source:raw.raw_customers\n```\n\nExpected result: `raw.raw_customers` passes freshness, with `max(loaded_at)` less than the 24-hour warn threshold.\n\nConfirm the orphaned customer IDs are gone:\n\n```sql\nselect\n    f.customer_id,\n    count(*) as order_count\nfrom \"ecommerce\".\"main\".\"fct_orders\" f\nleft join \"ecommerce\".\"main\".\"dim_customers\" c\n    on f.customer_id = c.customer_id\nwhere c.customer_id is null\ngroup by f.customer_id\norder by f.customer_id;\n```\n\nExpected result: 0 rows.\n\nThen rerun the affected dbt build:\n\n```bash\ndbt build --select source:raw.raw_customers+ fct_orders dim_customers\n```\n\nExpected result: all selected models and tests pass, including:\n\n```text\nrelationships_fct_orders_customer_id__customer_id__ref_dim_customers_\n```\n\nOptionally run the full scheduled command:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: `dbt build` exits 0, and `raw.raw_customers` no longer warns for staleness.\n\n### Assumptions\n- The 5 missing `customer_id` values belong to customers created after the last successful CRM customer sync.\n- `raw.raw_orders` and `raw.raw_payments` ingestion are correct because their freshness checks passed and no related tests failed.\n- There was no unreported code change to `stg_customers`, `stg_orders`, `dim_customers`, or `fct_orders`.\n- The CRM system contains the missing customer records and can be backfilled into `raw.raw_customers`.\n- DuckDB/dbt adapter upgrade and warehouse storage move are unrelated because the relationship test passed for several runs after those changes."}, {"position": 88, "item_id": "RI01-01C", "is_repeat": 0, "scenario_id": "RI01", "label": "C", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\n`fct_orders.customer_id` contains 5 non-null customer IDs that do not exist in `dim_customers.customer_id`, causing the dbt `relationships` test to fail.\n\nThe likely reason is upstream data freshness skew: `raw.raw_orders` is current as of `2026-10-13 18:05 UTC`, but `raw.raw_customers` is stale, with latest `loaded_at = 2026-10-12 05:00 UTC`. Orders are arriving for customers that have not yet been ingested into `raw.raw_customers`, so `dim_customers` is missing those customers while `fct_orders` already contains their orders.\n\n### Fix\n\nFix the customer ingestion job outside dbt so that the CRM/customer source loading `raw.raw_customers` into the `raw` schema resumes hourly ingestion and catches up through at least `2026-10-13 18:05 UTC`.\n\nSpecifically:\n\n- Source: `raw.raw_customers`\n- Freshness column: `loaded_at`\n- Downstream dbt model affected: `dim_customers`\n- Failing model/test: `fct_orders.customer_id` relationships test to `dim_customers.customer_id`\n\nNo dbt model change is indicated by the evidence. The data contract appears correct: every `fct_orders.customer_id` should exist in `dim_customers.customer_id`.\n\nAfter the upstream job is fixed and backfilled, rebuild the affected models:\n\n```bash\ndbt build --select source:raw.raw_customers+ fct_orders\n```\n\nIf the source name is not literally `raw.raw_customers` in dbt selection syntax, use the actual dbt source selector from `sources.yml`, for example:\n\n```bash\ndbt build --select source:raw.raw_customers+ fct_orders\n```\n\nor rebuild the full project:\n\n```bash\ndbt build\n```\n\nOptional short-term operational mitigation: if customer freshness should block the pipeline earlier, lower or enforce the freshness threshold for `raw.raw_customers` so stale customer data becomes an error before mart tests fail. In the dbt source YAML, this would be configured on the `raw_customers` source table, for example:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 24\n            period: hour\n          error_after:\n            count: 48\n            period: hour\n```\n\nIf 38 hours of staleness is already unacceptable, change `error_after` to a lower threshold, such as 24 hours:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 6\n            period: hour\n          error_after:\n            count: 24\n            period: hour\n```\n\n### Verification\n\nFirst confirm the customer source has caught up:\n\n```bash\ndbt source freshness --select source:raw.raw_customers\n```\n\nExpected result:\n\n- `raw.raw_customers` passes freshness.\n- `max(loaded_at)` is recent enough to be within the configured threshold, ideally close to the latest successful order ingestion time.\n\nThen rerun the failing relationship check, or rebuild the affected models and tests:\n\n```bash\ndbt build --select fct_orders dim_customers\n```\n\nExpected result:\n\n- The relationships test on `fct_orders.customer_id` to `dim_customers.customer_id` passes.\n- `dbt build` exits with code 0.\n\nYou can also directly inspect remaining orphaned customer IDs:\n\n```sql\nselect o.customer_id, count(*) as order_count\nfrom ecommerce.main.fct_orders o\nleft join ecommerce.main.dim_customers c\n  on o.customer_id = c.customer_id\nwhere o.customer_id is not null\n  and c.customer_id is null\ngroup by 1\norder by order_count desc;\n```\n\nExpected result: zero rows.\n\n### Assumptions\n\n- `dim_customers` is built from `raw.raw_customers`.\n- `fct_orders` is built from `raw.raw_orders`.\n- The 5 failing relationship rows are caused by orders for recently created customers missing from the stale customer feed.\n- The intended business rule is that every non-null `fct_orders.customer_id` must exist in `dim_customers.customer_id`.\n- The issue is with the upstream CRM/customer ingestion job, not with a transformation bug in the dbt model."}, {"position": 89, "item_id": "RI01-01A", "is_repeat": 0, "scenario_id": "RI01", "label": "A", "group_pos": 5, "group_size": 6, "text": "### Root cause\n\nThe failure in the test `test relationships_fct_orders_customer_id__customer_id__ref_dim_customers_` suggests that the test is expecting a certain number of results, but is instead getting 5 results. This is likely due to a mismatch between the expected data and the actual data in the `fct_orders` and `dim_customers` tables. The test is configured to fail if the result is not zero, which indicates that there is a problem with the relationships between these two tables.\n\n### Fix\n\nTo fix this issue, we need to update the test to correctly validate the relationships between `fct_orders` and `dim_customers`. This can be done by modifying the test to expect a certain number of results (e.g. 1) instead of zero. We also need to check the data in the `fct_orders` and `dim_customers` tables to ensure that the relationships are correct.\n\nFor example, we can modify the test SQL to:\n\n```sql\nwith child as (\n    select customer_id as from_field\n    from \"ecommerce\".\"main\".\"fct_orders\"\n    where customer_id is not null\n),\nparent as (\n    select customer_id as to_field\n    from \"ecommerce\".\"main\".\"dim_customers\"\n)\nselect\n    from_field\nfrom child\nleft join parent\n    on child.from_field = parent.to_field\nwhere parent.to_field is not null\nlimit 1\n```\n\nThis test will now pass if there is at least one matching record between `fct_orders` and `dim_customers`, which is the expected behavior.\n\n### Verification\n\nTo verify that the fix worked, we can run the dbt command `dbt test` again and check that the test `test relationships_fct_orders_customer_id__customer_id__ref_dim_customers_` passes.\n\n### Assumptions\n\n* The data in the `fct_orders` and `dim_customers` tables is accurate and up-to-date.\n* The relationships between `fct_orders` and `dim_customers` are correct and should not be affected by any external factors."}, {"position": 90, "item_id": "RI01-03B", "is_repeat": 0, "scenario_id": "RI01", "label": "B", "group_pos": 6, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the test `relationships_fct_orders_customer_id__customer_id__ref_dim_customers_` failing. This test is checking if there is a relationship between the `fct_orders.customer_id` and `dim_customers.customer_id`. The failure message suggests that the test expected 0 results, but got 5 results, which indicates that there are duplicate customer IDs in the `fct_orders` table.\n\n### Fix\n\nTo fix this issue, we need to ensure that the `fct_orders` table does not contain duplicate customer IDs. We can do this by adding a unique constraint on the `customer_id` column in the `fct_orders` table. This can be done by adding the following code to the `fct_orders.sql` file:\n\n```sql\nalter table fct_orders\nadd constraint unique_customer_id unique (customer_id);\n```\n\n### Verification\n\nTo verify that the fix worked, we can run the following dbt command:\n\n```\ndbt test\n```\n\nThis will re-run all the tests, including the failed test, and check if the issue is resolved. If the issue is resolved, the test should pass.\n\n### Assumptions\n\n* The `fct_orders` table is a materialized view, and the unique constraint is not already present.\n* The duplicate customer IDs are not present in the `dim_customers` table, and the relationship test is failing because of the duplicate IDs in the `fct_orders` table."}], "scenarios": {"FV01": {"sections": [["Failure report", "Command: dbt build  (exit code 0)\nResult: 30 passed, 0 failed, 0 errors, 0 warnings, 0 skipped\n\nCommand: dbt source freshness  (exit code 1)\n- PASS: source raw.raw_customers: max(loaded_at) = 2026-10-13 14:56 UTC, 4.1 h before the check (warn after 24 hours, error after 48 hours)\n- ERROR: source raw.raw_orders: max(loaded_at) = 2026-10-12 19:05 UTC, 24.0 h before the check (warn after 6 hours, error after 12 hours)\n- ERROR: source raw.raw_payments: max(loaded_at) = 2026-10-12 19:05 UTC, 24.0 h before the check (warn after 6 hours, error after 12 hours)", true], ["Model and source metadata", "### Source raw.raw_orders\nTable: \"ecommerce\".\"raw\".\"raw_orders\"\nDescription: One row per order placed in the web shop.\nFreshness: measured on `loaded_at`; warn after 6 hours, error after 12 hours\nColumns (name · type in warehouse · description):\n- order_id · INTEGER · Shop primary key of the order (integer).\n- customer_id · INTEGER · CRM customer_id of the customer who placed the order.\n- order_date · DATE · Date the order was placed (ISO format YYYY-MM-DD).\n- status · VARCHAR · Order lifecycle status: placed, shipped, completed or cancelled.\n- loaded_at · TIMESTAMP · UTC timestamp when the ingestion job wrote the row.\n\n### Source raw.raw_payments\nTable: \"ecommerce\".\"raw\".\"raw_payments\"\nDescription: One row per payment taken by the payment provider. Split payments produce several rows per order.\nFreshness: measured on `loaded_at`; warn after 6 hours, error after 12 hours\nColumns (name · type in warehouse · description):\n- payment_id · INTEGER · Payment provider primary key (integer).\n- order_id · INTEGER · Shop order_id the payment belongs to.\n- payment_method · VARCHAR · Payment method: credit_card, bank_transfer, voucher or gift_card.\n- amount · INTEGER · Payment amount in integer cents.\n- loaded_at · TIMESTAMP · UTC timestamp when the ingestion job wrote the row.", false], ["Lineage", "DAG edges (upstream → downstream; tests omitted):\n- source raw.raw_orders → model stg_orders\n- source raw.raw_payments → model stg_payments\n- model dim_customers → exposure finance_revenue_dashboard\n- model dim_customers → exposure marketing_customer_dashboard\n- model fct_orders → exposure finance_revenue_dashboard\n- model stg_orders → model dim_customers\n- model stg_orders → model fct_orders\n- model stg_payments → model dim_customers\n- model stg_payments → model fct_orders\nDownstream nodes (affected if the failing node is wrong or skipped):\n- model stg_payments (view): Cleaned payments, one row per payment. Amount converted from cents to currency units.\n- model dim_customers (table): One row per customer with order history and lifetime value. Used by marketing and finance dashboards.\n- model fct_orders (table): One row per order with payment amounts pivoted by method. Grain must match stg_orders (one row per order).\n- exposure finance_revenue_dashboard (dashboard, owner: Finance analytics): Daily revenue by payment method and order status. Refreshed at 07:00 UTC and used in the daily finance stand-up.\n- exposure marketing_customer_dashboard (dashboard, owner: Marketing analytics): Customer counts, lifetime value and repeat-purchase rate by country.\n- model stg_orders (view): Cleaned orders, one row per order. Expected volume is 500-1,000 orders over the 180-day window.\nColumn-level lineage (as designed):\n- stg_payments.{payment_id, order_id, payment_method, loaded_at} ← raw_payments (same names)\n- stg_payments.amount ← raw_payments.amount (integer cents / 100)\n- dim_customers.{customer_id, first_name, last_name, email, country_code, created_at} ← stg_customers (same names)\n- dim_customers.{first_order_date, most_recent_order_date, number_of_orders} ← stg_orders.order_date / order_id, per customer_id\n- dim_customers.lifetime_value ← stg_payments.amount joined via stg_orders.order_id, non-cancelled orders, per customer_id\n- fct_orders.{order_id, customer_id, order_date, status} ← stg_orders (same names)\n- fct_orders.{credit_card_amount, bank_transfer_amount, voucher_amount, gift_card_amount} ← stg_payments.amount by payment_method, per order_id\n- fct_orders.amount ← stg_payments.amount, total per order_id\n- stg_orders.{order_id, customer_id, status, loaded_at} ← raw_orders (same names)\n- stg_orders.order_date ← raw_orders.order_date (cast to date)", false], ["Recent history", "Recent changes (newest first):\n- 2026-10-12 · ticket · SEC-58: rotated the database credentials of the shop read replica.\n- 2026-10-08 · ticket · BI-204: 'Weekly revenue' tile added to the finance revenue dashboard (reads fct_orders)\n- 2026-10-01 · commit 7d3a016 · stg_customers: lower-case email and upper-case country code (models/staging/stg_customers.sql)\nPrevious incidents:\n- INC-0359 (2026-08-14): orders stale for 14 h while the connector was paused for maintenance. Resolution: connector resumed; missing hours backfilled automatically.\nRecent run history:\n- raw_orders and raw_payments freshness age at run time, last 7 daily runs: 0.5–1.5 h; today (2026-10-13) about 24 h.", false]], "reference": "Root cause: raw_orders and raw_payments both stopped receiving rows at 2026-10-12 19:05 UTC, about 24 h ago, and both come through the shop database connector. raw_customers comes from the CRM and is still fresh. The timing matches the SEC-58 credential rotation on the shop replica: the connector is still using the old credentials. The dbt models and tests are fine; dbt build passes on stale data.\n\nFix: Update the shop connector with the new SEC-58 credentials and re-run the sync. Its incremental extract should backfill the missing hours. Then re-run `dbt build` and `dbt source freshness`. Prevention: add credential rotation to the connector's runbook and alert on connector failures, not only on freshness.\n\nVerification: `dbt source freshness` passes for raw_orders and raw_payments, and `select max(loaded_at) from raw.raw_orders` is within the last hour. Orders placed after 2026-10-12 19:05 UTC, during the outage, are present."}, "FV02": {"sections": [["Failure report", "Command: dbt build  (exit code 0)\nResult: 30 passed, 0 failed, 0 errors, 0 warnings, 0 skipped\n\nCommand: dbt source freshness  (exit code 1)\n- PASS: source raw.raw_customers: max(loaded_at) = 2026-10-13 14:56 UTC, 4.1 h before the check (warn after 24 hours, error after 48 hours)\n- ERROR: source raw.raw_orders: max(loaded_at) = 2026-10-12 13:05 UTC, 30.0 h before the check (warn after 6 hours, error after 12 hours)\n- PASS: source raw.raw_payments: max(loaded_at) = 2026-10-13 18:05 UTC, 1.0 h before the check (warn after 6 hours, error after 12 hours)", true], ["Model and source metadata", "### Source raw.raw_orders\nTable: \"ecommerce\".\"raw\".\"raw_orders\"\nDescription: One row per order placed in the web shop.\nFreshness: measured on `loaded_at`; warn after 6 hours, error after 12 hours\nColumns (name · type in warehouse · description):\n- order_id · INTEGER · Shop primary key of the order (integer).\n- customer_id · INTEGER · CRM customer_id of the customer who placed the order.\n- order_date · DATE · Date the order was placed (ISO format YYYY-MM-DD).\n- status · VARCHAR · Order lifecycle status: placed, shipped, completed or cancelled.\n- loaded_at · TIMESTAMP · UTC timestamp when the ingestion job wrote the row.", false], ["Lineage", "DAG edges (upstream → downstream; tests omitted):\n- source raw.raw_orders → model stg_orders\n- model dim_customers → exposure finance_revenue_dashboard\n- model dim_customers → exposure marketing_customer_dashboard\n- model fct_orders → exposure finance_revenue_dashboard\n- model stg_orders → model dim_customers\n- model stg_orders → model fct_orders\nDownstream nodes (affected if the failing node is wrong or skipped):\n- model stg_orders (view): Cleaned orders, one row per order. Expected volume is 500-1,000 orders over the 180-day window.\n- model dim_customers (table): One row per customer with order history and lifetime value. Used by marketing and finance dashboards.\n- model fct_orders (table): One row per order with payment amounts pivoted by method. Grain must match stg_orders (one row per order).\n- exposure finance_revenue_dashboard (dashboard, owner: Finance analytics): Daily revenue by payment method and order status. Refreshed at 07:00 UTC and used in the daily finance stand-up.\n- exposure marketing_customer_dashboard (dashboard, owner: Marketing analytics): Customer counts, lifetime value and repeat-purchase rate by country.\nColumn-level lineage (as designed):\n- stg_orders.{order_id, customer_id, status, loaded_at} ← raw_orders (same names)\n- stg_orders.order_date ← raw_orders.order_date (cast to date)\n- dim_customers.{customer_id, first_name, last_name, email, country_code, created_at} ← stg_customers (same names)\n- dim_customers.{first_order_date, most_recent_order_date, number_of_orders} ← stg_orders.order_date / order_id, per customer_id\n- dim_customers.lifetime_value ← stg_payments.amount joined via stg_orders.order_id, non-cancelled orders, per customer_id\n- fct_orders.{order_id, customer_id, order_date, status} ← stg_orders (same names)\n- fct_orders.{credit_card_amount, bank_transfer_amount, voucher_amount, gift_card_amount} ← stg_payments.amount by payment_method, per order_id\n- fct_orders.amount ← stg_payments.amount, total per order_id", false], ["Recent history", "Recent changes (newest first):\n- 2026-10-11 · deploy · Ingestion: orders loader upgraded to v2.3 (watermark-based incremental extraction).\n- 2026-10-04 · commit f9bf287 · docs: add column descriptions to models/marts/schema.yml (no SQL change)\n- 2026-09-30 · deploy · CRM connector upgraded 3.1 → 3.2 (bug-fix release)\nPrevious incidents:\n- INC-0359 (2026-08-14): orders stale for 14 h while the connector was paused for maintenance. Resolution: connector resumed; missing hours backfilled automatically.\nRecent run history:\n- raw_orders freshness age at run time, last 7 daily runs: 0.5–1.5 h on previous days; about 30 h today (2026-10-13).\n- New rows in raw_orders: normal volume, including 4 rows in the last 30 h.", false]], "reference": "Root cause: raw_orders is not really stale. Orders placed in the last 30 h are present (4 rows, latest order_date 2026-10-13), but every one of them has the same loaded_at, 2026-10-12 13:05 UTC, which for some is earlier than when the order was placed. The orders loader upgraded to v2.3 two days ago stamps loaded_at with its extraction watermark, which is stuck, instead of the load time. The freshness check reads loaded_at, so it reports the source as about 30 h stale.\n\nFix: Ask the ingestion team to fix or roll back loader v2.3 so loaded_at records the actual load time and the watermark advances. Then reload the affected rows so their loaded_at is correct. Do not raise the freshness threshold to make the error go away: a real outage would then go unnoticed.\n\nVerification: `select loaded_at, count(*) from raw.raw_orders group by 1 order by 1 desc limit 5` shows separate hourly load times again, and `dbt source freshness --select source:raw.raw_orders` passes."}, "FV03": {"sections": [["Failure report", "Command: dbt build  (exit code 0)\nResult: 30 passed, 0 failed, 0 errors, 0 warnings, 0 skipped\n\nCommand: dbt source freshness  (exit code 1)\n- ERROR: source raw.raw_customers: max(loaded_at) = 2026-10-13 14:56 UTC, 4.1 h before the check (warn after 1 hour, error after 2 hours)\n- PASS: source raw.raw_orders: max(loaded_at) = 2026-10-13 18:05 UTC, 1.0 h before the check (warn after 6 hours, error after 12 hours)\n- PASS: source raw.raw_payments: max(loaded_at) = 2026-10-13 18:05 UTC, 1.0 h before the check (warn after 6 hours, error after 12 hours)", true], ["Model and source metadata", "### Source raw.raw_customers\nTable: \"ecommerce\".\"raw\" ame, last_name, email, country_code, created_at} ← stg_customers (same names)\n- dim_customers.{first_order_date, most_recent_order_date, number_of_orders} ← stg_orders.order_date / order_id, per customer_id\n- dim_customers.lifetime_value ← stg_payments.amount joined via stg_orders.order_id, non-cancelled orders, per customer_id", false], ["Recent history", "Recent changes (newest first):\n- 2026-10-12 · commit f1c34a7 · sources.yml: align raw_customers freshness with orders/payments since all loaders run hourly, DATA-140 (models/staging/sources.yml)\n- 2026-10-07 · deploy · CI image upgraded dbt-duckdb 1.10 → 1.11; full build passed afterwards\n- 2026-10-02 · commit 33c675a · add accepted_values test on stg_payments.payment_method (models/staging/schema.yml)\nPrevious incidents:\n- INC-0318 (2026-07-08): CRM sync paused for 2 days during a vendor upgrade; raw_customers freshness errored at 48 h. Resolution: sync resumed.\nRecent run history:\n- raw_customers freshness age at run time, last 7 daily runs: 3 h, 19 h, 7 h, 30 h, 11 h, 5 h; about 4 h today (2026-10-13).\n- Customer sign-ups per day: 0–2.", false]], "reference": "Root cause: Yesterday's DATA-140 commit changed raw_customers freshness in models/staging/sources.yml from warn 24 h / error 48 h to warn 1 h / error 2 h. Freshness is measured on max(loaded_at), and raw_customers only gets a row when a customer signs up, at most a couple a day. So max(loaded_at) is usually hours old even when the loader is healthy (now about 4 h). The CRM loader is working: the source is quiet, not stale.\n\nFix: Revert the raw_customers freshness override in models/staging/sources.yml to `warn_after: {count: 24, period: hour}` and `error_after: {count: 48, period: hour}`. If hourly monitoring of the CRM loader is needed, check the loader's own run log or heartbeat instead of row timestamps.\n\nVerification: `dbt source freshness --select source:raw.raw_customers` passes, and its age falls within the historical range of 3–30 h n        -- source stores integer cents; convert to currency units\n        cast(amount as decimal(18, 2)) / 100 as amount,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```", false], ["Lineage", "DAG edges (upstream → downstream; tests omitted):\n- source raw.raw_payments → model stg_payments\n- model dim_customers → exposure finance_revenue_dashboard\n- model dim_customers → exposure marketing_customer_dashboard\n- model fct_orders → exposure finance_revenue_dashboard\n- model stg_payments → model dim_customers\n- model stg_payments → model fct_orders\nUpstream nodes and their current warehouse columns:\n- source raw.raw_payments (source table): payment_id INTEGER, order_id INTEGER, payment_method VARCHAR, amount INTEGER, loaded_at TIMESTAMP\nDownstream nodes (affected if the failing node is wrong or skipped):\n- model dim_customers (table): One row per customer with order history and lifetime value. Used by marketing and finance dashboards.\n- model fct_orders (table): One row per order with payment amounts pivoted by method. Grain must match stg_orders (one row per order).\n- exposure finance_revenue_dashboard (dashboard, owner: Finance analytics): Daily revenue by payment method and order status. Refreshed at 07:00 UTC and used in the daily finance stand-up.\n- exposure marketing_customer_dashboard (dashboard, owner: Marketing analytics): Customer counts, lifetime value and repeat-purchase rate by country.\nColumn-level lineage (as designed):\n- stg_payments.{payment_id, order_id, payment_method, loaded_at} ← raw_payments (same names)\n- stg_payments.amount ← raw_payments.amount (integer cents / 100)\n- dim_customers.{customer_id, first_name, last_name, email, country_code, created_at} ← stg_customers (same names)\n- dim_customers.{first_order_date, most_recent_order_date, number_of_orders} ← stg_orders.order_date / order_id, per customer_id\n- dim_customers.lifetime_value ← stg_payments.amount joined via stg_orders.order_id, non-cancelled orders, per customer_id\n- fct_orders.{order_id, customer_id, order_date, status} ← stg_orders (same names)\n- fct_orders.{credit_card_amount, bank_transfer_amount, voucher_amount, gift_card_amount} ← stg_payments.amount by payment_method, per order_id\n- fct_orders.amount ← stg_payments.amount, total per order_id", false], ["Recent history", "Recent changes (newest first):\n- 2026-10-13 · vendor · Payment provider notice: gift-card settlement re-sync for the last 30 days runs today (2026-10-13), early morning UTC.\n- 2026-10-08 · ticket · BI-204: 'Weekly revenue' tile added to the finance revenue dashboard (reads fct_orders)\n- 2026-10-07 · deploy · CI image upgraded dbt-duckdb 1.10 → 1.11; full build passed afterwards\nPrevious incidents:\n- INC-0402 (2026-09-13): voucher amounts doubled after a provider file resend. Resolution: provider sent a corrected file; payments re-ingested.\nRecent run history:\n- not_null_stg_payments_amount, last 7 daily runs: pass ×6, fail today (2026-10-13) with 11 rows.\n- Gift-card payments per day: 0–2 (normal).", false]], "reference": "Root cause: All 11 null amounts in raw.raw_payments are payment_method = 'gift_card' rows from the last 30 days, and all share the same loaded_at (2026-10-13 16:05 UTC). The provider's gift-card re-sync reloaded them without the amount value. stg_payments passes amount straight through, so not_null_stg_payments_amount fails and the marts are skipped. dbt is working as intended; the data is wrong at the source.\n\nFix: Confirm the pattern: `select payment_method, loaded_at, count(*) from raw.raw_payments where amount is null group by 1, 2`. Ask the payment provider to resend the re-sync with amounts, then re-run ingestion and `dbt build`. Do not coalesce the nulls to 0: that would understate gift-card revenue on the finance dashboard. If the marts must refresh before the provider fixes it, temporarily set the not_null test on stg_payments.amount to `severity: warn` and tell Finance that gift-card revenue for the last 30 days is incomplete.\n\nVerification: After re-ingestion, `select count(*) from raw.raw_payments where amount is null` returns 0, `dbt build --select stg_payments+` passes, and fct_orders.gift_card_amount for the last 30 days is back to its earlier level."}, "NR02": {"sections": [["Failure report", "Command: dbt build  (exit code 1)\nResult: 29 passed, 1 failed, 0 errors, 0 warnings, 0 skipped\n- FAIL: test not_null_fct_orders_amount [not_null] on fct_orders.amount\n  Message: Got 46 results, configured to fail if != 0\n  Compiled test SQL:\n    select amount\n    from \"ecommerce\".\"main\".\"fct_orders\"\n    where amount is null\n\nCommand: dbt source freshness  (exit code 0)\n- PASS: source raw.raw_customers: max(loaded_at) = 2026-10-13 14:56 UTC, 4.1 h before the check (warn after 24 hours, error after 48 hours)\n- PASS: source raw.raw_orders: max(loaded_at) = 2026-10-13 18:05 UTC, 1.0 h before the check (warn after 6 hours, error after 12 hours)\n- PASS: source raw.raw_payments: max(loaded_at) = 2026-10-13 18:05 UTC, 1.0 h before the check (warn after 6 hours, error after 12 hours)", true], ["Model and source metadata", "### Model fct_orders\nFile: models/marts/fct_orders.sql · materialized as table\nDescription: One row per order with payment amounts pivoted by method. Grain must match stg_orders (one row per order).\nColumns (name · type in warehouse · description · tests):\n- order_id · INTEGER · Primary key of the order. · tests: unique, not_null\n- customer_id · INTEGER · Customer who placed the order (foreign key to dim_customers). · tests: not_null, relationships(to=dim_customers, field=customer_id)\n- order_date · DATE · Date the order was placed.\n- status · VARCHAR · Order lifecycle status.\n- credit_card_amount · DOUBLE · Amount paid by credit card.\n- bank_transfer_amount · DOUBLE · Amount paid by bank transfer.\n- voucher_amount · DOUBLE · Amount paid with vouchers.\n- gift_card_amount · DOUBLE · Amount paid with gift cards.\n- amount · DOUBLE · Total amount paid for the order (0 if no payments, e.g. cancelled orders). · tests: not_null\nModel-level tests: equal_row_count(compare_model=stg_orders)\nSQL (models/marts/fct_orders.sql):\n```sql\nwith orders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\norder_payments as (\n\n    select\n        order_id,\n        sum(case when payment_method = 'credit_card' then amount else 0 end) as credit_card_amount,\n        sum(case when payment_method = 'bank_transfer' then amount else 0 end) as bank_transfer_amount,\n        sum(case when payment_method = 'voucher' then amount else 0 end) as voucher_amount,\n        sum(case when payment_method = 'gift_card' then amount else 0 end) as gift_card_amount,\n        sum(amount) as total_amount\n    from payments\n    group by order_id\n\n),\n\nfinal as (\n\n    select\n        orders.order_id,\n        orders.customer_id,\n        orders.order_date,\n        orders.status,\n        coalesce(order_payments.credit_card_amount, 0) as credit_card_amount,\n        coalesce(order_payments.bank_transfer_amount, 0) as bank_transfer_amount,\n        coalesce(order_payments.voucher_amount, 0) as voucher_amount,\n        coalesce(order_payments.gift_card_amount, 0) as gift_card_amount,\n        order_payments.total_amount as amount\n    from orders\n    left join order_payments on orders.order_id = order_payments.order_id\n\n)\n\nselect * from final\n```", false], ["Lineage", "DAG edges (upstream → downstream; tests omitted):\n- source raw.raw_orders → model stg_orders\n- source raw.raw_payments → model stg_payments\n- model fct_orders → exposure finance_revenue_dashboard\n- model stg_orders → model fct_orders\n- model stg_payments → model fct_orders\nUpstream nodes and their current warehouse columns:\n- source raw.raw_orders (source table): order_id INTEGER, customer_id INTEGER, order_date DATE, status VARCHAR, loaded_at TIMESTAMP\n- s
