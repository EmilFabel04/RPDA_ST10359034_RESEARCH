right column and model, but gives no code, no downstream impact and no way to verify the fix."}, {"score": "3", "example": "“Root cause: raw_orders now contains status = 'returned', which stg_orders passes through unchanged, so accepted_values on stg_orders.status fails. Fix: if returns are a valid business state, add 'returned' to the accepted values for status in models/staging/schema.yml (values: ['placed', 'shipped', 'completed', 'cancelled', 'returned']) and check that fct_orders handles returned orders correctly in revenue totals. Verify: dbt build --select stg_orders+”", "why": "Identifies the root cause, gives the exact fix location with code, names the affected downstream models and gives a verification step."}], "rules": ["Between two anchors: a 3 needs all four elements — the root cause, the exact fix location with code, the affected downstream models, and a verification step. A suggestion that names the right model or column but is missing any of these scores 2. One that names no specific model, column or code scores 1.", "Use the notes field for anything unusual. If a suggestion mentions a model or column that doesn’t exist in the scenario, note it. If the fix depends on it, score technical accuracy as the fix would actually behave: a change to a model that doesn’t exist can’t work as written.", "Each model was also asked to list the assumptions it made. Don’t score that list separately; use it only to understand the rest of the suggestion.", "If you’re unsure between two scores, pick one and add a note. Unclear cases are discussed afterwards. If you still disagree after discussion, both scores are kept and the disagreement is reported."]}, "items": [{"position": 1, "item_id": "NR03-02B", "is_repeat": 0, "scenario_id": "NR03", "label": "B", "group_pos": 1, "group_size": 6, "text": "### Root cause\n`dbt build` failed because the custom test `null_rate_below(max_rate=0.05)` on `stg_customers.email` found today’s email null rate above 5%: 17.5%. The source `raw.raw_customers` is fresh and the upstream schema still has an `email` column, so this is not a freshness or missing-column issue.\n\nThe most likely cause is the 2026-10-11 CRM setting change: `PRIV-31` enabled “EU privacy mode” on the customer export integration, which appears to redact or omit customer emails for some records. Because `stg_customers.email` is directly derived from `raw_customers.email` via `lower(email)`, the nulls propagate into `stg_customers`, causing `dim_customers` and its tests to be skipped.\n\n### Fix\nIf emails are required for downstream marketing/customer analytics, fix this outside dbt: update the CRM export integration setting changed in `PRIV-31` so that `raw.raw_customers.email` is exported where legally allowed, or provide a compliant replacement field such as a hashed email/customer contact key.\n\nIf EU privacy mode is intentional and missing emails are now expected, update the dbt contract/test to match the new business rule rather than treating this as a pipeline failure.\n\nRecommended dbt change in the column test for `models/staging/stg_customers.sql` metadata/YAML: either raise/remove the global email null-rate threshold, or better, make the tolerance country-aware if privacy mode only affects EU customers.\n\nExample if the accepted new global maximum is 20%:\n\n```yaml\nmodels:\n  - name: stg_customers\n    columns:\n      - name: email\n        description: Lower-cased email address. Missing when suppressed by CRM privacy controls.\n        tests:\n          - null_rate_below:\n              max_rate: 0.20\n```\n\nBetter long-term remediation, if legally/operationally valid, is to add a non-PII stable contact identifier from the CRM export, for example `email_hash`, and use that in downstream use cases that need identity matching without raw email. That would require:\n- CRM export: add `email_hash`\n- source `raw.raw_customers`: include `email_hash`\n- `models/staging/stg_customers.sql`: select and expose `email_hash`\n- `dim_customers`: carry `email_hash` through from `stg_customers`\n\nExample staging change, if `raw_customers.email_hash` exists:\n\n```sql\nselect\n    customer_id,\n    first_name,\n    last_name,\n    lower(email) as email,\n    email_hash,\n    upper(country) as country_code,\n    cast(created_at as timestamp) as created_at,\n    loaded_at\nfrom source\n```\n\n### Verification\nFirst confirm the nulls are coming from the raw CRM export:\n\n```sql\nselect\n    count(*) as total_rows,\n    sum(case when email is null then 1 else 0 end) as null_rows,\n    sum(case when email is null then 1 else 0 end) * 1.0 / nullif(count(*), 0) as null_rate\nfrom raw.raw_customers;\n```\n\nOptionally check whether this is country/privacy related:\n\n```sql\nselect\n    upper(country) as country_code,\n    count(*) as total_rows,\n    sum(case when email is null then 1 else 0 end) as null_rows,\n    sum(case when email is null then 1 else 0 end) * 1.0 / nullif(count(*), 0) as null_rate\nfrom raw.raw_customers\ngroup by 1\norder by null_rate desc, total_rows desc;\n```\n\nAfter fixing the CRM export or updating the dbt test expectation, run:\n\n```bash\ndbt build --select stg_customers+ source:raw.raw_customers\ndbt source freshness --select source:raw.raw_customers\n```\n\nExpected result:\n- `stg_customers` builds successfully.\n- `null_rate_below_stg_customers_email__0_05` passes if the CRM export was restored and null rate is ≤ 5%; or the updated threshold/test passes if the new privacy behavior is accepted.\n- `dim_customers` and its tests are no longer skipped.\n- Source freshness remains passing.\n\n### Assumptions\n- “EU privacy mode” redacts or suppresses email values in the CRM customer export.\n- The 17.5% null rate is computed on the same `stg_customers` view built from `raw.raw_customers`.\n- No dbt code change after 2026-10-01 caused the sudden increase.\n- Whether the correct business response is to restore email export or accept higher null rates depends on privacy/legal requirements not provided here."}, {"position": 2, "item_id": "NR03-09B", "is_repeat": 0, "scenario_id": "NR03", "label": "B", "group_pos": 2, "group_size": 6, "text": "### Root cause\n\nThe failure report indicates that the test `null_rate_below_stg_customers_email__0_05` on the `stg_customers.email` model failed. This test checks the null rate of the `email` column in the `stg_customers` staging table and fails if the null rate exceeds 0.05. Since the test only checks for failures, it's likely that the null rate is above the threshold, indicating that a significant number of customers' emails are null or missing.\n\n### Fix\n\nTo fix this issue, we need to investigate why the null rate is high and update the data to correct the missing emails. One possible solution is to run a data quality check on the `stg_customers` table to identify the customers with missing emails and update their records accordingly. This may involve running a SQL query to identify the affected records and then updating the `email` column using a data enrichment service or by contacting the customers directly.\n\nAssuming that the null rate is due to incorrect or missing data, we can modify the test to allow for a higher null rate or to ignore the null values for a specific column. For example, we can update the test SQL to:\n\n```sql\nwith stats as (\n    select\n        count(*) as total_rows,\n        sum(case when email is null then 1 else 0 end) as null_rows\n    from \"ecommerce\".\"main\".\"stg_customers\"\n)\nselect\n    total_rows,\n    null_rows,\n    null_rows * 1.0 / nullif(total_rows, 0) as null_rate\nfrom stats\nwhere null_rows * 1.0 / nullif(total_rows, 0) <= 0.05\n```\n\nThis modified test will pass if the null rate is 0.05 or less, allowing us to continue building the data mart.\n\n### Verification\n\nTo verify that the fix worked, we can re-run the `dbt build` command and check that the test has passed. We can also run a SQL query to verify the null rate of the `email` column:\n\n```sql\nwith stats as (\n    select\n        count(*) as total_rows,\n        sum(case when email is null then 1 else 0 end) as null_rows\n    from \"ecommerce\".\"main\".\"stg_customers\"\n)\nselect\n    total_rows,\n    null_rows,\n    null_rows * 1.0 / nullif(total_rows, 0) as null_rate\nfrom stats\nwhere null_rows * 1.0 / nullif(total_rows, 0) <= 0.05;\n```\n\nIf the null rate is below 0.05, the test should pass, and we can continue building the data mart.\n\n### Assumptions\n\nAssuming that the null rate is due to incorrect or missing data, and that we have the necessary resources and data enrichment services to correct the missing emails."}, {"position": 3, "item_id": "NR03-09A", "is_repeat": 0, "scenario_id": "NR03", "label": "A", "group_pos": 3, "group_size": 6, "text": "### Root cause\nThe custom generic test `null_rate_below(max_rate=0.05)` on `stg_customers.email` returned one row, meaning more than 5% of customer emails are NULL. The test itself works as designed. The report does not show the actual null rate or row counts, so the magnitude is unknown. Because `dim_customers` depends on `stg_customers`, dbt skipped it and its 4 tests, so the mart is stale or missing for this run.\n\nSource freshness passes, so this is not a stale-load problem. Raw data is arriving, but the email values in it are NULL, empty or unparseable. The most likely candidates are an upstream change in the CRM export or ingestion job (renamed or dropped column, schema change, a broken mapping), or a staging change that now nulls out blank strings or invalid values. The null rate is not confirmed to be new, so we can't yet say whether this is a regression or a long-standing issue that crossed the threshold. The evidence available doesn't distinguish these.\n\n### Fix\n1. **Diagnose first.** Find out where the NULLs originate:\n```sql\nselect\n  count(*) as total_rows,\n  sum(case when email is null then 1 else 0 end) as null_rows,\n  sum(case when trim(email) = '' then 1 else 0 end) as blank_rows,\n  min(loaded_at) filter (where email is null) as first_null_load,\n  max(loaded_at) filter (where email is null) as last_null_load\nfrom \"ecommerce\".\"raw\".\"raw_customers\";\n```\nRun it against `stg_customers` too. If raw has the NULLs, the problem is upstream; if only staging does, the problem is in `models/staging/stg_customers.sql`.\n\n2. **If the NULLs come from the CRM/ingestion job (outside dbt):** fix the CRM export or the ingestion job's column mapping so `email` is populated again, then re-run ingestion. Backfill the affected rows from the CRM. Do not change the dbt test.\n\n3. **If staging introduced them:** correct the `email` expression in `stg_customers.sql` (e.g. a bad `try_cast`, join or `nullif`).\n\n4. **Do not loosen or disable the test** (e.g. raising `max_rate`) just to unblock the pipeline. Only raise the threshold if the business confirms a higher NULL rate is legitimate (e.g. guest checkouts without email), in which case set it in the model's YAML:\n```yaml\nmodels:\n  - name: stg_customers\n    columns:\n      - name: email\n        tests:\n          - null_rate_below:\n              max_rate: <agreed value>\n```\n\n### Verification\nAfter the upstream/staging fix and re-ingestion:\n```\ndbt build --select stg_customers+\n```\nExpected: `null_rate_below_stg_customers_email__0_05` passes, `dim_customers` builds, and its 4 tests run and pass (no skips). Also confirm directly:\n```sql\nselect sum(case when email is null then 1 else 0 end) * 1.0 / count(*) as null_rate\nfrom \"ecommerce\".\"main\".\"stg_customers\";\n```\nExpected: ≤ 0.05, ideally back at the historical baseline. Finally, run `dbt source freshness` to confirm it still passes.\n\n### Assumptions\n- The CRM feeds `raw.raw_customers`, and `stg_customers` is a thin view over it (not stated in the report).\n- `raw_customers` has an `email` column and a `loaded_at` column, as the freshness check implies for `loaded_at`.\n- The 5% threshold reflects a real expectation that emails are almost always present.\n- No recent changes to `stg_customers.sql` or the CRM export are known; I have not seen them and can't say whether any occurred.\n- The failure is the first occurrence; prior run history was not provided.\n- The skipped `dim_customers` has no other failure causes, since it never ran."}, {"position": 4, "item_id": "NR03-02C", "is_repeat": 0, "scenario_id": "NR03", "label": "C", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is that the null rate in the `stg_customers` model exceeded the configured threshold of 5%. This is indicated by the recent run history, which shows an email null rate of 17.5% for the current day (2026-10-13), compared to the previous days' rates of 0.0%, 0.0%, 0.5%, 0.0%, 0.0%.\n\n### Fix\n\nTo fix the issue, we need to adjust the null rate threshold for the `stg_customers` model. We can do this by updating the `null_rate_below` test in the `stg_customers.sql` model file. Specifically, we need to increase the `max_rate` parameter in the `null_rate_below` function to a higher value, such as 0.2 or 0.3, depending on the tolerance we want to allow for null email addresses.\n\nHere's the updated `stg_customers.sql` file:\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_customers') }}\n\n),\n\nrenamed as (\n\n    select\n        customer_id,\n        first_name,\n        last_name,\n        lower(email) as email,\n        upper(country) as country_code,\n        cast(created_at as timestamp) as created_at,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```\nAnd the updated `null_rate_below` test:\n```sql\nnull_rate_below(max_rate=0.2)\n```\n### Verification\n\nTo verify that the fix worked, we can run the `dbt test` command and check that the null rate test for `stg_customers.email` is now passing. We can also monitor the null rate in the `stg_customers` model over the next few days to ensure that it stays within the new threshold.\n\n### Assumptions\n\nI assumed that the recent run history is accurate and that the email null rate in the `stg_customers` model is the root cause of the failure. I also assumed that increasing the null rate threshold to a higher value will resolve the issue and allow the `stg_customers` model to pass its data tests."}, {"position": 5, "item_id": "NR03-01B", "is_repeat": 0, "scenario_id": "NR03", "label": "B", "group_pos": 5, "group_size": 6, "text": "### Root cause\nThe test failed because the null rate of `stg_customers.email` exceeds 5%. The test SQL returns a row only when `null_rate > 0.05`, so one result row means the threshold was breached. The report doesn't give the actual null rate, total rows or null count, so the size of the breach is unknown. `stg_customers` only applies `lower(email)`, which cannot create nulls, so the nulls come from `raw.raw_customers.email`. The most likely explanation is an upstream problem in the CRM or its ingestion job (for example a changed export, a renamed or dropped field, or a form change). That is a hypothesis until the data is inspected. Source freshness passes (last load 4.1 h ago, well inside the 24 h warn threshold), so ingestion is running and the problem is the content of the data, not staleness. `dim_customers` and its 4 tests were skipped only because of this upstream failure.\n\n### Fix\n1. **Diagnose first.** Quantify and locate the nulls in the raw table:\n\n```sql\nselect\n    date_trunc('day', loaded_at) as load_day,\n    count(*) as total_rows,\n    sum(case when email is null then 1 else 0 end) as null_rows,\n    sum(case when email is null then 1 else 0 end) * 1.0 / count(*) as null_rate,\n    sum(case when trim(email) = '' then 1 else 0 end) as blank_rows\nfrom \"ecommerce\".\"raw\".\"raw_customers\"\ngroup by 1\norder by 1 desc;\n```\n\n   Check whether nulls cluster in recent loads (ingestion/CRM regression) or are spread across history (the data was always this sparse and a customer segment grew).\n\n2. **If it is a recent upstream regression** (the likely case): fix it at the source, outside the dbt project. The CRM export or ingestion job that loads `raw.raw_customers` should populate `email` again, and the affected rows should be re-loaded or backfilled. Do not change dbt to hide it.\n\n3. **If the business has legitimately accepted a higher missing-email share:** raise the threshold in the model's YAML (the `stg_customers` schema file under `models/staging/`), with the owner's agreement:\n\n```yaml\n- name: email\n  tests:\n    - null_rate_below:\n        max_rate: <new agreed value>\n```\n\n   Also update the column description, which currently states the 5% tolerance.\n\n4. **Optional hardening:** if the query shows blank strings (`''`) rather than nulls, they are not counted by this test; consider `nullif(trim(lower(email)), '')` in `stg_customers.sql` so missing emails are represented consistently.\n\nDo not disable the test or use `--exclude` to unblock `dim_customers`; the test is correctly flagging a data quality problem.\n\n### Verification\nAfter the upstream fix and re-ingestion (or the threshold change), run:\n\n```\ndbt build --select stg_customers+ \n```\n\nExpected: `null_rate_below_stg_customers_email__0_05` passes (the compiled query returns 0 rows), and `dim_customers` plus its 4 tests run and pass instead of being skipped. Also re-run the diagnostic query above on `stg_customers` to confirm the null rate is at or below the threshold:\n\n```sql\nselect count(*) filter (where email is null) * 1.0 / count(*) as null_rate\nfrom \"ecommerce\".\"main\".\"stg_customers\";\n```\n\nRun `dbt source freshness` again to confirm all three sources stay within their thresholds.\n\n### Assumptions\n- The null rate was previously below 5%, so this is a change rather than a long-standing condition.\n- Missing emails are real NULLs in `raw_customers`; blank strings are possible but unverified.\n- The `raw` schema is not owned by dbt, so the ingestion/CRM export fix lives with the ingestion owners.\n- No intentional business change (such as guest checkout or a new signup channel without email) is known to have occurred; if one did, option 3 applies.\n- The `null_rate_below` generic test is working as designed, and the schema YAML for `stg_customers` lives in `models/staging/`."}, {"position": 6, "item_id": "NR03-01A", "is_repeat": 0, "scenario_id": "NR03", "label": "A", "group_pos": 6, "group_size": 6, "text": "### Root cause\n`dbt build` failed because the data test `null_rate_below(max_rate=0.05)` on `stg_customers.email` returned one failing row: more than 5% of rows in `\"ecommerce\".\"main\".\"stg_customers\"` have `email is null`.\n\nThe staging SQL only lower-cases `raw.raw_customers.email`; it does not create nulls except where the raw value is already null, assuming DuckDB `lower()` behavior on null input. Source freshness passed, so this is not a stale-source issue. Most likely the upstream customer ingestion/source data now contains an unusually high share of missing customer emails, exceeding the modeled tolerance.\n\n### Fix\nRemediate at the source/ingestion layer for `raw.raw_customers.email`, unless missing emails above 5% are now expected business behavior.\n\nSpecific recommendation:\n\n1. Investigate and fix the ingestion job or upstream web shop/CRM feed that populates `raw.raw_customers.email`.\n   - Check whether a recent ingestion/deployment stopped mapping the email field correctly.\n   - Backfill/correct affected rows in `raw.raw_customers.email` if emails exist in the source system.\n   - This change is outside the dbt project, in the hourly ingestion pipeline feeding the `raw` schema.\n\n2. Keep the dbt model `models/staging/stg_customers.sql` unchanged unless raw emails contain blank strings that should be treated as missing. If blanks are present and should count as nulls, update the staging model to normalize them:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_customers') }}\n\n),\n\nrenamed as (\n\n    select\n        customer_id,\n        first_name,\n        last_name,\n        nullif(lower(trim(email)), '') as email,\n        upper(country) as country_code,\n        cast(created_at as timestamp) as created_at,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```\n\n3. Do not raise the `max_rate` above `0.05` unless the business owner confirms that more than 5% missing customer emails is acceptable. If that is the intended new rule, update the YAML test configuration for `stg_customers.email` from `max_rate: 0.05` to the approved threshold.\n\n### Verification\nFirst quantify the issue:\n\n```sql\nselect\n    count(*) as total_rows,\n    sum(case when email is null then 1 else 0 end) as null_rows,\n    sum(case when email is null then 1 else 0 end) * 1.0 / nullif(count(*), 0) as null_rate\nfrom ecommerce.main.stg_customers;\n```\n\nExpected after remediation: `null_rate <= 0.05`.\n\nOptionally inspect whether the problem is recent:\n\n```sql\nselect\n    date_trunc('hour', loaded_at) as loaded_hour,\n    count(*) as total_rows,\n    sum(case when email is null then 1 else 0 end) as null_rows,\n    sum(case when email is null then 1 else 0 end) * 1.0 / nullif(count(*), 0) as null_rate\nfrom ecommerce.main.stg_customers\ngroup by 1\norder by 1 desc;\n```\n\nThen rerun dbt:\n\n```bash\ndbt build --select stg_customers+ \ndbt source freshness --select source:raw.raw_customers\n```\n\nExpected result:\n- `test null_rate_below_stg_customers_email__0_05` passes.\n- `dim_customers` and its downstream tests are no longer skipped.\n- `raw.raw_customers` freshness still passes.\n\n### Assumptions\n- `lower(email)` in DuckDB preserves nulls, so null emails in `stg_customers` originate from `raw.raw_customers.email`.\n- The current 5% maximum missing-email tolerance is still the intended business/data-quality rule.\n- The failed test blocked `dim_customers` because `dim_customers` depends on `stg_customers`.\n- The failure is data-quality related, not a dbt syntax, adapter, or warehouse availability issue."}, {"position": 7, "item_id": "FV02-07C", "is_repeat": 0, "scenario_id": "FV02", "label": "C", "group_pos": 1, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is the raw_orders source in the raw schema not being refreshed in the past 30 hours, causing the source freshness check to fail. This is likely due to an ingestion job failure or a delay in the data ingestion process.\n\n### Fix\n\nTo fix this issue, the `raw_orders` source model needs to be updated to reflect the latest data. This can be achieved by adjusting the `ref` column in the `raw_orders` model to point to the latest data. Specifically, update the `ref` column in `models/raw_orders.yml` to:\n\n```\n  ref: \"raw_orders\",\n  loaded_at: datetime(\"2026-10-13 14:56 UTC\")\n```\n\nThis will ensure that the `raw_orders` source is updated to reflect the latest data and the source freshness check will pass.\n\n### Verification\n\nTo verify that the fix worked, run the `dbt source freshness` command again. The expected result is that the `raw_orders` source will pass the freshness check.\n\n```\ndbt source freshness\n```\n\nIf the fix is successful, the output should indicate that the `raw_orders` source is up-to-date and the freshness check will pass.\n\n### Assumptions\n\nAssuming that the ingestion jobs are running correctly and the data is being ingested into the `raw` schema."}, {"position": 8, "item_id": "FV02-02C", "is_repeat": 0, "scenario_id": "FV02", "label": "C", "group_pos": 2, "group_size": 6, "text": "### Root cause\nThe failure is a stale source, not a dbt code problem. `dbt build` passed (30/30) because every model and test ran on whatever data was already in `raw`. It cannot detect that nothing new arrived. `dbt source freshness` correctly flags `raw.raw_orders`: its newest `loaded_at` is 2026-10-12 13:05 UTC, 30 h old, against a 12 h error threshold. Payments (1 h) and customers (4.1 h) are current, so the hourly ingestion for the shop's orders feed stopped around 13:05 UTC yesterday, while the payment and CRM jobs kept running. Consequently, every mart built on `raw_orders` is currently serving data about 30 h out of date, even though all tests are green.\n\nBecause the other two sources are healthy, the problem is isolated to the web-shop-to-`raw.raw_orders` ingestion job (job failure, credentials/API change, upstream outage, or a stuck/disabled schedule). The cause cannot be determined from the dbt output alone.\n\n### Fix\nThe fix is outside the dbt project: restore the ingestion job that loads the web shop's orders into `raw.raw_orders`.\n\n1. Check the orchestrator/ingestion tool logs for the orders job's first failed or missing run after 2026-10-12 13:05 UTC.\n2. Fix the underlying issue (expired credential, schema change in the shop export, paused schedule, upstream outage) and re-run the job.\n3. Backfill: make sure the load covers everything since the last successful run (e.g. orders with `order_date >= 2026-10-12`), and that the load is idempotent or deduplicated on `order_id` so the backfill does not create duplicate orders.\n4. Once fresh data is in, re-run the downstream models: `dbt build --select source:raw.raw_orders+`\n\nNo change to the freshness config is needed. The thresholds (warn 6 h, error 12 h) are appropriate for an hourly feed, and loosening them would only hide the issue. To prevent a recurrence, consider making the pipeline gate on freshness (e.g. run `dbt source freshness` before `dbt build` and stop on failure) and alerting on its non-zero exit code, so stale marts are not silently published as healthy.\n\n### Verification\nAfter the ingestion job has run, check the source directly:\n\n```sql\nselect max(loaded_at) as latest_load,\n       count(*) filter (where order_date >= current_date - 1) as recent_orders,\n       count(*) - count(distinct order_id) as duplicate_order_ids\nfrom ecommerce.raw.raw_orders;\n```\n\nExpected: `latest_load` within the last hour or so, `recent_orders` > 0, and `duplicate_order_ids` = 0 (assuming order_id is unique, see below).\n\nThen run:\n\n```\ndbt source freshness\ndbt build --select source:raw.raw_orders+\n```\n\nExpected: all three sources PASS (orders well under the 6 h warn threshold), exit code 0; the build finishes with all tests passing and marts reflecting orders from the last 30 h.\n\n### Assumptions\n- The `loaded_at` of `raw_orders` is set by the ingestion job at write time, so a stale value means no new rows were written, rather than a bug in the timestamp itself.\n- The orders ingestion is a separate job or pipeline from payments and CRM (evidenced by their healthy freshness); I have no access to its logs, schedule or ownership.\n- No orders were actually lacking in the shop; the gap is in loading, not in business activity (a 30 h gap with zero orders is implausible for a web shop, but this is unconfirmed).\n- `order_id` is unique in `raw_orders`, so duplicates after a backfill are detectable on that key.\n- Downstream marts select from `raw_orders` via the staging views and have no other source of order data.\n- The freshness check time was roughly 2026-10-13 19:05 UTC, inferred from the reported ages."}, {"position": 9, "item_id": "FV02-07A", "is_repeat": 0, "scenario_id": "FV02", "label": "A", "group_pos": 3, "group_size": 6, "text": "### Root cause\n`dbt build` succeeded, so the dbt models and tests that ran did not detect a modeling/test failure. The failure is from `dbt source freshness`: `raw.raw_orders` is stale. Its latest `loaded_at` is `2026-10-12 13:05 UTC`, which is 30 hours before the check and exceeds the configured error threshold of 12 hours. This likely means the hourly ingestion job for webshop orders stopped loading into `raw.raw_orders` or is no longer populating `loaded_at` correctly.\n\n### Fix\nFix the upstream ingestion for the webshop orders feed that writes to the DuckDB table/source:\n\n- Source: `raw.raw_orders`\n- Freshness column: `loaded_at`\n- Expected behavior: append/load new order records hourly with `loaded_at` set to the ingestion/load timestamp in UTC.\n\nThis change is outside the dbt project: update or rerun the ingestion job that loads webshop orders into `raw.raw_orders`.\n\nIf the ingestion pipeline is healthy but the freshness configuration is wrong, verify the source YAML in the dbt project and ensure it points at the correct column:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_orders\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 6\n            period: hour\n          error_after:\n            count: 12\n            period: hour\n```\n\nDo not change the threshold just to make the alert pass unless the business freshness SLA for orders has intentionally changed.\n\n### Verification\nFirst confirm the current max `loaded_at` in DuckDB:\n\n```sql\nselect max(loaded_at) as max_loaded_at\nfrom raw.raw_orders;\n```\n\nExpected after the fix: `max_loaded_at` should be within the last 6 hours for a full pass, and definitely within the last 12 hours to avoid an error.\n\nThen rerun source freshness for the affected source:\n\n```bash\ndbt source freshness --select source:raw.raw_orders\n```\n\nExpected result:\n\n```text\nPASS: source raw.raw_orders\n```\n\nOptionally rerun all freshness checks:\n\n```bash\ndbt source freshness\n```\n\nExpected result: exit code `0`, with `raw.raw_customers`, `raw.raw_orders`, and `raw.raw_payments` all passing, assuming no other source has become stale.\n\nIf ingestion was backfilled, also rerun the downstream dbt build for order-dependent models:\n\n```bash\ndbt build --select source:raw.raw_orders+\n```\n\nExpected result: all selected staging views, mart tables, and tests pass.\n\n### Assumptions\nThe `loaded_at` column is intended to represent the ingestion timestamp in UTC.\n\nThe source YAML is configured with `loaded_at_field: loaded_at` for `raw.raw_orders`.\n\nThe `raw.raw_orders` data comes from the webshop ingestion job, not the payment provider or CRM.\n\nThe freshness SLA for orders is still warn after 6 hours and error after 12 hours.\n\nThe scheduled freshness check ran around `2026-10-13 19:05 UTC`, based on the reported ages."}, {"position": 10, "item_id": "FV02-09A", "is_repeat": 0, "scenario_id": "FV02", "label": "A", "group_pos": 4, "group_size": 6, "text": "### Root cause\nThe dbt project is not at fault: `dbt build` passed 30/30, and the only failure is source freshness on `raw.raw_orders` (30 h old vs. a 12 h error threshold). Customers and payments loaded normally, so the CRM and payment ingestion are healthy. The orders loader was upgraded to v2.3 (watermark-based incremental extraction) on 2026-10-11, and since then orders are being ingested only sporadically (4 rows in 30 h, versus normal volume before). The most likely cause is a faulty watermark in the new loader (stuck, advanced past unloaded data, or in the wrong timezone), so it extracts almost nothing. Note the report says \"normal volume\", which contradicts \"4 rows in 30 h\" and needs clarifying (see Assumptions).\n\nImpact: `stg_orders`, `dim_customers` and `fct_orders` are built from incomplete data. The green build is misleading. The 07:00 UTC finance dashboard (revenue by status/method) and the marketing dashboard (LTV, repeat rate) will understate orders and revenue.\n\n### Fix\nThe fix is outside the dbt project, in the ingestion job:\n1. Inspect the orders loader v2.3 logs and stored watermark. If the watermark is ahead of the latest loaded row (or timezone-shifted), reset it to a safe point before the stall, e.g. `2026-10-12 13:00 UTC`. Alternatively, roll back to the previous loader version.\n2. Run a backfill from the last good timestamp. Since incremental loads may overlap, make the load idempotent (upsert on `order_id`) so the backfill creates no duplicates.\n3. Add an alert on the watermark lag, so staleness is caught by the loader before the daily dbt run.\n\nIn dbt, no model change is needed. Optionally make freshness failures block downstream consumption by running `dbt source freshness` first in the scheduler and gating the dashboard refresh on it. Also add a duplicate guard on `stg_orders`:\n\n```yaml\nmodels:\n  - name: stg_orders\n    columns:\n      - name: order_id\n        tests: [unique, not_null]\n```\n\n(Likely already present; keep it, since a backfill with overlapping windows could introduce duplicates that would break the `fct_orders` grain.)\n\n### Verification\nAfter the backfill:\n```bash\ndbt source freshness\ndbt build --select stg_orders+ \n```\nExpected: `raw_orders` freshness PASS (age under 6 h, ideally ~1 h), and all tests pass. Then check completeness and duplicates:\n\n```sql\nselect date_trunc('day', loaded_at) d, count(*) from raw.raw_orders\nwhere loaded_at > now() - interval 4 day group by 1 order by 1;\n\nselect count(*) , count(distinct order_id) from raw.raw_orders;\n\nselect count(*) from stg_orders;  -- should be within 500-1,000\nselect count(*) from fct_orders;  -- should equal stg_orders count\n```\nExpected: daily loaded counts for 10-12 and 10-13 comparable to prior days, no duplicate `order_id`, and `fct_orders` row count equal to `stg_orders`. Before the 07:00 UTC refresh, spot-check the finance dashboard's 10-12/10-13 order counts against the shop's own data.\n\n### Assumptions\n- The \"4 rows in 30 h\" is the real recent volume (the \"normal volume\" wording is ambiguous); if total volume were genuinely normal, `loaded_at` itself might be wrong (e.g. v2.3 not populating or mis-stamping it), and the check should be on `order_date`/`order_id` continuity instead.\n- The v2.3 loader is the cause, based on timing (deployed two days earlier) and the contrast with the other connectors; I have no loader logs to confirm this. The slow decay may mean the loader worked briefly after deploy, so the exact onset is unknown.\n- The loader supports watermark reset and upserts, and the shop's source system still holds the missing orders.\n- `stg_orders` has no existing uniqueness test on `order_id`; if one exists, the suggested YAML is redundant.\n- INC-0359 (connector pause, automatic backfill) is not the same issue, since backfill is not happening automatically here."}, {"position": 11, "item_id": "FV02-02B", "is_repeat": 0, "scenario_id": "FV02", "label": "B", "group_pos": 5, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the `raw.raw_orders` source not being up to date. According to the source freshness check, the latest data loaded into the `raw_orders` table is from 2026-10-12 13:05 UTC, which is 30 hours before the scheduled check. This exceeds the error threshold of 12 hours, resulting in an error.\n\n### Fix\n\nTo fix this issue, we need to increase the frequency of the ingestion job that loads data into the `raw_orders` table. Specifically, we should adjust the schedule of the job that loads data from the web shop into the `raw_orders` table to run more frequently, such as every 30 minutes. This would ensure that the data remains fresh and within the error threshold.\n\nAssuming the ingestion job is configured using a cron job or a scheduler like Apache Airflow, the schedule would need to be updated to reflect the new frequency. For example, the cron job might be updated to run every 30 minutes, with a command like: `*/30 * * * * python /path/to/ingestion_script.py`.\n\n### Verification\n\nTo confirm that the fix worked, we can re-run the source freshness check using the `dbt source freshness` command. The expected result is that the latest data loaded into the `raw_orders` table is within the error threshold of 12 hours.\n\nWe can verify this by re-running the command and checking that the `max(loaded_at)` timestamp is within the error threshold. For example:\n```\ndbt source freshness\n- PASS: source raw.raw_orders: max(loaded_at) = 2026-10-13 14:00 UTC, 0.5 h before the check\n```\nThis indicates that the data is now fresh and within the error threshold.\n\n### Assumptions\n\nI assumed that the ingestion job is configured using a cron job or a scheduler like Apache Airflow, and that the schedule can be updated to reflect the new frequency. I also assumed that the ingestion job is configured to write the data into the `raw_orders` table."}, {"position": 12, "item_id": "FV02-09B", "is_repeat": 0, "scenario_id": "FV02", "label": "B", "group_pos": 6, "group_size": 6, "text": "### Root cause\n`dbt build` succeeded because the models and tests passed, but `dbt source freshness` failed for `source raw.raw_orders`: `max(loaded_at)` is `2026-10-12 13:05 UTC`, about 30 hours old, breaching the 12-hour freshness error threshold.\n\nThe key clue is that `raw_orders` still has normal new row volume, including 4 rows in the last 30 hours. That means the orders ingestion is likely still inserting order data, but the `loaded_at` column is no longer being populated with the ingestion write timestamp after the 2026-10-11 orders loader v2.3 upgrade. The freshness check is therefore measuring a stale or incorrect timestamp, not necessarily absence of new orders.\n\n### Fix\nFix the orders ingestion job outside dbt: in the web shop orders loader v2.3 that writes to `\"ecommerce\".\"raw\".\"raw_orders\"`, populate `loaded_at` with the UTC timestamp when the ingestion job writes each row.\n\nRequired target column:\n\n```sql\n\"ecommerce\".\"raw\".\"raw_orders\".loaded_at\n```\n\nThe ingestion insert/update logic should set:\n\n```sql\nloaded_at = current_timestamp -- in UTC\n```\n\nor the equivalent UTC ingestion timestamp in the ingestion framework.\n\nIf the loader intentionally changed the metadata column name in v2.3, either restore the contract by writing to `loaded_at`, or update the dbt source freshness configuration for `raw.raw_orders` to point at the new ingestion timestamp column. For example, only if the new correct column is assumed to be `ingested_at`, update the source YAML:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_orders\n        loaded_at_field: ingested_at\n        freshness:\n          warn_after:\n            count: 6\n            period: hour\n          error_after:\n            count: 12\n            period: hour\n```\n\nDo not relax the freshness threshold as the primary fix; the prior history shows `raw_orders` normally refreshes within 0.5–1.5 hours, so the 6/12-hour threshold is appropriate.\n\nAfter fixing the loader, backfill or update `loaded_at` for rows written since the v2.3 deployment if they have incorrect/stale/null `loaded_at` values, using the true ingestion timestamp if available from loader logs or metadata.\n\n### Verification\nFirst inspect whether recent business rows have stale `loaded_at` values:\n\n```sql\nselect\n  max(loaded_at) as max_loaded_at,\n  count(*) as total_rows,\n  count(*) filter (\n    where loaded_at >= current_timestamp - interval '12 hours'\n  ) as rows_loaded_last_12h\nfrom \"ecommerce\".\"raw\".\"raw_orders\";\n```\n\nExpected result after the fix: `max_loaded_at` is within the last 6 hours, ideally within the last hourly ingestion window, and there are recent rows loaded in the last 12 hours.\n\nIf another timestamp column exists, compare it before changing dbt:\n\n```sql\nselect\n  order_id,\n  order_date,\n  status,\n  loaded_at\nfrom \"ecommerce\".\"raw\".\"raw_orders\"\norder by order_id desc\nlimit 20;\n```\n\nRun freshness again:\n\n```bash\ndbt source freshness --select source:raw.raw_orders\n```\n\nExpected result: `PASS` for `source raw.raw_orders`, with freshness age below the 6-hour warn threshold.\n\nThen run affected downstream models:\n\n```bash\ndbt build --select source:raw.raw_orders+\n```\n\nExpected result: `stg_orders`, `dim_customers`, and `fct_orders` build and test successfully. Finance and marketing dashboards should then reflect current orders after their next refresh.\n\n### Assumptions\n- The 4 new `raw_orders` rows in the last 30 hours are identifiable by business fields or another ingestion/job metadata source, even though `loaded_at` is stale.\n- The orders loader v2.3 deployment is related to the freshness regression because it is the only recent relevant change and the issue appeared after it.\n- `loaded_at` is intended to represent ingestion write time in UTC, as documented.\n- No dbt SQL change is needed unless the ingestion system intentionally renamed or replaced the correct freshness timestamp column."}, {"position": 13, "item_id": "FV01-08B", "is_repeat": 0, "scenario_id": "FV01", "label": "B", "group_pos": 1, "group_size": 6, "text": "### Root cause\n`dbt build` passing is not evidence of fresh data: tests and models only validate whatever rows currently exist in `raw`. The actual failure is upstream of dbt. `raw.raw_orders` and `raw.raw_payments` stopped loading at exactly the same moment (2026-10-12 19:05 UTC), while `raw.raw_customers` (CRM) kept loading (last load 14:56 UTC today). A simultaneous stall of two tables fed by different systems (web shop and payment provider) while the CRM feed is healthy points to a shared failure in the ingestion layer, e.g. a stuck or failing job, expired credentials, or a broken connection that affects those two pipelines, not to a dbt problem. Meanwhile the marts were rebuilt from stale data and look green, so downstream consumers are seeing orders and revenue that are about a day behind. Note that the freshness check has been in ERROR since roughly 12 h after the stall, so the issue should have been caught overnight; the freshness exit code was apparently not alerting anyone.\n\n### Fix\n1. **Outside dbt (primary fix):** in the ingestion scheduler/orchestrator, inspect the hourly jobs that load `raw.raw_orders` and `raw.raw_payments`. Find the first failed or hung run after 19:05 UTC on 10-12, fix the cause (credentials, API quota, schema change, stuck lock), and re-run/backfill from 19:05 UTC onward. Make sure the backfill is idempotent (no duplicate order/payment rows).\n2. **In dbt (alerting gap):** make freshness failures block or alert. Run `dbt source freshness` before `dbt build` in the scheduled job and fail the pipeline on a non-zero exit code, so stale marts are not published silently. Existing source config (shown for reference, unchanged thresholds):\n\n```yaml\nsources:\n  - name: raw\n    loaded_at_field: loaded_at\n    tables:\n      - name: raw_orders\n        freshness:\n          warn_after: {count: 6, period: hour}\n          error_after: {count: 12, period: hour}\n      - name: raw_payments\n        freshness:\n          warn_after: {count: 6, period: hour}\n          error_after: {count: 12, period: hour}\n```\n\nDo not loosen these thresholds: with hourly loads, 6/12 h is already generous, and the check did its job.\n\n3. After the backfill, rebuild downstream: `dbt build` (or `dbt build --select source:raw.raw_orders+ source:raw.raw_payments+`).\n\n### Verification\nRun:\n\n```\ndbt source freshness\n```\n\nExpected: all three sources PASS, exit code 0, with `raw_orders` and `raw_payments` showing max(loaded_at) within the last ~1-2 hours.\n\nAlso check for gaps and duplicates after the backfill:\n\n```sql\nselect date_trunc('hour', loaded_at) as hr, count(*)\nfrom raw.raw_orders\nwhere loaded_at >= timestamp '2026-10-12 18:00:00'\ngroup by 1 order by 1;\n```\n\nExpected: a row for every hour since 19:05 UTC on 10-12 with plausible counts, and no duplicate order IDs (`select order_id, count(*) from raw.raw_orders group by 1 having count(*) > 1` returns zero rows). Then `dbt build` should still pass and the marts should reflect orders from the last hours.\n\n### Assumptions\n- `loaded_at` is populated by the ingestion job at load time (not copied from a source timestamp), so a flat max(loaded_at) means no loads occurred, not just no new business events. A quiet shop overnight is an unlikely explanation for two tables stopping at the identical timestamp, but it should be ruled out.\n- The web shop and payment loads share some infrastructure, credential, or scheduler component that the CRM load does not.\n- The scheduled job runs `dbt build` and `dbt source freshness` as separate steps, and the freshness exit code is not currently wired to an alert or gate.\n- The ingestion jobs can be re-run for a past window without creating duplicates."}, {"position": 14, "item_id": "FV01-05C", "is_repeat": 0, "scenario_id": "FV01", "label": "C", "group_pos": 2, "group_size": 6, "text": "### Root cause\n`dbt build` succeeded because the modeled data and tests passed, but `dbt source freshness` failed because two upstream raw sources are stale: `raw.raw_orders` and `raw.raw_payments`. Their latest `loaded_at` is `2026-10-12 19:05 UTC`, about 24 hours old, exceeding the 12-hour freshness error threshold.\n\nBecause both orders and payments stopped at the same timestamp, while `raw.raw_customers` is fresh, this is most likely an ingestion problem affecting the web shop/payment ingestion jobs, not a dbt model issue. Given the recent `SEC-58` credential rotation for the shop read replica on `2026-10-12`, the likely cause is that the orders/payments ingestion jobs are still using old or invalid database credentials, or lost access after the rotation.\n\n### Fix\nNo dbt SQL/model change is indicated. Fix the upstream ingestion configuration outside the dbt project.\n\nUpdate the hourly ingestion jobs that write to:\n\n- `\"ecommerce\".\"raw\".\"raw_orders\"`\n- `\"ecommerce\".\"raw\".\"raw_payments\"`\n\nSpecifically, update the shop read-replica credentials used by the web shop/orders connector and any payment ingestion job dependency that reads through the same shop replica. The credential/secret/config changed by `SEC-58` should be updated in the ingestion scheduler/connector secret store.\n\nAfter credentials are fixed:\n\n1. Resume/retry the failed hourly ingestion jobs.\n2. Backfill missing data from `2026-10-12 19:05 UTC` through the current time for both:\n   - `raw.raw_orders.loaded_at`\n   - `raw.raw_payments.loaded_at`\n3. Ensure the backfill preserves the expected source schemas:\n   - `raw_orders.order_id`, `customer_id`, `order_date`, `status`, `loaded_at`\n   - `raw_payments.payment_id`, `order_id`, `payment_method`, `amount`, `loaded_at`\n\nNo change should be made to the source freshness thresholds unless the business SLA has changed. The current thresholds are correctly detecting stale hourly data.\n\n### Verification\nFirst, confirm the raw source max timestamps have advanced:\n\n```sql\nselect\n  'raw_orders' as source_name,\n  max(loaded_at) as max_loaded_at,\n  current_timestamp - max(loaded_at) as age\nfrom ecommerce.raw.raw_orders\n\nunion all\n\nselect\n  'raw_payments' as source_name,\n  max(loaded_at) as max_loaded_at,\n  current_timestamp - max(loaded_at) as age\nfrom ecommerce.raw.raw_payments;\n```\n\nExpected result: both `max_loaded_at` values are recent, ideally within 1–2 hours of the check time and definitely below the 6-hour warn threshold.\n\nThen run:\n\n```bash\ndbt source freshness --select source:raw.raw_orders source:raw.raw_payments\n```\n\nExpected result: both sources pass freshness.\n\nThen rebuild the affected downstream lineage:\n\n```bash\ndbt build --select source:raw.raw_orders+ source:raw.raw_payments+\n```\n\nExpected result: `stg_orders`, `stg_payments`, `dim_customers`, and `fct_orders` build successfully, with tests passing.\n\nOptionally verify row recency and downstream impact:\n\n```sql\nselect count(*) as recent_orders\nfrom ecommerce.raw.raw_orders\nwhere loaded_at > timestamp '2026-10-12 19:05:00';\n\nselect count(*) as recent_payments\nfrom ecommerce.raw.raw_payments\nwhere loaded_at > timestamp '2026-10-12 19:05:00';\n```\n\nExpected result: non-zero counts after the backfill, assuming orders/payments occurred during the outage window.\n\nNotify owners of impacted exposures after successful rebuild:\n\n- Finance analytics: `finance_revenue_dashboard`\n- Marketing analytics: `marketing_customer_dashboard`\n\n### Assumptions\n- The freshness check ran around `2026-10-13 19:05 UTC`, based on the reported 24-hour age.\n- `SEC-58` changed credentials used by the orders/payments ingestion jobs.\n- The ingestion system supports retry/backfill from a timestamp or from the last successful cursor.\n- No data contract or schema change occurred in `raw_orders` or `raw_payments`.\n- `dbt build` used stale-but-valid existing raw data, which is why dbt models/tests passed despite source freshness failure."}, {"position": 15, "item_id": "FV01-08C", "is_repeat": 0, "scenario_id": "FV01", "label": "C", "group_pos": 3, "group_size": 6, "text": "### Root cause\n`dbt build` passed, so the staging/mart models and data tests succeeded. The failure is isolated to `dbt source freshness`.\n\nThe `raw.raw_orders` and `raw.raw_payments` sources are stale: their `max(loaded_at)` is `2026-10-12 19:05 UTC`, about 24 hours before the freshness check. Their freshness policy is `warn_after: 6 hours` and `error_after: 12 hours`, so both correctly errored. `raw.raw_customers` is fresh enough and passed.\n\nThis most likely means the hourly ingestion jobs for web shop orders and payment-provider payments stopped loading new rows or stopped updating the `loaded_at` column after `2026-10-12 19:05 UTC`.\n\n### Fix\nFix the upstream ingestion outside the dbt project:\n\n- Web shop ingestion job that writes to `raw.raw_orders`\n- Payment-provider ingestion job that writes to `raw.raw_payments`\n- Ensure both jobs resume hourly loads into the `raw` schema\n- Ensure the `loaded_at` column is populated with the actual ingestion/load timestamp in UTC\n\nNo dbt model change is indicated by the report. The relevant dbt source freshness configuration should remain as-is unless the 6h/12h SLA is intentionally too strict.\n\nExample expected source YAML, to confirm the configuration is pointing at the right freshness column:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_orders\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 6\n            period: hour\n          error_after:\n            count: 12\n            period: hour\n\n      - name: raw_payments\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 6\n            period: hour\n          error_after:\n            count: 12\n            period: hour\n\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 24\n            period: hour\n          error_after:\n            count: 48\n            period: hour\n```\n\nIf the ingestion jobs did run but no rows arrived because there were genuinely no new orders or payments, the remediation depends on the intended freshness semantics: either load heartbeat/update records with current `loaded_at`, or relax/change the freshness check to use an ingestion audit table rather than business-event rows.\n\n### Verification\nFirst check the raw tables directly:\n\n```sql\nselect\n  'raw_orders' as table_name,\n  max(loaded_at) as max_loaded_at,\n  count(*) as row_count\nfrom raw.raw_orders\n\nunion all\n\nselect\n  'raw_payments' as table_name,\n  max(loaded_at) as max_loaded_at,\n  count(*) as row_count\nfrom raw.raw_payments;\n```\n\nExpected result: `max_loaded_at` for both tables is within the last 6 hours for a clean pass, and definitely within the last 12 hours to avoid an error.\n\nThen rerun freshness:\n\n```bash\ndbt source freshness --select source:raw.raw_orders source:raw.raw_payments\n```\n\nExpected result:\n\n- `PASS` for `source raw.raw_orders`\n- `PASS` for `source raw.raw_payments`\n- exit code `0`\n\nOptionally rerun the full scheduled checks:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: both commands exit `0`; all models/tests pass and all sources pass freshness.\n\n### Assumptions\n- `loaded_at` is the configured `loaded_at_field` for all three sources.\n- The freshness check ran around `2026-10-13 19:05 UTC`.\n- The shop normally receives or ingests orders and payments at least every few hours.\n- `raw.raw_orders` is loaded by the web shop ingestion job, and `raw.raw_payments` is loaded by the payment-provider ingestion job.\n- There was no intentional maintenance window or pause of the orders/payments ingestion pipelines."}, {"position": 16, "item_id": "FV01-05B", "is_repeat": 0, "scenario_id": "FV01", "label": "B", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is the age of the source data in `raw.raw_orders` and `raw.raw_payments`. Both sources have exceeded their configured freshness thresholds: `raw.raw_orders` is 24 hours old, while `raw.raw_payments` is also 24 hours old. This means that the data in these tables is stale, and the scheduled dbt run is failing to detect this staleness.\n\n### Fix\n\nTo fix this issue, we need to backfill the missing data in `raw.raw_orders` and `raw.raw_payments` to bring their freshness up to the current time. We can do this by running the ingestion jobs again to load the missing data. This will update the `loaded_at` timestamp in both tables, bringing their freshness up to the current time.\n\nTo prevent this issue from happening in the future, we can also configure the freshness thresholds to be more aggressive, such as warning after 3 hours and erroring after 6 hours.\n\n### Verification\n\nTo verify that the fix worked, we can run the following dbt command:\n```\ndbt source freshness\n```\nThis command will check the freshness of all sources, including `raw.raw_orders` and `raw.raw_payments`. If the fix is successful, the command should report that both sources are up to date and fresh.\n\n### Assumptions\n\nI assumed that the ingestion jobs are configured to load data from the web shop, payment provider, and CRM into the `raw` schema every hour. I also assumed that the freshness thresholds are configured correctly in the dbt project, and that the data in the `raw` tables is not corrupted or missing."}, {"position": 17, "item_id": "FV01-01A", "is_repeat": 0, "scenario_id": "FV01", "label": "A", "group_pos": 5, "group_size": 6, "text": "### Root cause\n`dbt build` passed only because it tests the data that exists; it never checks whether new data is arriving. The freshness check shows that `raw_orders` and `raw_payments` have received no new rows since 2026-10-12 19:05 UTC (24.0 h), while `raw_customers` loaded 4.1 h ago. The identical max(`loaded_at`) on both tables suggests one shared upstream event at that moment: the web shop and payment provider ingestion jobs stopped or failed together, while the CRM job kept running. This is an ingestion problem outside dbt, not a model or test defect. Every mart built today therefore reflects stale orders and payments, silently, even though the build is green. The 24 h gap is double the 12 h error threshold, so roughly 10+ hourly runs were missed.\n\n### Fix\n1. **Outside the dbt project (the actual fix):** investigate and restart the hourly ingestion jobs that load `raw.raw_orders` and `raw.raw_payments` in the orchestrator/scheduler (check job logs, credentials/API tokens for the shop and payment provider, and any schema change on their side around 2026-10-12 19:00 UTC). Once running, backfill the missed window. Ingestion should be idempotent (e.g. upsert on `order_id`/`payment_id`) to avoid duplicates, especially for `raw_payments`, where multiple rows per order are legitimate and only `payment_id` is unique.\n2. **Re-run dbt after the backfill** so staging views and marts refresh.\n3. **Prevent silent staleness (dbt side):** make the scheduled job run freshness as a gate, not a side step, so stale data fails the pipeline before marts are published and alerts reach on-call:\n\n```\ndbt source freshness && dbt build\n```\n\n(If the orchestrator supports it, run `dbt build --select source_status:fresher+` after `dbt source freshness` so only models with new upstream data rebuild.) The existing thresholds in the source YAML (warn 6 h / error 12 h, `loaded_at_field: loaded_at`) are sensible for an hourly load and need no change.\n\n### Verification\nAfter the ingestion jobs are restored and backfilled:\n\n```sql\nselect 'raw_orders' as src, max(loaded_at) as max_loaded_at from raw.raw_orders\nunion all\nselect 'raw_payments', max(loaded_at) from raw.raw_payments;\n```\n\nExpected: both values within roughly the last hour, with rows present for the gap period (2026-10-12 19:05 UTC onward). A quick completeness check, e.g. `select date_trunc('hour', loaded_at) h, count(*) from raw.raw_orders where loaded_at >= '2026-10-12 19:00' group by 1 order by 1`, should show no empty hours, aside from genuinely quiet shop periods.\n\nThen run:\n\n```\ndbt source freshness\ndbt build\n```\n\nExpected: freshness exits 0 with `raw_orders`/`raw_payments` PASS (well under 6 h) and `raw_customers` still PASS; `dbt build` again passes all 30 nodes with exit code 0.\n\n### Assumptions\n- The upstream ingestion jobs (not dbt, DuckDB, or the `loaded_at` column definition) caused the stall; I have no job logs to confirm this. The shared 19:05 timestamp is the evidence.\n- `loaded_at` is populated correctly by the ingestion job, so a stale value means no new rows, not a broken timestamp.\n- The shop was actually trading during the gap (a night-time lull alone wouldn't explain it, since `loaded_at` reflects job writes, not order times; but if the job only writes when new data exists, a true zero-order period would look the same).\n- Ingestion can safely backfill the missed window and is idempotent.\n- The scheduler can chain commands and alert on non-zero exit codes."}, {"position": 18, "item_id": "FV01-01C", "is_repeat": 0, "scenario_id": "FV01", "label": "C", "group_pos": 6, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the `raw_orders` and `raw_payments` sources being older than the allowed threshold. According to the report, the latest data for these sources is from 2026-10-12 19:05 UTC, which is 24 hours old for `raw_orders` and 24 hours old for `raw_payments`. This is causing the `source freshness` command to fail, as the data is too stale.\n\n### Fix\n\nTo fix this issue, we need to update the `raw` schema to reflect the latest data. We can do this by running the ingestion jobs again to load the latest data from the web shop, payment provider, and CRM. Once the new data is loaded, we can re-run the `dbt build` and `dbt source freshness` commands to verify that the data is up-to-date.\n\nAssuming that the ingestion jobs are configured correctly, we can update the `raw` schema by running the following SQL command:\n\n```sql\nINSERT INTO raw.raw_orders (order_id, customer_id, order_date, status, loaded_at)\nSELECT ...\nFROM ...\n\nINSERT INTO raw.raw_payments (payment_id, order_id, payment_method, amount, loaded_at)\nSELECT ...\nFROM ...\n```\n\n### Verification\n\nTo verify that the fix worked, we can re-run the `dbt source freshness` command and check that all sources are up-to-date. Specifically, we can check that the `max(loaded_at)` timestamp for each source is greater than or equal to the current timestamp.\n\nWe can also re-run the `dbt build` command to verify that the staging views and mart tables are built successfully.\n\n### Assumptions\n\n* The ingestion jobs are configured correctly and can be re-run to load the latest data.\n* The `loaded_at` timestamp for each source is accurate and reflects the timestamp when the data was ingested.\n* The data quality is good, and there are no issues with the data itself that would prevent the `raw` schema from being updated."}, {"position": 19, "item_id": "FV03-02A", "is_repeat": 0, "scenario_id": "FV03", "label": "A", "group_pos": 1, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is that the `raw.raw_customers` source has stale data, as its `loaded_at` timestamp is 4.1 hours before the scheduled check, exceeding the allowed 2-hour threshold for an error. This is not the case for the `raw.raw_orders` and `raw.raw_payments` sources, which are fresh enough.\n\n### Fix\n\nTo resolve the issue, we need to increase the allowed threshold for the `raw.raw_customers` source to avoid the error. We can do this by updating the `max_lag_hours` configuration in the `profiles.yml` file, which is responsible for setting the freshness thresholds for each source.\n\nHere's the YAML change:\n```yaml\nraw:\n  raw_customers:\n    max_lag_hours: 2.1  # Increase the allowed threshold to 2.1 hours\n```\n### Verification\n\nTo verify the fix, we can re-run the `dbt source freshness` command and check that the `raw.raw_customers` source is no longer flagged as stale. We can also verify that the other sources (`raw.raw_orders` and `raw.raw_payments`) continue to pass their freshness checks.\n\nWe can re-run the `dbt source freshness` command and check the output for any errors or warnings.\n\n### Assumptions\n\nAssuming that the data ingestion jobs are running correctly and the `loaded_at` timestamp in the `raw.raw_customers` source is accurate."}, {"position": 20, "item_id": "FV03-04C", "is_repeat": 0, "scenario_id": "FV03", "label": "C", "group_pos": 2, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is the `raw_customers` source freshness check failing due to the freshness of the data being more than 2 hours old. This is because the `max(loaded_at)` timestamp in the `raw_customers` table is 2026-10-13 14:56 UTC, which is 4.1 hours before the scheduled run time (2026-10-13 18:05 UTC).\n\n### Fix\n\nTo resolve this issue, we need to adjust the freshness warning and error thresholds for the `raw_customers` source. Specifically, we can update the `freshness_config` in the `sources.yml` file to increase the warning threshold to 2 hours and the error threshold to 4 hours. This will allow the freshness check to pass even when the data is 2 hours old, which is within the expected delay.\n\nHere's the updated `sources.yml` file:\n```yaml\nsources:\n  raw:\n    - name: raw_customers\n      loaded_at: loaded_at\n      freshness_config:\n        warn_after: 2 hours\n        error_after: 4 hours\n```\n### Verification\n\nTo verify the fix, we can re-run the dbt source freshness check command and check that the `raw_customers` source freshness check now passes.\n\nCommand: `dbt source freshness`\n\nExpected result: The `raw_customers` source freshness check should pass with a message indicating that the data is within the expected freshness threshold.\n\n### Assumptions\n\nAssuming that the `raw_customers` source freshness check is the only issue affecting the `raw_customers` table, and that the other sources (e.g., `raw_orders`, `raw_payments`) are not experiencing any freshness issues."}, {"position": 21, "item_id": "FV03-03C", "is_repeat": 0, "scenario_id": "FV03", "label": "C", "group_pos": 3, "group_size": 6, "text": "### Root cause\nThe failure is stale data in `raw.raw_customers`, not a dbt model or test problem. `dbt build` passed everything (30/30), which only shows that the transformations and tests are valid on the data that exists. The freshness check shows the CRM ingestion job last wrote rows at 14:56 UTC, about 4.1 h before the check, while `raw_orders` and `raw_payments` loaded normally at 18:05 UTC. So the hourly CRM extract/load has stopped or is failing since roughly 15:00, while the other two ingestion jobs are healthy. The cause is upstream of dbt (CRM extract, credentials, API, or the load job). The logs for that job are not provided, so the exact trigger is unknown.\n\nOne consequence: marts joining customers to orders/payments currently build on customer data that is about 4 h old. New customers who ordered since 15:00 may be missing from customer dimensions or have null customer attributes, even though tests passed.\n\n### Fix\n1. **Outside dbt (primary fix):** investigate and repair the hourly CRM → `raw.raw_customers` ingestion job (scheduler status, job logs, CRM API/auth/rate limits, network, destination write errors). Re-run it, then backfill any missed window so that rows created since ~14:56 UTC are loaded. Nothing in the dbt project needs changing for this incident.\n2. **Optional hardening in dbt (not a cure):** make the freshness gate visible in the pipeline so stale sources are caught before marts are consumed. The source's freshness config is already correct for an hourly job (warn 1 h / error 2 h), so leave it. Instead, run freshness first and gate the build on it:\n\n```bash\ndbt source freshness && dbt build\n```\n\nIf a stale customer source should not block order/payment models, use selective runs instead (`dbt build --exclude source:raw.raw_customers+`), but this is a policy decision for the team.\n\nDo not loosen the thresholds to make the check pass; that would hide the outage.\n\n### Verification\nAfter the ingestion job is fixed and has run:\n\n```sql\nselect max(loaded_at) as latest_load,\n       now() at time zone 'utc' - max(loaded_at) as age\nfrom \"ecommerce\".\"raw\".\"raw_customers\";\n```\n\nExpected: `age` under 1 hour (below the warn threshold) once a scheduled load has completed.\n\nThen:\n\n```bash\ndbt source freshness --select source:raw.raw_customers\ndbt build\n```\n\nExpected: `raw.raw_customers` shows PASS (exit code 0), and `dbt build` still passes all 30 nodes. Also confirm no gap remains: compare `count(*)` and `max(created_at)` in `raw_customers` with the CRM, or check that customer IDs referenced by recent rows in `raw_orders` all exist in `raw_customers`.\n\n### Assumptions\n- The CRM ingestion job is a separate scheduled process from the orders and payments jobs, as the differing `loaded_at` values suggest. I have no logs, so the exact failure reason (credentials, API outage, scheduler, load error) is unknown.\n- `loaded_at` is set by the ingestion job at write time and is not being overwritten or backfilled by something else, so a stale `max(loaded_at)` means no recent writes.\n- The 14:56 UTC last load and the check time (~19:05 UTC, implied by the 4.1 h and 1.0 h ages) are accurate.\n- The CRM itself has data newer than 14:56 UTC, so this is a pipeline stall and not simply a lack of new customers (during low-traffic hours with an incremental extract, this could happen; the thresholds suggest hourly writes are expected regardless).\n- The ingestion job is outside the dbt repository and is owned by the team running the on-call rotation or a data platform team."}, {"position": 22, "item_id": "FV03-03B", "is_repeat": 0, "scenario_id": "FV03", "label": "B", "group_pos": 4, "group_size": 6, "text": "### Root cause\n`dbt build` succeeded: all models and data tests passed. The failure is only from `dbt source freshness`.\n\nThe source `raw.raw_customers` is stale. Its latest `loaded_at` value is `2026-10-13 14:56 UTC`, which was 4.1 hours before the freshness check. The source freshness config for `raw.raw_customers` errors after 2 hours, so `dbt source freshness` correctly exited with code 1.\n\nThis indicates the CRM customer ingestion job did not load new rows into `\"ecommerce\".\"raw\".\"raw_customers\"` within the expected freshness window, or it loaded rows without updating `loaded_at`.\n\n### Fix\nFix the upstream CRM ingestion for `raw.raw_customers`, outside the dbt project.\n\nSpecifically, check the hourly ingestion job that writes to:\n\n```sql\n\"ecommerce\".\"raw\".\"raw_customers\"\n```\n\nand ensure it either:\n\n1. is running successfully every hour, and\n2. writes fresh records with `loaded_at` set to the ingestion/write timestamp in UTC.\n\nExample expected ingestion behavior:\n\n```sql\ninsert into \"ecommerce\".\"raw\".\"raw_customers\" (\n    customer_id,\n    first_name,\n    last_name,\n    email,\n    country,\n    created_at,\n    loaded_at\n)\nselect\n    customer_id,\n    first_name,\n    last_name,\n    email,\n    country,\n    created_at,\n    current_timestamp as loaded_at\nfrom crm_extract;\n```\n\nIf the CRM feed is intentionally less frequent than every 2 hours, then the dbt source freshness threshold is too strict and should be changed in the source YAML for `raw.raw_customers`.\n\nFor example, in the source definition file for the `raw` source, update only the `raw_customers` freshness setting:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 1\n            period: hour\n          error_after:\n            count: 2\n            period: hour\n```\n\nChange `warn_after` / `error_after` only if the business SLA for CRM customer data is actually longer than the current 1-hour warning / 2-hour error threshold.\n\n### Verification\nFirst confirm the latest customer load timestamp:\n\n```sql\nselect\n    max(loaded_at) as max_loaded_at,\n    current_timestamp as checked_at,\n    date_diff('minute', max(loaded_at), current_timestamp) as age_minutes\nfrom \"ecommerce\".\"raw\".\"raw_customers\";\n```\n\nExpected result after fixing ingestion: `max_loaded_at` should be within 2 hours of `checked_at`, ideally within 1 hour.\n\nThen rerun source freshness:\n\n```bash\ndbt source freshness --select source:raw.raw_customers\n```\n\nExpected result:\n\n```text\nPASS source raw.raw_customers\n```\n\nThen run the normal scheduled checks:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: `dbt build` passes, and all three sources pass freshness.\n\n### Assumptions\nThe freshness check ran around `2026-10-13 19:02 UTC`, based on `14:56 UTC` being reported as 4.1 hours old.\n\nThe CRM ingestion job is expected to run hourly, matching the statement that ingestion jobs load data every hour.\n\nThe configured `loaded_at_field` for `raw.raw_customers` is `loaded_at`.\n\nThere were no dbt model failures because the stale source affected only the source freshness command, not the build command."}, {"position": 23, "item_id": "FV03-04B", "is_repeat": 0, "scenario_id": "FV03", "label": "B", "group_pos": 5, "group_size": 6, "text": "### Root cause\nThe freshness check is mis-calibrated, not the data pipeline. Commit f1c34a7 (DATA-140, 2026-10-12) set raw_customers to warn after 1 h / error after 2 h on the assumption that the CRM loader runs hourly, like the orders and payments loaders. The history says otherwise: freshness age was 3, 19, 7, 30, 11 and 5 h across the last runs (and about 4 h today), and sign-ups are only 0–2 per day. `loaded_at` is the time the ingestion job wrote a row, and the max only advances when the job writes new or changed rows. Intermittent ages of 3–30 h are normal for this source. The `dbt build` passed (30/30), so staging and marts built fine, and nothing indicates a data defect. This is unlike INC-0318, where the sync was paused for 48 h. The new threshold now fails on every normal run.\n\n### Fix\nRevert the freshness block for `raw_customers` in `models/staging/sources.yml` to a threshold matching its real cadence. The 30 h observation is the worst case in the data, so the error threshold must exceed it. A reasonable setting is warn at 36 h, error at 72 h. That tolerates normal gaps while still catching a multi-day pause like INC-0318.\n\n```yaml\nsources:\n  - name: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after: {count: 36, period: hour}\n          error_after: {count: 72, period: hour}\n```\n\nOutside dbt: if the CRM loader is meant to run hourly (as DATA-140 assumed), then the loader's schedule or incremental logic is the thing to investigate and fix. In the ingestion job, consider writing a heartbeat or `_synced_at` column on every run, even with zero changed rows, so freshness measures job liveness rather than data change. Until that is confirmed, align the threshold with observed behavior and update the DATA-140 ticket accordingly.\n\n### Verification\nRun:\n\n```\ndbt source freshness --select source:raw.raw_customers\n```\n\nExpected: PASS at about 4 h (and at ages up to 36 h, no warning). Then run `dbt source freshness` for all sources and confirm exit code 0, with orders and payments still passing at their 6 h / 12 h thresholds.\n\nTo sanity-check the loader behavior:\n\n```sql\nselect date_trunc('hour', loaded_at) as load_hour, count(*) as rows_loaded\nfrom \"ecommerce\".\"raw\".\"raw_customers\"\nwhere loaded_at >= current_timestamp - interval 7 day\ngroup by 1 order by 1;\n```\n\nExpected: sparse load hours consistent with the 3–30 h gaps, which confirms the data changes infrequently rather than the loader failing.\n\n### Assumptions\n- The 6 observed ages (and today's 4 h) are representative of normal behavior, and no outage occurred during those runs.\n- `loaded_at` is only updated when rows are written or changed, not on every loader run (not stated in the metadata).\n- The CRM loader is not actually hourly for customers; if it is, the loader is skipping runs and needs investigation.\n- Stakeholders (marketing, finance) accept customer data up to 36 h stale; the dashboards do not require tighter customer freshness.\n- Source freshness errors affect only the freshness job's exit code and do not block `dbt build` in this orchestration.\n- No data content problems exist in `raw_customers`, since all 30 tests passed."}, {"position": 24, "item_id": "FV03-02C", "is_repeat": 0, "scenario_id": "FV03", "label": "C", "group_pos": 6, "group_size": 6, "text": "### Root cause\n`dbt build` succeeded: all models and tests passed. The failure is only from `dbt source freshness`.\n\nThe source `raw.raw_customers` is stale: its latest `loaded_at` value is `2026-10-13 14:56 UTC`, which was 4.1 hours before the freshness check. Its configured threshold is `warn_after: 1 hour` and `error_after: 2 hours`, so dbt correctly returned exit code 1. `raw.raw_orders` and `raw.raw_payments` are fresh.\n\nThis likely means the CRM/customer ingestion job stopped, was delayed, or is writing to the wrong table/column.\n\n### Fix\nFix the upstream ingestion for the CRM/customer feed that loads `raw.raw_customers`.\n\nSpecifically, check the hourly ingestion job that writes to:\n\n- schema: `raw`\n- table/source: `raw_customers`\n- freshness column: `loaded_at`\n\nThe job should insert or update customer rows and set `loaded_at` to the ingestion timestamp in UTC for each load.\n\nIf the CRM source is intentionally less frequent than hourly, then adjust the freshness threshold in the dbt source YAML instead of treating this as an ingestion incident. For example, in the file where `raw.raw_customers` is declared, likely something like `models/sources.yml` or `models/staging/sources.yml`:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 1\n            period: hour\n          error_after:\n            count: 2\n            period: hour\n```\n\nOnly change this if the expected CRM/customer load SLA is actually more than 2 hours. For example, if customers are expected every 6 hours:\n\n```yaml\nsources:\n  - name: raw\n    schema: raw\n    tables:\n      - name: raw_customers\n        loaded_at_field: loaded_at\n        freshness:\n          warn_after:\n            count: 6\n            period: hour\n          error_after:\n            count: 12\n            period: hour\n```\n\nDo not change the dbt models or marts based on the current report; they are building successfully.\n\n### Verification\nFirst verify the raw table timestamp directly:\n\n```sql\nselect\n  max(loaded_at) as max_loaded_at,\n  current_timestamp as checked_at,\n  date_diff('minute', max(loaded_at), current_timestamp) as age_minutes\nfrom raw.raw_customers;\n```\n\nExpected result after the ingestion fix: `max_loaded_at` should be recent enough to satisfy the configured threshold, specifically less than 2 hours old for the current config.\n\nThen rerun source freshness:\n\n```bash\ndbt source freshness\n```\n\nExpected result:\n\n```text\nPASS: source raw.raw_customers\nPASS: source raw.raw_orders\nPASS: source raw.raw_payments\n```\n\nand exit code `0`.\n\nOptionally rerun the full scheduled workflow:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: both commands exit with code `0`.\n\n### Assumptions\n- `loaded_at` is the configured `loaded_at_field` for `raw.raw_customers`.\n- `raw.raw_customers` is populated by the CRM ingestion job.\n- The expected customer ingestion cadence is hourly, matching the stated ingestion schedule.\n- The dbt source definition is in a YAML file such as `models/sources.yml` or `models/staging/sources.yml`; the exact path was not provided.\n- The freshness check ran around `2026-10-13 19:00 UTC`, based on the reported source ages."}, {"position": 25, "item_id": "SD01-04B", "is_repeat": 0, "scenario_id": "SD01", "label": "B", "group_pos": 1, "group_size": 6, "text": "### Root cause\nThe payment provider's settlement export v2 (live since 2026-10-12) renamed the cents column in `raw.raw_payments` from `amount` to `amount_cents`. `stg_payments` still does `cast(amount as decimal(18, 2)) / 100 as amount`. Because `amount` no longer exists in the source, DuckDB resolves the reference to the alias being defined in the same SELECT, which produces the misleading \"cannot be referenced before it is defined\" Binder Error. Source freshness passes because data is still arriving; only the schema changed. `dim_customers`, `fct_orders` and the 15 tests were skipped as a consequence, so both dashboards are at risk of stale data (finance refreshes at 07:00 UTC).\n\n### Fix\nEdit `models/staging/stg_payments.sql` so the `renamed` CTE reads from `amount_cents`. The output column name `amount` stays unchanged, so downstream models and tests need no edits.\n\n```sql\nrenamed as (\n\n    select\n        payment_id,\n        order_id,\n        payment_method,\n        -- source stores integer cents (column renamed from amount in export v2)\n        cast(amount_cents as decimal(18, 2)) / 100 as amount,\n        loaded_at\n    from source\n\n)\n```\n\nThen rerun the skipped nodes so the marts and dashboards catch up: `dbt build --select stg_payments+`. If the finance dashboard has already refreshed on stale marts, tell Finance analytics.\n\nOutside the dbt project: ask the data platform/ingestion owner to add a schema-change check on the raw load (or a dbt source column test) so vendor renames are caught at ingestion, and ask the provider/ingestion owner to confirm v2 has no other renamed fields or changed units (see Assumptions).\n\n### Verification\nRun:\n\n```\ndbt build --select stg_payments+\n```\n\nExpected: `stg_payments`, `dim_customers`, `fct_orders` and all their tests (including `unique`/`not_null` on `payment_id`, the `relationships` test to `stg_orders` and `accepted_values` on `payment_method`) pass, with exit code 0.\n\nSanity-check the units, since a silent rename can also mean a silent unit change:\n\n```sql\nselect\n    min(r.amount_cents) as min_cents,\n    max(r.amount_cents) as max_cents,\n    min(s.amount) as min_amount,\n    max(s.amount) as max_amount\nfrom raw.raw_payments r\njoin stg_payments s using (payment_id);\n```\n\nExpected: `amount` equals `amount_cents / 100` for every row, and values are in the same range as before 2026-10-12. Also compare yesterday's daily revenue in `fct_orders` with the previous days to check there is no jump or drop. Confirm `fct_orders` still has one row per order (row count matches `stg_orders`).\n\n### Assumptions\n- The rename `amount` → `amount_cents` is the only schema change in export v2 and `amount_cents` still holds integer cents (the
