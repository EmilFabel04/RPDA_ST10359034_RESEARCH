 does not match DuckDB’s default expected date format `YYYY-MM-DD`, so querying the view errors before the `not_null` predicate can be evaluated.\n\nSource freshness passed, so this is not a stale ingestion issue. It is a data format/parsing issue in `raw.raw_orders.order_date` or in the staging model’s date normalization logic.\n\n### Fix\nFix the date format at the ingestion boundary if possible: the job loading `raw.raw_orders.order_date` into the `raw` schema should write dates consistently as ISO `YYYY-MM-DD`, or load the column as a proper `DATE` type.\n\nIf the raw source can contain multiple valid date formats, make `models/staging/stg_orders.sql` parse them explicitly instead of using a single implicit cast.\n\nReplace:\n\n```sql\ncast(order_date as date) as order_date\n```\n\nwith something like:\n\n```sql\ncoalesce(\n    try_strptime(order_date, '%Y-%m-%d')::date,\n    try_strptime(order_date, '%m/%d/%Y')::date\n) as order_date\n```\n\nFull model:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_orders') }}\n\n),\n\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        coalesce(\n            try_strptime(order_date, '%Y-%m-%d')::date,\n            try_strptime(order_date, '%m/%d/%Y')::date\n        ) as order_date,\n        status,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```\n\nFile: `models/staging/stg_orders.sql`  \nColumn affected: `order_date`  \nSource affected: `raw.raw_orders.order_date`\n\nOptionally, add a source-level data quality test to catch unparseable raw dates before they break downstream models. For example, create a custom test or dbt-utils expression test, if available, checking that `raw.raw_orders.order_date` matches one of the accepted formats.\n\n### Verification\nFirst, inspect the bad raw values:\n\n```sql\nselect order_id, order_date, loaded_at\nfrom raw.raw_orders\nwhere try_strptime(order_date, '%Y-%m-%d') is null\n  and try_strptime(order_date, '%m/%d/%Y') is null;\n```\n\nExpected result after the model change: zero rows for unparseable dates, assuming only ISO and `MM/DD/YYYY` are valid.\n\nThen run the affected model and its tests:\n\n```bash\ndbt build --select stg_orders+\n```\n\nExpected result: `stg_orders`, downstream models such as `dim_customers` and `fct_orders`, and their tests build successfully. The `not_null_stg_orders_order_date` test should pass rather than error.\n\nYou can also directly validate the staged column:\n\n```sql\nselect count(*) as null_order_dates\nfrom main.stg_orders\nwhere order_date is null;\n```\n\nExpected result: `0`, provided every raw order has a valid populated date.\n\nFinally, rerun the scheduled commands:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: no dbt build errors, no skipped downstream nodes due to `stg_orders`, and source freshness still passing.\n\n### Assumptions\nThe value `\"10/10/2026\"` represents October 10, 2026 in `MM/DD/YYYY` format, not another locale-specific format such as `DD/MM/YYYY`.\n\n`raw.raw_orders.order_date` is stored as a string-like column in DuckDB, or at least arrives in a form that requires parsing in `stg_orders`.\n\nOnly `YYYY-MM-DD` and `MM/DD/YYYY` are intended valid formats unless the ingestion owner confirms additional formats.\n\nThe preferred long-term contract is to store `raw.raw_orders.order_date` consistently as ISO-formatted text or as a native `DATE` before dbt staging."}, {"position": 52, "item_id": "SD02-03A", "is_repeat": 0, "scenario_id": "SD02", "label": "A", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\nThe failure is due to an invalid date format in the `stg_orders.order_date` column. The `not_null_stg_orders_order_date` test is failing because it's trying to cast the `order_date` column to a date, but the format \"10/10/2026\" is not recognized as a valid date format.\n\n### Fix\n\nTo fix this issue, we need to update the `stg_orders` model to handle the incorrect date format. We can do this by specifying the correct format in the `date_format` setting in the `stg_orders` model.\n\nUpdate the `models/staging/schema.yml` file to add the following setting:\n```yaml\nstg_orders:\n  date_format: 'YYYY-MM-DD'\n```\nThis setting will tell dbt to expect dates in the \"YYYY-MM-DD\" format when processing the `stg_orders` model.\n\n### Verification\n\nTo verify that the fix worked, we can re-run the `dbt build` command and check that the `not_null_stg_orders_order_date` test is now passing.\n\nRun the following command:\n```\ndbt build\n```\nIf the test is now passing, we can proceed with re-building the staging views and mart tables.\n\n### Assumptions\n\n* The `stg_orders` model is the only one affected by this issue, and updating its `date_format` setting will resolve the problem.\n* The incorrect date format is consistent across all data loaded into the `stg_orders` table, and there are no other formats present in the data."}, {"position": 53, "item_id": "SD02-05C", "is_repeat": 0, "scenario_id": "SD02", "label": "C", "group_pos": 5, "group_size": 6, "text": "### Root cause\n`stg_orders` is a view, so `cast(order_date as date)` runs when the not_null test queries it. At least one row in `raw.raw_orders.order_date` now holds a string in `DD/MM/YYYY` or `MM/DD/YYYY` form (\"10/10/2026\") instead of ISO `YYYY-MM-DD`. DuckDB cannot cast it, and the test errors out (a runtime error, not a null found). The 13 downstream nodes (`dim_customers`, `fct_orders`, 9 tests) were skipped. Freshness passing only shows data is arriving, not that it is well-formed. The format change most likely originates in the web-shop ingestion, because the raw column is evidently a string. Note that \"10/10/2026\" is ambiguous: it cannot tell us whether the format is day-first or month-first.\n\n### Fix\n1. **Find the offending rows and the source's actual format** (not guessable from this one value):\n```sql\nselect order_id, order_date, loaded_at\nfrom raw.raw_orders\nwhere try_cast(order_date as date) is null\norder by loaded_at;\n```\nCheck the earliest `loaded_at` among them and ask the web-shop ingestion owner which format it now emits. If the format change was unintentional, **fix it at the ingestion job (outside dbt)** so it writes ISO dates. This is the proper long-term fix.\n\n2. **Make the staging model tolerant** in `models/staging/stg_orders.sql`, replacing the cast (shown assuming the new format is `DD/MM/YYYY`; swap to `%m/%d/%Y` if the owner says month-first):\n```sql\ncoalesce(\n    try_cast(order_date as date),\n    try_strptime(order_date, '%d/%m/%Y')::date\n) as order_date,\n```\nDo **not** use a bare `try_cast`: it would turn bad values into NULLs, and the existing `not_null` test would then fail on every affected row. That is a loud failure, but it hides which values are broken. Do not guess the day/month order, since a wrong guess silently shifts dates (e.g. 03/10 vs 10/03) while all tests pass.\n\n3. Optionally add a test on the raw source to catch format drift earlier, e.g. in `sources.yml` on `raw_orders.order_date`, a `dbt_expectations.expect_column_values_to_match_regex` check (or a singular test with `where try_cast(order_date as date) is null`), set to `warn` for raw data.\n\n4. If only a handful of rows are bad and the owner confirms they are one-off errors, correct or reload them in `raw.raw_orders` instead of loosening the model.\n\n### Verification\n```\ndbt build --select stg_orders+\n```\nExpected: `not_null_stg_orders_order_date` passes, and `dim_customers`, `fct_orders` and the 9 previously skipped tests run and pass. Then confirm no unparseable values remain and the dates are plausible:\n```sql\nselect count(*) from raw.raw_orders where try_cast(order_date as date) is null\n  and try_strptime(order_date, '%d/%m/%Y') is null;   -- expect 0\n\nselect min(order_date), max(order_date), count(*) from stg_orders;\n-- expect dates within the last 180 days, none in the future, count 500-1,000\n```\nSpot-check a few converted rows against the web shop to verify the day/month order. Finally, rerun `dbt build` fully; expect exit code 0, including `row_count_between`.\n\n### Assumptions\n- `raw.raw_orders.order_date` is a VARCHAR, since the cast to DATE failed on a string; the raw schema is not shown.\n- The offending format is non-ISO slash dates and the cause is an upstream change in the web-shop ingestion (the report does not say when it began or how many rows are affected).\n- The day/month order is unknown; `%d/%m/%Y` above is only a placeholder pending confirmation from the ingestion owner.\n- `dbt_expectations` is only usable if that package is installed; otherwise use a singular test.\n- The 500-1,000 row range test was skipped or not reached in this run, so I cannot say whether it would pass."}, {"position": 54, "item_id": "SD02-08A", "is_repeat": 0, "scenario_id": "SD02", "label": "A", "group_pos": 6, "group_size": 6, "text": "### Root cause\nThe web shop's locale switch (SHOP-219, 2026-10-10) changed the date format in the raw export. `raw.raw_orders.order_date` is a VARCHAR, and new rows now arrive as `DD/MM/YYYY` (e.g. `10/10/2026`) instead of ISO `YYYY-MM-DD`. `stg_orders` is a view that does `cast(order_date as date)`, which DuckDB only accepts for ISO strings. The view is evaluated lazily, so the error surfaced when the `not_null` test queried it, and `dim_customers` and `fct_orders` were skipped. It is not a freshness problem (ingestion is current) and not a data-volume problem. The test only failed on the third day after the change, plausibly because the earlier runs' tests passed before any non-ISO rows were loaded or the cast was not exercised on them (assumption). Note: `10/10/2026` is ambiguous between DD/MM and MM/DD, so the format must be confirmed.\n\n### Fix\n**1. Immediate (dbt):** make `stg_orders` tolerant of both formats, using `try_strptime` so an unparseable value becomes NULL (and is caught by `not_null`) instead of crashing the model. Edit `models/staging/stg_orders.sql`:\n\n```sql\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        cast(\n            coalesce(\n                try_strptime(order_date, '%Y-%m-%d'),   -- legacy en-US/ISO rows\n                try_strptime(order_date, '%d/%m/%Y')    -- en-ZA rows since 2026-10-10\n            ) as date\n        ) as order_date,\n        status,\n        loaded_at\n    from source\n\n)\n```\n\nDo not add `%m/%d/%Y` as a fallback: it would silently misparse en-ZA dates such as 10/10 vs 03/10. Because en-ZA formatting is day-first, rows like `13/10/2026` would also fail an MM/DD parse, so a single explicit `%d/%m/%Y` is the safe choice.\n\n**2. Root fix (outside dbt):** ask the web shop/ingestion owners to export `order_date` as ISO 8601 regardless of store locale (or load it as a DATE), and to confirm what the format is for any previously loaded non-ISO rows. Once done, the fallback can be removed.\n\n**3. Optional guard:** add a test (e.g. `dbt_expectations.expect_column_values_to_match_regex` on `raw_orders.order_date`, or a singular test) so a format change is flagged at the source rather than in staging.\n\n**4. Recovery:** after merging, re-run so `dim_customers`, `fct_orders` and the dashboards (Finance refresh at 07:00 UTC) are rebuilt before stand-up.\n\n### Verification\n1. Confirm the offending values and that all parse:\n```sql\nselect order_date, count(*) from raw.raw_orders\nwhere try_strptime(order_date,'%Y-%m-%d') is null group by 1;   -- non-ISO rows\n\nselect count(*) from stg_orders where order_date is null;       -- expect 0\nselect min(order_date), max(order_date) from stg_orders;        -- max should be ~2026-10-13\n```\n2. Run `dbt build --select stg_orders+` (includes downstream `dim_customers`, `fct_orders` and their tests). Expected: exit code 0, no errors, nothing skipped, and `row_count_between` (500–1,000) still passing.\n3. Spot-check that `10/10/2026` became `2026-10-10` and that `fct_orders` still has one row per order (`unique` test on `order_id`).\n4. Next scheduled run passes, and `dbt source freshness` remains green.\n\n### Assumptions\n- The new format is `DD/MM/YYYY`, based on the en-ZA locale. This must be confirmed with the shop team or by inspecting rows with day values >12.\n- Only `order_date` is affected; other columns (including amounts, which en-ZA may format with decimal commas elsewhere) are unchanged. Payment amounts come from the payment provider and are not impacted per the info given.\n- Rows loaded before 2026-10-10 are ISO formatted.\n- `try_strptime` is available in the DuckDB version used (it is in current releases).\n- No other models read `raw_orders.order_date` directly."}, {"position": 55, "item_id": "NR01-05B", "is_repeat": 0, "scenario_id": "NR01", "label": "B", "group_pos": 1, "group_size": 6, "text": "### Root cause\nThe `not_null` test on `stg_payments.amount` found 11 rows where `amount` is NULL, so `dbt build` failed that test and skipped everything downstream (`dim_customers`, `fct_orders`, 9 tests). Source freshness passes (data loaded 0.9 h ago), so this is not a stale or missing load. The problem is the content of the data: either `raw.raw_payments` contains rows with NULL amounts (e.g. failed, pending or voided payments from the payment provider, or an ingestion bug/schema change), or `stg_payments` mis-maps or mis-casts the column (e.g. a renamed field or a failed cast producing NULL). The report doesn't say which, so the first step is to inspect the 11 rows.\n\n### Fix\n1. **Diagnose first.** Compare the 11 rows in staging with raw:\n```sql\nselect s.*, r.*\nfrom \"ecommerce\".\"main\".\"stg_payments\" s\nleft join \"ecommerce\".\"raw\".\"raw_payments\" r on r.<payment_id_col> = s.payment_id\nwhere s.amount is null;\n```\n2. **If raw is NULL for legitimate non-monetary states** (e.g. status `failed`/`pending`), handle it in `models/staging/stg_payments.sql`, not by deleting the test. Either filter those rows out or make the semantics explicit:\n```sql\n-- option A: exclude non-settled payments\nwhere amount is not null\n\n-- option B: keep rows, default to 0 and keep the status for downstream filtering\ncoalesce(amount, 0) as amount\n```\nChoose A if downstream marts only want settled payments; choose B only if a zero amount is semantically correct. Do not silently coalesce if the NULL means \"unknown\".\n\n3. **If the staging cast/mapping is wrong** (e.g. `cast(amount_cents as decimal)/100` on a renamed column, or `try_cast` on a malformed string), fix the expression in `stg_payments.sql` to read the correct source column.\n\n4. **If raw data is genuinely bad** (provider or ingestion defect), the fix belongs outside dbt: correct the payment-provider ingestion job that writes `raw.raw_payments`, then backfill/reload the 11 affected records. Keep the `not_null` test in `models/staging/schema.yml` as is, since it correctly caught a data-quality issue. If NULLs turn out to be expected for some statuses and you want to keep them, scope the test instead:\n```yaml\n- name: amount\n  tests:\n    - not_null:\n        config:\n          where: \"status = 'completed'\"\n```\n(Only do this after confirming with the business that NULL is valid for other statuses.)\n\n### Verification\n```\ndbt build --select stg_payments+\n```\nExpected: `not_null_stg_payments_amount` passes (0 failing rows), and `dim_customers`, `fct_orders` and their 9 tests run and pass instead of being skipped.\n\nAlso confirm directly:\n```sql\nselect count(*) from \"ecommerce\".\"main\".\"stg_payments\" where amount is null;  -- expect 0\n```\nIf you filtered rows, check that the row-count drop is exactly the 11 expected rows. After the next hourly ingestion, rerun the full `dbt build` to confirm the issue doesn't recur.\n\n### Assumptions\n- The column names (`payment_id`, `status`, `amount`) and model file path (`models/staging/stg_payments.sql`, `schema.yml`) follow common dbt conventions; actual names may differ.\n- `stg_payments` is a view over `raw.raw_payments` with light renaming/casting.\n- The 11 NULLs are new or newly surfaced; I don't know whether the test passed on previous runs.\n- Whether NULL amounts are valid business states (failed/pending payments) versus ingestion defects is unknown and determines which fix option applies.\n- The skipped downstream nodes have no independent problems; they were skipped only because of the upstream failure."}, {"position": 56, "item_id": "NR01-09C", "is_repeat": 0, "scenario_id": "NR01", "label": "C", "group_pos": 2, "group_size": 6, "text": "### Root cause\n\nThe failure is due to 11 rows in the `stg_payments` table having a `null` value in the `amount` column, causing the `not_null` test to fail. This is because the `amount` column is supposed to be not null, according to the model's documentation.\n\n### Fix\n\nTo fix this issue, we need to update the `stg_payments` model to handle the case where the `amount` column is null. We can do this by adding a `coalesce` function to the SQL query, which will replace null values with a default value, such as 0. The updated model file (`models/staging/stg_payments.sql`) should look like this:\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_payments') }}\n\n),\n\nrenamed as (\n\n    select\n        payment_id,\n        order_id,\n        payment_method,\n        -- coalesce amounts to 0 for null values\n        coalesce(cast(amount as decimal(18, 2)) / 100, 0) as amount,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```\n\n### Verification\n\nTo verify that the fix worked, we can run the following dbt command:\n```\ndbt test stg_payments\n```\nThis should pass without any errors. We can also check the `stg_payments` table in the warehouse to ensure that the `amount` column is no longer null.\n\n### Assumptions\n\n* The `raw_payments` table in the `raw` schema is being loaded with data that contains null values in the `amount` column.\n* The `stg_payments` model is the only one affected by this issue, and there are no other models or sources that are also failing."}, {"position": 57, "item_id": "NR01-05C", "is_repeat": 0, "scenario_id": "NR01", "label": "C", "group_pos": 3, "group_size": 6, "text": "### Root cause\n`dbt build` failed because the `not_null` data test on `stg_payments.amount` found 11 rows where `amount is null`. Source freshness passed for `raw.raw_payments`, so this is not a stale-ingestion problem; recent payment rows arrived, but some have missing or unmapped payment amounts. Because `dim_customers`, `fct_orders`, and downstream tests depend on the failed upstream node/test path, dbt skipped them.\n\n### Fix\nInvestigate `stg_payments` and the underlying source `raw.raw_payments` to determine whether the 11 nulls are legitimate source data or caused by staging logic.\n\nRun:\n\n```sql\nselect *\nfrom \"ecommerce\".\"main\".\"stg_payments\"\nwhere amount is null;\n```\n\nThen trace those rows back to the raw source, using the payment key column used by `stg_payments` — assumed here to be `payment_id`:\n\n```sql\nselect *\nfrom raw.raw_payments\nwhere payment_id in (\n    select payment_id\n    from \"ecommerce\".\"main\".\"stg_payments\"\n    where amount is null\n);\n```\n\nIf the raw records also have missing payment amounts, fix the upstream ingestion/source system: ensure the payment provider ingestion job populates the raw amount field in `raw.raw_payments` for every payment row before dbt runs.\n\nIf the raw records have a non-null amount but `stg_payments.amount` is null, fix the staging model, likely `models/staging/stg_payments.sql`, to select/cast the correct raw column. For example, if the correct raw column is `amount_cents`, update the staging SQL to derive `amount` from it:\n\n```sql\nselect\n    payment_id,\n    order_id,\n    payment_method,\n    status,\n    amount_cents / 100.0 as amount,\n    loaded_at\nfrom {{ source('raw', 'raw_payments') }}\n```\n\nDo not remove the `not_null` test from `stg_payments.amount` unless the business definition allows payments without amounts. If null amounts are valid for specific statuses, narrow the test in the YAML file containing the `stg_payments` tests, for example `models/staging/schema.yml`:\n\n```yaml\nmodels:\n  - name: stg_payments\n    columns:\n      - name: amount\n        data_tests:\n          - not_null:\n              config:\n                where: \"status not in ('pending', 'failed', 'voided')\"\n```\n\n### Verification\nAfter applying the source or staging fix, run:\n\n```bash\ndbt build --select stg_payments+\n```\n\nExpected result: the `not_null_stg_payments_amount` test passes with 0 failing rows, and downstream models/tests such as `dim_customers` and `fct_orders` are no longer skipped.\n\nAlso confirm directly:\n\n```sql\nselect count(*) as null_amount_rows\nfrom \"ecommerce\".\"main\".\"stg_payments\"\nwhere amount is null;\n```\n\nExpected result:\n\n```text\nnull_amount_rows = 0\n```\n\nIf a conditional test was intentionally added, verify instead:\n\n```sql\nselect count(*) as invalid_null_amount_rows\nfrom \"ecommerce\".\"main\".\"stg_payments\"\nwhere amount is null\n  and status not in ('pending', 'failed', 'voided');\n```\n\nExpected result:\n\n```text\ninvalid_null_amount_rows = 0\n```\n\nFinally, rerun freshness if needed:\n\n```bash\ndbt source freshness\n```\n\nExpected result: `raw.raw_payments` remains fresh and passes.\n\n### Assumptions\n- `stg_payments` is built from `source('raw', 'raw_payments')`.\n- The payment identifier is named `payment_id`.\n- The staging model file is `models/staging/stg_payments.sql`.\n- The YAML file defining the `stg_payments.amount` `not_null` test is `models/staging/schema.yml`.\n- `amount` is intended to be mandatory for completed/valid payment records unless the business explicitly allows nulls for some statuses."}, {"position": 58, "item_id": "NR01-07B", "is_repeat": 0, "scenario_id": "NR01", "label": "B", "group_pos": 4, "group_size": 6, "text": "### Root cause\nThe failure originates upstream of dbt. The staging SQL is unchanged since the last passing run, and the CI upgrade (2026-10-07) was followed by a passing build. The NULLs match the provider's gift-card settlement re-sync for the last 30 days, which ran this morning. The re-sync most likely loaded gift-card rows into `raw.raw_payments` with `amount` NULL (e.g. settlement records without a cent value), and the NULLs flow unchanged through the cast and division in `stg_payments`. Freshness passes because rows were loaded recently, so it cannot detect bad content. The not_null failure correctly blocked `dim_customers` and `fct_orders` (13 skipped nodes), protecting the finance and marketing dashboards from understated revenue and lifetime value.\n\n### Fix\nDo not filter out the NULL rows or coalesce them to 0 in `stg_payments`. That would silently understate revenue and hide a real data problem.\n\n1. **Outside dbt (ingestion / provider):** Ask the payment provider or the ingestion owner to supply the missing gift-card amounts (corrected file or re-sync), as was done in INC-0402, then re-ingest into `raw.raw_payments`. If re-ingestion appends duplicates, deduplicate the raw load by `payment_id` (keeping the row with a non-null amount) so `unique` on `payment_id` still holds.\n2. **Inside dbt, optional hardening:** add a source-level test so the problem is caught at the boundary, and make the failure more informative:\n\n```yaml\n# models/staging/_sources.yml\nsources:\n  - name: raw\n    tables:\n      - name: raw_payments\n        columns:\n          - name: amount\n            tests:\n              - not_null:\n                  config:\n                    severity: error\n```\n\n3. Once the raw data is corrected, rerun the build so the skipped models refresh before the 07:00 UTC finance refresh.\n\nOnly if the provider confirms NULL amounts are legitimate (e.g. zero-value settlements) should the model change to `coalesce(cast(amount as decimal(18,2)) / 100, 0) as amount` with the test left in place.\n\n### Verification\nFirst confirm the diagnosis (before fixing):\n\n```sql\nselect payment_method, count(*) as null_rows, min(loaded_at), max(loaded_at)\nfrom raw.raw_payments\nwhere amount is null\ngroup by 1;\n```\n\nExpected: all 11 rows are `gift_card`, with `loaded_at` from this morning's re-sync window.\n\nAfter correction and re-ingestion:\n\n```\ndbt build --select stg_payments+ \n```\n\nExpected: `not_null_stg_payments_amount` passes (0 rows), `dim_customers`, `fct_orders` and their 9 tests run and pass, exit code 0. Also check that `fct_orders` has one row per order (the existing grain test) and that gift-card totals look plausible against the provider's settlement report, since a re-sync could also have duplicated or altered amounts (compare to the 0–2 payments/day baseline).\n\n### Assumptions\n- The NULL rows are the 11 gift-card payments touched by the re-sync; I infer this from timing and the vendor notice, not from a query result (the verification query confirms it).\n- NULLs originate in `raw.raw_payments.amount` rather than being created by dbt; a cast of an integer column cannot produce NULLs from non-NULL values.\n- The ingestion layer permits NULL amounts and is owned by someone who can request a corrected provider file and re-ingest.\n- The re-sync did not otherwise corrupt other columns or duplicate rows (unverified; checks above cover this).\n- A NULL amount is a data defect, not a legitimate business value.\n- Rerun can happen before the next 07:00 UTC finance dashboard refresh; if not, Finance analytics should be told the dashboard shows yesterday's data."}, {"position": 59, "item_id": "NR01-07C", "is_repeat": 0, "scenario_id": "NR01", "label": "C", "group_pos": 5, "group_size": 6, "text": "### Root cause\n\nThe failure is due to 11 null payment amounts found in the `stg_payments` table, which is a departure from the expected behavior of zero or fewer null values. This issue has been recurring, with 6 previous daily runs passing and 1 failing today.\n\n### Fix\n\nTo fix the issue, we need to update the `stg_payments` model to handle missing or null payment amounts. This can be achieved by adding a check in the `stg_payments` SQL file to set the `amount` column to a reasonable value (e.g., 0) when it's null. The updated SQL file would be:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_payments') }}\n\n),\n\nrenamed as (\n\n    select\n        payment_id,\n        order_id,\n        payment_method,\n        -- set null amount to 0\n        coalesce(cast(amount as decimal(18, 2)) / 100, 0) as amount,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```\n\n### Verification\n\nTo confirm the fix worked, we can re-run the `dbt test` command and verify that the `not_null_stg_payments_amount` test passes. Specifically, we can run the following SQL query to check the number of null values in the `amount` column:\n\n```sql\nSELECT COUNT(*) \nFROM \"ecommerce\".\"main\".\"stg_payments\" \nWHERE amount IS NULL;\n```\n\nIf the result is 0, the fix is successful."}, {"position": 60, "item_id": "NR01-09A", "is_repeat": 0, "scenario_id": "NR01", "label": "A", "group_pos": 6, "group_size": 6, "text": "### Root cause\n`dbt build` failed because the `not_null` test on `stg_payments.amount` found 11 rows where `amount` is `NULL`. The compiled test queries the staged view, and `stg_payments.amount` is derived from `raw.raw_payments.amount` using:\n\n```sql\ncast(amount as decimal(18, 2)) / 100 as amount\n```\n\nIf the raw `amount` is `NULL`, the staged `amount` remains `NULL`. Source freshness passed, so this is not an ingestion-latency issue; fresh payment data arrived, but 11 payment records have missing raw payment amounts.\n\n### Fix\nFix the upstream ingestion/source data for `raw.raw_payments.amount`, not the dbt transformation, unless `NULL` payment amounts are valid business data.\n\nRecommended remediation outside dbt:\n\n- In the web shop/payment provider ingestion job that writes to `raw.raw_payments`, ensure `amount` is populated in integer cents for every payment row.\n- Backfill or correct the 11 affected rows in `raw.raw_payments.amount`.\n\nTo identify the affected rows:\n\n```sql\nselect\n    payment_id,\n    order_id,\n    payment_method,\n    amount,\n    loaded_at\nfrom raw.raw_payments\nwhere amount is null;\n```\n\nAfter correcting the source data, keep the existing dbt model and test as-is:\n\nFile: `models/staging/stg_payments.sql`\n\n```sql\ncast(amount as decimal(18, 2)) / 100 as amount\n```\n\nColumn test to keep:\n\n```yaml\namount:\n  tests:\n    - not_null\n```\n\nDo not replace `NULL` with `0` in `stg_payments`, because that would hide bad payment data and could materially misstate revenue.\n\nIf the business confirms that missing payment amounts are expected for certain records, then update the model/test to reflect that rule, for example by excluding non-monetary or pending payment rows from the `not_null` test. That should only be done after confirming the valid condition.\n\n### Verification\nFirst confirm the raw issue:\n\n```sql\nselect count(*) as null_raw_amount_count\nfrom raw.raw_payments\nwhere amount is null;\n```\n\nExpected before remediation: `11`, assuming all failing staged rows come directly from null raw amounts.\n\nAfter the ingestion fix/backfill, run:\n\n```sql\nselect count(*) as null_raw_amount_count\nfrom raw.raw_payments\nwhere amount is null;\n```\n\nExpected result: `0`.\n\nThen rerun the affected dbt test:\n\n```bash\ndbt test --select stg_payments.amount\n```\n\nExpected result: pass for `not_null_stg_payments_amount`.\n\nFinally rerun the build for impacted downstream models:\n\n```bash\ndbt build --select stg_payments+ \n```\n\nExpected result: `stg_payments`, `dim_customers`, `fct_orders`, and their downstream tests build/pass without skips caused by this failure.\n\nOptionally rerun freshness:\n\n```bash\ndbt source freshness --select source:raw.raw_payments\n```\n\nExpected result: pass, confirming the source is still current.\n\n### Assumptions\n- `raw.raw_payments.amount` is the raw integer-cents field referenced by `stg_payments.sql`.\n- The 11 null staged amounts are caused by `NULL` values in `raw.raw_payments.amount`, not by unusual casting behavior.\n- Payment amounts are required for all rows in `raw.raw_payments`; `NULL` is invalid business data.\n- The ingestion/backfill process is owned outside the dbt project.\n- Downstream skips occurred because `dim_customers`, `fct_orders`, and their tests depend directly or indirectly on `stg_payments`."}, {"position": 61, "item_id": "RC01-07C", "is_repeat": 0, "scenario_id": "RC01", "label": "C", "group_pos": 1, "group_size": 6, "text": "### Root cause\n`stg_orders` failed because it now has 1,200 rows instead of the expected 500–1,000, and 600 `order_id` values are duplicated. The timing strongly points to the 2026-10-13 orders ingestion connector upgrade to loader v2.4 with new default write settings.\n\nMost likely, `raw.raw_orders` received duplicate rows during ingestion, probably by appending a second copy of the current 180-day order window instead of replacing/upserting it. `stg_orders` is a view that selects directly from `raw.raw_orders` without deduplication, so the raw duplicates propagated into `stg_orders`, causing the row-count and uniqueness tests to fail and skipping `dim_customers`, `fct_orders`, and downstream tests.\n\n### Fix\nFix the ingestion behavior outside dbt first.\n\nIn the orders ingestion job for source table `raw.raw_orders`, change loader v2.4 write settings back to the intended behavior: upsert/merge or replace for the 180-day window keyed by `order_id`, instead of append-only. Also clean up the duplicated rows already loaded into `raw.raw_orders`.\n\nIf cleanup can be done by keeping the latest record per `order_id`, run a raw-table repair similar to:\n\n```sql\ncreate or replace table raw.raw_orders as\nselect\n    order_id,\n    customer_id,\n    order_date,\n    status,\n    loaded_at\nfrom (\n    select\n        *,\n        row_number() over (\n            partition by order_id\n            order by loaded_at desc\n        ) as rn\n    from raw.raw_orders\n)\nwhere rn = 1;\n```\n\nBecause `stg_orders` is documented as “one row per order,” also make it resilient to duplicate raw loads by deduplicating in `models/staging/stg_orders.sql`:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_orders') }}\n\n),\n\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        cast(order_date as date) as order_date,\n        status,\n        loaded_at\n    from source\n\n),\n\ndeduplicated as (\n\n    select\n        order_id,\n        customer_id,\n        order_date,\n        status,\n        loaded_at\n    from renamed\n    qualify row_number() over (\n        partition by order_id\n        order by loaded_at desc\n    ) = 1\n\n)\n\nselect * from deduplicated\n```\n\nNo YAML test change is recommended: the existing `unique`, `not_null`, accepted-values, and row-count tests correctly detected the issue.\n\n### Verification\nAfter fixing ingestion settings and repairing `raw.raw_orders`, check the raw duplicate count:\n\n```sql\nselect\n    count(*) as total_rows,\n    count(distinct order_id) as distinct_orders,\n    count(*) - count(distinct order_id) as duplicate_rows\nfrom raw.raw_orders;\n```\n\nExpected: `duplicate_rows = 0`, and total rows return to the normal range, around 600 for the current 180-day window.\n\nThen rebuild the affected lineage:\n\n```bash\ndbt build --select source:raw.raw_orders+ --source-freshness\n```\n\nExpected result:\n- `stg_orders` row count test passes with a count between 500 and 1,000.\n- `unique_stg_orders_order_id` passes with 0 duplicate `order_id`s.\n- `dim_customers`, `fct_orders`, and their downstream tests are no longer skipped.\n- Source freshness for `raw.raw_orders`, `raw.raw_payments`, and `raw.raw_customers` still passes.\n\nOptionally confirm `stg_orders` directly:\n\n```sql\nselect\n    count(*) as total_rows,\n    count(distinct order_id) as distinct_orders\nfrom main.stg_orders;\n```\n\nExpected: `total_rows = distinct_orders`, with `total_rows` between 500 and 1,000.\n\n### Assumptions\nThe 1,200 rows are caused by duplicate raw order loads after the loader v2.4 upgrade, not by a real doubling of order volume.\n\nFor duplicate `order_id`s, the row with the greatest `loaded_at` is the correct row to keep.\n\n`raw.raw_orders` represents only the intended 180-day window, matching the documented expected volume for `stg_orders`.\n\nDuckDB supports the `qualify` syntax in the project’s deployed version."}, {"position": 62, "item_id": "RC01-07B", "is_repeat": 0, "scenario_id": "RC01", "label": "B", "group_pos": 2, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is that the `test row_count_between_stg_orders_1000__500` test is failing, indicating that the number of rows in the `stg_orders` table is outside the expected range of 500 to 1000. Additionally, the `test unique_stg_orders_order_id` test is also failing, indicating that there are duplicate order IDs in the `stg_orders` table. These failures suggest that there is an issue with the data quality or processing in the `stg_orders` model.\n\n### Fix\n\nTo fix the issue, the `stg_orders` model needs to be updated to handle the expected volume of orders. This can be done by modifying the `stg_orders` model to use a more robust way of checking the row count, such as using a window function or a subquery. Additionally, the `stg_orders` model needs to be updated to handle duplicate order IDs by removing or flagging them as invalid.\n\nAssuming the model is defined in `models/staging/stg_orders.sql`, the updated model could look like:\n```sql\nwith source as (\n    select * from {{ source('raw', 'raw_orders') }}\n),\n\nrenamed as (\n    select\n        order_id,\n        customer_id,\n        cast(order_date as date) as order_date,\n        status,\n        loaded_at\n    from source\n)\n\nselect distinct\n    order_id,\n    customer_id,\n    order_date,\n    status,\n    loaded_at\nfrom renamed\n```\nThis updated model uses the `distinct` keyword to remove duplicate order IDs.\n\n### Verification\n\nTo verify that the fix worked, run the following dbt command:\n```\ndbt test\n```\nThis should pass the `test row_count_between_stg_orders_1000__500` and `test unique_stg_orders_order_id` tests.\n\nAdditionally, verify that the data quality has improved by running the following SQL query:\n```sql\nselect count(*) as n_records\nfrom \"ecommerce\".\"main\".\"stg_orders\"\nwhere order_id is not null\ngroup by order_id\nhaving count(*) > 1;\n```\nIf the query returns no rows, it indicates that the duplicate order IDs have been removed or flagged as invalid.\n\n### Assumptions\n\nAssumed that the `raw_orders` source table is correctly ingesting and processing order data."}, {"position": 63, "item_id": "RC01-03A", "is_repeat": 0, "scenario_id": "RC01", "label": "A", "group_pos": 3, "group_size": 6, "text": "### Root cause\n`stg_orders` has duplicate `order_id` values: 600 order IDs appear more than once, which fails the `unique` test. Source freshness passes, so data is arriving on time. The likely cause is that the hourly ingestion appends to `raw.raw_orders` without deduplicating or upserting, so the same order lands in several batches (re-sent or updated rows). `stg_orders` is a pass-through view that does not collapse them. The row-count test fails for the same reason: the inflated count falls outside the 500-1000 range (the actual count isn't given, but it is probably above 1000 if each of the 600 duplicate IDs has at least one extra row). The two failures are one problem. `dim_customers`, `fct_orders` and 9 tests were skipped only because they depend on `stg_orders`, so they are not independent failures.\n\nNote that the row-count test is a useful guard, but it is a poor proxy for volume: a hard 500-1000 range will break as the shop grows, so it should be revisited separately from this incident.\n\n### Fix\n1. **Deduplicate in `models/staging/stg_orders.sql`**, keeping the latest version of each order. This is a safe, idempotent fix that does not depend on fixing ingestion first:\n\n```sql\nwith source as (\n    select * from {{ source('raw', 'raw_orders') }}\n),\n\ndeduped as (\n    select *,\n        row_number() over (\n            partition by order_id\n            order by loaded_at desc\n        ) as _rn\n    from source\n)\n\nselect * exclude (_rn)\nfrom deduped\nwhere _rn = 1\n```\n\n(`exclude` is DuckDB syntax; replace the `select *` in `deduped` with your explicit column list if the existing model selects/renames columns.)\n\n2. **Fix the cause outside dbt**: in the ingestion job that loads the web shop into `raw.raw_orders`, change append-only loading to an upsert/merge on `order_id`, or make the load idempotent (for example, replace the batch by extraction window). Until this is done, `raw_orders` keeps growing with duplicates, which wastes storage and slows the dedup window function.\n\n3. **Review the row-count test** in the `stg_orders` YAML (`row_count_between`, min 500, max 1000). After deduplication, check the real row count; if it is legitimately outside 500-1000, update the bounds (or switch to a relative/anomaly-based check) rather than loosening them to hide duplicates. Don't change it until the deduplicated count is known.\n\nDo not remove or weaken the `unique` test.\n\n### Verification\nRebuild the failed model and everything downstream:\n\n```\ndbt build --select stg_orders+\n```\n\nExpected: `unique_stg_orders_order_id` passes, the row-count test passes (or fails only if the true deduplicated count is outside the bounds, in which case adjust them as above), and `dim_customers`, `fct_orders` and their 9 tests now run and pass instead of being skipped.\n\nConfirm directly in SQL:\n\n```sql\nselect count(*) as n_rows, count(distinct order_id) as n_ids\nfrom \"ecommerce\".\"main\".\"stg_orders\";\n```\n\nExpected: `n_rows = n_ids`. Also check the raw table to confirm the cause:\n\n```sql\nselect order_id, count(*) from raw.raw_orders group by 1 having count(*) > 1 limit 20;\n```\n\nAfter the ingestion fix, this should return zero rows following the next hourly load. Finally, run `dbt source freshness` to confirm it still passes.\n\n### Assumptions\n- `raw.raw_orders` has a `loaded_at` column (implied by the freshness config) that reliably identifies the most recent version of a row; if orders have an `updated_at` field, order by that first.\n- `order_id` is the intended unique key of an order, and duplicate rows are repeated or updated versions of the same order rather than distinct orders sharing an ID.\n- `stg_orders` is currently a simple select from the source with no existing deduplication.\n- The duplication comes from append-only loading by the ingestion job; I cannot see the ingestion code, so this is inferred from the symptoms (duplicates with healthy freshness).\n- The 500-1000 row bounds were set for an earlier data volume and have not been validated against the current true order count."}, {"position": 64, "item_id": "RC01-03B", "is_repeat": 0, "scenario_id": "RC01", "label": "B", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is that two tests failed: `test row_count_between_stg_orders_1000__500` and `test unique_stg_orders_order_id`. The `row_count_between` test failed because it expected a row count between 500 and 1000, but got only 1 result. The `unique` test failed because it found 600 duplicate `order_id` values, which exceeded the expected count of 0.\n\n### Fix\n\nTo fix this, we need to adjust the `stg_orders` model to ensure it has a reasonable number of rows and order IDs are unique. Specifically, we need to add a `unique` constraint to the `order_id` column and ensure the model is populated with a sufficient number of rows.\n\nIn the `stg_orders` model, add the following line to the `columns` section:\n```yaml\ncolumns:\n  - name: order_id\n    tests: [unique]\n```\nThis will enforce uniqueness on the `order_id` column.\n\nTo increase the row count, we need to adjust the ingestion job to load more data into the `raw` schema. This could involve changing the data retrieval query or increasing the frequency of the ingestion job.\n\nAssuming the data retrieval query is the issue, we would need to modify the ingestion job to load more data. For example, if the query is currently filtering by a specific date range, we could adjust the range to include more data.\n\n### Verification\n\nTo verify the fix worked, we can run the following dbt command:\n```\ndbt test\n```\nThis will re-run all tests, including the two that failed initially. We should see both tests pass, indicating that the `stg_orders` model is now populated with a sufficient number of rows and `order_id` values are unique.\n\nWe can also verify the fix by running the following SQL query:\n```sql\nSELECT count(*) as n_rows FROM \"ecommerce\".\"main\".\"stg_orders\";\nSELECT count(*) as n_unique FROM \"ecommerce\".\"main\".\"stg_orders\" WHERE order_id IS NOT NULL GROUP BY order_id HAVING count(*) = 1;\n```\nThe first query should return a reasonable row count, and the second query should return 0 rows, indicating that all `order_id` values are unique.\n\n### Assumptions\n\n* The ingestion job is the source of the data issue, rather than the dbt project itself.\n* The data retrieval query is the primary cause of the low row count, and adjusting the query will resolve the issue.\n* The CRM, payment provider, and web shop data ingestion jobs are all configured correctly and are not the source of the issue."}, {"position": 65, "item_id": "RC01-04A", "is_repeat": 0, "scenario_id": "RC01", "label": "A", "group_pos": 5, "group_size": 6, "text": "### Root cause\n`stg_orders` is expected to be one row per order, but the raw input feeding it contains duplicate rows for every order. The `unique_stg_orders_order_id` test returned 600 duplicate `order_id` groups, and the row-count test exceeded the expected 500–1,000 range. Since source freshness passed for `raw.raw_orders`, this is not a stale-data issue; the ingestion likely loaded duplicate records into `raw.raw_orders`, or `stg_orders` is not deduplicating repeated ingested rows.\n\n### Fix\nFix the upstream ingestion into `raw.raw_orders` so the hourly job is idempotent and does not append the same order snapshot multiple times. This change belongs outside dbt, in the web shop/raw-orders ingestion job.\n\nAlso make `models/staging/stg_orders.sql` defensive by deduplicating `raw.raw_orders` to one row per `order_id`, keeping the latest `loaded_at` record:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_orders') }}\n\n),\n\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        cast(order_date as date) as order_date,\n        status,\n        loaded_at\n    from source\n\n),\n\ndeduplicated as (\n\n    select\n        order_id,\n        customer_id,\n        order_date,\n        status,\n        loaded_at\n    from renamed\n    qualify row_number() over (\n        partition by order_id\n        order by loaded_at desc\n    ) = 1\n\n)\n\nselect * from deduplicated\n```\n\nFile to change: `models/staging/stg_orders.sql`.\n\nIf late-arriving corrections can produce multiple versions of the same order with identical `loaded_at`, add a deterministic tie-breaker column from the raw source, such as an ingestion sequence or source updated timestamp. If no such column exists, add one in the ingestion pipeline.\n\n### Verification\nFirst inspect the raw duplication pattern:\n\n```sql\nselect\n    count(*) as raw_rows,\n    count(distinct order_id) as distinct_orders,\n    count(*) - count(distinct order_id) as duplicate_rows\nfrom raw.raw_orders;\n```\n\nThen check which IDs are duplicated:\n\n```sql\nselect\n    order_id,\n    count(*) as n_records,\n    min(loaded_at) as first_loaded_at,\n    max(loaded_at) as last_loaded_at\nfrom raw.raw_orders\nwhere order_id is not null\ngroup by order_id\nhaving count(*) > 1\norder by n_records desc, order_id;\n```\n\nAfter fixing ingestion and/or applying the staging deduplication, run:\n\n```bash\ndbt build --select stg_orders+\ndbt source freshness --select source:raw.raw_orders\n```\n\nExpected result:\n- `unique_stg_orders_order_id` passes.\n- `row_count_between_stg_orders_1000__500` passes, with `stg_orders` row count between 500 and 1,000.\n- Downstream models `dim_customers` and `fct_orders` are no longer skipped.\n- `raw.raw_orders` freshness still passes.\n\nOptional direct confirmation:\n\n```sql\nselect\n    count(*) as stg_rows,\n    count(distinct order_id) as distinct_orders\nfrom ecommerce.main.stg_orders;\n```\n\nExpected: `stg_rows = distinct_orders`, and `stg_rows` between 500 and 1,000.\n\n### Assumptions\n- The 600 duplicate `order_id` groups are caused by duplicate ingestion into `raw.raw_orders`, not by legitimate multiple order versions that should be modeled separately.\n- `loaded_at` can be used to select the latest version of an order.\n- `raw.raw_orders` is append-loaded hourly.\n- DuckDB/dbt supports the `qualify` clause in the project’s environment."}, {"position": 66, "item_id": "RC01-04B", "is_repeat": 0, "scenario_id": "RC01", "label": "B", "group_pos": 6, "group_size": 6, "text": "### Root cause\n`stg_orders` is a pass-through view over `raw.raw_orders`, which is loaded hourly. The loads are evidently append-only, with no deduplication or incremental/merge logic. Each run re-inserts the same orders, so `order_id` repeats and the row count exceeds the expected 500-1,000 window. The two failures are one symptom: 600 duplicated `order_id` values (at least 600 extra rows) pushed the count over 1,000. The staging model has no dedup step, and source freshness passes because rows keep arriving, so it cannot detect this. The 13 skipped nodes (`dim_customers`, `fct_orders`, 9 tests) are collateral from the upstream failure.\n\n### Fix\nTwo changes, in order of priority:\n\n1. **Outside dbt (root fix):** change the orders ingestion job that writes `raw.raw_orders` to upsert/merge on `order_id` (or load into a staging table and merge) instead of blind append. Then remove the existing duplicates from `raw.raw_orders`, keeping the latest `loaded_at` per `order_id`.\n\n2. **In dbt (defensive, and an immediate unblock):** deduplicate in `models/staging/stg_orders.sql` so staging honors its \"one row per order\" contract regardless of raw behavior:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_orders') }}\n\n),\n\ndeduplicated as (\n\n    select *\n    from source\n    qualify row_number() over (\n        partition by order_id\n        order by loaded_at desc\n    ) = 1\n\n),\n\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        cast(order_date as date) as order_date,\n        status,\n        loaded_at\n    from deduplicated\n\n)\n\nselect * from renamed\n```\n\nKeep the `unique` and `row_count_between` tests unchanged. They caught the problem and should stay as guards. Do not widen the row-count bounds or delete the unique test to make the build green.\n\n### Verification\nFirst, confirm the diagnosis in DuckDB:\n\n```sql\nselect count(*) as total_rows,\n       count(distinct order_id) as distinct_orders\nfrom \"ecommerce\".\"main\".\"stg_orders\";   -- run against raw.raw_orders before the fix\n```\n\nBefore the fix, `total_rows` should exceed `distinct_orders` and `total_rows` should be above 1,000.\n\nAfter the change, run:\n\n```\ndbt build --select stg_orders+\n```\n\nExpected: `unique_stg_orders_order_id` and `row_count_between_stg_orders_1000__500` pass, and `dim_customers`, `fct_orders` and their 9 tests run (no skips). Then run the query above against `stg_orders`: `total_rows` should equal `distinct_orders` and fall between 500 and 1,000. After the ingestion fix, check that `raw.raw_orders` itself stays unique across a couple of hourly loads.\n\n### Assumptions\n- Duplicates are repeated loads of the same order (identical or updated versions of the same order), not distinct orders with colliding ids. If `order_id` collisions between different orders exist, deduplicating would hide a real data problem and the source system needs investigation.\n- Keeping the row with the latest `loaded_at` is the correct \"current\" version (e.g., latest status). If the source has a better ordering column (such as an updated-at timestamp), use that.\n- Once duplicates are removed, the true order count falls within 500-1,000, as the model description states. The report doesn't show the distinct count, so confirm this with the verification query.\n- The ingestion job is append-only and owned outside the dbt project. The report doesn't show this directly; it is inferred from the duplicates in a pass-through staging view.\n- The `row_count_between` test's name suffix `_1000__500` doesn't affect behavior; the compiled SQL shows the correct bounds (500-1,000)."}, {"position": 67, "item_id": "SD03-06B", "is_repeat": 0, "scenario_id": "SD03", "label": "B", "group_pos": 1, "group_size": 6, "text": "### Root cause\n`dim_customers` joins `customers.customer_id` to `customer_orders.customer_id` (line 66), and the two columns have incompatible types. The error shows the customer side now contains string values like `'CUST-00001'`, while the other side is INT32, so DuckDB's implicit cast fails. The most likely explanation is an upstream change: the CRM ingestion into `raw.raw_customers` started delivering a prefixed string key (`CUST-00001`) where it previously delivered integers, while `raw.raw_orders` still carries the integer key. This is an inference from the error message; the report doesn't show the source schemas. Freshness passing confirms data is arriving, so this is a key-format/type mismatch, not a stale-data problem. The 4 skipped tests are collateral: they never ran because `dim_customers` failed.\n\n### Fix\nFirst, confirm which side changed (see Verification query) and which format is canonical. Then:\n\n1. **Short term, in dbt:** normalize the key to a single type in the staging layer, so marts never see mixed types. Assuming the staging models are `stg_customers` and `stg_orders` (file names assumed), cast explicitly there. If the canonical key is now the prefixed string, make both sides strings:\n\n```sql\n-- models/staging/stg_customers.sql\ncast(customer_id as varchar) as customer_id\n\n-- models/staging/stg_orders.sql\n-- only if orders still carries the old integer key\n'CUST-' || lpad(cast(customer_id as varchar), 5, '0') as customer_id\n```\n\nCheck that the padding width (5) matches the real format of the prefixed keys. If orders is *also* about to migrate to the prefixed format, use `try_cast`-free logic that handles both (e.g. `case when cast(customer_id as varchar) like 'CUST-%' then ... else ... end`) so the model survives the transition.\n\n2. **Add a guard:** declare the expected type in the staging YAML and add a relationships test so a future mismatch fails at staging, not deep in a mart:\n\n```yaml\nmodels:\n  - name: stg_orders\n    columns:\n      - name: customer_id\n        data_tests:\n          - relationships:\n              to: ref('stg_customers')\n              field: customer_id\n```\n\nIf the project uses dbt model contracts (`contract: {enforced: true}` with `data_type: varchar`), enable them on the staging models too.\n\n3. **Outside the dbt project:** the CRM ingestion job (the owner of `raw.raw_customers`) changed a key's type without notice. Agree with its owner on the canonical `customer_id` format, and ask that schema changes to the raw tables be announced or versioned. If the change was unintentional, the better long-term fix is for ingestion to revert or to apply the same format to orders.\n\nDo not use `try_cast` to silently null out the non-numeric keys; that would drop customers from the dimension and fail quietly.\n\n### Verification\nInspect the types and sample values on both sides:\n\n```sql\ndescribe raw.raw_customers;\ndescribe raw.raw_orders;\nselect customer_id from raw.raw_customers limit 5;\nselect count(*) from raw.raw_customers where try_cast(customer_id as integer) is null;\n```\n\nAfter the fix, run:\n\n```\ndbt build --select stg_customers stg_orders dim_customers+\n```\n\nExpected: `dim_customers` builds, the 4 previously skipped tests run and pass, and exit code is 0. Also check that the join didn't lose rows:\n\n```sql\nselect count(*) from dim_customers;  -- should match distinct customers in stg_customers\nselect count(*) from stg_orders o\nleft join stg_customers c using (customer_id) where c.customer_id is null; -- expect 0\n```\n\nThen rerun the full `dbt build` on the next schedule.\n\n### Assumptions\n- Staging models are named `stg_customers` and `stg_orders` and are views over the raw sources; actual names weren't given.\n- The type change originated in the CRM ingestion (`raw_customers`), and `raw_orders.customer_id` is still an integer, inferred from the INT32 side of the error.\n- Keys follow the pattern `CUST-` plus five zero-padded digits, based on the single example `CUST-00001`.\n- No contracts or relationships tests on `customer_id` currently exist at staging, which is why the mismatch surfaced only in the mart.\n- The 4 skipped tests all depend on `dim_customers`, as the report states."}, {"position": 68, "item_id": "SD03-03C", "is_repeat": 0, "scenario_id": "SD03", "label": "C", "group_pos": 2, "group_size": 6, "text": "### Root cause\n\nThe failure is caused by a conversion error in the `dim_customers` model. The error message indicates that the model is trying to convert a string column (`customer_id`) to an `INT32` data type. This is likely due to the `customer_id` column having non-numeric values, which cannot be directly converted to an integer.\n\n### Fix\n\nTo fix this issue, we need to modify the `customer_id` column in the `customer_orders` CTE to handle non-numeric values. We can do this by casting the `customer_id` column to a string using the `::varchar` syntax.\n\nWe will need to update the `customer_orders` CTE in the `dim_customers` model to add this casting:\n```sql\ncustomer_orders as (\n    select\n        ::varchar(customer_id) as customer_id,\n        min(order_date) as first_order_date,\n        max(order_date) as most_recent_order_date,\n        count(order_id) as number_of_orders\n    from orders\n    group by ::varchar(customer_id)\n)\n```\n### Verification\n\nTo verify that the fix worked, we can run the following dbt command:\n```\ndbt build\n```\nThis will re-run the `dim_customers` model and rebuild the staging view and mart table. If the fix is successful, the model should build without any errors.\n\nWe can also verify the fix by running a SQL query to select the first few rows of the `dim_customers` mart table:\n```sql\nSELECT * FROM {{ ref('dim_customers') }}\n```\nThis should return the expected data without any conversion errors.\n\n### Assumptions\n\n* The issue is specific to the `customer_id` column in the `customer_orders` CTE and does not affect other columns or models in the dbt project.\n* The `customer_id` column in the `customer_orders` CTE is not used elsewhere in the model, and the fix will not affect the accuracy or performance of the model."}, {"position": 69, "item_id": "SD03-03B", "is_repeat": 0, "scenario_id": "SD03", "label": "B", "group_pos": 3, "group_size": 6, "text": "### Root cause\n`dim_customers` fails while joining `stg_customers.customer_id` to `stg_orders.customer_id` via `customer_orders.customer_id`. One side is typed as `INTEGER` and the other now contains string IDs like `'CUST-00001'`. DuckDB is trying to cast `'CUST-00001'` to `INT32` during the join and cannot.\n\nSource freshness passed, so this is not a stale ingestion issue. It is a schema/type mismatch, likely caused by a change in the upstream customer ID format or inconsistent typing between staging models.\n\n### Fix\nUse a single canonical type for customer identifiers across staging and marts. Because the source now contains values like `CUST-00001`, `customer_id` should be treated as a string, not an integer.\n\nChange the staging models that expose `customer_id`, most importantly:\n\n- `models/staging/stg_customers.sql`\n- `models/staging/stg_orders.sql`\n\nCast `customer_id` to `VARCHAR` in both models.\n\nExample change:\n\n```sql\n-- models/staging/stg_customers.sql\n\nselect\n    cast(customer_id as varchar) as customer_id,\n    first_name,\n    last_name,\n    lower(email) as email,\n    country_code,\n    created_at\nfrom {{ source('raw', 'raw_customers') }}\n```\n\n```sql\n-- models/staging/stg_orders.sql\n\nselect\n    order_id,\n    cast(customer_id as varchar) as customer_id,\n    order_date,\n    status\nfrom {{ source('raw', 'raw_orders') }}\n```\n\nThen update the documented warehouse type for `dim_customers.customer_id` from `INTEGER` to `VARCHAR` in the model YAML file that documents `dim_customers`, for example:\n\n```yaml\nmodels:\n  - name: dim_customers\n    description: One row per customer with order history and lifetime value. Used by marketing and finance dashboards.\n    columns:\n      - name: customer_id\n        data_type: varchar\n        description: Primary key of the customer.\n        tests:\n          - unique\n          - not_null\n```\n\nIf downstream dashboards, semantic models, or BI tools expect `dim_customers.customer_id` to be numeric, update them to use a string customer key.\n\nDo not fix this by stripping `CUST-` and casting to integer unless the business has confirmed that the canonical customer ID is still numeric and the prefix is only a presentation artifact.\n\n### Verification\nRun the affected lineage first:\n\n```bash\ndbt build --select stg_customers stg_orders dim_customers+\n```\n\nExpected result: `dim_customers` builds successfully, and the previously skipped tests run.\n\nConfirm the column types and join compatibility in DuckDB:\n\n```sql\nselect\n    typeof(customer_id) as customer_id_type\nfrom dim_customers\nlimit 1;\n```\n\nExpected result: `VARCHAR`.\n\nCheck that prefixed customer IDs are present and not dropped:\n\n```sql\nselect customer_id\nfrom dim_customers\nwhere customer_id like 'CUST-%'\nlimit 10;\n```\n\nExpected result: rows such as `CUST-00001`, if those exist in the raw source.\n\nRun the normal scheduled command:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: no model errors; `dim_customers` tests `unique`, `not_null`, and `lifetime_value not_null` pass; source freshness remains passing.\n\n### Assumptions\n- `stg_customers` and `stg_orders` both expose a `customer_id` column used by `dim_customers`.\n- The new value `'CUST-00001'` is a valid customer ID, not corrupt data.\n- String customer IDs are now the canonical format from the web shop or CRM.\n- The YAML file documenting `dim_customers` exists under `models/`, though its exact filename was not provided.\n- No other mart or staging model still casts `customer_id` to `INTEGER`; if they do, they need the same `VARCHAR` treatment."}, {"position": 70, "item_id": "SD03-06C", "is_repeat": 0, "scenario_id": "SD03", "label": "C", "group_pos": 4, "group_size": 6, "text": "### Root cause\n`dim_customers` failed while joining `customers.customer_id` to `customer_orders.customer_id`. DuckDB tried to cast the string value `'CUST-00001'` to `INT32`, which means the two join columns have incompatible types: one side is a string customer key like `CUST-00001`, while the other side is numeric/integer.\n\nSource freshness passed, so this is not a stale-ingestion issue. It is a schema/type mismatch introduced upstream, likely in the raw/staging order or customer data, or in a dbt model that casts `customer_id` to integer.\n\n### Fix\nMake `customer_id` a string consistently across the customer and order staging models, then join strings in `models/marts/dim_customers.sql`.\n\nRecommended dbt-side fix:\n\nIn the customer staging model, for example `models/staging/stg_customers.sql`, ensure:\n\n```sql\nselect\n    cast(customer_id as varchar) as customer_id,\n    ...\nfrom {{ source('raw', 'raw_customers') }}\n```\n\nIn the orders staging model, for example `models/staging/stg_orders.sql`, ensure:\n\n```sql\nselect\n    cast(customer_id as varchar) as customer_id,\n    ...\nfrom {{ source('raw', 'raw_orders') }}\n```\n\nIf the raw orders table stores numeric IDs but the canonical customer key now includes the `CUST-` prefix, do not simply cast the integer to `varchar`; normalize it to the same format as customers, for example:\n\n```sql\nselect\n    'CUST-' || lpad(cast(customer_id as varchar), 5, '0') as customer_id,\n    ...\nfrom {{ source('raw', 'raw_orders') }}\n```\n\nIn `models/marts/dim_customers.sql`, avoid implicit casts in the join. The join should compare same-type, same-format keys:\n\n```sql\nleft join customer_orders\n    on customers.customer_id = customer_orders.customer_id\n```\n\nIf `customer_orders` is a CTE inside `dim_customers`, make sure its `customer_id` is selected from `stg_orders.customer_id` after the normalization above, not re-cast to integer.\n\nAlso update schema tests/YAML if the expected type is documented. For example in `models/staging/schema.yml`:\n\n```yaml\nmodels:\n  - name: stg_customers\n    columns:\n      - name: customer_id\n        data_type: varchar\n        tests:\n          - not_null\n          - unique\n\n  - name: stg_orders\n    columns:\n      - name: customer_id\n        data_type: varchar\n        tests:\n          - not_null\n          - relationships:\n              to: ref('stg_customers')\n              field: customer_id\n```\n\nIf the source contract is that `customer_id` should be numeric, then the fix belongs outside dbt: the ingestion job loading `raw.raw_customers.customer_id` should stop emitting prefixed IDs like `CUST-00001`, or it should load a separate numeric customer key. Based on the error, however, the safer analytics fix is to treat customer IDs as strings.\n\n### Verification\nRun the affected models and downstream tests:\n\n```bash\ndbt build --select stg_customers stg_orders dim_customers+\n```\n\nExpected result: `dim_customers` builds successfully, and the four previously skipped downstream tests run and pass.\n\nConfirm both staging columns have compatible values/types:\n\n```sql\nselect typeof(customer_id), count(*)\nfrom {{ ref('stg_customers') }}\ngroup by 1;\n\nselect typeof(customer_id), count(*)\nfrom {{ ref('stg_orders') }}\ngroup by 1;\n```\n\nExpected result: both return `VARCHAR`.\n\nCheck that order customer IDs match customer IDs:\n\n```sql\nselect o.customer_id, count(*) as order_count\nfrom {{ ref('stg_orders') }} o\nleft join {{ ref('stg_customers') }} c\n    on o.customer_id = c.customer_id\nwhere c.customer_id is null\ngroup by 1\nlimit 20;\n```\n\nExpected result: zero rows, except for any known/acceptable guest or deleted-customer orders.\n\nFinally rerun the scheduled command:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: build exits 0; source freshness continues to pass.\n\n### Assumptions\n- `customers` and `customer_orders` in the error are CTEs or relations inside `models/marts/dim_customers.sql`.\n- The relevant staging models are named `stg_customers` and `stg_orders`.\n- `customer_id` values like `CUST-00001` are valid business keys and should be represented as strings.\n- If raw orders currently contain integer IDs, they correspond to the numeric suffix of the customer key and can be safely normalized with the `CUST-` prefix and zero-padding."}, {"position": 71, "item_id": "SD03-01A", "is_repeat": 0, "scenario_id": "SD03", "label": "A", "group_pos": 5, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is a conversion error in the `dim_customers` model when casting the `customer_id` column from the `customer_orders` join to an INT32. This is due to the `customer_id` column in the `raw_customers` table being stored as a VARCHAR.\n\n### Fix\n\nTo fix this issue, the `customer_id` column in the `customer_orders` CTE needs to be cast to INT32. This can be achieved by adding the following line in the `customer_orders` CTE:\n\n```sql\ncustomer_id::INT32 as customer_id\n```\n\nThe full SQL statement would be:\n\n```sql\ncustomer_orders as (\n    select\n        customer_id::INT32 as customer_id,\n        min(order_date) as first_order_date,\n        max(order_date) as most_recent_order_date,\n        count(order_id) as number_of_orders\n    from orders\n    group by customer_id\n)\n```\n\n### Verification\n\nTo verify the fix, run the following dbt command:\n\n```\ndbt build\n```\n\nAnd check the output for any errors or warnings. Also, run the following SQL query to verify the data types:\n\n```sql\nSELECT \n    column_name, \n    data_type\nFROM \n    information_schema.columns\nWHERE \n    table_name = 'customer_orders'\nAND \n    column_name = 'customer_id';\n```\n\nThe expected result is that the `customer_id` column is of type INT32.\n\n### Assumptions\n\nIt is assumed that the `customer_id` column in the `raw_customers` table is indeed stored as a VARCHAR, and that the issue is specific to this particular model and not a general issue with the dbt project or the warehouse."}, {"position": 72, "item_id": "SD03-01C", "is_repeat": 0, "scenario_id": "SD03", "label": "C", "group_pos": 6, "group_size": 6, "text": "### Root cause\nThe CRM migration (CRM-77, 2026-10-12) regenerated the customer export with the new tenant's external reference keys. `raw.raw_customers.customer_id` is VARCHAR and now holds values like `CUST-00001`, while `raw_orders.customer_id` is still INTEGER. `stg_customers` is a pass-through view, so it succeeded and its tests passed. `dim_customers` then joins `customers.customer_id` (VARCHAR) to `customer_orders.customer_id` (INTEGER). DuckDB implicitly casts the string to INT32 and fails on the first non-numeric value. Nothing changed in dbt code or in the order/payment data. The break is an upstream key-format change, and it also means customers and orders no longer share a key.\n\n### Fix\nDo not cast `'CUST-00001'` to an integer or wrap the join in `try_cast`. That would silently null the keys and produce a `dim_customers` with zero order history and zero lifetime value, which would be wrong on both dashboards.\n\n1. **Outside dbt (CRM/ingestion owners, CRM-77):** Establish how the new external reference keys map to the legacy integer customer IDs used by the web shop. Either the export should also carry the legacy integer ID (preferred; add it as a column in `raw_customers`), or the web shop and orders must be re-keyed. Until this is clarified, the key is undefined.\n2. **In dbt, once the mapping exists:** Keep `customer_id` as the integer legacy key throughout and expose the CRM key separately. Example, assuming the export gains a `legacy_customer_id` column:\n\n```sql\n-- models/staging/stg_customers.sql (relevant columns)\ncast(legacy_customer_id as integer) as customer_id,\ncustomer_id                         as crm_customer_key,\n```\n\nAdd `crm_customer_key` to `dim_customers` and `schema.yml`. `dim_customers.sql` itself then needs no change. If no legacy ID is available and a separate mapping table is needed, add it as a seed or source and join it in `stg_customers`.\n\n3. **Add a guard:** In `models/staging/schema.yml`, add a `not_null` and a relationships test from `stg_orders.customer_id` to `stg_customers.customer_id`, so a key mismatch fails at staging rather than in the mart. Consider an explicit cast/contract on `stg_customers.customer_id`.\n\n4. **Interim:** Because `dim_customers` is a table, the previous successful build is probably still being served (see assumptions). Tell Marketing and Finance that its data is stale (as of 2026-10-12) until the fix lands, and do not force a workaround build.\n\n### Verification\n```\ndbt build --select stg_customers+ \n```\nExpected: `dim_customers` builds, all its tests (unique, not_null on `customer_id`, not_null on `lifetime_value`) and the new relationships test pass, with the 6 previously skipped nodes now run.\n\nSanity-check the join actually matches:\n```sql\nselect count(*) as customers,\n       count(first_order_date) as with_orders,\n       sum(number_of_orders) as total_orders\nfrom dim_customers;\n\nselect count(*) from stg_orders o\nleft join stg_customers c using (customer_id)\nwhere c.customer_id is null;   -- expect 0\n```\nExpected: `with_orders` is close to yesterday's level, `total_orders` equals `count(*)` from `stg_orders`, and the orphan count is 0. Compare against yesterday's `dim_customers` row count and total `lifetime_value`.\n\n### Assumptions\n- The migration is the cause of the key change; I infer this from timing and the `CUST-` prefix, not from the CRM export itself.\n- A mapping from the new reference keys to legacy integer IDs exists or can be provided by the CRM team.\n- `raw_orders.customer_id` still uses the legacy integer IDs and the web shop has not changed.\n- The failed `dbt build` did not drop or replace the existing `dim_customers` table, so the dashboards are showing yesterday's data rather than erroring.\n- The source freshness check passing only shows data is recent, not that its format is valid."}, {"position": 73, "item_id": "RC02-04C", "is_repeat": 0, "scenario_id": "RC02", "label": "C", "group_pos": 1, "group_size": 6, "text": "### Root cause\n`stg_orders` contains too few or too many rows relative to the expected range of 500–1000 rows; the exact count is not shown, but the row-count test returned one failing row. Because `stg_payments` has 415 `order_id` values that do not exist in `stg_orders`, payments are being loaded for orders that are absent from the staged orders model.\n\nSource freshness passed for both `raw.raw_orders` and `raw.raw_payments`, so this is unlikely to be a late or stale ingestion issue. The most likely cause is that `stg_orders` is filtering out valid orders, using the wrong source/table, or otherwise transforming `raw.raw_orders` incorrectly, while `stg_payments` still includes payments for those orders.\n\n### Fix\nInspect and fix `models/staging/stg_orders.sql`, especially any `where` clause, join, deduplication, date filter, status filter, or cast on `order_id`.\n\nFor example, if `stg_orders` currently filters orders too narrowly, change it to stage all valid raw orders:\n\n```sql\n-- models/staging/stg_orders.sql\n\nselect\n    cast(order_id as varchar) as order_id,\n    cast(customer_id as varchar) as customer_id,\n    cast(order_created_at as timestamp) as order_created_at,\n    status,\n    loaded_at\nfrom {{ source('raw', 'raw_orders') }}\nwhere order_id is not null\n```\n\nAlso ensure `stg_payments.order_id` uses the same type and normalization as `stg_orders.order_id`:\n\n```sql\n-- models/staging/stg_payments.sql\n\nselect\n    cast(payment_id as varchar) as payment_id,\n    cast(order_id as varchar) as order_id,\n    cast(payment_created_at as timestamp) as payment_created_at,\n    amount,\n    status,\n    loaded_at\nfrom {{ source('raw', 'raw_payments') }}\nwhere payment_id is not null\n```\n\nIf the missing orders are actually absent from `raw.raw_orders` but present in the payment provider feed, the fix belongs outside dbt: repair the webshop ingestion job that loads `raw.raw_orders` so it includes all orders corresponding to `raw.raw_payments.order_id`.\n\nThe row-count test may also need review if the business volume has legitimately grown beyond 1000 orders. In that case, update the test threshold in the YAML file defining tests for `stg_orders`, likely `models/staging/schema.yml`:\n\n```yaml\nmodels:\n  - name: stg_orders\n    tests:\n      - row_count_between:\n          min_rows: 500\n          max_rows: 2000\n```\n\nDo not change the threshold merely to hide missing-parent relationship failures.\n\n### Verification\nFirst compare raw and staged counts:\n\n```sql\nselect 'raw_orders' as table_name, count(*) as n_rows from raw.raw_orders\nunion all\nselect 'stg_orders', count(*) from main.stg_orders\nunion all\nselect 'raw_payments', count(*) from raw.raw_payments\nunion all\nselect 'stg_payments', count(*) from main.stg_payments;\n```\n\nCheck the missing payment order IDs:\n\n```sql\nselect p.order_id, count(*) as n_payments\nfrom main.stg_payments p\nleft join main.stg_orders o\n  on p.order_id = o.order_id\nwhere p.order_id is not null\n  and o.order_id is null\ngroup by p.order_id\norder by n_payments desc;\n```\n\nAfter applying the fix, run:\n\n```bash\ndbt build --select stg_orders stg_payments+ --fail-fast\ndbt source freshness\n```\n\nExpected result: the `row_count_between` test on `stg_orders` passes, the `relationships` test on `stg_payments.order_id` returns 0 rows, and downstream models/tests are no longer skipped.\n\n### Assumptions\n- `stg_orders` is built from `source('raw', 'raw_orders')`.\n- `stg_payments` is built from `source('raw', 'raw_payments')`.\n- `main` is the target schema for dbt models in DuckDB.\n- Payment records should only reference orders that exist in `stg_orders`.\n- The 500–1000 row-count range is intended for the current scheduled run volume unless business growth has made it obsolete."}, {"position": 74, "item_id": "RC02-07C", "is_repeat": 0, "scenario_id": "RC02", "label": "C", "group_pos": 2, "group_size": 6, "text": "### Root cause\nThe orders ingestion config was changed today (commit 12cac3c, PR #88, ingestion-config repo) to `lookback_days: 60`. The orders extract now loads only the last 60 days instead of the full 180-day window. `raw.raw_orders` therefore dropped from ~597 to 209 rows. `raw.raw_payments` is unchanged (636 rows), so 415 payments now point at orders that are missing from `stg_orders`. This explains both failures: the row-count test (209 < 500) and the relationships test (415 orphan payments).\n\nNeither dbt model is wrong. Freshness passed because the newest rows are current; freshness cannot detect missing history. The failures also caused `dim_customers` and `fct_orders` to be skipped, so both marts (and the finance and marketing dashboards, notably the 07:00 UTC finance refresh) would be stale or built on an incomplete order set. `fct_orders`, `dim_customers` and the finance dashboard must not be fed from the truncated data.\n\n### Fix\n1. **Outside dbt, in the ingestion-config repo:** revert PR #88 (commit 12cac3c), restoring the orders extract to the full 180-day window (or a lookback of at least 180 days).\n2. **Backfill:** trigger a one-off full re-extract of orders for the last 180 days into `raw.raw_orders`. A config revert only affects future loads. If the loader replaces the table on each run, the next full run restores it. If it appends or upserts, the backfill is needed to restore the missing ~390 older orders. Make sure the load is idempotent on `order_id` so no duplicates arise (the `unique` test on `stg_orders.order_id` will catch them).\n3. **No change to dbt tests or models.** Do not loosen `row_count_between` or the `relationships` test; both correctly caught the problem. If a faster hourly load is still wanted, do it as an incremental load that keeps the full history (e.g. upsert recent changes on `order_id`), not a shorter extract window.\n4. Once raw data is restored, rerun the pipeline: `dbt build`. The skipped `dim_customers`, `fct_orders` and their 9 tests will then run.\n5. Optional follow-up: add a row-count or min(`order_date`) check on `source('raw','raw_orders')` so truncation is caught at the source, before the staging layer:\n\n```yaml\nsources:\n  - name: raw\n    tables:\n      - name: raw_orders\n        tests:\n          - row_count_between:\n              min_rows: 500\n              max_rows: 1000\n```\n\n### Verification\nCheck the raw history first:\n\n```sql\nselect count(*) as n_rows, min(order_date) as oldest, max(order_date) as newest\nfrom raw.raw_orders;\n-- expected: ~597+ rows, oldest ≈ 180 days ago\n\nselect count(*) from raw.raw_payments p\nleft join raw.raw_orders o using (order_id)\nwhere p.order_id is not null and o.order_id is null;\n-- expected: 0\n```\n\nThen run:\n\n```\ndbt build\ndbt source freshness\n```\n\nExpected: all tests pass, including `row_count_between` (500–1000) and the `relationships` test on `stg_payments.order_id`. `dim_customers` and `fct_orders` build with no skips. `fct_orders` has the same row count as `stg_orders`. Before the finance stand-up, confirm the finance dashboard totals match yesterday's trend.\n\n### Assumptions\n- The 180-day window is the intended extract scope; `lookback_days: 60` was not meant to shorten history.\n- The extract replaces or overwrites the `raw_orders` contents rather than only appending; either way a backfill is the safe path.\n- The source system still holds the full 180 days of order data, so it can be re-extracted.\n- The ~415 orphan payments are exactly the orders older than 60 days (inferred from the timing and the row counts, not verified).\n- No other changes occurred to the connector or payments extract today (none are listed in the history)."}, {"position": 75, "item_id": "RC02-03C", "is_repeat": 0, "scenario_id": "RC02", "label": "C", "group_pos": 3, "group_size": 6, "text": "### Root cause\n`stg_orders` is a plain pass-through view over `raw.raw_orders`, so its row count and its set of order_ids reflect whatever the raw table contains. The row-count test reports that `stg_orders` now has fewer than 500 or more than 1,000 rows (the report says only that the count is out of range, not which side). The orphaned payments (415 of them) point to `stg_orders` missing orders that `stg_payments` still references, so the likeliest exp
