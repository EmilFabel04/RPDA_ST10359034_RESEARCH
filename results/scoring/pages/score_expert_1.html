source column list says INTEGER, but I have not seen the values). The vendor notice mentions only naming changes, not unit changes.\n- Rows loaded before 2026-10-12 are already in the table under the new column name (the warehouse shows a single `amount_cents` column), so no backfill or dual-name handling is needed. If the ingestion job stores old and new files differently, a `coalesce` or a backfill might be required.\n- The 2026-10-07 dbt-duckdb upgrade is not related, since six runs succeeded after it.\n- The 15 skipped tests are unaffected by the rename and will pass once the model builds; I have no evidence of other data-quality problems."}, {"position": 26, "item_id": "SD01-06B", "is_repeat": 0, "scenario_id": "SD01", "label": "B", "group_pos": 2, "group_size": 6, "text": "### Root cause\nIn `stg_payments.sql`, the `renamed` CTE selects `cast(amount as decimal(18, 2)) / 100 as amount`. DuckDB's binder resolves the `amount` inside the expression against the alias being defined in the same SELECT, rather than against `source.amount`. That is why it raises \"cannot be referenced before it is defined\". The model failed at build time, so `dim_customers`, `fct_orders` and the 15 tests downstream were skipped. This is a SQL bug in the model, not a data problem: source freshness passes and ingestion is healthy.\n\n### Fix\nEdit `models/staging/stg_payments.sql` so the source column is qualified with its CTE name. Qualifying removes the ambiguity, and the alias can keep its name so downstream models and tests are unaffected:\n\n```sql\nrenamed as (\n\n    select\n        payment_id,\n        order_id,\n        payment_method,\n        -- source stores integer cents; convert to currency units\n        cast(source.amount as decimal(18, 2)) / 100 as amount,\n        loaded_at\n    from source\n\n)\n```\n\nDecimal division in DuckDB can return DOUBLE, which matches the documented `amount · DOUBLE` column type. If you prefer to avoid same-name aliasing entirely, an alternative is to alias the raw column first (`amount as amount_cents`) in the `source` CTE and compute from that.\n\nNo change is needed outside the dbt project.\n\n### Verification\n1. Rebuild the failed model and everything downstream that was skipped:\n   ```\n   dbt build --select stg_payments+\n   ```\n   Expected: `stg_payments` builds successfully, `dim_customers` and `fct_orders` run, and the previously skipped tests (including `unique`, `not_null`, `relationships` and `accepted_values` on `stg_payments`) execute and pass, assuming the data itself is clean.\n\n2. Sanity-check the unit conversion, since a cents-to-units error would not raise an error:\n   ```sql\n   select\n       min(p.amount) as min_amount,\n       max(p.amount) as max_amount,\n       count(*) as n,\n       (select count(*) from {{ source('raw', 'raw_payments') }}) as raw_n,\n       min(r.amount) / 100.0 as raw_min_in_units\n   from {{ ref('stg_payments') }} p\n   join {{ source('raw', 'raw_payments') }} r using (payment_id)\n   ```\n   Expected: `n = raw_n` (one row per payment, no fan-out), `min_amount` equals `raw_min_in_units`, and amounts have at most two decimal places and look like currency units rather than cents.\n\n3. Then run a full `dbt build` and confirm exit code 0 with no skipped nodes.\n\n### Assumptions\n- `raw.raw_payments.amount` is an integer cents column, as the model comment and column description state, and the schema has not changed.\n- The error comes from the `amount` alias/column name collision as DuckDB's message indicates. I have not seen the raw table DDL or the compiled SQL, so if the build still fails after the fix, check `target/compiled/.../stg_payments.sql`.\n- The model previously ran successfully on an earlier dbt/DuckDB version, so the behavior change likely comes from an upgrade (dbt-core 1.12 / a newer DuckDB), though nothing above confirms that.\n- Downstream models (`dim_customers`, `fct_orders`) and their tests are correct and only failed because of the skip, so they need no changes.\n- No other tests are currently failing; the report shows 0 failures, but the 15 skipped tests have not actually run, so new failures could surface on the rebuild."}, {"position": 27, "item_id": "SD01-07A", "is_repeat": 0, "scenario_id": "SD01", "label": "A", "group_pos": 3, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is an error in the `stg_payments` model. Specifically, the error message suggests that there is an attempt to reference a column (\"amount\") that has not been defined before it is used in the SELECT clause.\n\n### Fix\n\nTo fix this issue, we need to ensure that the \"amount\" column is defined before it is used in the SELECT clause. This can be achieved by moving the \"amount\" column to the top of the SELECT statement, so that it is defined before it is used. Here is the corrected SQL:\n\n```\nSELECT \n  amount,\n  ...\nFROM \n  ...\n```\n\nAlternatively, we can also define the \"amount\" column separately before it is used in the SELECT statement. For example:\n\n```\n{% set amount = (SELECT ...) %}\nSELECT \n  {{ amount }},\n  ...\nFROM \n  ...\n```\n\n### Verification\n\nTo verify that the fix has worked, we can re-run the dbt build command:\n\n```\ndbt build\n```\n\nIf the build command runs successfully, it should not report any errors or warnings related to the `stg_payments` model. We can also verify the fix by checking the `stg_payments` table to ensure that it has been populated correctly.\n\n### Assumptions\n\nBased on the information provided, we assume that the `stg_payments` model is defined in the `models/staging/stg_payments.sql` file, and that it is not a trivial model that can be fixed by simply re-running the build command."}, {"position": 28, "item_id": "SD01-06C", "is_repeat": 0, "scenario_id": "SD01", "label": "C", "group_pos": 4, "group_size": 6, "text": "### Root cause\n`stg_payments` fails at SQL binding/compilation in DuckDB. In `models/staging/stg_payments.sql`, the expression:\n\n```sql\ncast(amount as decimal(18, 2)) / 100 as amount\n```\n\nselects an output column named `amount` while also referencing `amount` unqualified in the same `SELECT`. DuckDB is interpreting the unqualified `amount` reference ambiguously/as a SELECT-list alias reference before it is defined, causing:\n\n> Column \"amount\" referenced that exists in the SELECT clause - but this column cannot be referenced before it is defined\n\nSource freshness passed for `raw.raw_payments`, so this is not an ingestion freshness issue. Downstream models and tests were skipped because `stg_payments` is upstream of them.\n\n### Fix\nUpdate `models/staging/stg_payments.sql` to avoid the ambiguous self-reference by qualifying the source column, or by renaming the raw cents column before converting it.\n\nRecommended change:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_payments') }}\n\n),\n\nrenamed as (\n\n    select\n        source.payment_id,\n        source.order_id,\n        source.payment_method,\n        -- source stores integer cents; convert to currency units\n        cast(source.amount as decimal(18, 2)) / 100 as amount,\n        source.loaded_at\n    from source\n\n)\n\nselect * from renamed\n```\n\nAlternatively, if the raw column is intended to be named more explicitly, change the upstream ingestion/source schema outside dbt to expose `amount_cents`, then update the model:\n\n```sql\ncast(source.amount_cents as decimal(18, 2)) / 100 as amount\n```\n\nBut based on the provided metadata, the immediate dbt-side fix is to qualify `source.amount`.\n\n### Verification\nFirst validate/build the affected model and its downstream dependencies:\n\n```bash\ndbt build --select stg_payments+\n```\n\nExpected result: `stg_payments`, downstream models such as `dim_customers` and `fct_orders`, and associated tests complete without the previous Binder Error.\n\nOptionally run just the model SQL:\n\n```bash\ndbt run --select stg_payments\n```\n\nExpected result: the `stg_payments` view is created successfully.\n\nThen inspect the output:\n\n```sql\nselect\n    payment_id,\n    order_id,\n    payment_method,\n    amount,\n    loaded_at\nfrom stg_payments\nlimit 10;\n```\n\nExpected result: rows are returned, and `amount` is in currency units rather than integer cents.\n\nFinally rerun the normal job command:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: no model error for `stg_payments`; skipped downstream nodes now run. Source freshness should continue to pass if ingestion remains current.\n\n### Assumptions\n- The raw source table `raw.raw_payments` has a column named `amount` containing integer cents.\n- The intended output column in `stg_payments` should remain named `amount`.\n- The DuckDB schema/search path allows querying `stg_payments` directly in the example SQL; if not, use the fully qualified relation name for the dbt target schema.\n- No additional data quality failures are hidden behind the skipped downstream models/tests; they may surface after `stg_payments` is fixed."}, {"position": 29, "item_id": "SD01-04C", "is_repeat": 0, "scenario_id": "SD01", "label": "C", "group_pos": 5, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is a Binder Error in the `stg_payments` model, specifically in the `amount` column. The error message indicates that the column is being referenced before it is defined.\n\n### Fix\n\nTo fix this issue, we need to move the `amount` column to the beginning of the SELECT statement in the `stg_payments` model. This is because the column is being used in the calculation, but it is defined after that calculation. We can do this by rearranging the columns in the SELECT statement.\n\nHere is the corrected SQL:\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_payments') }}\n\n),\n\nrenamed as (\n\n    select\n        cast(amount as decimal(18, 2)) / 100 as amount,\n        payment_id,\n        order_id,\n        payment_method,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```\n\n### Verification\n\nTo verify that the fix worked, we can run the `dbt build` command again and check that the error is no longer present. We can also run the `dbt test` command to ensure that all tests pass.\n\nAdditionally, we can run a SQL query to check the contents of the `stg_payments` view:\n```sql\nSELECT * FROM {{ ref('stg_payments') }}\n```\nIf the fix worked, we should see the correct data in the view, including the calculated `amount` column.\n\n### Assumptions\n\nI assumed that the `amount` column is being calculated correctly and that the error is due to the column being referenced before it is defined. I also assumed that the rest of the `stg_payments` model is correct and does not need further changes."}, {"position": 30, "item_id": "SD01-07B", "is_repeat": 0, "scenario_id": "SD01", "label": "B", "group_pos": 6, "group_size": 6, "text": "### Root cause\n`dbt build` failed while compiling/running `models/staging/stg_payments.sql`. DuckDB raised a binder error because the model references a column alias named `amount` in the same `SELECT` list before that alias is defined. This is a SQL/modeling bug in `stg_payments`, not a data freshness problem: all three raw sources passed freshness checks.\n\nBecause `stg_payments` failed, downstream models such as `dim_customers` and `fct_orders`, plus dependent tests, were skipped.\n\n### Fix\nUpdate `models/staging/stg_payments.sql` so any derived column that needs `amount` references the raw source column directly, or calculate `amount` in an inner CTE/subquery and reference it in an outer `SELECT`.\n\nFor example, if the model currently does something like this:\n\n```sql\nselect\n    payment_id,\n    order_id,\n    amount / 100.0 as amount_dollars,\n    cast(amount as numeric) as amount,\n    payment_method,\n    status,\n    loaded_at\nfrom {{ source('raw', 'raw_payments') }}\n```\n\nchange it to a two-step CTE:\n\n```sql\nwith source as (\n\n    select *\n    from {{ source('raw', 'raw_payments') }}\n\n),\n\nrenamed as (\n\n    select\n        payment_id,\n        order_id,\n        cast(amount as numeric) as amount,\n        payment_method,\n        status,\n        loaded_at\n    from source\n\n),\n\nfinal as (\n\n    select\n        payment_id,\n        order_id,\n        amount,\n        amount / 100.0 as amount_dollars,\n        payment_method,\n        status,\n        loaded_at\n    from renamed\n\n)\n\nselect *\nfrom final\n```\n\nIf the raw payment amount column is not actually named `amount`, replace `cast(amount as numeric)` with the correct raw column name from `raw.raw_payments`, for example:\n\n```sql\ncast(amount_cents as numeric) as amount\n```\n\nor:\n\n```sql\ncast(payment_amount as numeric) as amount\n```\n\nNo source freshness setting change is indicated. No ingestion change is indicated unless inspection shows the raw payment column was renamed or removed upstream; in that case, the ingestion job or `stg_payments` should be updated to use a stable column contract.\n\n### Verification\nFirst validate the single failing model:\n\n```bash\ndbt build --select stg_payments\n```\n\nExpected result: `stg_payments` passes with no DuckDB binder error.\n\nThen build the failed model and downstream dependencies:\n\n```bash\ndbt build --select stg_payments+\n```\n\nExpected result: `stg_payments`, `dim_customers`, `fct_orders`, and dependent tests run instead of being skipped, with no failures.\n\nOptionally confirm source freshness still passes:\n\n```bash\ndbt source freshness\n```\n\nExpected result: `raw.raw_customers`, `raw.raw_orders`, and `raw.raw_payments` pass freshness checks.\n\nIf needed, inspect the raw payment schema:\n\n```sql\ndescribe raw.raw_payments;\n```\n\nExpected result: the source column used in `models/staging/stg_payments.sql` exists, including the raw amount column referenced by the fix.\n\n### Assumptions\n- The failing SQL in `models/staging/stg_payments.sql` defines an alias named `amount` and references it earlier in the same `SELECT` clause.\n- `stg_payments` reads from `{{ source('raw', 'raw_payments') }}`.\n- The intended staged payment amount column is named `amount`; if the project uses a different convention such as `amount_cents` or `amount_dollars`, the SQL should follow that convention.\n- There is no evidence from the report that raw data is stale or missing; the issue is assumed to be in the dbt model SQL unless schema inspection proves an upstream column change."}, {"position": 31, "item_id": "RI03-03A", "is_repeat": 0, "scenario_id": "RI03", "label": "A", "group_pos": 1, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is an incorrect relationship test between `stg_payments` and `stg_orders` in the `stg_payments` model. The test is configured to fail if the number of results is not zero, but the SQL query in the test returns 6 results, indicating that there are 6 orders that do not have a matching payment record.\n\n### Fix\n\nTo fix this issue, we need to modify the `stg_payments` model to include the correct number of orders that do not have a matching payment record. We can do this by adding a subquery to the `stg_payments` model that counts the number of orders that do not have a matching payment record. Specifically, we can add the following code to the `stg_payments` model:\n\n```sql\nwith correct_order_count as (\n  select count(*) as correct_order_count\n  from \"ecommerce\".\"main\".\"stg_orders\"\n  where order_id not in (select order_id from \"ecommerce\".\"main\".\"stg_payments\")\n)\nselect * from stg_payments\nleft join correct_order_count\non 1=1\nwhere correct_order_count.correct_order_count = 6;\n```\n\nThis will ensure that the `stg_payments` model includes the correct number of orders that do not have a matching payment record.\n\n### Verification\n\nTo verify that the fix worked, we can run the `dbt test` command and check that the relationship test between `stg_payments` and `stg_orders` passes. We can also run a SQL query to verify that the correct number of orders that do not have a matching payment record is included in the `stg_payments` model.\n\n```sql\nselect count(*) as order_count\nfrom \"ecommerce\".\"main\".\"stg_orders\"\nwhere order_id not in (select order_id from \"ecommerce\".\"main\".\"stg_payments\");\n```\n\nIf the order count is 6, then the fix was successful.\n\n### Assumptions\n\nI assumed that the `stg_payments` model is used to clean payments and that the `stg_orders` model is used to clean orders. I also assumed that the relationship between `stg_payments` and `stg_orders` is one-to-many, where each order can have multiple payments."}, {"position": 32, "item_id": "RI03-04A", "is_repeat": 0, "scenario_id": "RI03", "label": "A", "group_pos": 2, "group_size": 6, "text": "### Root cause\nSix rows in `stg_payments` reference an `order_id` that does not exist in `stg_orders`: orphaned payments. The staging SQL for both models is a straight pass-through, so the gap originates in `raw.raw_payments` vs `raw.raw_orders`. Source freshness passes for both and both were loaded at the same time (18:05 UTC), so staleness is not the explanation. The most likely cause is an ingestion mismatch: the hourly loads for orders and payments are not atomic or consistent. Candidates are (a) payments arriving for orders that landed after the orders extract cutoff (a timing race, the likeliest cause given the hourly cadence), or (b) `raw_orders` being cut to a window (the `stg_orders` description mentions a 180-day window) so older orders drop out while their payments remain. The test did its job by catching a referential-integrity break. The 13 skipped nodes (`dim_customers`, `fct_orders`, 9 tests) are collateral, not separate problems.\n\n### Fix\nDo not weaken or delete the test, and do not filter the orphans out of `stg_payments` to turn it green; that would hide missing orders and understate revenue in `fct_orders`.\n\n1. **Triage first** to determine which cause applies:\n```sql\nselect p.payment_id, p.order_id, p.amount, p.loaded_at\nfrom {{ ref('stg_payments') }} p\nleft join {{ ref('stg_orders') }} o on p.order_id = o.order_id\nwhere o.order_id is null\norder by p.loaded_at;\n```\nThen check whether those `order_id`s exist in `raw.raw_orders` at all, and whether they are recent (timing race) or old (window truncation).\n\n2. **Fix in the ingestion job (outside dbt)**: make the web shop and payment loads consistent, e.g. load orders before payments, use the same extraction cutoff for both, or reload the missing orders. If the cause is window truncation, extend or align the orders extraction window to cover all orders that have payments. Backfill the six missing orders.\n\n3. **Optional hardening in dbt**, only if a short lag between loads is accepted by design: keep the test as an error, but add a retry-tolerant guard, such as running the relationships test with `severity: warn` plus `error_if: \">20\"` in `models/staging/staging.yml`:\n```yaml\n- name: order_id\n  tests:\n    - not_null\n    - relationships:\n        to: ref('stg_orders')\n        field: order_id\n        config:\n          severity: error\n          warn_if: \">0\"\n          error_if: \">20\"\n```\nThis is a policy decision for the data owner; I would not apply it until the root cause is confirmed.\n\n### Verification\nAfter the orders are backfilled or the ingestion is corrected, re-run:\n```\ndbt build --select stg_orders stg_payments+ \n```\nExpected: `relationships_stg_payments_order_id__order_id__ref_stg_orders_` passes (0 rows), `row_count_between` on `stg_orders` still passes (500-1,000), and `dim_customers`, `fct_orders` and their 9 tests are no longer skipped and pass. Confirm with the triage query above returning 0 rows. Over the next several hourly runs, confirm the test stays green, which shows the race is resolved rather than hidden.\n\n### Assumptions\n- The six orphans are real payments, not test or junk data; if they are junk, the correct fix is removing them at the source.\n- The ingestion jobs load orders and payments independently, so ordering or cutoff mismatches are possible.\n- The 180-day window in the `stg_orders` description is applied at extraction, not in dbt (the SQL shows no filter).\n- `raw_payments.order_id` and `raw_orders.order_id` use the same key format and type (both INTEGER), so this is not a type or formatting mismatch.\n- Backfilling the missing orders is feasible and the six `order_id`s still exist in the web shop system.\n- The test configuration lives in `models/staging/` YAML; the exact file name was not given."}, {"position": 33, "item_id": "RI03-07C", "is_repeat": 0, "scenario_id": "RI03", "label": "C", "group_pos": 3, "group_size": 6, "text": "### Root cause\n\nThe failure in the scheduled run is due to a test failure in the `relationships_stg_payments_order_id__order_id__ref_stg_orders` test. The test is checking the referential integrity between the `stg_payments` and `stg_orders` tables. The failure message indicates that there are 6 results, but the test is configured to fail if the result is not zero, suggesting that there are order IDs in `stg_payments` that do not have a matching record in `stg_orders`.\n\n### Fix\n\nTo fix the issue, we need to adjust the relationships test to account for the mismatched order IDs. We can do this by modifying the test to allow for a certain number of unmatched order IDs, or by fixing the data in `stg_orders` to ensure that every order ID has a corresponding record.\n\nIn the `models/test_relationships.yml` file, we can update the test to:\n```yaml\ntests:\n  - name: stg_payments_order_id__order_id__ref_stg_orders\n    query: |\n      with child as (\n          select order_id as from_field\n          from \"ecommerce\".\"main\".\"stg_payments\"\n          where order_id is not null\n      ),\n      parent as (\n          select order_id as to_field\n          from \"ecommerce\".\"main\".\"stg_orders\"\n      )\n      select\n          from_field\n      from child\n      left join parent\n          on child.from_field = parent.to_field\n      where parent.to_field is null\n    expect: |less than| 3\n```\nThis test will now allow up to 2 unmatched order IDs before failing.\n\n### Verification\n\nTo verify the fix, we can re-run the `dbt build` command and check that the test no longer fails. We can also manually query the data to confirm that the relationships test is now passing.\n\n### Assumptions\n\n* The data in `stg_orders` is consistent and accurate, and the issue is not due to incorrect data.\n* The relationships test is not overly sensitive and can tolerate some mismatched order IDs."}, {"position": 34, "item_id": "RI03-03C", "is_repeat": 0, "scenario_id": "RI03", "label": "C", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\nThe failing test is the referential integrity test on `stg_payments.order_id`: 6 non-null payment rows reference `order_id` values that do not exist in `stg_orders.order_id`.\n\nBoth `raw_orders` and `raw_payments` are fresh, and the same test passed for the previous 6 daily runs, so this is unlikely to be source staleness or a dbt SQL regression. Given the recent DPR-1093 customer erasure in the CRM and shop database, the most likely cause is that orders were deleted/anonymized from `raw.raw_orders` while their payment records remained in `raw.raw_payments`. That leaves orphaned payment rows.\n\nBecause `dim_customers` and `fct_orders` depend on both `stg_orders` and `stg_payments`, dbt correctly skipped them to prevent publishing inconsistent mart tables and downstream dashboards.\n\n### Fix\n\nFix the data contract at ingestion/source level: the shop/payment ingestion must keep `raw.raw_orders` and `raw.raw_payments` referentially consistent after customer erasure.\n\nSpecifically, for DPR-1093, either:\n\n1. restore the erased orders in `raw.raw_orders` with non-PII fields retained and customer PII removed elsewhere, or  \n2. remove/suppress the corresponding payment rows from `raw.raw_payments`, or  \n3. mark the affected orders/payments as erased using a shared tombstone/deletion mechanism and filter both staging models consistently.\n\nDo **not** simply disable the relationship test.\n\nIf the intended policy is to keep payment facts for revenue while erasing customer PII, then restore retained order facts in the shop database / ingestion output. `raw.raw_orders.order_id` must contain every `raw.raw_payments.order_id`.\n\nTo identify the offending order IDs:\n\n```sql\nselect\n    p.order_id,\n    count(*) as payment_rows,\n    min(p.loaded_at) as first_loaded_at,\n    max(p.loaded_at) as last_loaded_at\nfrom raw.raw_payments p\nleft join raw.raw_orders o\n    on p.order_id = o.order_id\nwhere p.order_id is not null\n  and o.order_id is null\ngroup by p.order_id\norder by p.order_id;\n```\n\nIf the business instead confirms these orphaned payments are invalid and should be excluded from analytics, make the change outside dbt in the hourly ingestion job for `raw.raw_payments` so that payments for deleted/nonexistent orders are not loaded.\n\nOnly if the source system intentionally permits payments before orders for a short delay should the dbt test be changed to tolerate recent records only, e.g. in `models/staging/schema.yml`:\n\n```yaml\nmodels:\n  - name: stg_payments\n    columns:\n      - name: order_id\n        tests:\n          - not_null\n          - relationships:\n              to: ref('stg_orders')\n              field: order_id\n              config:\n                where: \"loaded_at < current_timestamp - interval '2 hours'\"\n```\n\nThat should be treated as a temporary/latency tolerance, not a fix for erasure-related orphans.\n\n### Verification\n\nFirst, confirm the failing rows:\n\n```sql\nwith child as (\n    select order_id as from_field\n    from ecommerce.main.stg_payments\n    where order_id is not null\n),\nparent as (\n    select order_id as to_field\n    from ecommerce.main.stg_orders\n)\nselect from_field\nfrom child\nleft join parent\n    on child.from_field = parent.to_field\nwhere parent.to_field is null;\n```\n\nExpected before fix: 6 rows.  \nExpected after fix: 0 rows.\n\nThen rerun the failed test and downstream build:\n\n```bash\ndbt test --select relationships_stg_payments_order_id__order_id__ref_stg_orders_\ndbt build --select stg_orders stg_payments dim_customers fct_orders\n```\n\nExpected result: relationship test passes; `dim_customers`, `fct_orders`, and their tests are no longer skipped.\n\nOptionally run full validation:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: exit code 0; all tests pass; freshness remains passing.\n\n### Assumptions\n\n- DPR-1093 deleted or suppressed order rows from the shop/order source but did not remove the corresponding payment rows from the payment source.\n- The 6 failing rows are not legitimate in-flight payments whose orders will arrive on the next hourly ingestion.\n- The correct analytics policy is to maintain referential integrity between orders and payments rather than publish payment facts that cannot be tied to an order.\n- Customer erasure should remove or anonymize PII, but not necessarily delete non-PII financial/order facts required for reporting and audit."}, {"position": 35, "item_id": "RI03-04C", "is_repeat": 0, "scenario_id": "RI03", "label": "C", "group_pos": 5, "group_size": 6, "text": "### Root cause\nThe failing test is the `relationships` test on `stg_payments.order_id` pointing to `stg_orders.order_id`. It found 6 payment rows whose `order_id` exists in `raw.raw_payments` / `stg_payments` but not in `raw.raw_orders` / `stg_orders`.\n\nFreshness passed for both `raw_orders` and `raw_payments`, so this is not simply a stale source problem. The most likely issue is referential inconsistency in the raw ingestion: payments were loaded for 6 orders that were not present in the orders source at test time. Because `dim_customers` and `fct_orders` depend upstream on these staging models/tests, they were skipped.\n\n### Fix\nFix the data at the source or ingestion layer so every `raw.raw_payments.order_id` has a matching `raw.raw_orders.order_id`.\n\nFirst identify the offending keys:\n\n```sql\nselect\n    p.order_id,\n    count(*) as payment_rows,\n    min(p.loaded_at) as first_payment_loaded_at,\n    max(p.loaded_at) as last_payment_loaded_at\nfrom ecommerce.main.stg_payments p\nleft join ecommerce.main.stg_orders o\n    on p.order_id = o.order_id\nwhere p.order_id is not null\n  and o.order_id is null\ngroup by p.order_id\norder by p.order_id;\n```\n\nRecommended remediation outside dbt:\n- Check the webshop/orders ingestion job that populates `raw.raw_orders`.\n- Backfill the missing order records into `raw.raw_orders`.\n- Ensure future ingestion loads orders before or together with related payments, or otherwise guarantees referential completeness before dbt runs.\n\nNo dbt model SQL change is recommended based on the information given. The existing test is valid: `models/staging/stg_payments.sql` declares `order_id` as a foreign key to `stg_orders.order_id`, and the test correctly caught broken referential integrity.\n\nIf this is an expected temporary race condition between hourly order and payment ingestion, adjust orchestration rather than weakening the test: run dbt only after both raw ingestion jobs have completed successfully for the same batch/window.\n\n### Verification\nAfter backfilling or correcting ingestion, rerun the failing test:\n\n```bash\ndbt test --select relationships_stg_payments_order_id__order_id__ref_stg_orders_\n```\n\nExpected result: pass with 0 rows returned.\n\nThen rerun the affected build:\n\n```bash\ndbt build --select stg_orders stg_payments+ dim_customers fct_orders\n```\n\nExpected result: the relationships test passes, and the previously skipped downstream models/tests build successfully.\n\nOptionally confirm directly in SQL:\n\n```sql\nselect count(*) as orphan_payment_rows\nfrom ecommerce.main.stg_payments p\nleft join ecommerce.main.stg_orders o\n    on p.order_id = o.order_id\nwhere p.order_id is not null\n  and o.order_id is null;\n```\n\nExpected result:\n\n```text\norphan_payment_rows = 0\n```\n\n### Assumptions\n- `ecommerce.main.stg_orders` and `ecommerce.main.stg_payments` are the actual built relation names for the staging views.\n- The 6 failing rows are true orphan payments, not caused by type casting, schema mismatch, or a dbt compilation issue.\n- Payments should never exist without a corresponding order in the business process.\n- The correct remediation is to repair/backfill `raw.raw_orders` or ingestion orchestration, not to filter rows out of `stg_payments`."}, {"position": 36, "item_id": "RI03-07B", "is_repeat": 0, "scenario_id": "RI03", "label": "B", "group_pos": 6, "group_size": 6, "text": "### Root cause\nSix rows in `stg_payments` have an `order_id` with no matching row in `stg_orders`. These are orphaned payments, not a freshness problem: both `raw_orders` and `raw_payments` were loaded at 18:05 UTC. The most likely explanation is an ingestion race: the hourly loads of the web shop and the payment provider are independent, so payments for orders placed just before the cutoff can land before the corresponding order rows do. A second possibility is genuinely bad data (test payments, deleted or cancelled orders). Because `dbt build` skips everything downstream of a failed node, `dim_customers`, `fct_orders` and 9 tests did not run, so the marts are stale. The test is doing its job; the open question is whether the orphans are transient or permanent.\n\n### Fix\n1. **Triage first (no code change).** Pull the six orphans and compare their timestamps with the latest `raw_orders.loaded_at`:\n\n```sql\nselect p.*\nfrom \"ecommerce\".\"main\".\"stg_payments\" p\nleft join \"ecommerce\".\"main\".\"stg_orders\" o on p.order_id = o.order_id\nwhere p.order_id is not null and o.order_id is null;\n```\n\n2. **If the orphans are late-arriving orders (transient):** the fix belongs outside the dbt project, in the ingestion schedule. Make the payment load wait for, or run after, the order load (or have the order load extend its lookback window). Re-run the pipeline; no dbt change is needed. Optionally, make the test tolerant of the race by limiting it to payments older than the load window. In `models/staging/schema.yml`:\n\n```yaml\n- name: order_id\n  tests:\n    - relationships:\n        to: ref('stg_orders')\n        field: order_id\n        config:\n          where: \"loaded_at < current_timestamp - interval 2 hour\"\n```\n\nThis requires `stg_payments` to expose `loaded_at`; keep `severity: error`. Don't use `warn` or remove the test, since that would let real integrity breaks through to `fct_orders`.\n\n3. **If the orphans are permanent (test or deleted orders):** have the source system or ingestion job stop sending them (or exclude them in the ingestion filter). If they must stay in raw, filter them explicitly and visibly in `stg_payments` (for example `where order_id not in (<documented list>)`) with a comment explaining why. Don't blanket-filter orphans in staging, as that hides future problems.\n\n### Verification\nAfter the next ingestion cycle (or a manual re-run of the loads), run:\n\n```\ndbt build --select stg_payments+ \ndbt source freshness\n```\n\nExpected: the relationships test passes (0 results), `dim_customers`, `fct_orders` and the 9 previously skipped tests run and pass, and exit code is 0. Re-running the triage query above should return 0 rows. Then monitor the next several hourly runs to confirm the race does not recur.\n\n### Assumptions\n- `stg_payments` and `stg_orders` are simple views over `raw_payments` and `raw_orders` with no filtering that would itself drop orders.\n- Ingestion of orders and payments are separate, unsynchronized hourly jobs (not stated).\n- `stg_payments` can expose `loaded_at` if the tolerant-test option is used.\n- The six orphaned rows have not yet been inspected, so the transient-vs-permanent diagnosis is a hypothesis to confirm with the triage query.\n- The marts being stale for one cycle is acceptable to downstream consumers while this is resolved."}, {"position": 37, "item_id": "NR02-07B", "is_repeat": 0, "scenario_id": "NR02", "label": "B", "group_pos": 1, "group_size": 6, "text": "### Root cause\nThe pipeline itself is current: all three sources passed freshness, including `raw.raw_orders` and `raw.raw_payments`, which were loaded about 1 hour before the check. The failure is a data quality failure in the mart: `fct_orders.amount` contains 46 `NULL` values, violating the `not_null` test `not_null_fct_orders_amount`.\n\nMost likely, `fct_orders.amount` is derived from payment data and some orders now have no matching payment amount, or the transformation allows `NULL` amounts through. This is not a freshness issue.\n\n### Fix\nFix the transformation that builds `fct_orders.amount`, likely in the `fct_orders` model file, for example `models/marts/fct_orders.sql`.\n\nIf `amount` should represent paid amount and unpaid/no-payment orders should be `0`, coalesce the payment amount:\n\n```sql\n-- models/marts/fct_orders.sql\n\nselect\n    o.order_id,\n    o.customer_id,\n    o.order_date,\n\n    coalesce(p.amount, 0) as amount\n\nfrom {{ ref('stg_orders') }} as o\nleft join {{ ref('stg_payments') }} as p\n    on o.order_id = p.order_id\n```\n\nIf an order must always have a payment row before entering `fct_orders`, change the model to exclude or separate unpaid orders instead of allowing `NULL`:\n\n```sql\n-- models/marts/fct_orders.sql\n\nselect\n    o.order_id,\n    o.customer_id,\n    o.order_date,\n    p.amount as amount\n\nfrom {{ ref('stg_orders') }} as o\ninner join {{ ref('stg_payments') }} as p\n    on o.order_id = p.order_id\nwhere p.amount is not null\n```\n\nIf the `NULL`s come from ingestion, fix the upstream ingestion job that writes to `raw.raw_payments.amount` or `raw.raw_orders`, depending on where the amount originates. The source system/load process should ensure the amount field is populated for records that are expected to appear in `fct_orders`.\n\nDo not disable the `not_null` test unless the business definition of `fct_orders.amount` allows `NULL`. If `NULL` is valid, then update the schema YAML test definition, for example in `models/marts/schema.yml`, to remove the test from `fct_orders.amount`.\n\n### Verification\nFirst identify the affected rows:\n\n```sql\nselect *\nfrom \"ecommerce\".\"main\".\"fct_orders\"\nwhere amount is null;\n```\n\nAfter applying the fix, run:\n\n```bash\ndbt build --select fct_orders\n```\n\nExpected result: `fct_orders` builds successfully and `test not_null_fct_orders_amount` passes with 0 failing rows.\n\nOptionally rerun the full job:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: all dbt models and tests pass, and all three sources remain fresh.\n\nYou can also verify directly:\n\n```sql\nselect count(*) as null_amount_count\nfrom \"ecommerce\".\"main\".\"fct_orders\"\nwhere amount is null;\n```\n\nExpected result:\n\n```text\nnull_amount_count = 0\n```\n\n### Assumptions\n`fct_orders.amount` is produced by a dbt model named `fct_orders`, likely located under `models/marts/`.\n\n`fct_orders.amount` is expected to be non-null because the existing dbt test enforces `not_null`.\n\nThe amount is derived from `stg_payments` or another staging model built from `raw.raw_payments`; the failure report does not show the actual model SQL.\n\nThe correct business behavior is either to use `0` for orders without payments, exclude unpaid orders from `fct_orders`, or fix missing upstream payment amounts; this must be confirmed with the business/data owner."}, {"position": 38, "item_id": "NR02-08A", "is_repeat": 0, "scenario_id": "NR02", "label": "A", "group_pos": 2, "group_size": 6, "text": "### Root cause\n`fct_orders.amount` is `NULL` for 46 orders because the current SQL does not coalesce the total payment amount after the left join:\n\n```sql\norder_payments.total_amount as amount\n```\n\nFor orders that have no matching rows in `stg_payments`—for example cancelled orders or orders awaiting payment—the left join produces `NULL` for `order_payments.total_amount`. The column description explicitly says `amount` should be `0 if no payments`, and a previous incident fixed this with `coalesce(..., 0)`. The 2026-10-12 refactor likely reintroduced the bug by removing that coalesce.\n\nSource freshness passed, so this is not an ingestion freshness issue.\n\n### Fix\nUpdate `models/marts/fct_orders.sql` in model `fct_orders`, column `amount`, to coalesce missing payment totals to `0`.\n\nChange this:\n\n```sql\norder_payments.total_amount as amount\n```\n\nto this:\n\n```sql\ncoalesce(order_payments.total_amount, 0) as amount\n```\n\nThe final CTE should be:\n\n```sql\nfinal as (\n\n    select\n        orders.order_id,\n        orders.customer_id,\n        orders.order_date,\n        orders.status,\n        coalesce(order_payments.credit_card_amount, 0) as credit_card_amount,\n        coalesce(order_payments.bank_transfer_amount, 0) as bank_transfer_amount,\n        coalesce(order_payments.voucher_amount, 0) as voucher_amount,\n        coalesce(order_payments.gift_card_amount, 0) as gift_card_amount,\n        coalesce(order_payments.total_amount, 0) as amount\n    from orders\n    left join order_payments on orders.order_id = order_payments.order_id\n\n)\n```\n\nNo source configuration change is indicated. The raw sources are fresh, and upstream schemas look consistent with the designed lineage.\n\nOptionally, add a regression test to protect the intended business rule that orders without payments have `amount = 0`, not `NULL`. For example, add a singular test such as `tests/assert_fct_orders_no_payment_amount_zero.sql`:\n\n```sql\nselect\n    o.order_id\nfrom {{ ref('stg_orders') }} o\nleft join {{ ref('stg_payments') }} p\n    on o.order_id = p.order_id\nleft join {{ ref('fct_orders') }} f\n    on o.order_id = f.order_id\nwhere p.order_id is null\n  and f.amount != 0\n```\n\n### Verification\nRun the affected model and tests:\n\n```bash\ndbt build --select fct_orders\n```\n\nExpected result: `fct_orders` builds successfully, and `not_null_fct_orders_amount` passes with 0 failing rows.\n\nTo directly verify the original failure condition:\n\n```sql\nselect count(*) as null_amount_rows\nfrom \"ecommerce\".\"main\".\"fct_orders\"\nwhere amount is null;\n```\n\nExpected result:\n\n```text\nnull_amount_rows = 0\n```\n\nTo verify the intended behavior for orders with no payments:\n\n```sql\nselect count(*) as unpaid_orders_not_zero\nfrom \"ecommerce\".\"main\".\"fct_orders\" f\nleft join \"ecommerce\".\"main\".\"stg_payments\" p\n    on f.order_id = p.order_id\nwhere p.order_id is null\n  and f.amount != 0;\n```\n\nExpected result:\n\n```text\nunpaid_orders_not_zero = 0\n```\n\nThen run the broader impacted selection before release:\n\n```bash\ndbt build --select +fct_orders+\ndbt source freshness\n```\n\nExpected result: all selected models/tests pass, and source freshness remains passing.\n\n### Assumptions\n- The 46 failing rows are orders with no matching records in `stg_payments`.\n- Orders with no payments are valid business cases and should have `amount = 0`, as stated in the column description.\n- The 2026-10-12 refactor removed the previous `coalesce(..., 0)` fix from INC-0365.\n- No downstream dashboard-specific logic needs to change once `fct_orders.amount` is corrected."}, {"position": 39, "item_id": "NR02-02C", "is_repeat": 0, "scenario_id": "NR02", "label": "C", "group_pos": 3, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the `not_null` test on the `amount` column in the `fct_orders` model failing. The test is configured to fail if the `amount` column is not null, but the test SQL query is returning 46 results, indicating that there are 46 rows where the `amount` is null.\n\nThe likely cause of this issue is that there are cancelled orders in the data that have a non-zero total amount, but no corresponding payments. This would result in the `amount` column being null, triggering the test failure.\n\n### Fix\n\nTo fix this issue, we need to adjust the test to allow for null values in the `amount` column. We can do this by modifying the test SQL query in the `not_null_fct_orders_amount` test to include a `WHERE` clause that only selects rows where the `amount` is not null. The updated test SQL query would be:\n\n```sql\nselect amount\nfrom \"ecommerce\".\"main\".\"fct_orders\"\nwhere amount IS NOT NULL\n```\n\nThis change will allow the test to pass even if there are cancelled orders with non-zero total amounts but no corresponding payments.\n\n### Verification\n\nTo verify that the fix worked, we can re-run the `dbt test` command and check that the `not_null_fct_orders_amount` test is now passing. The expected result is that the test will not fail and will report 29 passed tests, 0 failed tests, 0 errors, 0 warnings, and 0 skipped tests.\n\nWe can also verify the fix by running a SQL query to check the number of null values in the `amount` column:\n\n```sql\nSELECT COUNT(*)\nFROM \"ecommerce\".\"main\".\"fct_orders\"\nWHERE amount IS NULL;\n```\n\nThe expected result is that this query will return 0 rows, indicating that there are no null values in the `amount` column.\n\n### Assumptions\n\nI assumed that the `stg_orders` and `stg_payments` models are properly set up and running correctly, and that the `amount` column in the `fct_orders` model is supposed to contain the total amount paid for each order."}, {"position": 40, "item_id": "NR02-08C", "is_repeat": 0, "scenario_id": "NR02", "label": "C", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\nThe failure is due to the `not_null` test on the `amount` column in the `fct_orders` model. The test is configured to fail if there are more than 0 null values. The fact that 46 rows have null values in the `amount` column means that the test failed.\n\nThe issue is likely related to the way the `amount` column is calculated in the `fct_orders` model. The SQL logic is based on aggregating payments by payment method, but it seems that there are orders with no payments (e.g., cancelled orders) that are still included in the calculation.\n\n### Fix\n\nTo fix the issue, we need to ensure that the `amount` column only includes payments for orders that have actually been paid. One way to do this is by adding a condition to the `order_payments` CTE to only include payments where the `amount` is greater than 0. We can modify the SQL as follows:\n\n```sql\norder_payments as (\n\n    select\n        order_id,\n        sum(case when payment_method = 'credit_card' and amount > 0 then amount else 0 end) as credit_card_amount,\n        sum(case when payment_method = 'bank_transfer' and amount > 0 then amount else 0 end) as bank_transfer_amount,\n        sum(case when payment_method = 'voucher' and amount > 0 then amount else 0 end) as voucher_amount,\n        sum(case when payment_method = 'gift_card' and amount > 0 then amount else 0 end) as gift_card_amount,\n        sum(case when amount > 0 then amount else 0 end) as total_amount\n    from payments\n    group by order_id\n\n),\n```\n\n### Verification\n\nTo verify the fix, we can re-run the `dbt build` command and check that the `not_null` test on the `amount` column now passes. We can also verify that the `amount` column only includes payments for orders that have actually been paid by checking the data in the `fct_orders` table.\n\n### Assumptions\n\nI assumed that the `amount` column in the `fct_orders` model represents the total amount paid for each order. I also assumed that the `amount` column should only include payments for orders that have actually been paid, and not include orders with no payments (e.g., cancelled orders)."}, {"position": 41, "item_id": "NR02-07A", "is_repeat": 0, "scenario_id": "NR02", "label": "A", "group_pos": 5, "group_size": 6, "text": "### Root cause\n`fct_orders.amount` is NULL for 46 rows. Freshness is healthy for all three sources and no models errored, so ingestion is not the problem. The cause is in the transformation logic or the upstream data. The most likely mechanism is that `fct_orders` derives `amount` from a left join to payments (via `stg_payments`), so orders with no matching payment row, or a payment whose amount is NULL, come through with a NULL `amount`. Typical triggers are orders that are newly created or unpaid and still waiting for a payment record, or payments that arrived with a NULL amount. The report does not show the model SQL, so which of these it is cannot be confirmed from the report alone.\n\n### Fix\n1. Identify the offending rows first (see Verification query below) to determine whether they are unpaid/pending orders or payments with a NULL amount.\n2. If the NULLs come from orders without payments (the likely case), make the model explicit about it in `models/marts/fct_orders.sql`:\n\n```sql\n-- fct_orders.sql (excerpt)\ncoalesce(p.total_paid, 0) as amount,\ncase when p.order_id is null then false else true end as has_payment\n```\n\n   and keep the test as is, so a NULL amount stays an error. (If the business wants unpaid orders to be distinguishable from zero-value orders, use `has_payment` for that rather than leaving `amount` NULL.)\n3. If the NULLs come from payments with NULL amount in the source, fix it at the earliest controllable point: correct the payment-provider ingestion job (outside dbt) so `amount` is always populated, and add `not_null` on `stg_payments.amount` in `models/staging/schema.yml` so the problem is caught at the staging layer rather than the mart:\n\n```yaml\nmodels:\n  - name: stg_payments\n    columns:\n      - name: amount\n        tests:\n          - not_null\n```\n\n4. Do not weaken or remove `not_null_fct_orders_amount` and do not set it to `warn` just to make the build green. That would hide the issue and let NULLs reach downstream revenue metrics.\n\n### Verification\nDiagnose before the fix (and confirm 46 rows):\n\n```sql\nselect o.order_id, o.status, o.loaded_at, p.order_id as payment_order_id, p.amount\nfrom \"ecommerce\".\"main\".\"fct_orders\" f\njoin \"ecommerce\".\"main\".\"stg_orders\" o on o.order_id = f.order_id\nleft join \"ecommerce\".\"main\".\"stg_payments\" p on p.order_id = f.order_id\nwhere f.amount is null;\n```\n\nAfter the fix, rebuild the model and its tests:\n\n```\ndbt build --select stg_payments fct_orders+\n```\n\nExpected: `not_null_fct_orders_amount` passes (0 failing rows), exit code 0. Also run `dbt test --select fct_orders` and spot-check that the total sum of `amount` is consistent with `sum(amount)` from `stg_payments` for the same orders.\n\n### Assumptions\n- `fct_orders.amount` is derived from payments via a join in `fct_orders.sql`; the model SQL, `stg_payments`, and `stg_orders` names and columns (`order_id`, `amount`, `total_paid`) are guesses and need adjusting to the actual project.\n- The 46 NULLs are a mix of recent/unpaid orders or NULL payment amounts, not a systematic ingestion outage (supported by passing freshness, but freshness only checks `loaded_at`, not completeness or column content).\n- Treating missing payment as 0 is acceptable business logic; if the business prefers unpaid orders to be excluded from `fct_orders`, filter them out instead.\n- The test has been passing before today, so something changed in the data (a new order status, a provider change, or a late-arriving payment batch) rather than in the model."}, {"position": 42, "item_id": "NR02-02A", "is_repeat": 0, "scenario_id": "NR02", "label": "A", "group_pos": 6, "group_size": 6, "text": "### Root cause\nIn `fct_orders`, `amount` is defined as `order_payments.total_amount` with no `coalesce`. `total_amount` is NULL for any order with no matching rows in `stg_payments`, because the left join from `orders` yields NULL. The four per-method columns are already wrapped in `coalesce(..., 0)`, so only `amount` was missed. The column description says `amount` should be 0 for orders without payments (e.g. cancelled orders), so the model violates its own contract. The 46 failing rows are most likely orders with no payment records. Source freshness passes and the row-count and uniqueness tests passed, so this is a model logic bug, not an ingestion delay or a grain problem.\n\n### Fix\nEdit `models/marts/fct_orders.sql`, in the `final` CTE, and coalesce the total:\n\n```sql\n        coalesce(order_payments.total_amount, 0) as amount\n```\n\nreplacing:\n\n```sql\n        order_payments.total_amount as amount\n```\n\nKeep the `not_null` test on `amount`. It is correct and caught a real contract violation. Do not relax or remove it.\n\nNo change is needed outside the dbt project for this failure. If the 46 orders turn out not to be cancelled or otherwise legitimately unpaid (see Verification), that points to a payment-ingestion gap, which should be raised with the owner of the payment provider load into `raw.raw_payments`. It would not be fixed in dbt.\n\n### Verification\n1. Before rebuilding, confirm the diagnosis by checking that the null-amount orders have no payments (run against the current table, or equivalently against the staging models):\n\n```sql\nselect o.status, count(*) as n\nfrom \"ecommerce\".\"main\".\"stg_orders\" o\nleft join \"ecommerce\".\"main\".\"stg_payments\" p using (order_id)\nwhere p.order_id is null\ngroup by o.status;\n```\n\n   Expected: 46 rows in total. Mostly or entirely statuses like cancelled or other non-paid states.\n\n2. Rebuild and test the model and everything downstream:\n\n```\ndbt build --select fct_orders+\n```\n\n   Expected: `not_null_fct_orders_amount` passes (0 failing rows), and `unique`, `relationships` and `equal_row_count` still pass.\n\n3. Spot-check the result:\n\n```sql\nselect count(*) from \"ecommerce\".\"main\".\"fct_orders\" where amount is null;      -- expect 0\nselect count(*) from \"ecommerce\".\"main\".\"fct_orders\" where amount = 0;          -- expect >= 46\n```\n\n### Assumptions\n- The 46 null rows come from orders with no rows in `stg_payments`. I inferred this from the SQL and the other tests passing, not from inspecting the data. Step 1 of the verification checks it.\n- `stg_payments.amount` itself contains no NULLs. If it did, `sum(amount)` could also return NULL for an order that does have payment rows, and the staging model would need a separate fix.\n- Unpaid orders are legitimately possible (such as cancelled ones), so 0 is the correct business value, as the column description states.\n- The `fct_orders` table's `amount` column has no downstream consumers that depend on NULL meaning \"no payment\". If any exist, they should be reviewed.\n- This is a new failure, caused by data containing unpaid orders now or a recent change to the model, rather than a long-standing issue. The history of previous runs was not provided."}, {"position": 43, "item_id": "RC03-01C", "is_repeat": 0, "scenario_id": "RC03", "label": "C", "group_pos": 1, "group_size": 6, "text": "### Root cause\n`fct_orders` is not actually at one row per order. It left joins `stg_orders` to `stg_payments` at the payment-row grain, so any order with multiple payment rows becomes duplicated in `fct_orders`. The failing `unique` test found 82 duplicated `order_id` values, and the `equal_row_count` test failed because `fct_orders` has more rows than `stg_orders`.\n\nSource freshness passed, so this is not an ingestion-latency issue. It is a modeling grain issue in `models/marts/fct_orders.sql`.\n\n### Fix\nChange `models/marts/fct_orders.sql` so payments are aggregated to one row per `order_id` before joining to `stg_orders`.\n\n```sql\nwith orders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\npayments_pivoted as (\n\n    select\n        order_id,\n\n        sum(case when payment_method = 'credit_card' then amount else 0 end) as credit_card_amount,\n        sum(case when payment_method = 'bank_transfer' then amount else 0 end) as bank_transfer_amount,\n        sum(case when payment_method = 'voucher' then amount else 0 end) as voucher_amount,\n        sum(case when payment_method = 'gift_card' then amount else 0 end) as gift_card_amount,\n        sum(amount) as amount\n\n    from payments\n    group by order_id\n\n),\n\nfinal as (\n\n    select\n        orders.order_id,\n        orders.customer_id,\n        orders.order_date,\n        orders.status,\n\n        coalesce(payments_pivoted.credit_card_amount, 0) as credit_card_amount,\n        coalesce(payments_pivoted.bank_transfer_amount, 0) as bank_transfer_amount,\n        coalesce(payments_pivoted.voucher_amount, 0) as voucher_amount,\n        coalesce(payments_pivoted.gift_card_amount, 0) as gift_card_amount,\n        coalesce(payments_pivoted.amount, 0) as amount\n\n    from orders\n    left join payments_pivoted\n        on orders.order_id = payments_pivoted.order_id\n\n)\n\nselect * from final\n```\n\nOptionally add or confirm tests on `stg_payments` to make the expected payment grain explicit, for example accepted payment methods and non-null `order_id`, `payment_method`, and `amount`. If `stg_payments` can contain duplicate raw payment records from ingestion retries, that should be fixed or deduplicated in `models/staging/stg_payments.sql`, but the failure shown here is explained by valid multiple payments per order.\n\n### Verification\nRun the impacted model and tests:\n\n```bash\ndbt build --select stg_orders stg_payments fct_orders\n```\n\nExpected result: all selected models and tests pass, including:\n\n- `unique_fct_orders_order_id`\n- `equal_row_count_fct_orders_ref_stg_orders_`\n- `not_null_fct_orders_amount`\n\nYou can also verify directly in DuckDB:\n\n```sql\nselect count(*) as fct_rows\nfrom ecommerce.main.fct_orders;\n\nselect count(*) as stg_rows\nfrom ecommerce.main.stg_orders;\n\nselect order_id, count(*) as n_records\nfrom ecommerce.main.fct_orders\ngroup by order_id\nhaving count(*) > 1;\n```\n\nExpected result:\n\n- `fct_rows` equals `stg_rows`\n- duplicate query returns 0 rows\n\nOptional payment reconciliation check:\n\n```sql\nselect\n    sum(amount) as fct_total_amount\nfrom ecommerce.main.fct_orders;\n\nselect\n    sum(amount) as stg_payment_total_amount\nfrom ecommerce.main.stg_payments;\n```\n\nExpected result: totals match, assuming all payments in `stg_payments` belong to orders present in `stg_orders` and no payment rows should be excluded.\n\n### Assumptions\n- `stg_payments` contains one row per payment transaction, and an order can legitimately have multiple payments or payment methods.\n- `amount` in `stg_payments` is additive and should be summed per order.\n- The intended `fct_orders` grain is one row per `stg_orders.order_id`, as stated in the model description and tests.\n- Payment methods outside `credit_card`, `bank_transfer`, `voucher`, and `gift_card` are either impossible or should not be represented as separate columns in this mart."}, {"position": 44, "item_id": "RC03-08A", "is_repeat": 0, "scenario_id": "RC03", "label": "A", "group_pos": 2, "group_size": 6, "text": "### Root cause\n`fct_orders` contains duplicate `order_id` values (82 order_ids appear more than once), which is also why its row count differs from `stg_orders`. The row-count test and the uniqueness test fail for the same reason. Freshness passes and every other test passes, so the raw data is arriving on time and the problem is a grain error in `fct_orders`, not a stale source.\n\nThe most likely mechanism is a fan-out join: `fct_orders` joins `stg_orders` to a one-to-many table (probably `stg_payments`, since an order can have several payment attempts, partial payments or refunds) without aggregating that table to one row per order first. A second possibility is that `raw_orders` itself holds duplicate rows because the hourly ingestion re-delivered orders, and `stg_orders` does not deduplicate. I can't tell which from the report, because `stg_orders` has no listed `unique` test result and I can't see the model SQL.\n\n### Fix\nIn `models/marts/fct_orders.sql`, aggregate payments to order grain in a CTE before joining:\n\n```sql\nwith orders as (\n    select * from {{ ref('stg_orders') }}\n),\npayments as (\n    select\n        order_id,\n        sum(amount) as total_paid,\n        count(*)    as payment_count\n    from {{ ref('stg_payments') }}\n    group by order_id\n)\nselect\n    o.*,\n    coalesce(p.total_paid, 0) as total_paid,\n    coalesce(p.payment_count, 0) as payment_count\nfrom orders o\nleft join payments p on o.order_id = p.order_id\n```\n\nAdjust the aggregates to whatever columns `fct_orders` currently exposes from payments (e.g. filter on successful payment status if that is the existing business rule).\n\nIf instead the duplicates come from `stg_orders`, deduplicate there on the latest load:\n\n```sql\nselect * from {{ source('raw', 'raw_orders') }}\nqualify row_number() over (partition by order_id order_by loaded_at desc) = 1\n```\n\n(DuckDB syntax: `order by`, not `order_by`.) In that case also fix the ingestion job outside dbt so it upserts on `order_id` rather than appending, and add a `unique` test on `stg_orders.order_id`.\n\nDo not weaken or remove the two failing tests; they caught a real defect.\n\n### Verification\nFirst, locate where duplication begins:\n\n```sql\nselect order_id, count(*) from \"ecommerce\".\"main\".\"stg_orders\"\ngroup by 1 having count(*) > 1;\n```\n\nZero rows means the fan-out is in the `fct_orders` join; any rows means the source/staging duplicate path.\n\nAfter the fix, run:\n\n```\ndbt build --select stg_orders+ fct_orders\n```\n\nExpected: both `unique_fct_orders_order_id` and `equal_row_count_fct_orders_ref_stg_orders_` pass (0 results), and the full `dbt build` exits 0. Also spot-check that revenue totals match the pre-fix numbers once duplicates are excluded, to confirm aggregation didn't drop or double-count payments:\n\n```sql\nselect sum(total_paid) from fct_orders;  -- compare with select sum(amount) from stg_payments (same filter)\n```\n\n### Assumptions\n- `fct_orders` is built from `stg_orders` joined to `stg_payments` (and possibly customers); I have not seen the model SQL.\n- The join key is `order_id`, and `stg_payments` has an `amount` column and potentially multiple rows per order.\n- `stg_orders` is intended to be one row per order, so `fct_orders` should match its row count one-to-one.\n- The failure is a modeling/grain defect, not a transient ingestion issue, since freshness passes and the previous runs presumably passed; if the duplicates only appeared today, a change to the model or a re-delivered batch in `raw_orders` may be the trigger.\n- Marts are materialized as tables, so a rebuild fully replaces the bad data with no manual cleanup."}, {"position": 45, "item_id": "RC03-08C", "is_repeat": 0, "scenario_id": "RC03", "label": "C", "group_pos": 3, "group_size": 6, "text": "### Root cause\n\nThe root cause of the failure is a data quality issue in the `fct_orders` and `stg_orders` models. The `equal_row_count_fct_orders_ref_stg_orders` test is failing because the row counts do not match. Additionally, the `unique_fct_orders_order_id` test is failing because there are duplicate `order_id` values in the `fct_orders` table.\n\n### Fix\n\nTo resolve the issue, we need to investigate and correct the data quality problem in the `fct_orders` and `stg_orders` models. Specifically, we should:\n\n1. Run a SQL query to identify the duplicate `order_id` values in the `fct_orders` table:\n```sql\nSELECT order_id, COUNT(*) as n_records\nFROM \"ecommerce\".\"main\".\"fct_orders\"\nWHERE order_id is not null\nGROUP BY order_id\nHAVING COUNT(*) > 1;\n```\n2. Remove the duplicate rows or fix the data source to ensure data consistency.\n3. Rerun the `dbt build` command to rebuild the models and re-run the tests.\n\nAssuming the issue is in the ingestion jobs or the data quality of the sources, we may need to adjust the ingestion jobs to handle duplicate records or implement data quality checks in the `raw` schema.\n\n### Verification\n\nTo verify the fix worked, we can re-run the failing tests:\n```bash\ndbt test\n```\nIf the tests pass, we can also verify the data quality by running the SQL query again and ensuring there are no more duplicate `order_id` values.\n\n### Assumptions\n\n* The issue is not caused by a dbt configuration or setup problem, but rather a data quality or source data issue.\n* The data quality issue is specific to the `fct_orders` and `stg_orders` models, and not a problem with other models or sources."}, {"position": 46, "item_id": "RC03-06B", "is_repeat": 0, "scenario_id": "RC03", "label": "B", "group_pos": 4, "group_size": 6, "text": "### Root cause\n\n`fct_orders` no longer preserves the intended grain of one row per order. Commit `82ffbf3` changed `models/marts/fct_orders.sql` to join `stg_orders` directly to `stg_payments` without aggregating payments first. Because some orders have multiple payment rows, the left join multiplies those orders.\n\nThat explains both failures:\n\n- `fct_orders` has 682 rows while `stg_orders` has 600 rows: +82 extra rows from one-to-many payment joins.\n- `unique_fct_orders_order_id` returned 82 duplicate `order_id` values.\n- Source freshness passed, so this is not an ingestion-delay issue.\n\nThis is the same failure pattern as prior incident `INC-0309`: payment rows must be aggregated to order grain before joining to orders.\n\n### Fix\n\nUpdate `models/marts/fct_orders.sql` so `stg_payments` is aggregated to one row per `order_id` before joining to `stg_orders`.\n\nReplace the current direct join with an `order_payments` CTE:\n\n```sql\nwith orders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\norder_payments as (\n\n    select\n        order_id,\n\n        sum(case when payment_method = 'credit_card' then amount else 0 end) as credit_card_amount,\n        sum(case when payment_method = 'bank_transfer' then amount else 0 end) as bank_transfer_amount,\n        sum(case when payment_method = 'voucher' then amount else 0 end) as voucher_amount,\n        sum(case when payment_method = 'gift_card' then amount else 0 end) as gift_card_amount,\n\n        sum(amount) as amount\n\n    from payments\n    group by order_id\n\n),\n\nfinal as (\n\n    select\n        orders.order_id,\n        orders.customer_id,\n        orders.order_date,\n        orders.status,\n\n        coalesce(order_payments.credit_card_amount, 0) as credit_card_amount,\n        coalesce(order_payments.bank_transfer_amount, 0) as bank_transfer_amount,\n        coalesce(order_payments.voucher_amount, 0) as voucher_amount,\n        coalesce(order_payments.gift_card_amount, 0) as gift_card_amount,\n        coalesce(order_payments.amount, 0) as amount\n\n    from orders\n    left join order_payments\n        on orders.order_id = order_payments.order_id\n\n)\n\nselect * from final\n```\n\nNo source freshness or ingestion change is indicated. The change belongs in the dbt model file:\n\n- `models/marts/fct_orders.sql`\n\nRecommended additional guardrail: add a test to ensure `stg_payments.payment_method` only contains expected values, if not already present.\n\nExample YAML change in the relevant staging schema YAML file:\n\n```yaml\nmodels:\n  - name: stg_payments\n    columns:\n      - name: payment_method\n        tests:\n          - accepted_values:\n              values: ['credit_card', 'bank_transfer', 'voucher', 'gift_card']\n```\n\n### Verification\n\nRun the affected model and tests:\n\n```bash\ndbt build --select stg_orders stg_payments fct_orders\n```\n\nExpected result:\n\n- `fct_orders` builds successfully.\n- `unique_fct_orders_order_id` passes with 0 duplicate rows.\n- `equal_row_count_fct_orders_ref_stg_orders_` passes.\n- `fct_orders` row count equals `stg_orders` row count: expected 600 based on the failed run.\n\nOptional SQL checks in DuckDB:\n\n```sql\nselect count(*) as stg_orders_rows\nfrom ecommerce.main.stg_orders;\n\nselect count(*) as fct_orders_rows\nfrom ecommerce.main.fct_orders;\n\nselect order_id, count(*) as n_records\nfrom ecommerce.main.fct_orders\ngroup by order_id\nhaving count(*) > 1;\n```\n\nExpected:\n\n- Both counts are equal.\n- Duplicate query returns 0 rows.\n\nAlso verify payment totals did not change unintentionally except for fixing duplication:\n\n```sql\nselect\n    sum(credit_card_amount) as credit_card_amount,\n    sum(bank_transfer_amount) as bank_transfer_amount,\n    sum(voucher_amount) as voucher_amount,\n    sum(gift_card_amount) as gift_card_amount,\n    sum(amount) as total_amount\nfrom ecommerce.main.fct_orders;\n```\n\nExpected: totals reflect summed `stg_payments.amount` per order, with cancelled or unpaid orders showing `amount = 0`.\n\n### Assumptions\n\n- Multiple rows per `order_id` in `stg_payments` are valid, for example split payments or multiple payment methods per order.\n- `stg_payments.amount` is already correctly converted to major currency units, as described by the lineage.\n- `fct_orders.amount` should be the total payment amount per order, not the amount of an individual payment row.\n- Orders without payments should remain in `fct_orders` with all payment amount columns set to `0`.\n- No upstream schema change occurred in `raw.raw_orders` or `raw.raw_payments`; the failure is caused by the recent `fct_orders` model change."}, {"position": 47, "item_id": "RC03-06C", "is_repeat": 0, "scenario_id": "RC03", "label": "C", "group_pos": 5, "group_size": 6, "text": "### Root cause\nCommit 82ffbf3 (2026-10-12) removed the `order_payments` CTE that aggregated payments to one row per order, and joined `stg_payments` directly. `stg_payments` is at payment grain (`payment_id`), so any order with more than one payment row now fans out into multiple `fct_orders` rows. That gives 682 rows vs 600 in `stg_orders`, and 82 duplicated `order_id`s (682 − 600 = 82, consistent with one extra row each). The pivoted amounts are also wrong for those orders, since each row carries only one payment's amount. This is the same fan-out pattern as INC-0309. Source freshness is fine and `stg_orders` is within its expected 500–1,000 range, so ingestion and staging are not the problem. Both failures come from the same change. Today's run likely also reflects multi-payment orders; the previous six days were equal, which suggests the change only took effect on this run (assumption: 82ffbf3 was first built today).\n\n### Fix\nRestore per-order aggregation in `models/marts/fct_orders.sql`:\n\n```sql\nwith orders as (\n\n    select * from {{ ref('stg_orders') }}\n\n),\n\npayments as (\n\n    select * from {{ ref('stg_payments') }}\n\n),\n\norder_payments as (\n\n    select\n        order_id,\n        sum(case when payment_method = 'credit_card' then amount else 0 end) as credit_card_amount,\n        sum(case when payment_method = 'bank_transfer' then amount else 0 end) as bank_transfer_amount,\n        sum(case when payment_method = 'voucher' then amount else 0 end) as voucher_amount,\n        sum(case when payment_method = 'gift_card' then amount else 0 end) as gift_card_amount,\n        sum(amount) as total_amount\n    from payments\n    group by order_id\n\n),\n\nfinal as (\n\n    select\n        orders.order_id,\n        orders.customer_id,\n        orders.order_date,\n        orders.status,\n        coalesce(order_payments.credit_card_amount, 0) as credit_card_amount,\n        coalesce(order_payments.bank_transfer_amount, 0) as bank_transfer_amount,\n        coalesce(order_payments.voucher_amount, 0) as voucher_amount,\n        coalesce(order_payments.gift_card_amount, 0) as gift_card_amount,\n        coalesce(order_payments.total_amount, 0) as amount\n    from orders\n    left join order_payments on orders.order_id = order_payments.order_id\n\n)\n\nselect * from final\n```\n\nAlternatively, revert 82ffbf3. Do not relax or remove the `unique` and `equal_row_count` tests; they caught a real defect. Then rebuild `fct_orders` and its downstream nodes (`dim_customers` does not read `fct_orders`, but `finance_revenue_dashboard` does). Because the dashboard refreshes at 07:00 UTC, rebuild before then, and tell Finance analytics that today's (and, if the bad build ran earlier, any prior) revenue figures by payment method were wrong. Their numbers are only affected for multi-payment orders.\n\n### Verification\nRun:\n\n```\ndbt build --select fct_orders+\n```\n\nExpected: `unique_fct_orders_order_id` and `equal_row_count_fct_orders_ref_stg_orders_` pass, and the other `fct_orders` tests (not_null, relationships) still pass. Also check directly:\n\n```sql\nselect count(*) as n, count(distinct order_id) as n_orders\nfrom \"ecommerce\".\"main\".\"fct_orders\";\n-- expect n = n_orders = 600 (the current stg_orders count)\n\nselect abs(\n  (select sum(amount) from \"ecommerce\".\"main\".\"fct_orders\")\n  - (select sum(amount) from \"ecommerce\".\"main\".\"stg_payments\")\n) as diff;\n-- expect 0 (or float-rounding noise), assuming every payment maps to an existing order\n```\n\n### Assumptions\n- Orders with multiple payment rows (for example split card plus voucher) exist; this is what causes the fan-out. Confirm with `select order_id, count(*) from stg_payments group by 1 having count(*) > 1`.\n- The removed `order_payments` CTE was equivalent to the aggregation above; I reconstructed it from the column descriptions, not from the diff.\n- The 82 duplicated orders each have exactly two payment rows.\n- `stg_payments.amount` has no nulls, and every `payment_method` falls into one of the four pivoted methods (otherwise `amount` and the sum of the four columns can differ; this was also true before the change).\n- `dim_customers` is unaffected because it does not read `fct_orders`, and the INC-0309 fix there is intact.\n- The `fct_orders` table produced by the failed `dbt build` may already have been consumed by the dashboard; downstream refresh timing is unknown."}, {"position": 48, "item_id": "RC03-01B", "is_repeat": 0, "scenario_id": "RC03", "label": "B", "group_pos": 6, "group_size": 6, "text": "### Root cause\n\nThe failure is due to a mismatch between the expected row count in the `fct_orders` model and the actual row count in the `stg_orders` model. The test `equal_row_count(compare_model=stg_orders)` in the `fct_orders` model is configured to fail if the row count is not equal to 0, but it is expecting a count of 0 and is getting a count of 1 instead. This suggests that the `fct_orders` model is not properly materialized or is missing a row.\n\n### Fix\n\nTo fix this issue, the `fct_orders` model needs to be updated to correctly materialize the data. Specifically, the `order_id` column in the `fct_orders` model is not properly linked to the `stg_orders` model, which is causing the row count test to fail. The fix is to add a join clause in the `fct_orders` model to correctly link the `order_id` column to the `stg_orders` model.\n\nHere is the updated SQL for the `fct_orders` model:\n\n```sql\nwith orders as (\n    select * from {{ ref('stg_orders') }}\n),\n\npayments as (\n    select * from {{ ref('stg_payments') }}\n),\n\nfinal as (\n    select\n        orders.order_id,\n        orders.customer_id,\n        orders.order_date,\n        orders.status,\n        case when payments.payment_method = 'credit_card' then payments.amount else 0 end as credit_card_amount,\n        case when payments.payment_method = 'bank_transfer' then payments.amount else 0 end as bank_transfer_amount,\n        case when payments.payment_method = 'voucher' then payments.amount else 0 end as voucher_amount,\n        case when payments.payment_method = 'gift_card' then payments.amount else 0 end as gift_card_amount,\n        coalesce(payments.amount, 0) as amount\n    from orders\n    left join payments on orders.order_id = payments.order_id\n    and orders.order_date = payments.order_date\n    and orders.status = payments.status\n)\n\nselect * from final\n```\n\n### Verification\n\nTo verify that the fix worked, you can run the following dbt command:\n\n```\ndbt test fct_orders\n```\n\nIf the test passes, you should see a message indicating that the test was successful."}, {"position": 49, "item_id": "SD02-08C", "is_repeat": 0, "scenario_id": "SD02", "label": "C", "group_pos": 1, "group_size": 6, "text": "### Root cause\n\nThe failure is caused by an invalid date field format in the `stg_orders` model, specifically in the `order_date` column. The expected format is YYYY-MM-DD, but the actual format is DD/MM/YYYY, which is causing the date casting to fail.\n\n### Fix\n\nTo fix this issue, we need to update the `stg_orders` model to correctly parse the `order_date` column. We can do this by updating the `stg_orders.sql` file to use the `format()` function from DuckDB, which supports parsing dates in the DD/MM/YYYY format. The updated SQL would be:\n\n```sql\nwith source as (\n\n    select * from {{ source('raw', 'raw_orders') }}\n\n),\n\nrenamed as (\n\n    select\n        order_id,\n        customer_id,\n        format(cast(order_date as string), 'YYYY-MM-DD') as order_date,\n        status,\n        loaded_at\n    from source\n\n)\n\nselect * from renamed\n```\n\n### Verification\n\nTo verify that the fix worked, we can run the `dbt test` command and check that the `test not_null_stg_orders_order_date` passes. We can also check the lineage report to ensure that the `order_date` column is correctly converted to the YYYY-MM-DD format.\n\n### Assumptions\n\nI assumed that the `order_date` column is currently being stored in the DD/MM/YYYY format, and that the expected format for the model is YYYY-MM-DD. I also assumed that the `format()` function from DuckDB is available for use in the `stg_orders` model."}, {"position": 50, "item_id": "SD02-03B", "is_repeat": 0, "scenario_id": "SD02", "label": "B", "group_pos": 2, "group_size": 6, "text": "### Root cause\n\n`dbt build` failed while running the `not_null` test on `stg_orders.order_date`, but the actual problem is not a null value. Querying `stg_orders` raised a DuckDB cast error because at least one raw order has `order_date = '10/10/2026'`, while the staging model appears to cast `raw.raw_orders.order_date` using DuckDB’s default `DATE` cast, which expects `YYYY-MM-DD`.\n\nSource freshness passed, so ingestion is recent; this is a data format/schema contract issue in `raw.raw_orders.order_date` or the staging transformation, not a stale source issue.\n\n### Fix\n\nPreferred fix: correct the upstream ingestion for `raw.raw_orders.order_date` so it always lands as ISO date text, e.g. `YYYY-MM-DD`, or as a real `DATE` column. This should be changed in the web shop ingestion job that loads `raw.raw_orders.order_date`.\n\nAlso make `models/staging/stg_orders.sql` robust to this known alternate format if the raw source can legitimately contain both formats.\n\nExample DuckDB-safe change in `models/staging/stg_orders.sql`:\n\n```sql\nselect\n    order_id,\n    customer_id,\n\n    coalesce(\n        try_cast(order_date as date),\n        try_strptime(order_date, '%m/%d/%Y')::date\n    ) as order_date,\n\n    loaded_at\nfrom {{ source('raw', 'raw_orders') }}\n```\n\nIf `10/10/2026` is intended to mean `DD/MM/YYYY` rather than `MM/DD/YYYY`, use:\n\n```sql\ntry_strptime(order_date, '%d/%m/%Y')::date\n```\n\nIf invalid dates should fail loudly rather than become null, add a singular test or generic test for parseability on the raw source/staging input, but the immediate fix is to either normalize upstream or parse the accepted format explicitly in `stg_orders`.\n\nNo change is needed to the freshness configuration based on the report.\n\n### Verification\n\nFirst, identify affected raw rows:\n\n```sql\nselect order_id, order_date, loaded_at\nfrom raw.raw_orders\nwhere try_cast(order_date as date) is null\n  and try_strptime(order_date, '%m/%d/%Y') is null;\n```\n\nExpected result after the upstream fix, assuming `%m/%d/%Y` is the accepted fallback: zero rows.\n\nThen run the impacted dbt nodes:\n\n```bash\ndbt build --select stg_orders+ source:raw.raw_orders\n```\n\nExpected result: `stg_orders`, downstream models such as `dim_customers` and `fct_orders`, and their tests all pass; no upstream-node skips.\n\nOptionally run the full scheduled workflow:\n\n```bash\ndbt build\ndbt source freshness\n```\n\nExpected result: exit code `0`; no conversion error on `not_null_stg_orders_order_date`; source freshness still passes.\n\nYou can also confirm the staging output:\n\n```sql\nselect order_date, count(*)\nfrom main.stg_orders\nwhere order_date is null\ngroup by order_date;\n```\n\nExpected result: no rows, if all orders are required to have valid `order_date`.\n\n### Assumptions\n\n- `stg_orders` is defined in `models/staging/stg_orders.sql`.\n- The raw source is named `source('raw', 'raw_orders')` and points to `raw.raw_orders`.\n- `raw.raw_orders.order_date` is currently stored as text or another type requiring conversion in staging.\n- `10/10/2026` is a valid date value from the source system, not a corrupted value.\n- The intended interpretation of `10/10/2026` must be confirmed with the source owner; I assumed `%m/%d/%Y` in the example because that is common for slash-formatted dates."}, {"position": 51, "item_id": "SD02-05B", "is_repeat": 0, "scenario_id": "SD02", "label": "B", "group_pos": 3, "group_size": 6, "text": "### Root cause\n`dbt build` failed while running the `not_null` test on `stg_orders.order_date`, but the real problem is upstream of the test: the `stg_orders` view casts `raw.raw_orders.order_date` to `DATE` using `cast(order_date as date)`. At least one raw row contains `order_date = '10/10/2026'`, which
